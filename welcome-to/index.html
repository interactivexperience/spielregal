<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8DDCB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Siedlerhain">
<title>Siedlerhain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&display=swap">
<style>
/* Siedlerhain, Variante „Editorial“: ruhig, bildstark, modern. Serifenschrift (Instrument Serif) + Inter Tight,
   gedeckte Erdfarben, klare Architektur-Zeichnungen ohne Wackeln, große Hausnummern als Typografie, dünne Linien statt Versatzschatten. */
:root{
  --paper:#F3EEE5; --card:#FBF8F2; --ink:#1F1B17; --ink2:#7B7066; --line:rgba(31,27,23,.16);
  --acc:#C4543A; --accs:#F0D5CB; --sage:#7F9A82; --fix:#1F1B17;
  --b0:#E7D9C3; --b1:#D5DECF; --b2:#D3DDE4;
  --btn:#1F1B17; --btnt:#F7F1E6; --dock:#1F1B17; --dockt:#F3EEE5; --coach:#E6DAC6; --hero:#E8DDCB;
  --fd:'Instrument Serif','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --fb:'Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif;
  --g:3px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#171310; --card:#221D19; --ink:#F1E9DD; --ink2:#A89C8F; --line:rgba(241,233,221,.18); --accs:#4A2A21;
    --b0:#2C2620; --b1:#242B25; --b2:#232A31; --btn:#F1E9DD; --btnt:#1F1B17; --dock:#0E0C0A; --dockt:#F1E9DD; --coach:#2B241E; --hero:#241E19;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#171310; --card:#221D19; --ink:#F1E9DD; --ink2:#A89C8F; --line:rgba(241,233,221,.18); --accs:#4A2A21;
  --b0:#2C2620; --b1:#242B25; --b2:#232A31; --btn:#F1E9DD; --btnt:#1F1B17; --dock:#0E0C0A; --dockt:#F1E9DD; --coach:#2B241E; --hero:#241E19;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;position:fixed;inset:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);
  font:400 15px/1.4 var(--fb);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
a{color:inherit}
svg{display:block}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.disp{font-family:var(--fd);font-weight:400}

.thead{flex:none;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;
  padding:max(8px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
.leave{font:400 26px/1 var(--fd);text-decoration:none;color:var(--ink);padding:6px 6px 8px;display:inline-block}
.thead h1{font:400 28px/1 var(--fd);letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap}
.pill{display:flex;flex-direction:column;align-items:flex-end;min-width:34px}
.pill b{font:400 24px/1 var(--fd)}
.pill small{font:600 8.5px/1 var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin-top:3px}
.pill.pts b{color:var(--acc)}
.pill.bump{animation:bump .5s ease-out}
.mbtn{width:36px;height:36px;border:1px solid var(--ink);border-radius:50%;color:var(--ink);font:400 15px/1 var(--fb);display:grid;place-items:center;flex:none}
.mbtn:active{background:var(--ink);color:var(--paper)}

.main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:18px max(16px,env(safe-area-inset-right,0px)) 26px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.label{font:600 10.5px/1 var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.note{font-size:12.5px;line-height:1.4;color:var(--ink2);margin-top:10px}

.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.plan{position:relative;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 8px 10px;display:flex;flex-direction:column;gap:9px;min-width:0;overflow:hidden}
.plan.done{background:color-mix(in srgb,var(--sage) 28%,var(--card));border-color:var(--sage)}
.plan.late{opacity:.55}
.plan .ph{display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.plan .ph b{font:600 9.5px/1 var(--fb);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.oct{font:400 26px/.9 var(--fd);color:var(--acc)}
.plan.done .oct{color:var(--ink)}
.pest{display:flex;flex-direction:column;gap:7px}
.pe{display:flex;gap:1px;align-items:flex-end;border-bottom:1.5px solid var(--ink);padding:0 1px 2px;position:relative;width:max-content;max-width:100%}
.pe::before,.pe::after{content:"";position:absolute;bottom:-1px;height:6px;border-left:1.5px solid var(--ink)}
.pe::before{left:0}.pe::after{right:0}
.pe svg{width:12px;height:15px;flex:none}
.pe.ok svg .w{fill:var(--sage)}
.stamp{position:absolute;right:5px;bottom:6px;transform:rotate(-7deg);border:1px solid var(--acc);color:var(--acc);border-radius:3px;padding:2px 5px;
  font:600 8.5px/1.1 var(--fb);text-transform:uppercase;letter-spacing:.12em}

.street{background:var(--bc);border-radius:12px;padding:14px 10px 12px;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
.street[data-s="0"]{--bc:var(--b0)}.street[data-s="1"]{--bc:var(--b1)}.street[data-s="2"]{--bc:var(--b2)}
.shead{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-bottom:8px;padding:0 2px}
.shead h3{font:400 24px/1 var(--fd);letter-spacing:-.01em}
.shead h3 span{display:block;font:600 9.5px/1 var(--fb);margin:6px 0 0;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.parks{display:flex;gap:4px}
.ptok{width:26px;height:26px;display:grid;place-items:center;font:400 13px/1 var(--fd);color:var(--ink);position:relative}
.ptok svg{position:absolute;inset:0;width:100%;height:100%}
.ptok span{position:relative}
.ptok.on span{color:#fff}
.row{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));column-gap:var(--g);position:relative;align-items:end;margin-bottom:2px}
.house{position:relative;aspect-ratio:25/32;display:grid;place-items:center;min-width:0;padding:0}
.house.empty{font:400 14px/1 var(--fd);color:var(--ink)}
.house.empty.ok{border-radius:5px}
.road{height:10px;margin:0 -4px;border-radius:3px;background:#5E5650;position:relative}
.road::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:2px;background:repeating-linear-gradient(90deg,#EFE6D3 0 9px,transparent 9px 18px)}
.house svg{width:100%;height:100%;overflow:visible}
.house.ok.empty{border:2px solid var(--acc);background:var(--accs);cursor:pointer;animation:pulse 1.4s ease-in-out infinite;color:var(--acc)}
.house.ok.empty .ghost{font:400 17px/1 var(--fd);position:relative;z-index:1}
.house.ok.empty svg.lot{position:absolute;inset:0;opacity:.55}
.house.ok.full{cursor:pointer;animation:pulse 1.4s ease-in-out infinite}
.house.src{filter:drop-shadow(0 0 0 var(--acc)) drop-shadow(0 0 3px var(--acc))}
.house.pop{animation:pop .45s cubic-bezier(.3,1.4,.5,1)}
.tut-hl{outline:2px solid var(--acc);outline-offset:3px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.62}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes bump{40%{transform:scale(1.14)}}
.fence{position:absolute;top:-6px;bottom:-1px;width:6px;transform:translateX(-50%);pointer-events:none;
  left:calc((100% - (var(--n) - 1) * var(--g)) / var(--n) * var(--k) + var(--g) * (var(--k) - .5))}
.fence svg{width:100%;height:100%}
.fence.pop{animation:pop .4s ease-out}
.gap{position:absolute;top:-8px;bottom:-4px;width:22px;transform:translateX(-50%);z-index:2;
  left:calc((100% - (var(--n) - 1) * var(--g)) / var(--n) * var(--k) + var(--g) * (var(--k) - .5))}
.gap::before{content:"";position:absolute;left:50%;top:4px;bottom:4px;border-left:1.5px dashed var(--acc);transform:translateX(-50%)}
.gap::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:8px;margin-left:-4px;background:var(--acc);border-radius:4px;opacity:.9;animation:pulse 1.2s ease-in-out infinite}
.poolrow,.estrow{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));column-gap:var(--g);align-items:center}
.poolrow{height:18px;margin-top:5px}
.pool{grid-row:1;justify-self:center;width:100%;max-width:26px;height:17px}
.pool svg{width:100%;height:100%}
.estrow{margin-top:3px}
.est{grid-row:1;height:20px;position:relative;border-bottom:1px solid var(--ink);display:flex;justify-content:center;align-items:flex-start;font:400 14px/1 var(--fd);min-width:0;opacity:.75}
.est::before,.est::after{content:"";position:absolute;bottom:-1px;height:6px;border-left:1px solid var(--ink)}
.est::before{left:0}.est::after{right:0}
.est.done{opacity:1}
.est.done b{background:var(--ink);color:var(--paper);border-radius:99px;padding:3px 8px 2px;margin-top:-2px;font-weight:400}

.stats{display:flex;flex-direction:column;gap:10px}
.estgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.cgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 3px 7px;text-align:center;display:flex;flex-direction:column;gap:3px;min-width:0}
.cell small{font-size:10px;color:var(--ink2);line-height:1.2}
.cell b{font:400 26px/1 var(--fd)}
.pips{display:flex;justify-content:center;gap:3px;min-height:6px}
.pip{width:6px;height:6px;border-radius:50%;border:1px solid var(--ink2)}
.pip.on{background:var(--acc);border-color:var(--acc)}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
summary{cursor:pointer;font:400 20px/1.2 var(--fd)}
details[open] summary{margin-bottom:8px}
.lines{width:100%;border-collapse:collapse;font-size:13px}
.lines td{padding:6px 0;border-top:1px solid var(--line)}
.lines td:last-child{text-align:right;font:400 20px/1 var(--fd)}
.lines .d{color:var(--ink2);font-size:11.5px;padding-left:8px}
.lines tr.neg td:last-child{color:var(--acc)}

.result{background:var(--dock);color:var(--dockt);border-radius:14px;padding:22px 18px 18px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.result .eyebrow{font:600 10.5px/1 var(--fb);letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.result h2{font:400 64px/.95 var(--fd);letter-spacing:-.02em}
.result .why{font-size:13px;opacity:.85}
.result .lines td{border-color:rgba(243,238,229,.2)}
.result .lines .d{color:var(--dockt);opacity:.6}
.result .lines tr.neg td:last-child{color:#F29E86}
.result .stern{position:absolute;right:-30px;top:-30px;width:130px;height:130px;opacity:.9}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--btn);border-radius:999px;padding:13px 22px;font:600 14px/1 var(--fb);letter-spacing:.01em;
  background:var(--btn);color:var(--btnt);text-align:center}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pink{background:var(--dockt);border-color:var(--dockt);color:var(--dock)}
.btn.sm{padding:9px 15px;font-size:12.5px}
.btn.arm{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.hot{background:var(--acc);border-color:var(--acc);color:#fff}
.btn:disabled{opacity:.4}
.tlink{font:500 13px/1 var(--fb);text-decoration:underline;text-underline-offset:4px;padding:8px;text-align:center}

.dock{flex:none;position:relative;background:var(--dock);color:var(--dockt);border-radius:20px 20px 0 0;margin-top:10px;
  padding:14px max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.dinner{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:11px}
.prompt{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;line-height:1.35;min-height:30px}
.prompt p{min-width:0;opacity:.92}
.prompt b{font:400 19px/1 var(--fd);color:#F5B7A3}
.dock .btn{background:transparent;border-color:rgba(243,238,229,.5);color:var(--dockt)}
.dock .btn.pri,.dock .btn.hot{background:var(--acc);border-color:var(--acc);color:#fff}
.hand{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kard{position:relative;background:#F7F1E6;color:#1F1B17;border-radius:10px;padding:0;display:flex;flex-direction:column;min-width:0;overflow:hidden;text-align:center}
.kard:not(:disabled):active{transform:scale(.97)}
.kard.dead{opacity:.45}
.kard.chosen{box-shadow:0 0 0 2px var(--acc)}
.kard.dim{opacity:.55}
.kard .scene{width:100%;aspect-ratio:120/84;display:block}
.kard .scene svg{width:100%;height:100%}
.kard .back{display:flex;align-items:center;gap:6px;padding:6px 7px 7px;min-height:38px;border-top:1px solid rgba(31,27,23,.14)}
.kard .back svg{width:26px;height:26px;flex:none}
.kard .back span{font:400 14px/1 var(--fd);text-align:left;min-width:0;hyphens:manual}
.kard .tag{position:absolute;left:5px;top:5px;background:var(--acc);color:#fff;border-radius:99px;padding:3px 7px;font:600 9px/1 var(--fb);letter-spacing:.06em}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid rgba(243,238,229,.45);border-radius:10px;background:#F7F1E6;color:#1F1B17;padding:7px 14px;display:flex;flex-direction:column;align-items:center;min-width:60px}
.chip b{font:400 26px/1 var(--fd)}
.chip small{font-size:10.5px;color:#7B7066}
.chip:disabled{opacity:.3}
.chip:not(:disabled):active{transform:scale(.96)}

.coach{flex:none;background:var(--coach);color:var(--ink);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.cin{max-width:520px;margin:0 auto;display:flex;gap:12px;align-items:flex-start}
.cin svg{width:52px;height:52px;flex:none}
.cin .tx{flex:1;min-width:0;font-size:13.5px;line-height:1.4;display:flex;flex-direction:column;gap:8px}
.cin .tx b{font:400 20px/1 var(--fd)}
.cin .row2{display:flex;gap:8px}

.ov{position:fixed;inset:0;z-index:20;background:rgba(20,15,10,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88%;overflow-y:auto;background:var(--paper);border-radius:22px 22px 0 0;
  padding:0 max(20px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh{position:sticky;top:0;background:var(--paper);display:flex;justify-content:space-between;align-items:center;padding:18px 0 12px;z-index:1}
.sh h2{font:400 32px/1 var(--fd)}
.xbtn{width:34px;height:34px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center;font:400 13px/1 var(--fb)}
.menu{display:flex;flex-direction:column;gap:10px;padding-bottom:6px}
.menu .btn{width:100%;justify-content:flex-start;padding:15px 20px}
.rules{display:flex;flex-direction:column;gap:12px;font-size:14px;line-height:1.5}
.rules h3{font:400 22px/1.1 var(--fd);margin-top:8px}
.rules ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.rules .fine{font-size:12.5px;color:var(--ink2)}

.bub{position:fixed;z-index:40;max-width:250px;background:var(--ink);color:var(--paper);border-radius:8px;padding:9px 12px;font-size:12.5px;line-height:1.4;pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 210px);transform:translateX(-50%);z-index:45;max-width:86%;background:var(--acc);color:#fff;border-radius:10px;padding:10px 15px;
  font-size:13px;font-weight:500;text-align:center;animation:up .2s ease-out}
.toast.good{background:var(--ink);color:var(--paper)}
.fl{position:fixed;z-index:35;font:400 28px/1 var(--fd);color:var(--acc);pointer-events:none;animation:fl 1.1s ease-out forwards}
@keyframes fl{to{transform:translateY(-46px);opacity:0}}

.start{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--hero)}
.stage{flex:1;min-height:0;position:relative;overflow:hidden}
.stage svg.cover{position:absolute;inset:0;width:100%;height:100%;display:block}
.start .leave{position:absolute;z-index:3;left:max(10px,env(safe-area-inset-left,0px));top:max(6px,env(safe-area-inset-top,0px));font:600 12px/1 var(--fb);letter-spacing:.06em;
  background:var(--paper);border-radius:999px;color:var(--ink);padding:9px 14px}
.sdock{flex:none;position:relative;background:var(--paper);border-radius:20px 20px 0 0;margin-top:-20px;padding:20px max(18px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:10px;align-items:stretch}
.sdock .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sdock .btn{width:100%;flex-direction:column;gap:4px;padding:13px 14px}
.sdock .btn.alt{background:transparent;color:var(--ink);border-color:var(--ink)}
.sdock .links{display:flex;justify-content:center;gap:6px}
.sdock .sub{display:block;font:500 10.5px/1.2 var(--fb);opacity:.75}

@media (prefers-reduced-motion: reduce){
  .house.ok,.gap::after,.tut-hl,.pill.bump,.house.pop,.fence.pop,.sheet,.toast,.fl{animation:none!important}
}
@media (max-width:360px){.thead h1{font-size:24px}.plan{padding:7px 5px}}
</style>

<div id="app"></div>

  const POOL_SPOTS = [[2, 6, 7], [0, 3, 7], [1, 6, 10]];                       // Felder mit Poolplatz (ab 0)
  const POOL_SCORE = [0, 3, 6, 9, 13, 17, 21, 26, 31, 36];                     // nach 0 … 9 Pools

  const TEMP_BOXES = 11;

  const TEMP_POINTS = 7;

  const EFFECTS = ['fence', 'agent', 'park', 'pool', 'temp', 'bis'];
  // Kartenliste: je Hausnummer, wie oft welcher Effekt auf der Rückseite steht
  // Reihenfolge: Geometer, Makler, Gärtner, Pool, Zeitarbeit, Doppelte Nummer (insgesamt 81 Karten)
  const DECK_TABLE = {

  // Die 18 Stadtpläne der Basisversion: je Stufe (Nr. 1, 2, 3) sechs Karten; req = Siedlungsgrößen, first / second = Punkte
  const PLAN_CARDS = [
    [{ req: [6, 6], first: 10, second: 6 }, { req: [1, 1, 1, 1, 1, 1], first: 8, second: 4 }, { req: [2, 2, 2, 2], first: 8, second: 4 },

    if (!U.tut || !S) return;
    while (U.tut.step < TUT.length - 1 && TUT[U.tut.step].r < S.round) U.tut.step++;
    if (S.phase === 'pick' && S.tutRound !== S.round && TUT_HANDS[S.round - 1]) {
      S.hand = TUT_HANDS[S.round - 1].map(c => ({ n: c.n, e: c.e }));
      S.tutRound = S.round;
    }
  }
  function startTut() { newGame('solo'); S.id = 'tut'; S.soloSeen = false; U.tut = { step: 0 }; U.view = 'game'; U.sheet = null; tutSync(); }
  function tutStep() { return U.tut ? TUT[U.tut.step] : null; }
  function tutAllow(a, d) {
    if (a === 'tutnext' || a === 'tutquit') return true;
    const st = TUT[U.tut.step];
    if (st.k !== 'act' || a !== st.a) return false;
    if (st.idx != null) return +d.i === st.idx;
    if (st.cell) return +d.s === st.cell[0] && +d.i === st.cell[1];
    if (st.gap != null) return +d.g === st.gap;
    if (st.size != null) return +d.size === st.size;
    return true;
  }
  const hl = (a, test) => { const st = tutStep(); return st && st.k === 'act' && st.a === a && test(st) ? ' tut-hl' : ''; };

  // ---------- Bausteine ----------
  function header(sc) {
    const left = S.mode === 'solo' ? G.realLeft(S) : null;
    return '<div class="thead"><a class="leave" href="../" aria-label="Zurück zum Spielregal"' + inf('Zurück zum Spielregal') + '>‹</a><h1>Siedlerhain</h1>' +
      '<div class="pill"' + inf(S.mode === 'solo' ? 'Runde. Es gibt 27 Runden, dann ist der Kartenstapel aufgebraucht.' : 'Runde: So viele Runden hast du schon gespielt.') + '><b>' + S.round + (S.mode === 'solo' ? '/27' : '') + '</b><small>Runde</small></div>' +
      '<div class="pill pts"' + inf('Deine Punkte jetzt. Die Zwischenwertung findest du unten.') + '><b>' + sc.total + '</b><small>Punkte</small></div>' +
      (U.tut ? '<button class="mbtn" data-a="tutquit" aria-label="Lernspiel beenden"' + inf('Lernspiel beenden') + '>✕</button>'
        : '<button class="mbtn" data-a="menu" aria-label="Menü">☰</button>') + '</div>';
  }

  function plans() {
    let h = '<section><p class="label">Stadtpläne: fertige Siedlungen dieser Größen</p><div class="plans">';
    for (let k = 0; k < 3; k++) {
      const c = G.planCard(S, k), p = G.planProgress(S, k), d = S.planDone[k];
      const late = !d && S.soloSeen;
      const used = {};
      const ests = p.req.map((sz, i) => {
        let hs = '';
        for (let j = 0; j < sz; j++) hs += miniHouse(p.filled[i] || !!d, k * 3 + j + sz);
        return '<span class="pe' + (p.filled[i] || d ? ' ok' : '') + '">' + hs + '</span>';
      }).join('');
      h += '<article class="plan' + (d ? ' done' : '') + (late ? ' late' : '') + '"' + inf('Stadtplan ' + (k + 1) + ': Baue fertige Siedlungen der Größen ' + p.req.join(', ') + '. Das gibt ' + c.first + ' Punkte' +
        (S.mode === 'solo' ? ', solange die Solo-Karte noch nicht aufgetaucht ist. Danach gilt der Plan als von der Konkurrenz erfüllt.' : '.')) + '><div class="ph"><b>Plan ' + (k + 1) + '</b><span class="oct">' + (d ? '+' + d.pts : c.first) + '</span></div><div class="pest">' + ests + '</div>' +
        (late ? '<span class="stamp">Zu spät</span>' : '') + '</article>';
    }
    h += '</div>';
    if (S.mode === 'solo') h += '<p class="note">' + (S.soloSeen ? 'Die Solo-Karte ist aufgetaucht: Die Konkurrenz hat alle offenen Pläne erfüllt.' : 'Pläne zählen nur, bis die Solo-Karte im Stapel auftaucht.') + '</p>';
    return h + '</section>';
  }

  function street(s) {
    const n = G.LEN[s], row = S.houses[s], ph = S.phase;
    const valid = new Set(), srcs = new Set();
    if (ph === 'place') G.validSlots(S, S.sel.n).forEach(p => { if (p[0] === s) valid.add(p[1]); });
    if (ph === 'bis') {
      const ts = G.bisTargets(S);
      if (!S.sel.src) ts.forEach(t => { if (t.s === s) valid.add(t.i); });
      else if (S.sel.src.s === s) ts.forEach(t => { if (t.s === s && t.i === S.sel.src.i) valid.add(t.q); });
    }
    const fenceMode = ph === 'fence' && S.sel.pos.s === s;
    let cells = '';
    row.forEach((v, i) => {
      const ok = valid.has(i), full = v !== null;
      const isSrc = ph === 'bis' && S.sel.src && S.sel.src.s === s && S.sel.src.i === i;
      let cls = 'house ' + (full ? 'full' : 'empty') + (ok ? ' ok' : '') + (isSrc ? ' src' : '');
      const ph2 = hl('cell', st => st.cell[0] === s && st.cell[1] === i);
      cls += ph2;
      const tip = full ? 'Hausnummer ' + v + ' in ' + NAMES[s] + '.' + (S.bisH[s][i] ? ' Doppelte Hausnummer: kostet Punkte.' : '') + (S.lock[s][i] ? ' Gehört zu einem erfüllten Stadtplan.' : '') : 'Freier Bauplatz. Die Nummern müssen in dieser Straße von links nach rechts aufsteigen.';
      const inner = full ? houseSVG(v, s, { bis: S.bisH[s][i], lock: S.lock[s][i] }) : (ok ? lotSVG(s * 3 + i) + '<span class="ghost">' + S.sel.n + '</span>' : lotSVG(s * 3 + i));
      cells += '<button class="' + cls + '" data-a="cell" data-s="' + s + '" data-i="' + i + '" data-v="' + (full ? v : '') + '"' + inf(tip) + (ok ? '' : ' disabled tabindex="-1"') +
        ' aria-label="' + NAMES[s] + ', Feld ' + (i + 1) + (full ? ', Nummer ' + v : ', frei') + '">' + inner + '</button>';
    });
    let fences = '';
    const free = fenceMode ? G.freeGaps(S, s) : [];
    S.fences[s].forEach((f, g) => {
      if (f) fences += '<i class="fence" data-s="' + s + '" data-g="' + g + '" style="--k:' + (g + 1) + '">' + fenceSVG() + '</i>';
      else if (fenceMode && free.indexOf(g) >= 0) fences += '<button class="gap' + hl('gap', st => st.gap === g) + '" data-a="gap" data-g="' + g + '" style="--k:' + (g + 1) + '" aria-label="Zaun zwischen Feld ' + (g + 1) + ' und ' + (g + 2) + '"></button>';
    });
    const pools = G.POOL_SPOTS[s].map(i => '<span class="pool" style="grid-column:' + (i + 1) + '"' + inf(S.pools[s][i] ? 'Pool gebaut.' : 'Poolplatz: Mit dem Swimmingpool-Effekt baust du hier einen Pool, wenn dein Haus auf diesem Bauplatz steht.') + '>' + poolSVG(S.pools[s][i], s * 9 + i) + '</span>').join('');
    const ests = G.estates(S, s).map(e => '<span class="est' + (e.complete ? ' done' : '') + '" style="grid-column:' + (e.a + 1) + ' / span ' + e.size + '"' +
      inf('Siedlung aus ' + e.size + ' Häusern' + (e.complete ? ', fertig bebaut.' : '. Sie zählt, sobald alle Häuser eine Nummer haben.') + (e.size > 6 ? ' Mehr als 6 Häuser zählen nicht.' : '')) + '><b>' + e.size + '</b></span>').join('');
    const ptoks = G.PARK_VALUES[s].map((v, k) => '<span class="ptok' + (k < S.parks[s] ? ' on' : '') + '"' + inf('Park ' + (k + 1) + ': Mit ' + (k + 1) + ' Parks in dieser Straße bekommst du ' + v + ' Punkte.') + '>' + parkSVG(k < S.parks[s], s * 5 + k) + '<span>' + v + '</span></span>').join('');
    return '<section class="street" data-s="' + s + '"><div class="shead"><h3>' + NAMES[s] + '<span>' + n + ' Häuser</span></h3><div class="parks">' + ptoks + '</div></div>' +
      '<div class="row" style="--n:' + n + '">' + cells + fences + '</div><div class="road"></div><div class="poolrow" style="--n:' + n + '">' + pools + '</div><div class="estrow" style="--n:' + n + '">' + ests + '</div></section>';
  }

  function lines(sc) {
    return '<table class="lines">' + sc.lines.map(l => '<tr class="' + (l.pts < 0 ? 'neg' : '') + '"><td>' + l.label + '<span class="d">' + l.detail + '</span></td><td>' + sgn(l.pts) + '</td></tr>').join('') +
      '<tr><td><b>Summe</b></td><td>' + sc.total + '</td></tr></table>';
  }

  function stats(sc) {
    const counts = G.completedCounts(S);
    let h = '<section class="stats"><p class="label">Siedlungswerte (der Makler erhöht sie)</p><div class="estgrid">';
    for (let k = 0; k < 6; k++) {
      const max = G.EST_VALUES[k].length - 1;
      let pips = '';
      for (let j = 0; j < max; j++) pips += '<i class="pip' + (j < S.marks[k] ? ' on' : '') + '"></i>';
      h += '<div class="cell"' + inf('Fertige Siedlungen der Größe ' + (k + 1) + ' zählen je ' + G.EST_VALUES[k][S.marks[k]] + ' Punkte. Die Punkte darunter zeigen, wie oft der Makler noch steigern kann.') + '><small>Größe ' + (k + 1) + '</small><b>' + G.EST_VALUES[k][S.marks[k]] + '</b><div class="pips">' + pips +
        '</div><small>' + counts[k + 1] + ' fertig</small></div>';
    }
    h += '</div><div class="cgrid">' +
      '<div class="cell"' + inf('Swimmingpools: Je mehr du baust, desto mehr Punkte (bis 9 Pools).') + '><small>Pools</small><b>' + sc.poolCount + '</b><small>' + sgn(sc.pools) + ' Pkt</small></div>' +
      '<div class="cell"' + inf('Zeitarbeit: Ab 6 Zeitarbeitern gibt es 7 Punkte, sonst keinen. Es gibt 11 Felder.') + '><small>Zeitarbeit</small><b>' + S.temps + '</b><small>' + sgn(sc.temps) + ' Pkt</small></div>' +
      '<div class="cell"' + inf('Doppelte Hausnummern kosten Punkte, und es werden immer mehr.') + '><small>Doppelte</small><b>' + S.bis + '</b><small>' + sgn(sc.bis) + ' Pkt</small></div>' +
      '<div class="cell"' + inf('Abgelehnte Bauanträge: Der erste kostet nichts, der zweite 3 Punkte, der dritte 5 Punkte und beendet das Spiel.') + '><small>Abgelehnt</small><b>' + S.refusals + '</b><small>' + sgn(sc.refusals) + ' Pkt</small></div></div>' +
      '<details><summary>Zwischenwertung</summary>' + lines(sc) + '</details></section>';
    return h;
  }

  const REASON = { plans: 'Alle drei Stadtpläne sind erfüllt.', refusals: 'Dritter abgelehnter Bauantrag.', full: 'Alle Häuser sind gebaut.', deck: 'Der Kartenstapel ist aufgebraucht.' };
  function result(sc) {
    const best = S.prevBest;
    return '<section class="result"><svg class="stern" viewBox="0 0 120 120" aria-hidden="true"><path d="' + burst(60, 60, 38, 58, 11, 9) + '" fill="#FFD23F" stroke="' + INK + '" stroke-width="4" stroke-linejoin="round"/></svg>' +
      '<p class="eyebrow">Spiel beendet · Runde ' + S.round + (S.mode === 'solo' ? ' · Solo' : ' · Basisspiel') + '</p><h2>' + sc.total + ' Punkte</h2>' +
      '<p class="why">' + (REASON[S.endReason] || '') + ' ' + (S.newBest ? (best === null ? 'Das ist dein erster Wert, der Bestwert startet hier.' : 'Neuer Bestwert! Vorher: ' + best + '.') : (best !== null ? 'Dein Bestwert: ' + best + '.' : '')) + '</p>' + lines(sc) +
      '<button class="btn pink" data-a="newsame">Neue Partie</button></section>';
  }

  function coach() {
    if (!U.tut) return '';
    const st = TUT[U.tut.step];
    return '<div class="coach"><div class="cin">' + birdSVG() + '<div class="tx"><b>Zippel</b><span>' + esc(st.t) + '</span>' +
      (st.k === 'info' ? '<div class="row2"><button class="btn sm pri" data-a="' + (st.last ? 'tutquit' : 'tutnext') + '">' + (st.last ? 'Fertig' : 'Weiter') + '</button></div>' : '') + '</div></div></div>';
  }

  function kard(c, i, o) {
    const m = EF[c.e];
    return '<button class="kard' + (o.dead ? ' dead' : '') + (o.chosen ? ' chosen' : '') + (o.dim ? ' dim' : '') + (o.hl || '') + '" data-a="' + o.a + '" data-i="' + i + '"' + inf('Hausnummer ' + c.n + ' vorne. Hinten: ' + m.info) + (o.dead || o.off ? ' disabled' : '') + '>' +
      (o.tag ? '<span class="tag">' + o.tag + '</span>' : '') +
      '<span class="scene">' + sceneSVG(c.n, i) + '</span><span class="back">' + effSVG(c.e) + '<span>' + m.name + '</span></span></button>';
  }

  function dock() {
    const ph = S.phase;
    let body = '';
    const cancel = U.tut ? '' : '<button class="btn sm" data-a="cancel">Zurück</button>';
    if (ph === 'over') {
      body = '<div class="prompt"><p>Das Spiel ist beendet.</p><button class="btn sm pri" data-a="newsame">Neue Partie</button></div>';
    } else if (ph === 'reshuf') {
      body = '<div class="prompt"><p><b>Erster Plan geschafft!</b> Du darfst die 81 Baukarten neu mischen und drei neue Stapel bilden.</p></div><div class="two chips"><button class="btn sm pri" data-a="reshufyes">Neu mischen</button><button class="btn sm" data-a="reshufno">Nein, weiter</button></div>';
    } else if (ph === 'pick') {
      const cards = S.mode === 'solo' ? S.hand : S.combos;
      body = '<div class="prompt"><p>' + (S.mode === 'solo' ? 'Wähle die Karte für die <b>Hausnummer</b>. Eine andere gibt dir gleich den Effekt.' : 'Wähle eine Kombination aus Hausnummer und Effekt.') + '</p></div><div class="hand">' +
        cards.map((c, i) => kard(c, i, { a: 'pick', hl: hl('pick', st => st.idx === i) })).join('') + '</div>';
    } else if (ph === 'pickeff') {
      body = '<div class="prompt"><p>Hausnummer <b>' + S.sel.n + '</b>. Welche Karte gibt den <b>Effekt</b>?</p>' + cancel + '</div><div class="hand">' +
        S.hand.map((c, i) => kard(c, i, i === S.sel.card ? { a: 'x', off: true, chosen: true, tag: 'Nummer ' + c.n } : { a: 'pickeff', hl: hl('pickeff', st => st.idx === i) })).join('') + '</div>' +
        (U.tut ? '' : '<div class="chips"><button class="btn sm" data-a="noeff">Ohne Effekt</button></div>');
    } else if (ph === 'refuse') {
      body = '<div class="prompt"><p>Die Nummer <b>' + S.sel.n + '</b> passt nirgends mehr hin. Dein Bauantrag wird abgelehnt (' + (S.refusals + 1) + '. von 3, ' + ['kostenlos', '\u22123 Punkte', '\u22125 Punkte, das Spiel endet'][S.refusals] + ').' + '</p></div><div class="chips"><button class="btn sm hot" data-a="refuse">Ablehnung eintragen</button>' + cancel + '</div>';
    } else {
      const m = S.sel.e ? EF[S.sel.e] : null;
      if (ph === 'adjust') {
        const chips = G.adjustOptions(S).map(o => '<button class="chip" data-a="adj" data-d="' + o.d + '"><b>' + o.n + '</b><small>' + (o.d === 'x' ? 'ohne Zeitarbeit' : (o.d === 0 ? '±0, Zeitarbeiter' : sgn(o.d) + ', Zeitarbeiter')) + '</small></button>').join('');
        body = '<div class="prompt"><p>Zeitarbeit: Welche Nummer bekommt das Haus?</p>' + cancel + '</div><div class="chips">' + chips + '</div>';
      } else if (ph === 'place') {
        body = '<div class="prompt"><p>Tippe ein markiertes Grundstück für die <b>' + S.sel.n + '</b> (' + G.validSlots(S, S.sel.n).length + ' möglich).' + (m ? ' Danach: ' + m.name + '.' : '') + '</p>' + cancel + '</div>';
      } else {
        const skip = '<button class="btn sm" data-a="skip">Überspringen</button>';
        if (ph === 'fence') body = '<div class="prompt"><p>Geometer: Tippe eine gestrichelte Stelle in ' + NAMES[S.sel.pos.s] + '.</p>' + skip + '</div>';
        else if (ph === 'bis') body = '<div class="prompt"><p>' + (S.sel.src ? 'Tippe das freie Nachbarfeld für die Kopie.' : 'Doppelte Hausnummer: Tippe das Haus, das du verdoppeln willst.') + '</p>' + (S.sel.src ? '<button class="btn sm" data-a="bisback">Anderes Haus</button>' : skip) + '</div>';
        else if (ph === 'agent') {
          const av = G.agentSizes(S);
          const chips = [1, 2, 3, 4, 5, 6].map(sz => { const can = av.indexOf(sz) >= 0;
            return '<button class="chip' + hl('size', st => st.size === sz) + '" data-a="size" data-size="' + sz + '"' + (can ? '' : ' disabled') + '><b>' + sz + '</b><small>' + (can ? G.EST_VALUES[sz - 1][S.marks[sz - 1]] + ' → ' + G.EST_VALUES[sz - 1][S.marks[sz - 1] + 1] : 'voll') + '</small></button>'; }).join('');
          body = '<div class="prompt"><p>Immobilienmakler: Für welche Siedlungsgröße steigt der Wert?</p>' + (U.tut ? '' : skip) + '</div><div class="chips">' + chips + '</div>';
        }
      }
    }
    return '<div class="dock"><div class="dinner">' + body + '</div></div>';
  }

  const RULES = '<div class="rules">' +
    '<h3>Ziel</h3><p>Du bist Architekt in den 50ern und baust in drei Straßen (10, 11 und 12 Häuser) Siedlungen mit Parks und Pools. Wer die meisten Punkte sammelt, ist der Stararchitekt.</p>' +
    '<h3>Solo-Spiel (so wie in der Solo-Variante)</h3><ul>' +
    '<li>81 Baukarten, 27 Runden. Jede Runde ziehst du drei Karten. Vorne steht eine Hausnummer im Vorgarten, hinten ein Effekt.</li>' +
    '<li>Du nimmst zwei verschiedene Karten: eine für die Hausnummer, eine für den Effekt. Die dritte fällt weg.</li>' +
    '<li>Die Solo-Karte ist unter den Karten versteckt. Sobald sie auftaucht, gelten alle Stadtpläne, die du noch nicht erfüllt hast, als von der Konkurrenz erfüllt.</li>' +
    '<li>Zeitarbeit bringt nur 7 Punkte, wenn du mindestens 6 Zeitarbeiter eingestellt hast, sonst keinen.</li></ul>' +
    '<h3>Basisspiel allein</h3><ul>' +
    '<li>Drei Stapel mit je 27 Karten. Jede Runde wird die oberste Karte jedes Stapels umgedreht. Die Hausnummer der neuen obersten Karte und der Effekt der umgedrehten Karte bilden eine Kombination. Du wählst eine der drei.</li>' +
    '<li>Du bist immer der Erste bei den Stadtplänen und bekommst die hohen Punkte. Nach dem ersten Plan darfst du die Karten neu mischen. Für Zeitarbeit gilt auch hier die Regel ab 6 Zeitarbeitern, weil es keine Mitspieler zum Vergleichen gibt.</li></ul>' +
    '<h3>Hausnummer eintragen</h3><ul>' +
    '<li>Schreibe die Nummer in ein freies Haus einer der drei Straßen. Die Nummern müssen von links nach rechts steigen. Lücken und übersprungene Nummern sind erlaubt. Dieselbe Nummer darf in einer Straße nicht zweimal stehen.</li>' +
    '<li>Kannst du die Nummer nirgends eintragen, wird dein Bauantrag abgelehnt. Die erste Ablehnung kostet nichts, die zweite 3 Minuspunkte, die dritte 5 Minuspunkte und beendet das Spiel. Beim abgelehnten Antrag gibt es keinen Effekt.</li></ul>' +
    '<h3>Die Effekte (nie Pflicht)</h3><ul>' +
    '<li><b>Geometer:</b> Setze einen Zaun zwischen zwei Bauplätze einer Straße. Zäune begrenzen Siedlungen (an den Straßenenden stehen schon welche). Mehr als 6 Häuser zählen nicht.</li>' +
    '<li><b>Immobilienmakler:</b> Steigere den Wert einer Siedlungsgröße. Normal gibt es 1 Punkt pro Haus.</li>' +
    '<li><b>Landschaftsgärtner:</b> Lege in der Straße des neuen Hauses einen Park an (2, 4, 10 Punkte und so weiter).</li>' +
    '<li><b>Swimmingpool:</b> Steht das Haus auf einem Bauplatz mit Poolplatz, baust du dort einen Pool (3, 6, 9, 13 … Punkte).</li>' +
    '<li><b>Zeitarbeit:</b> Ändere die Nummer um 1 oder 2 (0 bis 17 sind möglich). Jeder Zeitarbeiter zählt.</li>' +
    '<li><b>Doppelte Hausnummer:</b> Kopiere die Nummer irgendeines Hauses auf ein freies Nachbarfeld in derselben Siedlung. Das gibt Minuspunkte.</li></ul>' +
    '<h3>Siedlungen und Stadtpläne</h3><ul>' +
    '<li>Eine Siedlung zählt, wenn alle ihre Häuser eine Nummer haben. Ein Zaun darf später keine Siedlung teilen, die schon für einen Stadtplan verwendet wurde, und diese Siedlung kann nicht für einen zweiten Plan dienen.</li>' +
    '<li>Ein Stadtplan wird sofort gewertet, sobald du seine Siedlungen fertig hast.</li></ul>' +
    '<h3>Ende und Wertung</h3><ul>' +
    '<li>Das Spiel endet, wenn du den dritten Bauantrag ablehnst, alle drei Pläne erfüllt hast, alle Häuser gebaut sind (oder im Solo-Spiel der Kartenstapel aufgebraucht ist).</li>' +
    '<li>Punkte: Stadtpläne, Parks, Pools, Zeitarbeit, fertige Siedlungen. Abzug: doppelte Hausnummern und Ablehnungen.</li></ul>' +
    '<h3>Unterschiede zum Original</h3>' +
    '<p class="fine">Siedlerhain baut die Regeln, die Kartenliste (81 Karten), die Stadtpläne der Basisversion, die Poolplätze und die Wertungstabellen von Welcome To… nach. Nicht enthalten sind der Mehrspielermodus, die Fortgeschrittenen- und Expertenregeln (Kreisverkehre, zusätzliche Pläne, Karten wählen und weitergeben), Erweiterungen und das AAA-Solo. Die Zeichnungen sind eigene.</p></div>';

  function sheets() {
    if (!U.sheet) return '';
    const x = (t) => '<div class="sh"><h2 class="disp">' + t + '</h2><button class="xbtn" data-a="close" aria-label="Schließen">✕</button></div>';
    if (U.sheet === 'menu') return '<div class="ov" data-a="close"><div class="sheet" data-stop="1">' + x('Menü') + '<div class="menu">' +
      '<button class="btn" data-a="rules">Spielregeln</button><button class="btn" data-a="saveleave">Speichern und zum Spielregal</button><button class="btn" data-a="newask" data-mode="' + (S ? S.mode : 'solo') + '">Neustart</button><button class="tlink" data-a="reload">Neueste Version laden</button></div></div></div>';
    if (U.sheet === 'rules') return '<div class="ov" data-a="close"><div class="sheet" data-stop="1">' + x('Spielregeln') + RULES + '</div></div>';
    if (U.sheet === 'newask') return '<div class="ov" data-a="close"><div class="sheet" data-stop="1">' + x('Neue Partie?') + '<div class="menu"><p>' + (S && S.phase !== 'over' && U.view === 'game' ? 'Die laufende Partie wird dabei überschrieben.' : 'Die gespeicherte Partie wird dabei überschrieben.') + '</p>' +
      '<button class="btn pri" data-a="newyes" data-mode="' + U.mode + '">Ja, ' + (U.mode === 'solo' ? 'Solo' : 'Basisspiel') + ' starten</button><button class="btn" data-a="close">Weiterspielen</button></div></div></div>';
    return '';
  }

  function startView() {
    const saved = load();
    const sm = saved ? (saved.mode === 'solo' ? 'Solo' : 'Basisspiel') + ', Runde ' + saved.round : '';
    return '<div class="start"><div class="stage">' + coverSVG() + '<a class="leave" href="../"' + inf('Zurück zum Spielregal') + '>‹ Spielregal</a></div><div class="sdock">' +
      (saved ? '<button class="btn pri" data-a="resume">Partie fortsetzen<span class="sub">' + sm + '</span></button>' : '') +
      '<div class="two"><button class="btn ' + (saved ? 'alt' : 'pri') + '" data-a="start" data-mode="solo">Solo<span class="sub">27 Runden, 3 Karten</span></button><button class="btn alt" data-a="start" data-mode="base">Basisspiel<span class="sub">3 Kombinationen</span></button></div>' +
      '<div class="links"><button class="tlink" data-a="tut">Lernspiel</button><button class="tlink" data-a="rules">Spielregeln lesen</button></div></div>' + sheets() + '</div>';
  }

  function gameView() {
    const sc = G.score(S);
    return header(sc) + '<div class="main" id="sc"><div class="wrap">' + (S.phase === 'over' ? result(sc) : '') + plans() + [0, 1, 2].map(street).join('') + stats(sc) + '</div></div>' + coach() + dock() + sheets();
  }

  // ---------- Zeichnen ----------
  let prev = null;
  function render() {
    tutSync();
    const old = document.getElementById('sc'), top = old ? old.scrollTop : 0;
    if (U.view === 'game' && S) { app.innerHTML = gameView(); themeFor(false); } else { app.innerHTML = startView(); themeFor(true); }
    const nw = document.getElementById('sc'); if (nw) nw.scrollTop = top;
    if (S && S.phase === 'over' && !S.recorded) { recordPlay(); save(); if (nw) nw.scrollTop = 0; app.innerHTML = gameView(); }
    fx();
  }
  function fx() {
    if (!S || U.view !== 'game') { prev = null; return; }
    const sc = G.score(S).total;
    const parks = S.parks.reduce((a, b) => a + b, 0), pools = S.pools.reduce((a, r) => a + r.filter(Boolean).length, 0);
    if (prev && prev.id === S.id) {
      S.houses.forEach((r, s) => r.forEach((v, i) => { if (v !== null && prev.h[s][i] === null) { const el = app.querySelector('.house[data-s="' + s + '"][data-i="' + i + '"]'); if (el) el.classList.add('pop'); } }));
      S.fences.forEach((r, s) => r.forEach((v, g) => { if (v && !prev.f[s][g]) { const el = app.querySelector('.fence[data-s="' + s + '"][data-g="' + g + '"]'); if (el) el.classList.add('pop'); } }));
      if (sc !== prev.sc) {
        const p = app.querySelector('.pill.pts'); if (p) { p.classList.add('bump'); const r = p.getBoundingClientRect(); floaty(sgn(sc - prev.sc), r.left + r.width / 2 - 10, r.bottom + 4); }
      }
      if (parks > prev.parks) note('Park angelegt!');
      else if (pools > prev.pools) note('Pool gebaut!');
      if (S.soloSeen && !prev.soloSeen && S.mode === 'solo') toast('Die Solo-Karte ist aufgetaucht: Offene Pläne sind weg.');
    }
    prev = { id: S.id, h: S.houses.map(r => r.slice()), f: S.fences.map(r => r.slice()), sc, parks, pools, soloSeen: S.soloSeen };
  }
  function floaty(txt, x, y) {
    const e = document.createElement('div'); e.className = 'fl'; e.textContent = txt; e.style.left = x + 'px'; e.style.top = y + 'px';
    document.body.appendChild(e); setTimeout(() => e.remove(), 1200);
  }
  let toastT = null;
  function toast(msg, good) {
    document.querySelectorAll('.toast').forEach(t => t.remove());
    const t = document.createElement('div'); t.className = 'toast' + (good ? ' good' : ''); t.textContent = msg; document.body.appendChild(t);
    clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600);
  }
  const note = msg => toast(msg, true);
  function buzz() { try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) { /* egal */ } }

  // ---------- Info-Blase per langem Drücken ----------
  let lp = null, lpFired = false;
  function hideInfo() { document.querySelectorAll('.bub').forEach(b => b.remove()); }
  function showInfo(el) {
    hideInfo();
    const b = document.createElement('div'); b.className = 'bub'; b.textContent = el.dataset.info; document.body.appendChild(b);
    const r = el.getBoundingClientRect(), w = b.offsetWidth, h = b.offsetHeight;
    let x = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), window.innerWidth - w - 8), y = r.top - h - 10;
    if (y < 8) y = r.bottom + 10;
    b.style.left = x + 'px'; b.style.top = y + 'px';
    setTimeout(hideInfo, 4200);
  }
  document.addEventListener('pointerdown', e => {
    hideInfo();
    const t = e.target.closest && e.target.closest('[data-info]');
    if (!t) return;
    lp = { x: e.clientX, y: e.clientY, id: setTimeout(() => { lpFired = true; showInfo(t); buzz(); }, 450) };
  });
  document.addEventListener('pointermove', e => { if (lp && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > 10) { clearTimeout(lp.id); lp = null; } });
  ['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, () => { if (lp) { clearTimeout(lp.id); lp = null; } }));
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('click', e => { if (lpFired) { lpFired = false; e.stopPropagation(); e.preventDefault(); } }, true);

  // ---------- Eingaben ----------
  function act(a, d) {
    if (a === 'cell' && S && S.phase === 'bis') a = d.v !== '' ? 'bissrc' : 'bisdst';
    if (a === 'noeff') a = 'pickeff', d = { i: '-1' };
    if (U.tut && !tutAllow(a, d)) { const st = TUT[U.tut.step]; toast(st.k === 'act' ? st.t : 'Tippe auf „Weiter“.'); return; }
    let ok = true;
    const before = U.tut ? TUT[U.tut.step] : null;
    switch (a) {
      case 'pick': ok = G.choose(S, +d.i); break;
      case 'pickeff': ok = G.chooseEffect(S, +d.i); break;
      case 'adj': ok = G.adjust(S, d.d === 'x' ? 'x' : +d.d); break;
      case 'cancel': ok = G.cancel(S); break;
      case 'cell': ok = G.place(S, +d.s, +d.i); break;
      case 'bissrc': ok = G.bisSource(S, +d.s, +d.i); break;
      case 'bisdst': ok = G.placeBis(S, +d.i); break;
      case 'bisback': S.sel.src = null; break;
      case 'gap': ok = G.placeFence(S, +d.g); break;
      case 'size': ok = G.markAgent(S, +d.size); break;
      case 'skip': ok = G.skip(S); break;
      case 'refuse': ok = G.refuse(S); break;
      case 'reshufyes': ok = G.reshuffle(S, true); break;
      case 'reshufno': ok = G.reshuffle(S, false); break;
      case 'menu': U.sheet = 'menu'; render(); return;
      case 'rules': U.sheet = 'rules'; render(); return;
      case 'close': U.sheet = null; render(); return;
      case 'newask': U.mode = d.mode || U.mode; U.sheet = 'newask'; render(); return;
      case 'start': U.mode = d.mode || 'solo'; if (load()) { U.sheet = 'newask'; render(); return; } /* fall through */
      case 'newyes': U.tut = null; newGame(d.mode || U.mode); U.mode = S.mode; U.view = 'game'; U.sheet = null; save(); render(); return;
      case 'newsame': U.tut = null; newGame(S ? S.mode : 'solo'); U.view = 'game'; U.sheet = null; save(); render(); return;
      case 'resume': { const s = load(); if (s) { S = s; U.view = 'game'; } render(); return; }
      case 'tut': startTut(); render(); return;
      case 'tutnext': U.tut.step++; render(); return;
      case 'tutquit': U.tut = null; S = null; U.view = 'start'; prev = null; render(); return;
      case 'saveleave': save(); location.href = '../'; return;
      case 'reload': save(); location.replace(location.pathname + '?v=' + Date.now() + '&resume=1'); return;
    }
    if (ok && U.tut && before && before.k === 'act' && before.a === a) U.tut.step = Math.min(U.tut.step + 1, TUT.length - 1);
    if (ok) { save(); buzz(); }
    render();
  }
  app.addEventListener('click', ev => {
    const stop = ev.target.closest('[data-stop]');
    const t = ev.target.closest('[data-a]');
    if (!t || t.disabled) return;
    if (stop && t.classList.contains('ov')) return; // Klick im Fenster schließt nicht
    act(t.dataset.a, t.dataset);
  });

  // ---------- Start ----------
  (function init() {
    const saved = load();
    if (saved && /[?&]resume=1/.test(location.search)) { S = saved; U.view = 'game'; }
    render();
  })();
})();
</script>
</body>
</html>
