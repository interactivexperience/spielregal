<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B8A2E6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Siedlerhain">
<title>Siedlerhain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Siedlerhain (Welcome To…): Naive-Design-Stil nach den Moodboard-Referenzen des Owners.
   Flache Farbblöcke, dunkles Weinrot als Linienfarbe, wacklige Umrisse, harte Versatzschatten,
   Blob- und Zackenformen, Bogenkanten. Eigener Stil, nicht von anderen Spielen übernommen. */
:root{
  --paper:#F5F2EE; --card:#FFFDF8; --ink:#6B1324; --ink2:#8E4A57;
  --pink:#F59AC4; --lilac:#B8A2E6; --mint:#8ED9B0; --orange:#F7A21B; --yellow:#FFD23F; --red:#E0402F; --sky:#8FD0EE; --green:#63CE93;
  --b0:var(--pink); --b1:var(--lilac); --b2:var(--mint);
  --btn:#FFF8EE; --plate:#FFF8EE; --plate-ink:#6B1324; --dock:#FFD23F; --dock-ink:#6B1324; --hero:#B8A2E6;
  --fd:'Dela Gothic One','Arial Black',system-ui,sans-serif;
  --fb:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;
  --g:3px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#170F1F; --card:#2A1B33; --ink:#F6E3DA; --ink2:#C9A9A6;
    --b0:#9C3E70; --b1:#5C4A99; --b2:#2E7358; --red:#F0604B; --yellow:#E9BC22; --dock:#E9BC22; --hero:#5C4A99;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#170F1F; --card:#2A1B33; --ink:#F6E3DA; --ink2:#C9A9A6;
  --b0:#9C3E70; --b1:#5C4A99; --b2:#2E7358; --red:#F0604B; --yellow:#E9BC22; --dock:#E9BC22; --hero:#5C4A99;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;position:fixed;inset:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);
  font:400 15px/1.4 var(--fb);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
a{color:inherit}
svg{display:block}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.disp{font-family:var(--fd);font-weight:400}

/* Kopf */
.thead{flex:none;background:var(--paper);border-bottom:2.5px solid var(--ink);display:flex;align-items:center;gap:8px;
  padding:max(8px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
.leave{font:600 13px/1 var(--fb);text-decoration:none;color:var(--ink);padding:10px 4px;display:inline-block}
.thead h1{font:400 19px/1 var(--fd);letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap}
.pill{border:2px solid var(--ink);border-radius:999px;padding:3px 9px 4px;background:var(--card);box-shadow:2px 2px 0 var(--ink);
  display:flex;flex-direction:column;align-items:center;min-width:50px}
.pill b{font:400 15px/1.05 var(--fd)}
.pill small{font:600 8px/1 var(--fb);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);margin-top:1px}
.pill.pts{background:var(--pink);color:#6B1324}
.pill.pts small{color:#6B1324;opacity:.8}
.pill.bump{animation:bump .5s ease-out}
.mbtn{width:38px;height:38px;border:2.5px solid var(--ink);border-radius:50% 46% 52% 48%;background:var(--orange);color:#6B1324;font:400 17px/1 var(--fd);
  box-shadow:2px 2px 0 var(--ink);display:grid;place-items:center;flex:none}
.mbtn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}

/* Spielfläche */
.main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:14px max(12px,env(safe-area-inset-right,0px)) 22px max(12px,env(safe-area-inset-left,0px))}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.label{font:600 11px/1 var(--fb);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.note{font-size:12.5px;line-height:1.35;color:var(--ink2);margin-top:8px}

/* Stadtpläne */
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.plan{position:relative;background:var(--card);border:2.5px solid var(--ink);border-radius:12px 14px 11px 15px/14px 11px 15px 12px;padding:7px 7px 8px;box-shadow:3px 3px 0 var(--ink);
  display:flex;flex-direction:column;gap:6px;min-width:0;overflow:hidden}
.plan.done{background:var(--green);color:#6B1324}
.plan.late{opacity:.6}
.plan .ph{display:flex;justify-content:space-between;align-items:center;gap:4px}
.plan .ph b{font:400 12px/1 var(--fd)}
.oct{min-width:30px;height:26px;padding:0 4px;display:grid;place-items:center;font:400 14px/1 var(--fd);color:#6B1324;background:var(--yellow);border:2px solid #6B1324;
  clip-path:none;border-radius:8px 6px 9px 6px}
.plan.done .oct{background:var(--btn)}
.pest{display:flex;flex-direction:column;gap:5px}
.pe{display:flex;gap:1px;align-items:flex-end;border-bottom:2.5px solid var(--ink);padding:0 1px 1px;position:relative;width:max-content;max-width:100%}
.pe::before,.pe::after{content:"";position:absolute;bottom:-2px;height:9px;border-left:2.5px solid var(--ink)}
.pe::before{left:-1px}.pe::after{right:-1px}
.pe svg{width:12px;height:15px;flex:none}
.pe.ok svg .w{fill:var(--green)}
.plan.done .pe{border-color:#6B1324}
.plan.done .pe::before,.plan.done .pe::after{border-color:#6B1324}
.stamp{position:absolute;right:-6px;bottom:6px;transform:rotate(-14deg);border:2.5px solid var(--red);color:var(--red);border-radius:6px;padding:2px 6px;
  font:400 10px/1.1 var(--fd);text-transform:uppercase;background:color-mix(in srgb,var(--card) 80%,transparent);letter-spacing:.03em;text-align:center}

/* Straßen */
.street{background:var(--bc);border:2.5px solid var(--ink);border-radius:16px 20px 14px 22px/20px 14px 22px 16px;padding:10px 8px 9px;box-shadow:4px 4px 0 var(--ink);
  display:flex;flex-direction:column;gap:3px;color:var(--ink)}
.street[data-s="0"]{--bc:var(--b0)}.street[data-s="1"]{--bc:var(--b1)}.street[data-s="2"]{--bc:var(--b2)}
.shead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.shead h3{font:400 14px/1.1 var(--fd)}
.shead h3 span{font:500 11px/1 var(--fb);margin-left:6px;opacity:.8}
.parks{display:flex;gap:4px}
.ptok{width:24px;height:24px;display:grid;place-items:center;font:400 10.5px/1 var(--fd);color:var(--ink);position:relative}
.ptok svg{position:absolute;inset:0;width:100%;height:100%}
.ptok span{position:relative;top:-1px}
.ptok.on span{color:#fff;text-shadow:0 0 2px #6B1324,0 0 2px #6B1324}
.row{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));column-gap:var(--g);position:relative}
.house{position:relative;aspect-ratio:25/32;display:grid;place-items:center;min-width:0;padding:0}
.house.empty{border-radius:6px 7px 5px 7px;border:1.5px dashed color-mix(in srgb,var(--ink) 55%,transparent);background:rgba(255,255,255,.28);
  font:400 12px/1 var(--fd);color:var(--plate-ink)}
.house svg{width:100%;height:100%;overflow:visible}
.house.ok.empty{border:2.5px solid #6B1324;background:var(--yellow);cursor:pointer;animation:wig 1.3s ease-in-out infinite}
.house.ok.empty .ghost{opacity:.7}
.house.ok.full{cursor:pointer;animation:wig 1.3s ease-in-out infinite;filter:drop-shadow(0 0 3px var(--yellow)) drop-shadow(0 0 1px var(--yellow))}
.house.src{filter:drop-shadow(0 0 4px var(--orange)) drop-shadow(0 0 2px var(--orange))}
.house.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.tut-hl{outline:4px solid var(--red);outline-offset:3px;animation:wig 1.1s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) translateY(-1px)}}
@keyframes pop{0%{transform:scale(.3) rotate(-14deg)}100%{transform:none}}
@keyframes bump{40%{transform:scale(1.18) rotate(-3deg)}}
.fence{position:absolute;top:-5px;bottom:-4px;width:7px;transform:translateX(-50%);pointer-events:none;
  left:calc((100% - (var(--n) - 1) * var(--g)) / var(--n) * var(--k) + var(--g) * (var(--k) - .5))}
.fence svg{width:100%;height:100%}
.fence.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.gap{position:absolute;top:-8px;bottom:-8px;width:22px;transform:translateX(-50%);z-index:2;
  left:calc((100% - (var(--n) - 1) * var(--g)) / var(--n) * var(--k) + var(--g) * (var(--k) - .5))}
.gap::before{content:"";position:absolute;left:50%;top:5px;bottom:5px;border-left:3px dashed var(--red);transform:translateX(-50%);z-index:1}
.gap::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:10px;margin-left:-5px;background:var(--yellow);border:1.5px solid #6B1324;border-radius:6px;animation:wig 1.3s ease-in-out infinite}
.poolrow,.estrow{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));column-gap:var(--g);align-items:center}
.poolrow{height:18px;margin-top:3px}
.pool{grid-row:1;justify-self:center;width:100%;max-width:26px;height:17px}
.pool svg{width:100%;height:100%}
.estrow{margin-top:2px}
.est{grid-row:1;height:17px;position:relative;border-bottom:2px solid var(--ink);display:flex;justify-content:center;align-items:flex-start;font:400 11px/1 var(--fd);min-width:0}
.est::before,.est::after{content:"";position:absolute;bottom:-5px;height:8px;border-left:2px solid var(--ink)}
.est::before{left:0}.est::after{right:0}
.est.done{color:#6B1324;border-color:#6B1324}
.est.done::before,.est.done::after{border-color:#6B1324}
.est.done b{background:var(--green);border:1.5px solid #6B1324;border-radius:8px;padding:2px 6px 1px;margin-top:-4px}

/* Zähler */
.stats{display:flex;flex-direction:column;gap:9px}
.estgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.cgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.cell{background:var(--card);border:2px solid var(--ink);border-radius:10px 12px 9px 12px;padding:6px 3px 5px;text-align:center;display:flex;flex-direction:column;gap:2px;min-width:0;box-shadow:2px 2px 0 var(--ink)}
.cell small{font-size:10px;color:var(--ink2);line-height:1.2}
.cell b{font:400 19px/1.05 var(--fd)}
.pips{display:flex;justify-content:center;gap:3px;min-height:7px}
.pip{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--ink)}
.pip.on{background:var(--orange)}
details{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:10px 12px;box-shadow:3px 3px 0 var(--ink)}
summary{cursor:pointer;font:400 14px/1.2 var(--fd)}
details[open] summary{margin-bottom:8px}
.lines{width:100%;border-collapse:collapse;font-size:13px}
.lines td{padding:4px 0;border-top:1.5px dashed color-mix(in srgb,var(--ink) 35%,transparent)}
.lines td:last-child{text-align:right;font:400 15px/1 var(--fd)}
.lines .d{color:var(--ink2);font-size:11.5px;padding-left:8px}
.lines tr.neg td:last-child{color:var(--red)}

/* Ergebnis */
.result{background:var(--orange);color:#6B1324;border:2.5px solid #6B1324;border-radius:20px 16px 22px 14px/16px 22px 14px 20px;padding:18px 16px 16px;box-shadow:5px 5px 0 #6B1324;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.result .eyebrow{font:600 11px/1 var(--fb);letter-spacing:.09em;text-transform:uppercase}
.result h2{font:400 46px/1 var(--fd);letter-spacing:-.02em}
.result .why{font-size:13px}
.result .lines td{border-color:rgba(107,19,36,.35)}
.result .lines .d{color:#6B1324;opacity:.8}
.result .lines tr.neg td:last-child{color:#6B1324;text-decoration:underline wavy}
.result .stern{position:absolute;right:-26px;top:-26px;width:120px;height:120px;opacity:.9}

/* Knöpfe */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2.5px solid #6B1324;border-radius:999px;padding:11px 20px;font:400 15px/1 var(--fd);
  background:var(--btn);color:#6B1324;box-shadow:3px 3px 0 #6B1324;text-align:center}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #6B1324}
.btn.pri{background:var(--orange)}
.btn.pink{background:var(--pink)}
.btn.sm{padding:7px 13px;font-size:12.5px;box-shadow:2px 2px 0 #6B1324}
.btn.arm{background:var(--red);color:#fff}
.btn.hot{background:var(--yellow)}
.btn:disabled{opacity:.45}
.tlink{font:600 13px/1 var(--fb);text-decoration:underline;text-underline-offset:3px;padding:8px;text-align:center}

/* Eingabeleiste */
.dock{flex:none;position:relative;background:var(--dock);color:var(--dock-ink);margin-top:12px;
  padding:12px max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.dock::before{content:"";position:absolute;left:0;right:0;top:-10px;height:10px;pointer-events:none;
  background:radial-gradient(circle at 11px 11px,var(--dock) 10px,transparent 10.5px) 0 0/22px 10px repeat-x}
.dinner{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:9px}
.prompt{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;line-height:1.3;min-height:32px;font-weight:500}
.prompt p{min-width:0}
.prompt b{font:400 16px/1 var(--fd)}
.hand{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kard{position:relative;background:var(--plate);color:var(--plate-ink);border:2.5px solid #6B1324;border-radius:14px 12px 16px 12px/12px 16px 12px 14px;box-shadow:3px 3px 0 #6B1324;
  padding:0;display:flex;flex-direction:column;min-width:0;overflow:hidden;text-align:center}
.kard:not(:disabled):active{transform:translate(2px,2px);box-shadow:1px 1px 0 #6B1324}
.kard.dead{opacity:.45}
.kard.chosen{box-shadow:0 0 0 3px var(--red),3px 3px 0 #6B1324}
.kard.dim{opacity:.55}
.kard .scene{width:100%;aspect-ratio:120/84;border-bottom:2.5px solid #6B1324;background:#fff}
.kard .scene svg{width:100%;height:100%}
.kard .back{display:flex;align-items:center;gap:5px;padding:4px 5px 5px;min-height:38px;background:#FFF1D9}
.kard .back svg{width:30px;height:30px;flex:none}
.kard .back span{font:400 10px/1.1 var(--fd);text-align:left;min-width:0;hyphens:manual}
.kard .tag{position:absolute;left:4px;top:4px;background:var(--red);color:#fff;border:2px solid #6B1324;border-radius:8px;padding:2px 6px;font:400 9.5px/1 var(--fd)}
.kard.tut-hl{outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2.5px solid #6B1324;border-radius:12px 14px 11px 13px;background:var(--plate);color:#6B1324;padding:6px 13px;display:flex;flex-direction:column;align-items:center;min-width:56px;box-shadow:2px 2px 0 #6B1324}
.chip b{font:400 22px/1 var(--fd)}
.chip small{font-size:10.5px;color:#8E4A57}
.chip:disabled{opacity:.35}
.chip:not(:disabled):active{transform:translate(1px,1px);box-shadow:1px 1px 0 #6B1324}

/* Coach */
.coach{flex:none;background:var(--lilac);color:#6B1324;border-top:2.5px solid #6B1324;padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px))}
.cin{max-width:520px;margin:0 auto;display:flex;gap:10px;align-items:flex-start}
.cin svg{width:58px;height:58px;flex:none}
.cin .tx{flex:1;min-width:0;font-size:13.5px;line-height:1.35;font-weight:500;display:flex;flex-direction:column;gap:8px}
.cin .tx b{font:400 13px/1 var(--fd)}
.cin .row2{display:flex;gap:8px}
.coach .btn{box-shadow:2px 2px 0 #6B1324}

/* Fenster */
.ov{position:fixed;inset:0;z-index:20;background:rgba(40,10,30,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88%;overflow-y:auto;background:var(--paper);border:2.5px solid var(--ink);border-bottom:0;border-radius:24px 24px 0 0;
  padding:0 max(16px,env(safe-area-inset-right,0px)) max(18px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh{position:sticky;top:0;background:var(--paper);display:flex;justify-content:space-between;align-items:center;padding:14px 0 10px;z-index:1}
.sh h2{font:400 22px/1 var(--fd)}
.xbtn{width:36px;height:36px;border:2.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;font:400 14px/1 var(--fd);background:var(--card);box-shadow:2px 2px 0 var(--ink)}
.menu{display:flex;flex-direction:column;gap:10px;padding-bottom:6px}
.menu .btn{width:100%;justify-content:flex-start;padding:13px 18px}
.rules{display:flex;flex-direction:column;gap:12px;font-size:14px;line-height:1.45}
.rules h3{font:400 15px/1.1 var(--fd);margin-top:4px}
.rules ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.rules .fine{font-size:12.5px;color:var(--ink2)}
.ring{display:inline-block;vertical-align:-5px;width:20px;height:20px}

/* Info-Blase und Hinweis */
.bub{position:fixed;z-index:40;max-width:250px;background:var(--ink);color:var(--paper);border-radius:12px 14px 12px 14px;padding:9px 12px;font-size:12.5px;line-height:1.35;box-shadow:3px 3px 0 var(--orange);pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 210px);transform:translateX(-50%);z-index:45;max-width:86%;background:var(--red);color:#fff;border:2.5px solid #6B1324;border-radius:14px;padding:9px 14px;
  font-size:13px;font-weight:500;box-shadow:3px 3px 0 #6B1324;text-align:center;animation:up .2s ease-out}
.toast.good{background:var(--green);color:#6B1324}
.fl{position:fixed;z-index:35;font:400 20px/1 var(--fd);color:var(--orange);text-shadow:2px 2px 0 #6B1324;pointer-events:none;animation:fl 1.1s ease-out forwards}
@keyframes fl{to{transform:translateY(-46px);opacity:0}}

/* Startseite */
.start{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--hero)}
.stage{flex:1;min-height:0;position:relative;overflow:hidden}
.stage svg.cover{position:absolute;inset:0;width:100%;height:100%;display:block}
.start .leave{position:absolute;z-index:3;left:max(10px,env(safe-area-inset-left,0px));top:max(6px,env(safe-area-inset-top,0px));background:var(--btn);border:2.5px solid #6B1324;border-radius:999px;color:#6B1324;padding:9px 14px;box-shadow:2px 2px 0 #6B1324}
.sdock{flex:none;position:relative;background:var(--paper);padding:16px max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:10px;align-items:stretch}
.sdock::before{content:"";position:absolute;left:0;right:0;top:-10px;height:10px;pointer-events:none;
  background:radial-gradient(circle at 11px 11px,var(--paper) 10px,transparent 10.5px) 0 0/22px 10px repeat-x}
.sdock .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sdock .btn{width:100%}
.sdock .links{display:flex;justify-content:center;gap:6px}
.sdock .sub{display:block;font:500 10.5px/1.2 var(--fb);margin-top:3px;opacity:.85}

@media (prefers-reduced-motion: reduce){
  .house.ok,.gap::after,.tut-hl,.pill.bump,.house.pop,.fence.pop,.sheet,.toast,.fl{animation:none!important}
}
@media (max-width:360px){.thead h1{font-size:17px}.plan{padding:6px 5px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.Siedler = api;

  const sgn = v => (v > 0 ? '+' + v : v < 0 ? '−' + Math.abs(v) : '0');

  const inf = s => ' data-info="' + esc(s) + '"';

  // ---------- Speichern und Melden ----------
  function save() {
    if (U.tut) return;
    try { localStorage.setItem(SAVE, JSON.stringify({ screen: S && S.phase !== 'over' ? 'game' : 'start', st: S })); } catch (e) { /* ohne Speicher weiterspielen */ }
  }
  function load() {
    try { const x = JSON.parse(localStorage.getItem(SAVE) || 'null'); return x && x.st && x.st.v === 2 && x.st.houses && x.st.phase !== 'over' ? x.st : null; } catch (e) { return null; }
  }
  function localDate() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function myName() {
    try { const p = (JSON.parse(localStorage.getItem('spielregal:players') || '[]') || []).filter(x => x && x.name); return p.length ? p[0].name : 'Du'; } catch (e) { return 'Du'; }
  }

  function recordPlay() {
    if (!S || S.phase !== 'over' || S.recorded || U.tut) return;
    const total = G.score(S).total, nm = myName();
    try {
      const key = BEST + ':' + S.mode, old = parseInt(localStorage.getItem(key), 10);
      S.newBest = isNaN(old) || total > old; S.prevBest = isNaN(old) ? null : old;
      if (S.newBest) localStorage.setItem(key, String(total));
    } catch (e) { /* egal */ }
    const entry = { id: 'welcome-to-' + S.id, source: 'welcome-to', app: 'Siedlerhain', bggId: '233867', gameName: 'Welcome To...', date: localDate(), human: nm, solo: true,
      results: [{ name: nm, bot: false, total }], winners: [] };
    try {
      const inbox = JSON.parse(localStorage.getItem(INBOX) || '[]');
      if (!inbox.some(e => e.id === entry.id)) inbox.push(entry);
      localStorage.setItem(INBOX, JSON.stringify(inbox));
      S.recorded = true;
    } catch (e) { /* egal */ }
  }
  function newGame(mode) { S = G.newGame(mode); S.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function themeFor(onStart) {
    const dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches && document.documentElement.dataset.theme !== 'light';
    const top = onStart ? (dark ? '#5C4A99' : '#B8A2E6') : (dark ? '#170F1F' : '#F5F2EE');
    document.documentElement.style.backgroundColor = onStart ? top : '';
    let tc = document.querySelector('meta[name="theme-color"]');
    if (!tc) { tc = document.createElement('meta'); tc.name = 'theme-color'; document.head.appendChild(tc); }

  }

  // ---------- Lernspiel ----------
  const TUT_HANDS = [
    [{ n: 4, e: 'park' }, { n: 9, e: 'fence' }, { n: 14, e: 'bis' }],
    [{ n: 7, e: 'temp' }, { n: 5, e: 'park' }, { n: 12, e: 'bis' }],
    [{ n: 8, e: 'agent' }, { n: 11, e: 'bis' }, { n: 3, e: 'temp' }],
    [{ n: 6, e: 'pool' }, { n: 10, e: 'fence' }, { n: 13, e: 'agent' }]
  ];
  const TUT = [
    { r: 1, k: 'info', t: 'Hallo, ich bin Zippel, der Zaunkönig. Ich zeige dir in drei Runden, wie Siedlerhain geht. Du baust in drei Straßen Häuser und schreibst ihre Hausnummern auf.' },
    { r: 1, k: 'info', t: 'Jede Runde bekommst du drei Karten. Vorne steht ein Haus mit Hausnummer, hinten ein Effekt (der Streifen unten). Du nimmst zwei verschiedene Karten: eine für die Nummer, eine für den Effekt.' },
    { r: 1, k: 'act', a: 'pick', idx: 0, t: 'Tippe die Karte mit der 4 als Hausnummer.' },
    { r: 1, k: 'act', a: 'pickeff', idx: 1, t: 'Jetzt der Effekt: Nimm den Geometer von der Karte mit der 9.' },
    { r: 1, k: 'act', a: 'cell', cell: [0, 1], t: 'Setze die 4 auf das markierte Grundstück. In jeder Straße müssen die Nummern von links nach rechts größer werden.' },
    { r: 1, k: 'act', a: 'gap', gap: 2, t: 'Der Geometer setzt einen Zaun. Tippe die markierte Stelle. Häuser zwischen zwei Zäunen sind eine Siedlung, ihre Größe steht darunter.' },
    { r: 2, k: 'info', t: 'Eine Siedlung zählt erst, wenn alle ihre Häuser eine Nummer haben. Die drei Stadtpläne oben verlangen fertige Siedlungen bestimmter Größen. Wer sie schafft, bekommt viele Punkte, solange die Solo-Karte nicht aufgetaucht ist.' },
    { r: 2, k: 'act', a: 'pick', idx: 0, t: 'Neue Karten. Nimm die 7 als Hausnummer.' },
    { r: 2, k: 'act', a: 'pickeff', idx: 1, t: 'Als Effekt nimmst du den Landschaftsgärtner von der 5.' },
    { r: 2, k: 'act', a: 'cell', cell: [0, 2], t: 'Setze die 7 rechts neben die 4. Die Siedlung links vom Zaun ist dann fast fertig.' },
    { r: 3, k: 'info', t: 'Der Gärtner hat in der Straße einen Park angelegt: Der erste Baum oben rechts ist abgehakt. Parks bringen am Ende Punkte, und es werden immer mehr.' },
    { r: 3, k: 'act', a: 'pick', idx: 2, t: 'Nimm die 3 als Hausnummer. Sie passt ganz links.' },
    { r: 3, k: 'act', a: 'pickeff', idx: 0, t: 'Als Effekt nimmst du den Immobilienmakler von der 8.' },
    { r: 3, k: 'act', a: 'cell', cell: [0, 0], t: 'Setze die 3 ganz nach links. Damit ist die Siedlung mit drei Häusern fertig.' },
    { r: 3, k: 'act', a: 'size', size: 3, t: 'Der Makler steigert den Wert einer Siedlungsgröße. Tippe die 3: Jede fertige Siedlung mit drei Häusern bringt jetzt mehr Punkte.' },
    { r: 4, k: 'info', last: true, t: 'Geschafft. Es gibt noch Swimmingpools (Poolplätze unter der Straße), Zeitarbeit (Nummer ändern, ab 6 Zeitarbeitern 7 Punkte) und Doppelte Hausnummern (kosten Punkte). Passt eine Nummer nirgends, wird der Bauantrag abgelehnt. Viel Spaß beim Bauen!' }
  ];
  function tutSync() {
    if (!U.tut || !S) return;
    while (U.tut.step < TUT.length - 1 && TUT[U.tut.step].r < S.round) U.tut.step++;
    if (S.phase === 'pick' && S.tutRound !== S.round && TUT_HANDS[S.round - 1]) {
      S.hand = TUT_HANDS[S.round - 1].map(c => ({ n: c.n, e: c.e }));
      S.tutRound = S.round;
    }
  }
  function startTut() { newGame('solo'); S.id = 'tut'; S.soloSeen = false; U.tut = { step: 0 }; U.view = 'game'; U.sheet = null; tutSync(); }
  function tutStep() { return U.tut ? TUT[U.tut.step] : null; }
  function tutAllow(a, d) {
    if (a === 'tutnext' || a === 'tutquit') return true;
    const st = TUT[U.tut.step];
    if (st.k !== 'act' || a !== st.a) return false;
    if (st.idx != null) return +d.i === st.idx;
    if (st.cell) return +d.s === st.cell[0] && +d.i === st.cell[1];
    if (st.gap != null) return +d.g === st.gap;
    if (st.size != null) return +d.size === st.size;

  }
  const hl = (a, test) => { const st = tutStep(); return st && st.k === 'act' && st.a === a && test(st) ? ' tut-hl' : ''; };

  // ---------- Bausteine ----------
  function header(sc) {
    const left = S.mode === 'solo' ? G.realLeft(S) : null;
    return '<div class="thead"><a class="leave" href="../" aria-label="Zurück zum Spielregal"' + inf('Zurück zum Spielregal') + '>‹</a><h1>Siedlerhain.</h1>' +
      '<div class="pill"' + inf(S.mode === 'solo' ? 'Runde. Es gibt 27 Runden, dann ist der Kartenstapel aufgebraucht.' : 'Runde: So viele Runden hast du schon gespielt.') + '><b>' + S.round + (S.mode === 'solo' ? '/27' : '') + '</b><small>Runde</small></div>' +
      '<div class="pill pts"' + inf('Deine Punkte jetzt. Die Zwischenwertung findest du unten.') + '><b>' + sc.total + '</b><small>Punkte</small></div>' +

  function plans() {
    let h = '<section><p class="label">Stadtpläne: fertige Siedlungen dieser Größen</p><div class="plans">';
    for (let k = 0; k < 3; k++) {
      const c = G.planCard(S, k), p = G.planProgress(S, k), d = S.planDone[k];
      const late = !d && S.soloSeen;
      const used = {};
      const ests = p.req.map((sz, i) => {
        let hs = '';
        for (let j = 0; j < sz; j++) hs += miniHouse(p.filled[i] || !!d, k * 3 + j + sz);
        return '<span class="pe' + (p.filled[i] || d ? ' ok' : '') + '">' + hs + '</span>';
      }).join('');
      h += '<article class="plan' + (d ? ' done' : '') + (late ? ' late' : '') + '"' + inf('Stadtplan ' + (k + 1) + ': Baue fertige Siedlungen der Größen ' + p.req.join(', ') + '. Das gibt ' + c.first + ' Punkte' +

    return h + '</section>';
  }

  function street(s) {
    const n = G.LEN[s], row = S.houses[s], ph = S.phase;
    const valid = new Set(), srcs = new Set();
    if (ph === 'place') G.validSlots(S, S.sel.n).forEach(p => { if (p[0] === s) valid.add(p[1]); });
    if (ph === 'bis') {
      const ts = G.bisTargets(S);
      if (!S.sel.src) ts.forEach(t => { if (t.s === s) valid.add(t.i); });
      else if (S.sel.src.s === s) ts.forEach(t => { if (t.s === s && t.i === S.sel.src.i) valid.add(t.q); });
    }
    const fenceMode = ph === 'fence' && S.sel.pos.s === s;
    let cells = '';
    row.forEach((v, i) => {
      const ok = valid.has(i), full = v !== null;
      const isSrc = ph === 'bis' && S.sel.src && S.sel.src.s === s && S.sel.src.i === i;
      let cls = 'house ' + (full ? 'full' : 'empty') + (ok ? ' ok' : '') + (isSrc ? ' src' : '');
      const ph2 = hl('cell', st => st.cell[0] === s && st.cell[1] === i);
      cls += ph2;
      const tip = full ? 'Hausnummer ' + v + ' in ' + NAMES[s] + '.' + (S.bisH[s][i] ? ' Doppelte Hausnummer: kostet Punkte.' : '') + (S.lock[s][i] ? ' Gehört zu einem erfüllten Stadtplan.' : '') : 'Freier Bauplatz. Die Nummern müssen in dieser Straße von links nach rechts aufsteigen.';
      const inner = full ? houseSVG(v, s, { bis: S.bisH[s][i], lock: S.lock[s][i] }) : (ok ? '<span class="ghost">' + S.sel.n + '</span>' : '');

        ' aria-label="' + NAMES[s] + ', Feld ' + (i + 1) + (full ? ', Nummer ' + v : ', frei') + '">' + inner + '</button>';
    });
    let fences = '';
    const free = fenceMode ? G.freeGaps(S, s) : [];
    S.fences[s].forEach((f, g) => {
      if (f) fences += '<i class="fence" data-s="' + s + '" data-g="' + g + '" style="--k:' + (g + 1) + '">' + fenceSVG() + '</i>';
      else if (fenceMode && free.indexOf(g) >= 0) fences += '<button class="gap' + hl('gap', st => st.gap === g) + '" data-a="gap" data-g="' + g + '" style="--k:' + (g + 1) + '" aria-label="Zaun zwischen Feld ' + (g + 1) + ' und ' + (g + 2) + '"></button>';
    });
    const pools = G.POOL_SPOTS[s].map(i => '<span class="pool" style="grid-column:' + (i + 1) + '"' + inf(S.pools[s][i] ? 'Pool gebaut.' : 'Poolplatz: Mit dem Swimmingpool-Effekt baust du hier einen Pool, wenn dein Haus auf diesem Bauplatz steht.') + '>' + poolSVG(S.pools[s][i], s * 9 + i) + '</span>').join('');
    const ests = G.estates(S, s).map(e => '<span class="est' + (e.complete ? ' done' : '') + '" style="grid-column:' + (e.a + 1) + ' / span ' + e.size + '"' +
      inf('Siedlung aus ' + e.size + ' Häusern' + (e.complete ? ', fertig bebaut.' : '. Sie zählt, sobald alle Häuser eine Nummer haben.') + (e.size > 6 ? ' Mehr als 6 Häuser zählen nicht.' : '')) + '><b>' + e.size + '</b></span>').join('');
    const ptoks = G.PARK_VALUES[s].map((v, k) => '<span class="ptok' + (k < S.parks[s] ? ' on' : '') + '"' + inf('Park ' + (k + 1) + ': Mit ' + (k + 1) + ' Parks in dieser Straße bekommst du ' + v + ' Punkte.') + '>' + parkSVG(k < S.parks[s], s * 5 + k) + '<span>' + v + '</span></span>').join('');
    return '<section class="street" data-s="' + s + '"><div class="shead"><h3>' + NAMES[s] + '<span>' + n + ' Häuser</span></h3><div class="parks">' + ptoks + '</div></div>' +
      '<div class="row" style="--n:' + n + '">' + cells + fences + '</div><div class="poolrow" style="--n:' + n + '">' + pools + '</div><div class="estrow" style="--n:' + n + '">' + ests + '</div></section>';
  }

  function stats(sc) {

  function dock() {

        const skip = '<button class="btn sm" data-a="skip">Überspringen</button>';
        if (ph === 'fence') body = '<div class="prompt"><p>Geometer: Tippe eine gestrichelte Stelle in ' + NAMES[S.sel.pos.s] + '.</p>' + skip + '</div>';
        else if (ph === 'bis') body = '<div class="prompt"><p>' + (S.sel.src ? 'Tippe das freie Nachbarfeld für die Kopie.' : 'Doppelte Hausnummer: Tippe das Haus, das du verdoppeln willst.') + '</p>' + (S.sel.src ? '<button class="btn sm" data-a="bisback">Anderes Haus</button>' : skip) + '</div>';
        else if (ph === 'agent') {
          const av = G.agentSizes(S);
          const chips = [1, 2, 3, 4, 5, 6].map(sz => { const can = av.indexOf(sz) >= 0;
            return '<button class="chip' + hl('size', st => st.size === sz) + '" data-a="size" data-size="' + sz + '"' + (can ? '' : ' disabled') + '><b>' + sz + '</b><small>' + (can ? G.EST_VALUES[sz - 1][S.marks[sz - 1]] + ' → ' + G.EST_VALUES[sz - 1][S.marks[sz - 1] + 1] : 'voll') + '</small></button>'; }).join('');
          body = '<div class="prompt"><p>Immobilienmakler: Für welche Siedlungsgröße steigt der Wert?</p>' + (U.tut ? '' : skip) + '</div><div class="chips">' + chips + '</div>';
        }
      }
    }
    return '<div class="dock"><div class="dinner">' + body + '</div></div>';
  }

  const RULES = '<div class="rules">' +
    '<h3>Ziel</h3><p>Du bist Architekt in den 50ern und baust in drei Straßen (10, 11 und 12 Häuser) Siedlungen mit Parks und Pools. Wer die meisten Punkte sammelt, ist der Stararchitekt.</p>' +
    '<h3>Solo-Spiel (so wie in der Solo-Variante)</h3><ul>' +
    '<li>81 Baukarten, 27 Runden. Jede Runde ziehst du drei Karten. Vorne steht eine Hausnummer, hinten ein Effekt.</li>' +
    '<li>Du nimmst zwei verschiedene Karten: eine für die Hausnummer, eine für den Effekt. Die dritte fällt weg.</li>' +
    '<li>Die Solo-Karte ist unter den Karten versteckt. Sobald sie auftaucht, gelten alle Stadtpläne, die du noch nicht erfüllt hast, als von der Konkurrenz erfüllt.</li>' +
    '<li>Zeitarbeit bringt nur 7 Punkte, wenn du mindestens 6 Zeitarbeiter eingestellt hast, sonst keinen.</li></ul>' +
    '<h3>Basisspiel allein</h3><ul>' +
    '<li>Drei Stapel mit je 27 Karten. Jede Runde wird die oberste Karte jedes Stapels umgedreht. Die Hausnummer der neuen obersten Karte und der Effekt der umgedrehten Karte bilden eine Kombination. Du wählst eine der drei.</li>' +
    '<li>Du bist immer der Erste bei den Stadtplänen und bekommst die hohen Punkte. Nach dem ersten Plan darfst du die Karten neu mischen. Für Zeitarbeit gilt auch hier die Regel ab 6 Zeitarbeitern, weil es keine Mitspieler zum Vergleichen gibt.</li></ul>' +
    '<h3>Hausnummer eintragen</h3><ul>' +
    '<li>Schreibe die Nummer in ein freies Haus einer der drei Straßen. Die Nummern müssen von links nach rechts steigen. Lücken und übersprungene Nummern sind erlaubt. Dieselbe Nummer darf in einer Straße nicht zweimal stehen.</li>' +
    '<li>Kannst du die Nummer nirgends eintragen, wird dein Bauantrag abgelehnt. Die erste Ablehnung kostet nichts, die zweite 3 Minuspunkte, die dritte 5 Minuspunkte und beendet das Spiel. Beim abgelehnten Antrag gibt es keinen Effekt.</li></ul>' +
    '<h3>Die Effekte (nie Pflicht)</h3><ul>' +
    '<li><b>Geometer:</b> Setze einen Zaun zwischen zwei Bauplätze einer Straße. Zäune begrenzen Siedlungen (an den Straßenenden stehen schon welche). Mehr als 6 Häuser zählen nicht.</li>' +
    '<li><b>Immobilienmakler:</b> Steigere den Wert einer Siedlungsgröße. Normal gibt es 1 Punkt pro Haus.</li>' +
    '<li><b>Landschaftsgärtner:</b> Lege in der Straße des neuen Hauses einen Park an (2, 4, 10 Punkte und so weiter).</li>' +
    '<li><b>Swimmingpool:</b> Steht das Haus auf einem Bauplatz mit Poolplatz, baust du dort einen Pool (3, 6, 9, 13 … Punkte).</li>' +
    '<li><b>Zeitarbeit:</b> Ändere die Nummer um 1 oder 2 (0 bis 17 sind möglich). Jeder Zeitarbeiter zählt.</li>' +
    '<li><b>Doppelte Hausnummer:</b> Kopiere die Nummer irgendeines Hauses auf ein freies Nachbarfeld in derselben Siedlung. Das gibt Minuspunkte.</li></ul>' +
    '<h3>Siedlungen und Stadtpläne</h3><ul>' +
    '<li>Eine Siedlung zählt, wenn alle ihre Häuser eine Nummer haben. Ein Zaun darf später keine Siedlung teilen, die schon für einen Stadtplan verwendet wurde, und diese Siedlung kann nicht für einen zweiten Plan dienen.</li>' +
    '<li>Ein Stadtplan wird sofort gewertet, sobald du seine Siedlungen fertig hast.</li></ul>' +
    '<h3>Ende und Wertung</h3><ul>' +
    '<li>Das Spiel endet, wenn du den dritten Bauantrag ablehnst, alle drei Pläne erfüllt hast, alle Häuser gebaut sind (oder im Solo-Spiel der Kartenstapel aufgebraucht ist).</li>' +
    '<li>Punkte: Stadtpläne, Parks, Pools, Zeitarbeit, fertige Siedlungen. Abzug: doppelte Hausnummern und Ablehnungen.</li></ul>' +
    '<h3>Unterschiede zum Original</h3>' +
    '<p class="fine">Siedlerhain baut die Regeln, die Kartenliste (81 Karten), die Stadtpläne der Basisversion, die Poolplätze und die Wertungstabellen von Welcome To… nach. Nicht enthalten sind der Mehrspielermodus, die Fortgeschrittenen- und Expertenregeln (Kreisverkehre, zusätzliche Pläne, Karten wählen und weitergeben), Erweiterungen und das AAA-Solo. Die Zeichnungen sind eigene.</p></div>';

  function sheets() {
    if (!U.sheet) return '';
    const x = (t) => '<div class="sh"><h2 class="disp">' + t + '</h2><button class="xbtn" data-a="close" aria-label="Schließen">✕</button></div>';
    if (U.sheet === 'menu') return '<div class="ov" data-a="close"><div class="sheet" data-stop="1">' + x('Menü') + '<div class="menu">' +
      '<button class="btn" data-a="rules">Spielregeln</button><button class="btn" data-a="saveleave">Speichern und zum Spielregal</button><button class="btn" data-a="newask" data-mode="' + (S ? S.mode : 'solo') + '">Neustart</button><button class="tlink" data-a="reload">Neueste Version laden</button></div></div></div>';
    if (U.sheet === 'rules') return '<div class="ov" data-a="close"><div class="sheet" data-stop="1">' + x('Spielregeln') + RULES + '</div></div>';
    if (U.sheet === 'newask') return '<div class="ov" data-a="close"><div class="sheet" data-stop="1">' + x('Neue Partie?') + '<div class="menu"><p>' + (S && S.phase !== 'over' && U.view === 'game' ? 'Die laufende Partie wird dabei überschrieben.' : 'Die gespeicherte Partie wird dabei überschrieben.') + '</p>' +
      '<button class="btn pri" data-a="newyes" data-mode="' + U.mode + '">Ja, ' + (U.mode === 'solo' ? 'Solo' : 'Basisspiel') + ' starten</button><button class="btn" data-a="close">Weiterspielen</button></div></div></div>';
    return '';
  }

  function startView() {
    const saved = load();
    const sm = saved ? (saved.mode === 'solo' ? 'Solo' : 'Basisspiel') + ', Runde ' + saved.round : '';
    return '<div class="start"><div class="stage">' + coverSVG() + '<a class="leave" href="../"' + inf('Zurück zum Spielregal') + '>‹ Spielregal</a></div><div class="sdock">' +
      (saved ? '<button class="btn pri" data-a="resume">Partie fortsetzen<span class="sub">' + sm + '</span></button>' : '') +
      '<div class="two"><button class="btn ' + (saved ? '' : 'pri') + '" data-a="start" data-mode="solo">Solo<span class="sub">27 Runden, 3 Karten</span></button><button class="btn" data-a="start" data-mode="base">Basisspiel<span class="sub">3 Kombinationen</span></button></div>' +
      '<div class="links"><button class="tlink" data-a="tut">Lernspiel</button><button class="tlink" data-a="rules">Spielregeln lesen</button></div></div>' + sheets() + '</div>';
  }

  function gameView() {
    const sc = G.score(S);
    return header(sc) + '<div class="main" id="sc"><div class="wrap">' + (S.phase === 'over' ? result(sc) : '') + plans() + [0, 1, 2].map(street).join('') + stats(sc) + '</div></div>' + coach() + dock() + sheets();
  }

  // ---------- Zeichnen ----------
  let prev = null;
  function render() {
    tutSync();
    const old = document.getElementById('sc'), top = old ? old.scrollTop : 0;
    if (U.view === 'game' && S) { app.innerHTML = gameView(); themeFor(false); } else { app.innerHTML = startView(); themeFor(true); }
    const nw = document.getElementById('sc'); if (nw) nw.scrollTop = top;
    if (S && S.phase === 'over' && !S.recorded) { recordPlay(); save(); if (nw) nw.scrollTop = 0; app.innerHTML = gameView(); }
    fx();
  }
  function fx() {
    if (!S || U.view !== 'game') { prev = null; return; }
    const sc = G.score(S).total;
    const parks = S.parks.reduce((a, b) => a + b, 0), pools = S.pools.reduce((a, r) => a + r.filter(Boolean).length, 0);
    if (prev && prev.id === S.id) {
      S.houses.forEach((r, s) => r.forEach((v, i) => { if (v !== null && prev.h[s][i] === null) { const el = app.querySelector('.house[data-s="' + s + '"][data-i="' + i + '"]'); if (el) el.classList.add('pop'); } }));
      S.fences.forEach((r, s) => r.forEach((v, g) => { if (v && !prev.f[s][g]) { const el = app.querySelector('.fence[data-s="' + s + '"][data-g="' + g + '"]'); if (el) el.classList.add('pop'); } }));
      if (sc !== prev.sc) {
        const p = app.querySelector('.pill.pts'); if (p) { p.classList.add('bump'); const r = p.getBoundingClientRect(); floaty(sgn(sc - prev.sc), r.left + r.width / 2 - 10, r.bottom + 4); }
      }
      if (parks > prev.parks) note('Park angelegt!');
      else if (pools > prev.pools) note('Pool gebaut!');
      if (S.soloSeen && !prev.soloSeen && S.mode === 'solo') toast('Die Solo-Karte ist aufgetaucht: Offene Pläne sind weg.');
    }
    prev = { id: S.id, h: S.houses.map(r => r.slice()), f: S.fences.map(r => r.slice()), sc, parks, pools, soloSeen: S.soloSeen };
  }
  function floaty(txt, x, y) {
    const e = document.createElement('div'); e.className = 'fl'; e.textContent = txt; e.style.left = x + 'px'; e.style.top = y + 'px';
    document.body.appendChild(e); setTimeout(() => e.remove(), 1200);
  }
  let toastT = null;
  function toast(msg, good) {
    document.querySelectorAll('.toast').forEach(t => t.remove());
    const t = document.createElement('div'); t.className = 'toast' + (good ? ' good' : ''); t.textContent = msg; document.body.appendChild(t);
    clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600);
  }
  const note = msg => toast(msg, true);
  function buzz() { try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) { /* egal */ } }

  // ---------- Info-Blase per langem Drücken ----------
  let lp = null, lpFired = false;
  function hideInfo() { document.querySelectorAll('.bub').forEach(b => b.remove()); }
  function showInfo(el) {
    hideInfo();
    const b = document.createElement('div'); b.className = 'bub'; b.textContent = el.dataset.info; document.body.appendChild(b);
    const r = el.getBoundingClientRect(), w = b.offsetWidth, h = b.offsetHeight;
    let x = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), window.innerWidth - w - 8), y = r.top - h - 10;
    if (y < 8) y = r.bottom + 10;
    b.style.left = x + 'px'; b.style.top = y + 'px';
    setTimeout(hideInfo, 4200);
  }
  document.addEventListener('pointerdown', e => {
    hideInfo();
    const t = e.target.closest && e.target.closest('[data-info]');
    if (!t) return;
    lp = { x: e.clientX, y: e.clientY, id: setTimeout(() => { lpFired = true; showInfo(t); buzz(); }, 450) };
  });
  document.addEventListener('pointermove', e => { if (lp && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > 10) { clearTimeout(lp.id); lp = null; } });
  ['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, () => { if (lp) { clearTimeout(lp.id); lp = null; } }));
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('click', e => { if (lpFired) { lpFired = false; e.stopPropagation(); e.preventDefault(); } }, true);

  // ---------- Eingaben ----------
  function act(a, d) {
    if (a === 'cell' && S && S.phase === 'bis') a = d.v !== '' ? 'bissrc' : 'bisdst';
    if (a === 'noeff') a = 'pickeff', d = { i: '-1' };
    if (U.tut && !tutAllow(a, d)) { const st = TUT[U.tut.step]; toast(st.k === 'act' ? st.t : 'Tippe auf „Weiter“.'); return; }
    let ok = true;
    const before = U.tut ? TUT[U.tut.step] : null;
    switch (a) {
      case 'pick': ok = G.choose(S, +d.i); break;
      case 'pickeff': ok = G.chooseEffect(S, +d.i); break;
      case 'adj': ok = G.adjust(S, d.d === 'x' ? 'x' : +d.d); break;
      case 'cancel': ok = G.cancel(S); break;
      case 'cell': ok = G.place(S, +d.s, +d.i); break;
      case 'bissrc': ok = G.bisSource(S, +d.s, +d.i); break;
      case 'bisdst': ok = G.placeBis(S, +d.i); break;
      case 'bisback': S.sel.src = null; break;
      case 'gap': ok = G.placeFence(S, +d.g); break;
      case 'size': ok = G.markAgent(S, +d.size); break;
      case 'skip': ok = G.skip(S); break;
      case 'refuse': ok = G.refuse(S); break;
      case 'reshufyes': ok = G.reshuffle(S, true); break;
      case 'reshufno': ok = G.reshuffle(S, false); break;
      case 'menu': U.sheet = 'menu'; render(); return;
      case 'rules': U.sheet = 'rules'; render(); return;
      case 'close': U.sheet = null; render(); return;
      case 'newask': U.mode = d.mode || U.mode; U.sheet = 'newask'; render(); return;
      case 'start': U.mode = d.mode || 'solo'; if (load()) { U.sheet = 'newask'; render(); return; } /* fall through */
      case 'newyes': U.tut = null; newGame(d.mode || U.mode); U.mode = S.mode; U.view = 'game'; U.sheet = null; save(); render(); return;
      case 'newsame': U.tut = null; newGame(S ? S.mode : 'solo'); U.view = 'game'; U.sheet = null; save(); render(); return;
      case 'resume': { const s = load(); if (s) { S = s; U.view = 'game'; } render(); return; }
      case 'tut': startTut(); render(); return;
      case 'tutnext': U.tut.step++; render(); return;
      case 'tutquit': U.tut = null; S = null; U.view = 'start'; prev = null; render(); return;
      case 'saveleave': save(); location.href = '../'; return;
      case 'reload': save(); location.replace(location.pathname + '?v=' + Date.now() + '&resume=1'); return;
    }
    if (ok && U.tut && before && before.k === 'act' && before.a === a) U.tut.step = Math.min(U.tut.step + 1, TUT.length - 1);
    if (ok) { save(); buzz(); }
    render();
  }
  app.addEventListener('click', ev => {
    const stop = ev.target.closest('[data-stop]');
    const t = ev.target.closest('[data-a]');
    if (!t || t.disabled) return;
    if (stop && t.classList.contains('ov')) return; // Klick im Fenster schließt nicht
    act(t.dataset.a, t.dataset);
  });

  // ---------- Start ----------
  (function init() {
    const saved = load();
    if (saved && /[?&]resume=1/.test(location.search)) { S = saved; U.view = 'game'; }
    render();
  })();
})();
</script>
</body>
</html>
