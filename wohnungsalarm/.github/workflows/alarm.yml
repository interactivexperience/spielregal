name: wohnungsalarm

on:
  schedule:
    # alle 30 Min. von ca. 6–23 Uhr deutscher Zeit (Cron läuft in UTC; GitHub startet oft 5–15 Min. verspätet)
    - cron: "7,37 4-21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur testen, keine Pushes senden"
        type: boolean
        default: false

permissions:
  contents: write   # state.json zurückschreiben

concurrency:
  group: wohnungsalarm
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Quellen prüfen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m wohnungsalarm.run ${{ inputs.dry_run && '--dry-run' || '' }} --state state.json
      - name: Zustand speichern
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "wohnungsalarm-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -q -m "state: $(date -u +%FT%TZ)"
            git pull -q --rebase && git push -q
          fi
