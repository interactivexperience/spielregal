/* ---------------- GAME GRID CARD (global, reusable — used by Collection grid & List detail) ---------------- */
function GameGridCard({ game: g, expansions = [], playCounts = {}, gridCols = 2, onClick, onTouchStart, onTouchEnd, onTouchMove, hideSaleStatus }) {
  const items = expansions.length > 0 ? [g, ...expansions] : [g];
  const [slide, setSlide] = useState(0);
  const active = items[Math.min(slide, items.length - 1)];
  const isLentActive = active.lentTo && active.lentTo.trim();
  const playCount = playCounts[active.id] || 0;
  const dragStartX = React.useRef(null);
  const dragDeltaX = React.useRef(0);
  const swipedRef = React.useRef(false);

  const handleTouchStart = (e) => {
    if (items.length > 1) { dragStartX.current = e.touches[0].clientX; dragDeltaX.current = 0; swipedRef.current = false; }
    onTouchStart && onTouchStart(e);
  };
  const handleTouchMove = (e) => {
    if (items.length > 1 && dragStartX.current !== null) {
      const d = e.touches[0].clientX - dragStartX.current;
      dragDeltaX.current = d;
      if (Math.abs(d) > 10) swipedRef.current = true;
    }
    onTouchMove && onTouchMove(e);
  };
  const handleTouchEnd = (e) => {
    if (items.length > 1) {
      if (Math.abs(dragDeltaX.current) > 30) {
        if (dragDeltaX.current < 0) setSlide((s) => Math.min(s + 1, items.length - 1));
        else setSlide((s) => Math.max(s - 1, 0));
      }
      dragStartX.current = null; dragDeltaX.current = 0;
    }
    onTouchEnd && onTouchEnd(e);
  };
  const handleClick = (e) => {
    if (swipedRef.current) { swipedRef.current = false; return; }
    onClick && onClick(active);
  };

  return (
    <button
      onClick={handleClick}
      onTouchStart={handleTouchStart}
      onTouchEnd={handleTouchEnd}
      onTouchMove={handleTouchMove}
      className={`relative text-left rounded-2xl rise-in flex flex-col overflow-hidden ${gridCols === 4 ? "bg-transparent" : "bg-[#262422] border border-[#3A3631] p-1.5"}`}
    >
      <div className="relative flex aspect-square w-full">
        <Cover game={active} size="lg" compact={gridCols === 4} className={gridCols === 4 ? "!rounded-lg !border-0" : "!rounded-xl"} />
        {gridCols === 4 && active.rating && (
          <span className="absolute flex items-center leading-none gap-0.5 bg-black/70 border border-white/15 text-[#D4A24C] text-[10px] font-mono px-1.5 py-0.5 rounded-full" style={{ top: 4, left: 4 }}>
            <Star size={9} fill="currentColor" /> {active.rating}
          </span>
        )}
        {gridCols === 4 && (active.complexity || active.format === "digital") && (
          <div className="absolute flex flex-col items-start gap-1" style={{ bottom: 4, left: 4 }}>
            {active.complexity && (() => {
              const CIcon = COMPLEXITY_ICON[complexityLabel(active)] || Puzzle;
              const bg = COMPLEXITY_BADGE_BG[complexityLabel(active)] || "#000";
              return (
                <span className="flex items-center justify-center leading-none border border-white/20 rounded-full w-6 h-6" style={{ background: bg }} title={complexityLabel(active)}>
                  <CIcon size={17} />
                </span>
              );
            })()}
            {active.format === "digital" && (
              <span className="flex items-center justify-center leading-none bg-black/70 border border-white/15 text-[#8B9AFA] rounded-full w-5 h-5" title="Digital">
                <Globe size={11} />
              </span>
            )}
          </div>
        )}
        {gridCols === 2 && active.format === "digital" && (
          <span className="absolute flex items-center leading-none gap-0.5 bg-black/70 border border-white/15 text-[#8B9AFA] text-[10px] font-body px-1.5 py-0.5 rounded-full" style={{ bottom: 4, left: 4 }}>
            <Globe size={9} /> Digital
          </span>
        )}
        {!hideSaleStatus && active.saleStatus && (
          <span className={`absolute text-[9px] font-body leading-none px-1.5 py-1 rounded-full ${active.saleStatus === "sold" ? "bg-[#C1443C]/90 text-white" : "bg-[#D4A24C]/90 text-[#1C1B1A]"}`} style={{ top: 4, right: 4 }}>
            {active.saleStatus === "sold" ? "Verkauft" : "Zum Verkauf"}
          </span>
        )}
        {expansions.length > 0 && (
          <span className={`absolute flex items-center justify-center leading-none bg-black/70 border border-white/15 text-[#F2EDE4] rounded-full ${active.expansionOf && gridCols === 4 ? "w-5 h-5" : "gap-0.5 text-[10px] font-body px-1.5 py-0.5"}`} style={{ bottom: isLentActive ? 32 : 4, right: 4 }} title={active.expansionOf ? "Erweiterung" : `${expansions.length} Erweiterung${expansions.length === 1 ? "" : "en"}`}>
            {active.expansionOf ? (
              gridCols === 4 ? <Layers size={11} /> : (<><Layers size={9} /> Erweiterung</>)
            ) : (<><Layers size={9} /> +{expansions.length}</>)}
          </span>
        )}
      </div>
      {items.length > 1 && (
        <div className="flex items-center justify-center gap-1 py-1.5">
          {items.map((_, i) => (
            <span key={i} className={`rounded-full transition-all ${i === slide ? "w-3 h-1.5 bg-[#E85D9C]" : "w-1.5 h-1.5 bg-[#5C574F]"}`} />
          ))}
        </div>
      )}
      {gridCols === 2 && (
        <div className="px-1.5 pt-2 pb-1">
          <p className="font-body text-[#F2EDE4] text-sm font-medium leading-tight truncate">{active.name}</p>
          <div className="flex items-center gap-1.5 mt-1 flex-wrap">
            {active.rating ? (
              <span className="flex items-center gap-0.5 text-[10px] text-[#D4A24C] font-mono"><Star size={10} fill="currentColor" /> {active.rating}</span>
            ) : active.minPlayers ? (
              <span className="flex items-center gap-0.5 text-[10px] text-[#8B8478] font-mono"><Users size={10} /> {active.minPlayers}-{active.maxPlayers}</span>
            ) : null}
            {active.complexity ? (() => {
              const CIcon2 = COMPLEXITY_ICON[complexityLabel(active)] || Puzzle;
              return (
                <Pill tone={COMPLEXITY_TONE[complexityLabel(active)] || "default"}><CIcon2 size={13} className="inline -mt-0.5 mr-1" />{COMPLEXITY_SHORT[complexityLabel(active)] || parseFloat(active.complexity).toFixed(1)}</Pill>
              );
            })() : null}
            {playCount > 0 ? (
              <span className="text-[10px] text-[#8B8478] font-mono">{playCount}×</span>
            ) : active.status === "owned" ? (
              <span className="text-[10px] text-[#8B8478] font-mono">0×</span>
            ) : null}
          </div>
        </div>
      )}
    </button>
  );
}

const Cover = ({ game, size = "md", className: extraClass = "", compact = false }) => {
  const dims = size === "sm" ? "w-12 h-12" : size === "lg" ? "w-full aspect-square" : "w-16 h-16";
  const img = (game.images && game.images[0]) || game.image; // game.image kept as fallback for older saved entries
  const isLent = game.lentTo && game.lentTo.trim();
  // extraClass (e.g. "!rounded-none" for 4-col grid, "!rounded-xl" for cards)
  // overrides the base "rounded-lg" on the <img> — the tint overlay and the
  // bottom banner sit ON TOP of that image, so they need the exact same
  // radius override, or their default rounded-lg corners peek out past a
  // squared-off image underneath (or vice versa).
  const lentTint = isLent && (
    <div className={`absolute inset-0 bg-[#9C82D4] mix-blend-multiply opacity-60 rounded-lg pointer-events-none ${extraClass}`} />
  );
  // The banner only needs its BOTTOM corners rounded (its top edge sits flush
  // against the image above it) — so the override needs "rounded-b-*", not
  // the all-corners "rounded-*" that extraClass carries for the image/tint.
  const bottomRadiusClass = extraClass.replace(/rounded-/g, "rounded-b-");
  const lentBadge = isLent && (
    size === "lg" ? (
      compact ? (
        <span className={`absolute bottom-0 left-0 right-0 bg-[#9C82D4] text-[#1C1B1A] text-[9px] leading-none font-body font-semibold flex items-center justify-center py-1 px-1 truncate rounded-b-lg ${bottomRadiusClass}`} title={`Verliehen an ${game.lentTo.trim()}`}>
          {game.lentTo.trim()}
        </span>
      ) : (
        <span className={`absolute bottom-0 left-0 right-0 bg-[#9C82D4] text-[#1C1B1A] text-xs font-body font-semibold flex items-center justify-center py-1.5 rounded-b-lg ${bottomRadiusClass}`} title={`Verliehen an ${game.lentTo.trim()}`}>
          Verliehen an {game.lentTo.trim()}
        </span>
      )
    ) : (
      <span className="absolute bottom-[4px] right-[4px] bg-[#9C82D4] border-2 border-[#1C1B1A] rounded-full" style={{ width: 14, height: 14 }} title={`Verliehen an ${game.lentTo.trim()}`} />
    )
  );
  return img ? (
    <span className={`relative inline-block ${dims} ${extraClass} ${isLent ? "opacity-75" : ""}`}>
      <img src={img} alt={game.name} className={`w-full h-full block object-cover rounded-lg border border-[#3A3631] ${game.saleStatus ? "grayscale" : ""} ${extraClass}`} />
      {lentTint}
      {lentBadge}
    </span>
  ) : (
    <span className={`relative inline-flex ${dims} rounded-lg border border-[#3A3631] bg-[#2E2B28] items-center justify-center text-[#5C574F] ${extraClass} ${isLent ? "opacity-75" : ""}`}>
      <Dices size={size === "lg" ? 28 : 18} />
      {lentTint}
      {lentBadge}
    </span>
  );
};

/* ---------------- ADD PLAY MODAL ---------------- */
function PlayerOrderModal({ players, onSave, onClose }) {
  const { closing, requestClose } = useSheetClose(onClose);
  const [items, setItems] = useState(players);
  const dragIndex = React.useRef(null);
  const [draggingId, setDraggingId] = useState(null);
  const rowRefs = React.useRef({});

  const moveItem = (from, to) => {
    setItems((prev) => {
      const next = [...prev];
      const [moved] = next.splice(from, 1);
      next.splice(to, 0, moved);
      return next;
    });
  };
  const handleTouchStart = (idx, id) => { dragIndex.current = idx; setDraggingId(id); };
  const handleTouchMove = (e) => {
    if (dragIndex.current === null) return;
    e.preventDefault();
    const touchY = e.touches[0].clientY;
    items.forEach((p, idx) => {
      if (idx === dragIndex.current) return;
      const el = rowRefs.current[p.id];
      if (!el) return;
      const rect = el.getBoundingClientRect();
      const mid = rect.top + rect.height / 2;
      if ((touchY < mid && idx < dragIndex.current) || (touchY > mid && idx > dragIndex.current)) {
        moveItem(dragIndex.current, idx);
        dragIndex.current = idx;
      }
    });
  };
  const handleTouchEnd = () => { dragIndex.current = null; setDraggingId(null); };

  return (
    <div className={`fixed top-0 left-0 right-0 bg-black/70 z-[65] flex items-end justify-center p-0 ${closing ? "backdrop-fade-out" : "backdrop-fade"}`} style={{ height: "var(--app-height, 100dvh)", top: "var(--app-offset-top, 0px)" }} onClick={requestClose}>
      <div className={`glass border border-white/10 rounded-t-[28px] w-full font-body flex flex-col ${closing ? "sheet-out" : "rise-in"}`} style={{ maxHeight: "calc(var(--app-height, 100dvh) - 2rem)" }} onClick={(e) => e.stopPropagation()}>
        <div className="flex justify-center pt-2 pb-1"><div className="w-9 h-1 rounded-full bg-[#3A3631]" /></div>
        <div className="shrink-0 px-5 py-4 flex items-center justify-between">
          <h2 className="font-display text-xl text-[#F2EDE4]">Reihenfolge</h2>
          <button onClick={() => { onSave(items.map((p) => p.id)); requestClose(); }} className="text-[#E85D9C] text-sm font-medium px-2 py-1">Fertig</button>
        </div>
        <p className="shrink-0 text-xs text-[#5C574F] px-5 pb-2">Am Griff-Symbol ziehen. Gilt überall, wo Mitspieler angezeigt werden.</p>
        <div className="flex-1 overflow-y-auto p-4 space-y-2" style={{ paddingBottom: "max(1.25rem, env(safe-area-inset-bottom))", touchAction: draggingId ? "none" : "auto" }}>
          {items.map((p, idx) => (
            <div key={p.id} ref={(el) => { rowRefs.current[p.id] = el; }}
              className="flex items-center gap-3 bg-[#262422] border rounded-[14px] px-3.5 h-14"
              style={{
                borderColor: draggingId === p.id ? "#E85D9C" : "#3A3631",
                transform: draggingId === p.id ? "scale(1.02)" : "none",
                boxShadow: draggingId === p.id ? "0 8px 20px rgba(0,0,0,0.4)" : "none",
                zIndex: draggingId === p.id ? 10 : 1,
                transition: "border-color .15s, transform .15s, box-shadow .15s",
              }}>

            </div>
          ))}
        </div>
      </div>

/* ---------------- DASHBOARD ---------------- */
const DEFAULT_DASHBOARD_ORDER = ["month", "records", "bestof", "wishlist", "topRated", "dust", "digital"];

function DashboardReorderScreen({ order, sections, labels, hiddenSections = [], onToggleHidden, onSave, onClose }) {
  const [items, setItems] = useState(order.filter((key) => sections[key]));
  const [hidden, setHidden] = useState(hiddenSections);
  const dragIndex = React.useRef(null);
  const [draggingKey, setDraggingKey] = useState(null);
  const itemRefs = React.useRef({});

  const toggleHidden = (key) => {
    haptic(6);
    setHidden((prev) => (prev.includes(key) ? prev.filter((k) => k !== key) : [...prev, key]));
  };

  const moveItem = (from, to) => {
    setItems((prev) => {
      const next = [...prev];
      const [moved] = next.splice(from, 1);
      next.splice(to, 0, moved);
      return next;
    });
  };

  const handleTouchStart = (idx) => {
    dragIndex.current = idx;
    setDraggingKey(items[idx]);
  };
  const handleTouchMove = (e) => {
    if (dragIndex.current === null) return;
    const touchY = e.touches[0].clientY;
    items.forEach((key, idx) => {
      if (idx === dragIndex.current) return;
      const el = itemRefs.current[key];
      if (!el) return;
      const rect = el.getBoundingClientRect();
      const mid = rect.top + rect.height / 2;
      if ((touchY < mid && idx < dragIndex.current) || (touchY > mid && idx > dragIndex.current)) {
        moveItem(dragIndex.current, idx);
        dragIndex.current = idx;
      }
    });
  };
  const handleTouchEnd = () => {
    dragIndex.current = null;
    setDraggingKey(null);
  };

  return (
    <div className="fixed inset-0 z-[80] bg-[#1C1B1A] flex flex-col">
      <div className="shrink-0 px-5 flex items-center justify-between" style={{ paddingTop: "max(1rem, env(safe-area-inset-top))", paddingBottom: "1rem" }}>
        <button onClick={onClose} className="glass-icon-btn w-10 h-10 flex items-center justify-center rounded-full border border-white/15 text-[#F2EDE4]" aria-label="Abbrechen"><ChevronLeft size={22} /></button>
        <h2 className="font-display text-xl text-[#F2EDE4]">Sektionen</h2>
        <button onClick={() => { onSave(items); onToggleHidden && onToggleHidden(hidden); }} className="text-[#E85D9C] text-sm font-medium px-2 py-1">Fertig</button>
      </div>
      <p className="shrink-0 text-xs text-[#5C574F] px-5 pt-3 pb-1">Am Griff-Symbol ziehen, um die Reihenfolge zu ändern. Mit dem Augen-Symbol Sektionen aus- und einblenden.</p>
      <div className="flex-1 overflow-y-auto p-4 space-y-2" style={{ touchAction: draggingKey ? "none" : "auto" }}>
        {items.map((key, idx) => {
          const isHidden = hidden.includes(key);
          return (
          <div
            key={key}
            ref={(el) => { itemRefs.current[key] = el; }}
            className="flex items-center gap-3 bg-[#262422] border rounded-[14px] px-3.5 h-14"
            style={{
              borderColor: draggingKey === key ? "#E85D9C" : "#3A3631",
              transform: draggingKey === key ? "scale(1.03)" : "none",
              boxShadow: draggingKey === key ? "0 8px 20px rgba(0,0,0,0.4)" : "none",
              zIndex: draggingKey === key ? 10 : 1,
              opacity: isHidden ? 0.5 : 1,
              transition: "border-color .15s, transform .15s, box-shadow .15s, opacity .15s",
            }}
          >
            <button onClick={() => toggleHidden(key)} className="text-[#5C574F] p-1 -ml-1 shrink-0" aria-label={isHidden ? "Sektion einblenden" : "Sektion ausblenden"}>
              {isHidden ? <EyeOff size={18} /> : <Eye size={18} />}
            </button>
            <span className={`text-sm flex-1 ${isHidden ? "text-[#5C574F]" : "text-[#F2EDE4]"}`}>{labels[key] || key}</span>
            <div
              className="text-[#5C574F] p-2 -mr-2"
              onTouchStart={() => handleTouchStart(idx)}
              onTouchMove={handleTouchMove}
              onTouchEnd={handleTouchEnd}
            >
              <GripVertical size={18} />
            </div>
          </div>
          );
        })}
      </div>
    </div>
  );
}

function Dashboard({ games, plays, onQuickFilter, onView, sectionOrder, onReorder, hiddenSections = [], onToggleHidden, onSearch, aiWorkerUrl }) {
  const owned = games.filter(g => g.status === "owned");
  const [statInfo, setStatInfo] = useState(null);
  const statInfoClose = useSheetClose(() => setStatInfo(null));
  const playCounts = useMemo(() => {
    const map = {}; plays.forEach(p => { map[p.gameId] = (map[p.gameId] || 0) + 1; }); return map;
  }, [plays]);
  const lastPlays = [...plays].sort((a, b) => (b.date || "").localeCompare(a.date || "")).slice(0, 6);
  const dustCollectors = owned.filter(g => !playCounts[g.id]).sort((a, b) => (a.addedDate || "").localeCompare(b.addedDate || "")).slice(0, 6);
  const topRated = [...owned].filter(g => g.rating).sort((a, b) => parseInt(b.rating) - parseInt(a.rating)).slice(0, 10);
  const complexGames = owned.filter(g => g.complexity);
  const avgComplexity = complexGames.length ? (complexGames.reduce((s, g) => s + parseFloat(g.complexity), 0) / complexGames.length).toFixed(1) : "—";
  const thirtyDaysAgo = new Date(); thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
  const recentPlayCounts = {};
  plays.forEach(p => { if (p.date && new Date(p.date) >= thirtyDaysAgo) recentPlayCounts[p.gameId] = (recentPlayCounts[p.gameId] || 0) + 1; });
  const topMonth = Object.entries(recentPlayCounts).sort((a, b) => b[1] - a[1])[0];
  const topMonthGame = topMonth ? games.find(g => g.id === topMonth[0]) : null;
  const tasteProfile = useMemo(() => {
    const rated = games.filter((g) => g.rating && parseFloat(g.rating) >= 8);
    const tally = {};
    rated.forEach((g) => { [...(g.mechanisms || []), ...(g.categories || [])].forEach((t) => { tally[t] = (tally[t] || 0) + 1; }); });
    return Object.entries(tally).sort((a, b) => b[1] - a[1]).slice(0, 8);
  }, [games]);
  const digitalCount = plays.filter(p => p.mode === "bga").length;
  const physicalCount = plays.filter(p => p.mode !== "bga").length;
  const genreMix = useMemo(() => {
    const tally = {};
    owned.forEach(g => (g.categories || []).forEach(c => { tally[c] = (tally[c] || 0) + 1; }));
    return Object.entries(tally).sort((a, b) => b[1] - a[1]).slice(0, 7);
  }, [owned]);
  const findGame = (id) => games.find(g => g.id === id);

  const mostPlayed = useMemo(() => {
    const entries = Object.entries(playCounts).sort((a, b) => b[1] - a[1])[0];
    return entries ? { game: findGame(entries[0]), count: entries[1] } : null;
  }, [playCounts, games]);

  // Echte persönliche Rekorde aus dem tatsächlichen Spielverhalten — jeder erscheint erst, wenn er wirklich erreicht wurde.
  const bestDay = useMemo(() => {
    const tally = {};
    plays.forEach(p => { if (p.date) tally[p.date] = (tally[p.date] || 0) + 1; });
    const entry = Object.entries(tally).sort((a, b) => b[1] - a[1])[0];
    return entry && entry[1] >= 2 ? { date: entry[0], count: entry[1] } : null;
  }, [plays]);
  const bestStreak = useMemo(() => {
    const dates = [...new Set(plays.map(p => p.date).filter(Boolean))].sort();
    let best = 1, cur = 1;
    for (let i = 1; i < dates.length; i++) {
      const diff = (new Date(dates[i]) - new Date(dates[i - 1])) / 86400000;
      cur = diff === 1 ? cur + 1 : 1;
      best = Math.max(best, cur);
    }
    return dates.length && best >= 2 ? best : null;
  }, [plays]);
  const biggestPlayGroup = useMemo(() => {
    const sizes = plays.map(p => (p.players || "").split(",").map(s => s.trim()).filter(Boolean).length).filter(n => n > 0);
    const max = sizes.length ? Math.max(...sizes) : 0;
    return max >= 2 ? max : null;
  }, [plays]);

  const wishlist = games.filter(g => g.status === "wishlist").slice(0, 6);

  // Best-of: abgeleitet aus tatsächlich gespielten Partien, nicht nur aus der Sammlung.
  const bestOf = useMemo(() => {
    if (plays.length === 0) return null;
    const thisYear = new Date().getFullYear();
    const yearPlayCounts = {};
    plays.forEach(p => { if (p.date && new Date(p.date).getFullYear() === thisYear) yearPlayCounts[p.gameId] = (yearPlayCounts[p.gameId] || 0) + 1; });
    const topYearEntry = Object.entries(yearPlayCounts).sort((a, b) => b[1] - a[1])[0];
    const topYear = topYearEntry ? { game: findGame(topYearEntry[0]), count: topYearEntry[1] } : null;

    const playerCountTally = {};
    plays.forEach(p => { const n = (p.players || "").split(",").map(s => s.trim()).filter(Boolean).length; if (n > 0) playerCountTally[n] = (playerCountTally[n] || 0) + 1; });
    const favCountEntry = Object.entries(playerCountTally).sort((a, b) => b[1] - a[1])[0];

    const playedGameIds = [...new Set(plays.map(p => p.gameId))];
    const playedGames = playedGameIds.map(id => games.find(g => g.id === id)).filter(Boolean);
    const catTally = {}, mechTally = {};
    playedGames.forEach(g => {
      const count = plays.filter(p => p.gameId === g.id).length;
      (g.categories || []).forEach(c => { catTally[c] = (catTally[c] || 0) + count; });
      (g.mechanisms || []).forEach(m => { mechTally[m] = (mechTally[m] || 0) + count; });
    });
    const favCat = Object.entries(catTally).sort((a, b) => b[1] - a[1])[0];
    const favMech = Object.entries(mechTally).sort((a, b) => b[1] - a[1])[0];

    let complexitySum = 0, complexityCount = 0;
    playedGames.forEach(g => { if (g.complexity) { const c = plays.filter(p => p.gameId === g.id).length; complexitySum += parseFloat(g.complexity) * c; complexityCount += c; } });
    const avgPlayedComplexity = complexityCount ? complexitySum / complexityCount : null;
    const complexityLabelFromValue = avgPlayedComplexity == null ? null : avgPlayedComplexity < 2 ? "Familienspiel" : avgPlayedComplexity < 3.5 ? "Kennerspiel" : "Expertenspiel";

    return { topYear, favCount: favCountEntry ? { count: favCountEntry[0], times: favCountEntry[1] } : null, favCat, favMech, complexityLabel: complexityLabelFromValue, avgPlayedComplexity };
  }, [plays, games]);

  // Erfolge: rein aus vorhandenen Daten berechnet, kein zusätzlicher Speicherzustand nötig.
  const distinctPlayedGames = new Set(plays.map(p => p.gameId)).size;
  const distinctPlayedCategories = new Set(owned.filter(g => plays.some(p => p.gameId === g.id)).flatMap(g => g.categories || [])).size;
  const seriesCount = mostPlayed ? mostPlayed.count : 0;
  const allRated = owned.length > 0 && owned.every(g => g.rating);
  const campaignMastery = games.some(g => g.isCampaign && plays.filter(p => p.gameId === g.id).length >= 3);
  const achievements = [
    { id: "first", label: "Erste Partie", emoji: "🎉", unlocked: plays.length >= 1 },
    { id: "many", label: "Vielspieler", emoji: "🔥", unlocked: plays.length >= 10 },
    { id: "pro", label: "Spielprofi", emoji: "🏅", unlocked: plays.length >= 50 },
    { id: "collector", label: "Sammler", emoji: "📚", unlocked: owned.length >= 10 },
    { id: "megacollector", label: "Großsammler", emoji: "🏛️", unlocked: owned.length >= 25 },
    { id: "series", label: "Serientäter", emoji: "🔁", unlocked: seriesCount >= 5 },
    { id: "explorer", label: "Genre-Entdecker", emoji: "🧭", unlocked: distinctPlayedCategories >= 5 },
    { id: "variety", label: "Vielfalt", emoji: "🎨", unlocked: distinctPlayedGames >= 10 },
    { id: "campaign", label: "Kampagnen-Meister", emoji: "🗺️", unlocked: campaignMastery },
    { id: "rated", label: "Perfektionist", emoji: "⭐", unlocked: allRated },
  ].sort((a, b) => (b.unlocked === a.unlocked ? 0 : b.unlocked ? 1 : -1));

  const [justUnlocked, setJustUnlocked] = useState(null);
  const [weeklyTip, setWeeklyTip] = useState(() => { try { return JSON.parse(localStorage.getItem("spielregal:weeklyTip") || "null"); } catch { return null; } });
  const [yearlyInsight, setYearlyInsight] = useState(() => { try { return JSON.parse(localStorage.getItem("spielregal:yearlyInsight") || "null"); } catch { return null; } });
  const [tipLoading, setTipLoading] = useState(false);
  const [refreshToken, setRefreshToken] = useState(0);
  // A cheap fingerprint of the actual play data (not just its length) — so
  // correcting a play's date, winner, etc. invalidates the cached AI insights
  // too, not just adding/removing a play outright.
  const playsFingerprint = useMemo(() => plays.map((p) => `${p.id}:${p.date}:${p.winner || ""}`).join("|"), [plays]);

  useEffect(() => {
    if (!aiWorkerUrl || plays.length === 0) return;
    const now = Date.now();
    const weekMs = 7 * 24 * 60 * 60 * 1000;
    const yearKey = new Date().getFullYear();

    const needsWeekly = !weeklyTip || !weeklyTip.gameId || (now - weeklyTip.generatedAt) > weekMs || weeklyTip.fingerprint !== playsFingerprint;
    const needsYearly = !yearlyInsight || yearlyInsight.year !== yearKey || yearlyInsight.fingerprint !== playsFingerprint;
    if (!needsWeekly && !needsYearly) return;

    (async () => {
      setTipLoading(true);
      const context = buildCollectionContextForAI(games, plays);
      try {
        if (needsWeekly) {
          const ownedGames = games.filter((g) => g.status !== "wishlist");
          const wishlistGames = games.filter((g) => g.status === "wishlist");
          const playCounts = {};
          plays.forEach((p) => { playCounts[p.gameId] = (playCounts[p.gameId] || 0) + 1; });
          // Ein Spiel, das schon (mehrfach) gespielt wurde, muss nicht mehr
          // "ausprobiert" werden — der Tipp soll auf Unentdecktes hinweisen,
          // nicht auf längst etablierte Favoriten.
          const untried = ownedGames.filter((g) => (playCounts[g.id] || 0) <= 1);
          let candidates = [...untried, ...wishlistGames];
          if (candidates.length === 0) {
            // Reife Sammlung, alles schon mehrfach gespielt — dann wenigstens
            // die am wenigsten gespielten vorschlagen, statt gar nichts zu zeigen.
            candidates = [...ownedGames].sort((a, b) => (playCounts[a.id] || 0) - (playCounts[b.id] || 0)).slice(0, 8);
          }
          candidates.sort((a, b) => (playCounts[a.id] || 0) - (playCounts[b.id] || 0));

          if (candidates.length > 0) {
            const describeCandidate = (g) => {
              const count = playCounts[g.id] || 0;
              const tags = [...(g.categories || []), ...(g.mechanisms || [])].slice(0, 4).join(", ");
              const players = g.minPlayers ? `${g.minPlayers}-${g.maxPlayers} Spieler` : "Spieleranzahl unbekannt";
              const time = g.minTime ? `${g.minTime}-${g.maxTime} Min.` : "Dauer unbekannt";
              const status = g.status === "wishlist" ? "auf der Wunschliste, noch nicht im Besitz" : `${count}× gespielt${count === 0 ? " (noch nie gespielt)" : ""}`;
              return `- ${g.name} | ${players} | ${time} | Themen: ${tags || "-"} | ${status}`;
            };
            const prompt = `Du bist ein Brettspiel-Kumpel. Wähl aus der folgenden Kandidatenliste GENAU EIN Spiel aus, das sich diese Woche besonders lohnen könnte — bevorzuge, was zum bisherigen Geschmack des Nutzers passt (siehe Sammlungskontext unten). Wähl NUR aus der Kandidatenliste, keine anderen Spiele.\n\nKandidaten:\n${candidates.map(describeCandidate).join("\n")}\n\nAntworte in GENAU diesem Format, sonst nichts:\nNAME: <exakter Name aus der Kandidatenliste>\nGRUND: <1-2 kurze Sätze auf Deutsch, warum genau dieses Spiel diese Woche ein gutes Match sein könnte>\n\n${context}`;
            const raw = await aiChat(aiWorkerUrl, [{ role: "user", content: prompt }]);
            const nameMatch = raw.match(/NAME:\s*(.+)/i);
            const reasonMatch = raw.match(/GRUND:\s*([\s\S]+)/i);
            const pickedName = nameMatch ? nameMatch[1].trim() : "";
            const picked = candidates.find((g) => g.name === pickedName)
              || candidates.find((g) => g.name.toLowerCase() === pickedName.toLowerCase())
              || candidates[0];
            const reason = reasonMatch ? reasonMatch[1].trim() : `${picked.name} wartet noch darauf, (öfter) ausprobiert zu werden.`;
            const val = { gameId: picked.id, gameName: picked.name, reason, generatedAt: now, fingerprint: playsFingerprint };
            setWeeklyTip(val);
            localStorage.setItem("spielregal:weeklyTip", JSON.stringify(val));
          }
        }
        if (needsYearly) {
          // Die allgemeine Sammlungs-Übersicht enthält nur Gesamt-Spielzahlen
          // über die komplette Laufzeit — für eine Aussage über EIN Jahr
          // braucht es echte, nach Jahr gefilterte Zahlen, sonst kann die KI
          // nur raten bzw. Gesamtzahlen fälschlich als Jahreszahlen ausgeben.
          const yearPlays = plays.filter((p) => (p.date || "").startsWith(String(yearKey)));
          const prevYearPlays = plays.filter((p) => (p.date || "").startsWith(String(yearKey - 1)));
          const yearCounts = {};
          yearPlays.forEach((p) => { yearCounts[p.gameName] = (yearCounts[p.gameName] || 0) + 1; });
          const distinctGames = Object.keys(yearCounts).length;
          const topEntry = Object.entries(yearCounts).sort((a, b) => b[1] - a[1])[0];
          // Erstmals gespielte Spiele in diesem Jahr — kein Spiel, das vor
          // diesem Jahr schon mal gespielt wurde, zählt als "neu entdeckt".
          const priorGameNames = new Set(plays.filter((p) => (p.date || "") < `${yearKey}-01-01`).map((p) => p.gameName));
          const newThisYear = [...new Set(yearPlays.map((p) => p.gameName))].filter((n) => !priorGameNames.has(n));
          const monthCounts = {};
          yearPlays.forEach((p) => { const m = (p.date || "").slice(5, 7); if (m) monthCounts[m] = (monthCounts[m] || 0) + 1; });
          const busiestMonth = Object.entries(monthCounts).sort((a, b) => b[1] - a[1])[0];
          const monthNames = { "01": "Januar", "02": "Februar", "03": "März", "04": "April", "05": "Mai", "06": "Juni", "07": "Juli", "08": "August", "09": "September", "10": "Oktober", "11": "November", "12": "Dezember" };

          const yearContext = yearPlays.length === 0
            ? (() => {
                const wishlist = games.filter((g) => g.status === "wishlist");
                return wishlist.length > 0
                  ? `Im Jahr ${yearKey} wurden bisher noch KEINE Partien eingetragen. Da es dazu nichts zu sagen gibt, nutze stattdessen die Wunschliste für eine interessante Beobachtung (z.B. wie viele Spiele drauf stehen, oder ein auffälliges Muster bei Thema/Komplexität): ${wishlist.map((g) => g.name).join(", ")}`
                  : `Im Jahr ${yearKey} wurden bisher noch KEINE Partien eingetragen, und die Wunschliste ist auch leer. Sag einfach ehrlich, dass es dafür noch nichts zu berichten gibt.`;
              })()
            : `Echte Kennzahlen NUR für das Jahr ${yearKey} — nutze AUSSCHLIESSLICH diese Zahlen für Aussagen über das Jahr, nicht die Gesamtzahlen aus der Sammlung unten:
- Insgesamt ${yearPlays.length} Partien, davon ${distinctGames} unterschiedliche Spiele
- Meistgespielt: ${topEntry ? `${topEntry[0]} (${topEntry[1]}×)` : "kein klarer Favorit"}
- Neu entdeckt in diesem Jahr (vorher nie gespielt): ${newThisYear.length > 0 ? newThisYear.slice(0, 6).join(", ") : "keine neuen Spiele, nur Bekanntes gespielt"}
- Aktivster Monat: ${busiestMonth ? `${monthNames[busiestMonth[0]] || busiestMonth[0]} (${busiestMonth[1]} Partien)` : "kein klares Muster"}
- Vorjahresvergleich: ${yearKey - 1} wurden ${prevYearPlays.length} Partien gespielt (${prevYearPlays.length === 0 ? "keine Vergleichsbasis, da noch keine Daten" : yearPlays.length > prevYearPlays.length ? "dieses Jahr also aktiver" : yearPlays.length < prevYearPlays.length ? "dieses Jahr also ruhiger" : "etwa gleich aktiv"})`;

          const text = await aiChat(aiWorkerUrl, [{ role: "user", content: `Du bist ein Brettspiel-Kumpel. Schreib eine kurze ZUSAMMENFASSUNG des Spieljahres ${yearKey} des Nutzers — als zusammenhängender Fließtext (2-4 Sätze), der sich liest wie ein kleines Resümee, KEINE Aufzählung/Liste einzelner Spiele mit Zahlen dahinter. Wähl selbst aus den Kennzahlen unten die ein oder zwei interessantesten Aspekte aus (z.B. Aktivität im Vergleich zum Vorjahr, wie viel Neues entdeckt wurde, ein Highlight-Spiel) und verwebe sie zu einem echten kleinen Rückblick, nicht zu einer Datenliste. Halte dich für alle Zahlen STRIKT an den Abschnitt "Echte Kennzahlen NUR für das Jahr ${yearKey}" weiter unten — NICHT an die allgemeinen Sammlungsdaten danach, die enthalten Gesamtzahlen über die komplette Laufzeit, keine Jahreszahlen. Erfinde oder schätze keine Zahlen. Ist noch nichts für dieses Jahr eingetragen, sag das ehrlich statt etwas zu erfinden. Kein Grußwort, direkt der Rückblick.\n\n${yearContext}\n\n${context}` }]);
          const val = { text, year: yearKey, generatedAt: now, fingerprint: playsFingerprint };
          setYearlyInsight(val);
          localStorage.setItem("spielregal:yearlyInsight", JSON.stringify(val));
        }
      } catch { /* silently skip — these are a nice-to-have, not critical */ }
      setTipLoading(false);
    })();
  }, [aiWorkerUrl, plays.length, playsFingerprint, refreshToken]);
  const unlockedIdsKey = achievements.filter((a) => a.unlocked).map((a) => a.id).sort().join(",");
  useEffect(() => {
    const seenKey = "spielregal:seenAchievements";
    const seen = new Set(JSON.parse(localStorage.getItem(seenKey) || "[]"));
    const unlockedIds = unlockedIdsKey ? unlockedIdsKey.split(",") : [];
    const newlyUnlocked = unlockedIds.filter((id) => !seen.has(id));
    if (newlyUnlocked.length > 0 && seen.size > 0) { // skip the very first load so old data doesn't all "celebrate" at once
      const first = achievements.find((a) => a.id === newlyUnlocked[0]);
      if (first) {
        setJustUnlocked(first);
        haptic([12, 50, 12, 50, 25]);
        setTimeout(() => setJustUnlocked(null), 3200);
      }
    }
    localStorage.setItem(seenKey, JSON.stringify(unlockedIds));
  }, [unlockedIdsKey]);

  // Kontextuelle Vorschläge: das am längsten wartende Spiel mit einer kleinen freundlichen Nachricht.

  const sections = {
    month: topMonthGame && (
      <button key="month" onClick={() => onView(topMonthGame)} className="w-full text-left bg-[#262422] border border-[#3A3631] rounded-xl px-3.5 py-2.5 flex items-center gap-2.5">
        <Cover game={topMonthGame} size="sm" />
        <div className="min-w-0 flex-1">
          <p className="text-[#5C574F] text-[10px] font-body flex items-center gap-1"><TrendingUp size={10} /> Spiel des Monats</p>
          <p className="text-[#F2EDE4] font-body text-sm font-medium truncate">{topMonthGame.name} <span className="text-[#5C574F] font-normal">· {topMonth[1]}× diesen Monat</span></p>
        </div>
      </button>
    ),
    bestof: bestOf && (
      <div key="bestof">
        <h2 className="font-body text-sm font-semibold text-[#A39C8F] uppercase tracking-wide mb-2">Best of</h2>
        {plays.length < 5 ? (
          <p className="text-xs text-[#5C574F]">Trag noch ein paar mehr Partien ein, dann zeigen wir dir hier deine Vorlieben.</p>
        ) : (
        <div className="grid grid-cols-2 gap-2.5">
          {bestOf.topYear && bestOf.topYear.game && (
            <button onClick={() => onView(bestOf.topYear.game)} className="text-left glass border border-white/10 rounded-2xl p-3 flex flex-col">
              <p className="text-[10px] text-[#5C574F] font-body mb-1">Meistgespielt {new Date().getFullYear()}</p>
              <p className="text-[#F2EDE4] text-sm font-body font-medium truncate flex items-center gap-1.5">
                {(() => {
                  const label = complexityLabel(bestOf.topYear.game);
                  const CIcon = label && COMPLEXITY_ICON[label];
                  return CIcon ? <CIcon size={14} className="shrink-0" /> : null;
                })()}
                {bestOf.topYear.game.name}

        <DashboardReorderScreen

    </div>
  );

/* ---------------- LIST PICKER (Spiel zu Liste hinzufügen, Mehrfachauswahl) ---------------- */
/* ---------------- ADD GAMES TO LIST (search + toggle, Audible-style) ---------------- */
function AddGamesToListModal({ games, plays, list, onToggle, onClose, aiWorkerUrl }) {
  const { closing, requestClose } = useSheetClose(onClose);
  const [query, setQuery] = useState("");
  const [aiPicks, setAiPicks] = useState(null); // null = not run, [] = run but no matches, [...] = matched names
  const [aiLoading, setAiLoading] = useState(false);
  const [aiError, setAiError] = useState("");
  const filtered = games.filter((g) => gameMatchesQuery(g, query));

  // Local, instant "fits the list" signal (no AI needed): the categories/mechanisms
  // that show up most often among the games already in this list, used to flag
  // search results that share at least one of them.
  const themeTags = useMemo(() => {
    const counts = {};
    games.filter((g) => list.gameIds.includes(g.id)).forEach((g) => {
      [...(g.categories || []), ...(g.mechanisms || [])].forEach((t) => { counts[t] = (counts[t] || 0) + 1; });
    });
    return Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([t]) => t);
  }, [games, list.gameIds]);

  const runAiSuggest = async () => {
    setAiLoading(true); setAiError("");
    try {
      const gamesInList = games.filter((g) => list.gameIds.includes(g.id));
      const candidates = games.filter((g) => !list.gameIds.includes(g.id));
      const picks = await aiSuggestForList(aiWorkerUrl, list.name, gamesInList, candidates);
      setAiPicks(picks);
      haptic(8);
    } catch (e) { setAiError(e.message || "Fehlgeschlagen"); }
    finally { setAiLoading(false); }
  };

  return (
    <div className={`fixed top-0 left-0 right-0 bg-black/70 z-[65] flex items-end justify-center p-0 ${closing ? "backdrop-fade-out" : "backdrop-fade"}`} style={{ height: "var(--app-height, 100dvh)", top: "var(--app-offset-top, 0px)" }} onClick={requestClose}>
      <div className={`glass border border-white/10 rounded-t-[28px] w-full max-h-[var(--app-height,100dvh)] flex flex-col font-body ${closing ? "sheet-out" : "rise-in"}`} onClick={(e) =>
        e.stopPropagation()}>
        <div className="flex justify-center pt-2 pb-1"><div className="w-9 h-1 rounded-full bg-[#3A3631]" /></div>
        <div className="shrink-0 px-5 py-4 flex items-center justify-between">
          <h2 className="font-display text-xl text-[#F2EDE4]">Spiele hinzufügen</h2>
          <button onClick={requestClose} className="glass-icon-btn w-10 h-10 flex items-center justify-center rounded-full border border-white/10 text-[#A39C8F]"><X size={20} /></button>
        </div>
        <div className="shrink-0 p-4 border-b border-[#3A3631] space-y-2.5">
          <SearchInput value={query} onChange={setQuery} placeholder="Suchen…" inputClassName="h-11 bg-[#262422] border border-[#3A3631] rounded-[14px] text-sm" />
          {aiWorkerUrl && (
            <button onClick={runAiSuggest} disabled={aiLoading} className="w-full h-10 rounded-[14px] text-xs font-medium bg-[#E85D9C]/15 text-[#E85D9C] disabled:opacity-50 flex items-center justify-center gap-1.5">
              {aiLoading ? <Loader2 size={12} /> : <Sparkles size={12} />} Passende Spiele von KI hervorheben lassen
            </button>
          )}
          {aiError && <p className="text-[11px] text-[#C1443C]">{aiError}</p>}
          {aiPicks && aiPicks.length === 0 && !aiLoading && <p className="text-[11px] text-[#5C574F]">Keine der übrigen Spiele passt der KI zufolge besonders gut.</p>}
        </div>
        <div className="p-4 overflow-y-auto flex-1 space-y-2">
          {filtered.length === 0 && <p className="text-sm text-[#5C574F] px-1">Keine Spiele gefunden.</p>}
          {filtered.map((g) => {
            const checked = list.gameIds.includes(g.id);
            const aiMatch = aiPicks && aiPicks.includes(g.name);
            const themeMatch = !checked && query.trim() && themeTags.length > 0 && [...(g.categories || []), ...(g.mechanisms || [])].some((t) => themeTags.includes(t));
            const highlighted = aiMatch || themeMatch;
            return (
              <button key={g.id} onClick={() => onToggle(g.id)}
                className={`w-full flex items-center gap-3 px-2 py-2 rounded-[14px] bg-[#262422] border ${highlighted ? "border-[#E85D9C]" : "border-[#3A3631]"}`}
                style={highlighted ? { boxShadow: "0 0 0 1px #E85D9C, 0 0 16px rgba(108,127,224,0.35)" } : undefined}>
                <Cover game={g} size="sm" />
                <div className="flex-1 min-w-0 text-left">
                  <p className="text-sm text-[#F2EDE4] truncate flex items-center gap-1.5">
                    {gameSearchLabel(g)}
                    {highlighted && <Sparkles size={11} className="text-[#E85D9C] shrink-0" />}
                  </p>
                  <div className="flex items-center gap-1.5 mt-0.5 flex-wrap">
                    {g.status === "owned" && <Pill tone="teal">Besitz</Pill>}
                    {g.status === "wishlist" && <Pill tone="amber">Wunschliste</Pill>}
                  </div>
                </div>
                <div className={`w-6 h-6 rounded-full border flex items-center justify-center shrink-0 ${checked ? "bg-[conic-gradient(from_0deg,#ff5a96,#ffc850,#78dcff,#b482ff,#ff5a96)] border-transparent" : "border-[#3A3631]"}`}>
                  {checked && <Check size={14} className="text-[#F2EDE4]" />}
                </div>
              </button>
            );
          })}
        </div>
        <div className="shrink-0 p-4 border-t border-[#3A3631]">
          <button onClick={requestClose} className="glass w-full h-12 border border-white/15 text-[#F2EDE4] rounded-[14px] font-medium">Fertig</button>
        </div>
      </div>
    </div>
  );
}

/* ---------------- LIST DETAIL PAGE (view/add/remove games, delete the list) ---------------- */
function ListDetailModal({ list, games, plays, onClose, onView, onEdit, onDeleteList, onToggleGame, demoMode, guestMode, aiWorkerUrl }) {
  const [addOpen, setAddOpen] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [deleteMenuOpen, setDeleteMenuOpen] = useState(false);
  const deleteMenuClose = useSheetClose(() => setDeleteMenuOpen(false));
  const [selectMode, setSelectMode] = useState(false);
  const [selectedIds, setSelectedIds] = useState([]);
  const [contextGame, setContextGame] = useState(null);
  const contextGameClose1 = useSheetClose(() => setContextGame(null));
  const longPressTimer = React.useRef(null);
  const longPressFired = React.useRef(false);

    const map = {}; plays.forEach((p) => { map[p.gameId] = (map[p.gameId] || 0) + 1; }); return map;
  }, [plays]);
  const startLongPress = (g) => {
    if (demoMode || selectMode) return;
    longPressFired.current = false;
    longPressTimer.current = setTimeout(() => { longPressFired.current = true; setContextGame(g); }, 500);
  };
  const cancelLongPress = () => { if (longPressTimer.current) clearTimeout(longPressTimer.current); };
  const toggleSelected = (id) => { haptic(6); setSelectedIds((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id])); };

    <div className="fixed inset-0 z-[55] bg-[#1C1B1A]">

            <button onClick={onClose} className="glass-icon-btn w-10 h-10 flex items-center justify-center rounded-full border border-white/15 text-[#F2EDE4]" aria-label="Zurück"><ChevronLeft size={22} /></button>
          )}
          <h2 className="font-display text-xl text-[#F2EDE4] truncate px-2">{selectMode ? `${selectedIds.length} ausgewählt` : list.name}</h2>

            selectMode ? (
              <button onClick={removeSelected} disabled={selectedIds.length === 0} className="text-[#C1443C] text-sm font-medium px-1 disabled:opacity-30">Entfernen</button>

              <button onClick={() => setDeleteMenuOpen(true)} className="glass-icon-btn w-10 h-10 flex items-center justify-center rounded-full border border-white/15 text-[#C1443C]" aria-label="Optionen"><Trash2 size={16} /></button>
            )
          ) : <span className="w-8" />}
        </div>
        {confirmDelete && (
          <div className="shrink-0 bg-[#C1443C]/15 border-b border-[#C1443C]/30 px-5 py-3 flex items-center justify-between gap-3">

            <div className="flex gap-2 shrink-0">
              <button onClick={() => setConfirmDelete(false)} className="h-9 px-3 rounded-lg bg-[#262422] border border-[#3A3631] text-[#F2EDE4] text-xs">Abbrechen</button>
              <button onClick={() => { onDeleteList(list.id); onClose(); }} className="h-9 px-3 rounded-lg bg-[#C1443C] text-[#F2EDE4] text-xs font-medium">Löschen</button>
            </div>
          </div>
        )}
        <div className="flex-1 overflow-y-auto p-5 pb-28">
          {listGames.length === 0 ? (
            <p className="text-[#5C574F] text-sm text-center mt-8">Noch keine Spiele in dieser Liste.</p>
          ) : (
            <div className="grid grid-cols-2 gap-3">
              {listGames.map((g) => (
                <div key={g.id} className="relative">
                  <GameGridCard
                    game={g}
                    playCounts={playCounts}
                    gridCols={2}
                    onClick={(activeGame) => {
                      if (selectMode) { toggleSelected(g.id); return; }

                      onView(activeGame);

          style={{ background: "conic-gradient(from 0deg, #ff5a96, #ffc850, #78dcff, #b482ff, #ff5a96)", boxShadow: "0 8px 24px rgba(180,130,255,0.45), inset 0 1px 1px rgba(255,255,255,0.4)", bottom: "calc(100px + env(safe-area-inset-bottom))" }}>

            <button onClick={() => { setConfirmDelete(true); deleteMenuClose.requestClose(); }} className="w-full h-12 flex items-center gap-3 px-3.5 bg-[#262422] border border-[#3A3631] rounded-[14px] text-[#C1443C] text-sm">
              <Trash2 size={16} /> Liste löschen
            </button>
            <button onClick={deleteMenuClose.requestClose} className="w-full text-center py-2 text-[#A39C8F] text-sm">Abbrechen</button>
          </div>
        </div>
      )}
      {contextGame && (
        <div className={`fixed top-0 left-0 right-0 bg-black/70 z-[66] flex items-end justify-center p-0 ${contextGameClose1.closing ? "backdrop-fade-out" : "backdrop-fade"}`} style={{ height: "var(--app-height, 100dvh)", top: "var(--app-offset-top, 0px)" }} onClick={contextGameClose1.requestClose}>
          <div className={`glass border border-white/10 rounded-t-[28px] w-full font-body p-5 space-y-2 ${contextGameClose1.closing ? "sheet-out" : "rise-in"}`} onClick={(e) =>

            <button onClick={() => { onEdit(contextGame); contextGameClose1.requestClose(); }} className="w-full h-12 flex items-center gap-3 px-3.5 bg-[#262422] border border-[#3A3631] rounded-[14px] text-[#F2EDE4] text-sm">
              <Pencil size={16} /> Bearbeiten

            <button onClick={() => { onToggleGame(list.id, contextGame.id); contextGameClose1.requestClose(); }} className="w-full h-12 flex items-center gap-3 px-3.5 bg-[#262422] border border-[#3A3631] rounded-[14px] text-[#C1443C] text-sm">

  const playResults = q ? plays.filter((p) => (p.gameName || "").toLowerCase().includes(q) || (p.players || "").toLowerCase().includes(q)).slice(0, 4) : [];

    <div className={`fixed inset-0 bg-black/80 z-[75] flex flex-col ${closing ? "backdrop-fade-out" : ""}`} onClick={requestClose}>

          <Search size={16} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#5C574F] pointer-events-none" />

                </button>
              ))}

          </div>

        {listResults.length > 0 && (
          <div>
            <p className="text-xs text-[#5C574F] uppercase tracking-wide mb-2">Listen</p>
            <div className="space-y-2">
              {listResults.map((l) => (
                <button key={l.id} onClick={() => onOpenList(l)} className="w-full flex items-center gap-3 px-3.5 h-11 rounded-[14px] bg-[#262422] border border-[#3A3631]">
                  <span className="flex-1 min-w-0 text-left text-sm text-[#F2EDE4] truncate">{l.name}</span>
                  <span className="text-xs text-[#5C574F] shrink-0">{l.gameIds.length}</span>

        </div>

function Collection({ games, plays, filterFn, clearFilter, onAdd, onView, onEdit, onDelete, categoryOptions, mechanismOptions, demoMode, guestMode, lists, onCreateList, onOpenList }) {
  const [query, setQuery] = useState("");

  // Ein Status-/Verkaufsstatus-Filter, der noch aus dem normalen Modus stammt

  const [sortBy, setSortBy] = useState(() => loadKey("spielregal:collectionSortBy", "name-asc"));
  useEffect(() => { saveKey("spielregal:collectionSortBy", sortBy); }, [sortBy]);

  const cancelLongPress = () => { if (longPressTimer.current) clearTimeout(longPressTimer.current); };
  const activeFilterCount = filters.categories.length + filters.mechanisms.length + filters.publishers.length + filters.complexity.length + filters.saleStatus.length + (filters.players ? 1 : 0) + (filters.minRating ? 1 : 0) + (statusFilter !== "owned" ? 1 : 0);
  const presentCategories = useMemo(() => {

    games.forEach((g) => (g.categories || []).forEach((c) => { counts[c] = (counts[c] || 0) + 1; }));
    return Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([tag]) => tag);
  }, [games]);
  const presentMechanisms = useMemo(() => {
    const counts = {};
    games.forEach((g) => (g.mechanisms || []).forEach((m) => { counts[m] = (counts[m] || 0) + 1; }));
    return Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([tag]) => tag);
  }, [games]);
  const presentPublishers = useMemo(() => {

    return Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([tag]) => tag);
  }, [games]);
  const playCounts = useMemo(() => {

/* ---------------- SWIPEABLE ROW (swipe left to reveal delete) ---------------- */
function SwipeableRow({ onDelete, children, disabled }) {
  const [dragX, setDragX] = useState(0);
  const startX = React.useRef(0);
  const dragging = React.useRef(false);
  const REVEAL = 76;

  const onTouchStart = (e) => {
    if (disabled) return;
    startX.current = e.touches[0].clientX;
    dragging.current = true;
  };
  const onTouchMove = (e) => {
    if (!dragging.current || disabled) return;
    const delta = e.touches[0].clientX - startX.current;
    if (delta < 0) setDragX(Math.max(delta, -REVEAL - 20));
    else setDragX(0);
  };
  const onTouchEnd = () => {
    if (!dragging.current) return;
    dragging.current = false;
    const revealed = dragX < -REVEAL / 2;
    if (revealed) haptic(8);
    setDragX(revealed ? -REVEAL : 0);
  };

  return (
    <div className="relative overflow-hidden rounded-[14px]">
      <button
        onClick={() => { haptic(15); onDelete(); setDragX(0); }}
        className="absolute inset-y-0 right-0 w-[76px] bg-[#C1443C] text-white flex flex-col items-center justify-center gap-0.5 text-[10px]"
        aria-label="Löschen"
      >
        <Trash2 size={16} /> Löschen
      </button>
      <div
        onTouchStart={onTouchStart}
        onTouchMove={onTouchMove}
        onTouchEnd={onTouchEnd}
        style={{ transform: `translateX(${dragX}px)`, transition: dragging.current ? "none" : "transform 200ms" }}
        className="relative bg-[#1C1B1A]"
      >
        {children}
      </div>
    </div>
  );
}

function PlayLog({ plays, games, onAdd, onEdit, onDelete, demoMode, playerProfiles = [] }) {
  const [detailGroupKey, setDetailGroupKey] = useState(null);
  const [viewMode, setViewMode] = useState(() => loadKey("spielregal:playlogViewMode", "game")); // "game" | "evening"
  useEffect(() => { saveKey("spielregal:playlogViewMode", viewMode); }, [viewMode]);
  const [detailEveningDate, setDetailEveningDate] = useState(null);
  const groupSwipe = useEdgeSwipeBack(() => setDetailGroupKey(null));
  const eveningSwipe = useEdgeSwipeBack(() => setDetailEveningDate(null));
  const [searchOpen, setSearchOpen] = useState(false);
  const [query, setQuery] = useState("");
  const [filterModalOpen, setFilterModalOpen] = useState(false);
  const [filters, setFilters] = useState(() => loadKey("spielregal:playlogFilters", { mode: "all", winner: "", from: "", to: "" }));
  useEffect(() => { saveKey("spielregal:playlogFilters", filters); }, [filters]);
  const modeIcon = { "physical-owned": Home, "physical-other": Sofa, bga: Globe };
  const modeLabel = { "physical-owned": "Eigene Sammlung", "physical-other": "Geliehen / Event", bga: "Digital" };
  const activeFilterCount = (filters.mode !== "all" ? 1 : 0) + (filters.winner ? 1 : 0) + (filters.from ? 1 : 0) + (filters.to ? 1 : 0);
  const allWinners = useMemo(() => {
    const names = new Set();
    plays.forEach((p) => winnersOf(p).forEach((n) => names.add(n)));
    return [...names].sort();
  }, [plays]);

  let filteredPlays = plays;
  if (query.trim()) filteredPlays = filteredPlays.filter((p) => p.gameName.toLowerCase().includes(query.toLowerCase()));
  if (filters.mode !== "all") filteredPlays = filteredPlays.filter((p) => p.mode === filters.mode);
  if (filters.winner) filteredPlays = filteredPlays.filter((p) => winnersOf(p).includes(filters.winner));
  if (filters.from) filteredPlays = filteredPlays.filter((p) => p.date && p.date >= filters.from);
  if (filters.to) filteredPlays = filteredPlays.filter((p) => p.date && p.date <= filters.to);

  const sorted = [...filteredPlays].sort((a, b) => (b.date || "").localeCompare(a.date || ""));

  // Plays from the same date grouped into one "evening" card, newest first.
  const eveningGroups = useMemo(() => {
    const byDate = new Map();
    sorted.forEach((p) => {
      const key = p.date || "Ohne Datum";
      if (!byDate.has(key)) byDate.set(key, []);
      byDate.get(key).push(p);
    });
    return Array.from(byDate.entries()).sort((a, b) => b[0].localeCompare(a[0]));
  }, [sorted]);

  // Expansions are grouped together with their base game in the play history,
  // so plays of "Ark Nova: Marine Worlds" show up under "Ark Nova".
  const rootGameId = (id) => {
    let current = id;
    for (let i = 0; i < 5; i++) {
      const g = games.find((x) => x.id === current);
      if (g && g.expansionOf && games.some((x) => x.id === g.expansionOf)) current = g.expansionOf;
      else break;
    }
    return current;
  };

  // Same game's plays grouped together; groups ordered by their most recent play, newest first.
  const grouped = useMemo(() => {
    const byGame = new Map();
    sorted.forEach((p) => {
      const key = rootGameId(p.gameId) || p.gameName;
      if (!byGame.has(key)) byGame.set(key, []);
      byGame.get(key).push(p); // sorted already comes newest-first, so this stays newest-first per group
    });
    const groups = Array.from(byGame.values());
    const todayStr = new Date().toISOString().slice(0, 10); // re-evaluated on every render, so "today" is always current
    groups.sort((a, b) => {
      const aToday = a.some((p) => p.date === todayStr);
      const bToday = b.some((p) => p.date === todayStr);
      if (aToday !== bToday) return aToday ? -1 : 1; // played today always floats to the top
      return b.length - a.length; // otherwise most-played first
    });
    return groups;
  }, [sorted, games]);

  const currentYear = new Date().getFullYear();
  const yearPlays = plays.filter(p => p.date && new Date(p.date).getFullYear() === currentYear);
  const yearGameCount = new Set(yearPlays.map(p => p.gameId)).size;
  const estimatedMinutes = yearPlays.reduce((sum, p) => {
    const g = games.find(x => x.id === p.gameId);
    if (!g || !g.minTime) return sum;
    const avg = (parseInt(g.minTime) + parseInt(g.maxTime || g.minTime)) / 2;
    return sum + avg;
  }, 0);
  const estimatedHours = Math.round((estimatedMinutes / 60) * 10) / 10;

  const winCounts = useMemo(() => {
    const wins = {};
    const totals = {};
    plays.forEach((p) => {
      (p.players || "").split(",").map((s) => s.trim()).filter(Boolean).forEach((n) => { totals[n] = (totals[n] || 0) + 1; });
      winnersOf(p).forEach((name) => { wins[name] = (wins[name] || 0) + 1; });
    });
    return Object.entries(wins)
      .map(([name, count]) => ({ name, count, total: totals[name] || count, rate: (totals[name] || count) > 0 ? count / (totals[name] || count) : 0 }))
      .sort((a, b) => b.rate - a.rate || b.count - a.count)
      .slice(0, 3);
  }, [plays]);
  const medals = ["🥇", "🥈", "🥉"];

  const allPlayerNames = useMemo(() => {

    return [...names].sort();
  }, [plays]);
  const [h2hA, setH2hA] = useState(() => loadKey("spielregal:h2hA", ""));

          ) : (
            plays.length > 0 && (
              <button onClick={() => setSearchOpen(true)} aria-label="Suchen"
                className="glass-icon-btn w-10 h-10 flex items-center justify-center rounded-full border border-white/15 text-[#A39C8F] shadow-lg">
                <Search size={17} />
              </button>
            )
          )}
        </div>
        {!demoMode && (
          <button onClick={() => { haptic(8); onAdd(); }} aria-label="Partie eintragen"
            className={`text-[#F2EDE4] w-14 h-14 flex items-center justify-center rounded-full shadow-lg active:scale-95 border border-white/25 transition-all duration-300 ease-out shrink-0 ${searchOpen ? "opacity-0 scale-0 w-0 border-0 pointer-events-none" : "opacity-100 scale-100"}`}
            style={{ background: "conic-gradient(from 0deg, #ff5a96, #ffc850, #78dcff, #b482ff, #ff5a96)", boxShadow: "0 8px 24px rgba(180,130,255,0.45), inset 0 1px 1px rgba(255,255,255,0.4)" }}>
            <Plus size={22} />
          </button>
        )}
        {plays.length > 0 && (
          searchOpen ? (
            <button onClick={() => { setSearchOpen(false); setQuery(""); }} aria-label="Suche schließen"
              className="glass-icon-btn w-10 h-10 flex items-center justify-center rounded-full border border-white/15 text-[#A39C8F] shadow-lg shrink-0">

              <button onClick={() => setFilterModalOpen(true)} aria-label="Filter"

Wichtige Chat-Regeln, damit es sich nicht wie ein Bot anfühlt:
- Wiederhol NIE, was du schon gesagt hast, und stell nie zweimal dieselbe Frage anders formuliert.
- Geh wirklich auf das ein, was der Nutzer zuletzt geschrieben hat — reagier konkret drauf, nicht generisch.

- Sei entscheidungsfreudig — wenn du genug weißt, empfiehl direkt statt ewig nachzufragen.

RICHTUNG "Sammlung verkleinern": Der Nutzer will Spiele aus seiner EIGENEN Sammlung loswerden (verkaufen/weggeben). Schlag dafür gezielt Kandidaten aus der Sammlung unten vor — bevorzugt Spiele mit 0 Partien, niedriger Bewertung, oder die lange nicht gespielt wurden. Frag kurz nach, wonach er aussortieren will (z.B. "was hast du nie gespielt" vs. "was gefällt dir nicht mehr"), falls nicht klar. NIEMALS in dieser Richtung neue/fremde Spiele von BGG vorschlagen — es geht nur um Abbau der bestehenden Sammlung.

RICHTUNG "Neues Spiel entdecken": Der Nutzer will sein Regal ERWEITERN — er will NEUE Spiele kennenlernen, die er noch NICHT besitzt. Schlag hier NIE Spiele aus der eigenen Sammlung unten vor (die hat er ja schon) — nutze stattdessen BGGSEARCH/BGGDISCOVER, um wirklich neue, ihm unbekannte Spiele zu finden. Frag vorher kurz, in welche Richtung es gehen soll (Thema, Komplexität, für wie viele Spieler er meistens plant, oder was er von seinen Favoriten mag, um ähnliches zu finden).

RICHTUNG "Passendes Spiel finden": Das ist der Flow weiter unten (Spieleranzahl/Zeit/Anspruch erfragen, dann aus der EIGENEN Sammlung empfehlen, wie im Detail unten beschrieben).`}

Der folgende Ablauf (Spieleranzahl → Zeit → Anspruch, dann Empfehlung) gilt NUR für die Richtung "Passendes Spiel finden" (bzw. immer, wenn der Nutzer ein Gast ist). Bei "Sammlung verkleinern" oder "Neues Spiel entdecken" gilt er NICHT — dort gehst du nach den jeweiligen Anweisungen oben vor.

Bevor du ein KONKRETES Spiel vorschlägst, brauchst du drei Dinge — aber in fester Reihenfolge, nicht alles auf einmal:

SCHRITT 1 (immer zuerst, sofort in deiner ersten Antwort in einem neuen Gespräch): Frag nach Spieleranzahl UND Zeit zusammen in einer Nachricht — außer beides steht schon eindeutig da, dann direkt zu Schritt 2.

SCHRITT 2 (erst NACHDEM Schritt 1 beantwortet ist, als eigene, separate Nachricht danach): Frag, wie anspruchsvoll es sein darf — NIEMALS mit Fachbegriffen wie "Kennerspiel" oder "Komplexität", das sagt Nicht-Brettspielern nichts. Frag lebensnah, z.B. ob es eher entspannt und schnell erklärt sein soll oder ruhig etwas fordern darf, ob alle am Tisch schon Brettspiel-Erfahrung haben, oder ob's ein lockerer Feierabend oder ein "Reinfuchs"-Abend werden soll. Leite selbst die passende Stufe ab, ohne den Fachbegriff zwangsläufig zurückzuspielen. Steht das auch schon eindeutig da, überspring auch diesen Schritt.

Erst wenn alle drei Infos da sind, empfiehlst du konkrete Spiele.

WICHTIG, sobald du KONKRETE Spiele empfiehlst: erklär pro Spiel kurz, WIE es gespielt wird bzw. was die Kernmechanik ist, UND nenne die relevanten Eckdaten aus der Sammlung dazu (Spieleranzahl, Dauer) — nicht nur vage Begeisterung. Zur Komplexität: sag NICHT den rohen Fachbegriff ("Kennerspiel", "Expertenspiel", "Familienspiel") — die sagen Nicht-Brettspielern nichts —, sondern beschreib in eigenen, einfachen Worten, wie leicht oder anspruchsvoll es ist (z.B. "in 5 Minuten erklärt" vs. "braucht etwas Einarbeitung, lohnt sich aber"). Stütz dich dabei NUR auf die "Beschreibung"/Eckdaten in der Sammlung unten — erfinde keine Regeldetails, die dort nicht stehen. Gibt es zu einem Spiel keine Beschreibung, sag das ehrlich statt generische Floskeln wie "macht Laune" zu benutzen.

Formatierung, wenn du MEHRERE Spiele zur Auswahl vorschlägst (2-3 Optionen) — das ist keine Empfehlung, sondern eine Pflicht-Vorlage, halte dich EXAKT daran, auch wenn es dir redundant vorkommt:
**Spielname**
Kurzer Pitch (was man macht) + Eckdaten (Spieleranzahl, Dauer, Stufe) in ein bis zwei Sätzen.

**Zweiter Spielname**
Kurzer Pitch + Eckdaten.

Kein Fließtext-Absatz davor oder danach, der die Spiele schon vorwegnimmt oder zusammenfasst — die Einleitung ist maximal ein kurzer halber Satz, dann direkt die Liste im obigen Format. Bei nur EINEM einzelnen empfohlenen Spiel (keine Auswahl) reicht normaler Fließtext ohne dieses Format.

Lies zwischen den Zeilen: wenn der Nutzer z.B. erwähnt "die Kinder sind da", "wir sind neu dabei", "nach der Arbeit noch schnell", "größere Familienrunde an Weihnachten" — zieh daraus selbst Schlüsse (Zielgruppe, Energielevel, Regelkenntnis, verfügbare Zeit), statt stur nach Spieleranzahl/Zeit zu fragen, wenn's schon impliziert ist. Merk dir außerdem alles, was im bisherigen Gespräch schon gesagt wurde, und frag das nie nochmal.

Wenn du über die Komplexität eines Spiels sprichst, nutze die Einstufung, die auch in der Sammlung unten steht (Einsteiger, Familie, Familie+, Kenner–, Kenner, Kenner+, Experte) — nicht eigene, davon abweichende Wörter wie pauschal "komplex" oder "schwer", die eine andere Stufe suggerieren als die tatsächliche (z.B. ein "Kennerspiel" NICHT als "komplex" bezeichnen, das klingt nach Expertenspiel-Niveau — sag stattdessen z.B. "mittelschwer" oder nenn die Stufe direkt beim Namen).

Wenn du noch was Wichtiges nicht weißt, frag GEZIELT nach der einen Sache, die deine Empfehlung gerade am meisten einschränkt — nicht nach einem Standard-Set von Fragen (Spieleranzahl/Zeit) nach Schema F. Manchmal ist die entscheidende Frage etwas anderes: ob schon mal gespielt wurde, wie viel Konzentration gerade drin ist, ob's ums Gewinnen oder ums Zusammensein geht, wer dabei ist. Wähl die Frage, die dich am schnellsten zu einer guten, konkreten Empfehlung bringt. Höchstens EINE Rückfrage pro Nachricht, und nur wenn's wirklich nötig ist — reicht das Gesagte schon aus, empfiehl direkt.

Die OPTIONS-Zeile ist NUR für kurze Antwortmöglichkeiten gedacht, die der NUTZER als nächstes plausibel sagen würde — niemals Spielnamen, Erweiterungsnamen oder andere Datenfragmente. Beispiele für gute Optionen bei einer Rückfrage: "2 Spieler" | "4 Spieler" | "Egal". Nachdem du ein KONKRETES Spiel empfohlen hast, sind die einzig sinnvollen Optionen kurze Reaktionen wie "Klingt gut" | "Zeig mir eine Alternative" | "Erzähl mehr dazu" — nie mehrere andere Spiele auf einmal ohne dass der Nutzer danach gefragt hat. Häng die Zeile nur an, wenn sie wirklich sinnvolle, kurze Nutzer-Antworten enthält, sonst ganz weglassen, in exakt diesem Format:
OPTIONS: Option1 | Option2 | Option3

Du hast KEINEN Zugriff auf das freie Internet — aber du kannst gezielt bei BoardGameGeek (der größten Brettspiel-Datenbank) nachschlagen, wenn der Nutzer nach einem SPEZIFISCHEN Spiel fragt, das nicht in seiner Sammlung ist (z.B. "Was hältst du von X?", "Warum sollte ich X kaufen?", "Kennst du X?"). Antworte in diesem Fall NUR mit dieser einen Zeile, KOMPLETT OHNE einleitenden Satz davor oder danach — die Zeile muss deine gesamte Antwort sein, sonst funktioniert die Suche technisch nicht:
BGGSEARCH: <Spielname>

Fragt der Nutzer allgemein nach einer NEUEN Kaufempfehlung / einem Spiel, das er noch nicht hat, ohne einen bestimmten Titel zu nennen (z.B. "Was soll ich mir als nächstes kaufen?", "Empfiehl mir was Neues"), antworte NUR mit dieser einen Zeile, ebenfalls ganz ohne Satz davor oder danach:
BGGDISCOVER

Nutze BGGSEARCH/BGGDISCOVER, wenn dir Informationen fehlen, um die Frage zu beantworten — das gilt auch für Spiele, die schon (z.B. auf der Wunschliste) in der Sammlung stehen, wenn dort keine Beschreibung oder Rezensionen hinterlegt sind. Nur wenn du die Frage schon vollständig aus den Daten unten beantworten kannst (z.B. reine Empfehlung aus der Sammlung), brauchst du keine Suche. Fragt der Nutzer explizit nach Meinungen/Rezensionen/was andere Spieler sagen, und du hast dazu noch keine echten Rezensionen aus einer vorherigen BGGSEARCH-Antwort in diesem Gespräch, dann IMMER erst BGGSEARCH nutzen, bevor du antwortest — erfinde niemals Rezensionen oder Meinungen, die du nicht wirklich bekommen hast. Bekommst du nach einer BGGSEARCH-Anfrage echte Spieler-Rezensionen mitgeliefert, beziehe deren Meinung natürlich mit ein (z.B. "Spieler sagen, dass..."), statt sie zu ignorieren — aber erfinde nichts dazu, was nicht in den Rezensionen steht.

Du bist außerdem der Ratgeber, wenn's um die Sammlung als Ganzes geht — nicht nur "was spielen wir heute", sondern auch "was mach ich mit meiner Sammlung":

Beim VERKLEINERN/Ausmisten: Schau dir Spielanzahl, Bewertung und ob überhaupt gespielt wurde an. Kandidaten zum Abgeben sind typischerweise: nie gespielte Spiele, die schon lange in der Sammlung sind; niedrig bewertete Spiele; Spiele, die sich stark mit anderen, öfter gespielten Spielen überschneiden (gleiche Nische, gleicher Mechanismus). Sei dabei kein gnadenloser Roboter — frag ruhig kurz nach, ob ein selten gespieltes Spiel vielleicht bewusst für besondere Anlässe (Weihnachten, bestimmte Freunde) aufgehoben wird, bevor du's zum Abgeben vorschlägst. Nenn konkrete Spielnamen mit einem kurzen, ehrlichen Grund, keine vagen Pauschalaussagen.

Beim VERGRÖSSERN/Neuanschaffungen: Schau dir an, was in der Sammlung fehlt oder unterrepräsentiert ist (z.B. nur schwere Spiele, aber nichts für spontane Runden; keine guten 2-Spieler-Spiele; eine Lieblings-Mechanik, von der es kaum was gibt). Beziehe die Wunschliste mit ein, falls vorhanden — die ist ein starkes Signal für das, was den Nutzer schon interessiert. Schlag zuerst vor, offene Lücken zu füllen, bevor du wahllos neue Spiele in die gleiche Nische vorschlägst, die schon gut abgedeckt ist. Für konkrete neue Titel außerhalb der Sammlung nutzt du wie gewohnt BGGSEARCH (bestimmter Titel) oder BGGDISCOVER (offene Empfehlung).

In beiden Fällen: das ist ein Gespräch, kein Bericht — frag nach der einen Sache, die deine Einschätzung am meisten schärfen würde (z.B. "Geht's dir eher um Platz oder ums Geld zurückholen?" oder "Sollen es eher leichtere oder schwerere Spiele werden?"), statt sofort eine lange Liste runterzurattern.

Manche Spiele unten sind mit "STATUS: bereits verkauft" oder "STATUS: zum Verkauf markiert" gekennzeichnet — die stehen noch in der Sammlung, sind aber schon weg bzw. auf dem Sprung. Wenn du so ein Spiel empfiehlst oder erwähnst, weise kurz und beiläufig darauf hin (z.B. "…allerdings hast du das ja schon verkauft" oder "…ist aber gerade zum Verkauf markiert"), statt es zu verschweigen.
