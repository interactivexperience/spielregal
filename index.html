    haptic(6);
    const nextMessages = [...chatMessages, { role: "user", content: question, display: displayText }];
    setChatMessages(nextMessages);
    setChatInput("");
    setChatLoading(true);
    setChatError("");
    try {
      const apiMessages = [{ role: "system", content: systemPrompt() }, ...nextMessages.map(({ display, ...m }) => m)];
      let raw = await aiChat(aiWorkerUrl, apiMessages);
      let externalGame = null;

      // Not anchored to the very start — the model sometimes writes a short
      // lead-in sentence before the BGGSEARCH/BGGDISCOVER directive instead
      // of outputting it as the entire reply. Detect it anywhere so the
      // search still actually runs instead of the raw directive leaking into
      // the visible chat as plain text.
      const bggSearchMatch = raw.match(/BGGSEARCH:\s*(.+?)\s*$/im);
      const isDiscover = /BGGDISCOVER\b/i.test(raw);

      if (bggSearchMatch || isDiscover) {
        setChatLoadingLabel(isDiscover ? "durchstöbert BGG…" : "schaut bei BGG nach…");
        let toolResultText = "";
        try {
          if (bggSearchMatch) {
            const results = await bggSearch(bggSearchMatch[1].trim());
            if (results.length > 0) {
              const details = await bggThing(results[0].bggId);
              externalGame = details;
              let reviewsText = "";
              try {
                const comments = await bggThingComments(results[0].bggId);
                if (comments.length > 0) {
                  reviewsText = `\n\nEchte Spieler-Rezensionen (mit ihrer Bewertung 1-10):\n${comments.map((c) => `- (${c.rating || "?"}/10) "${c.text.slice(0, 200)}"`).join("\n")}`;
                }
              } catch { /* reviews are a nice-to-have — skip silently if unavailable */ }
              toolResultText = `Echte BGG-Daten zu "${details.name}" (${details.year || "?"}): ${details.minPlayers || "?"}-${details.maxPlayers || "?"} Spieler, ${details.minTime || "?"}-${details.maxTime || "?"} Min., Komplexität ${details.complexity || "unbekannt"}/5. Kategorien: ${(details.categories || []).slice(0, 4).join(", ") || "-"}. Mechanismen: ${(details.mechanisms || []).slice(0, 4).join(", ") || "-"}. Beschreibung: ${(details.summary || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim().slice(0, 500) || "keine verfügbar"}.${reviewsText}`;
            } else {
              toolResultText = `Keine Treffer auf BGG für "${bggSearchMatch[1].trim()}" gefunden.`;
            }
          } else {
            const hot = await bggFetchHotList();
            const top = hot.slice(0, 6);
            const enriched = [];
            for (const h of top.slice(0, 3)) {
              try { enriched.push(await bggThing(h.bggId)); } catch { /* skip this one */ }
            }
            if (enriched.length > 0) externalGame = enriched[0];
            toolResultText = `Aktuell angesagte Spiele auf BGG:\n${enriched.map((d) => `- ${d.name} (${d.year || "?"}) | ${d.minPlayers || "?"}-${d.maxPlayers || "?"} Sp. | Komplexität ${d.complexity || "?"}/5 | Themen: ${(d.categories || []).slice(0, 3).join(", ")}`).join("\n") || "Keine Daten verfügbar."}`;
          }
        } catch {
          toolResultText = "BGG war gerade nicht erreichbar.";
        }
        setChatLoadingLabel("überlegt…");
        const followUp = [
          ...apiMessages,
          { role: "assistant", content: raw },
          { role: "user", content: `[BGG-Ergebnis]: ${toolResultText}\n\nBeantworte jetzt meine ursprüngliche Frage damit — normal, wie mit einem Freund, kein Datengestammel. Schreib danach zusätzlich einen kurzen eigenen Abschnitt zu den Mechanismen des Spiels (2-3 Sätze): welche der genannten Mechanismen das Spiel prägen und was das für das Spielgefühl bedeutet — nicht nur die Begriffe auflisten, sondern kurz erklären.` },
        ];
        raw = await aiChat(aiWorkerUrl, followUp);
      }

      const { text: replyText, options } = parseReply(raw);
      setChatMessages([...nextMessages, { role: "assistant", content: replyText, options, externalGame }]);
      setTimeout(() => chatEndRef.current?.scrollIntoView({ behavior: "smooth" }), 100);
    } catch (e) {
      setChatError(e.message || "Fehlgeschlagen");
    } finally {
      setChatLoading(false);
      setChatLoadingLabel("überlegt…");
    }
  };

  // Pip greets you first, as a real chat message — once per fresh conversation.
  // Im Gästemodus gibt's nur den "passendes Spiel finden"-Flow (kein Sammlung
  // verkleinern/entdecken, das ergibt für einen Gast keinen Sinn) — startet
  // deshalb direkt mit der Spieleranzahl/Zeit-Frage. Im normalen Modus
  // präsentiert Pip erst die drei Grundrichtungen zur Auswahl.
  useEffect(() => {
    if (!aiWorkerUrl || chatMessages.length > 0 || greetedRef.current) return;
    greetedRef.current = true;
    (async () => {
      setChatLoading(true);
      try {
        const greeting = guestMode
          ? "[Begrüß mich kurz und locker mit deinem Namen Pip, erwähn beiläufig dass du beim Spielefinden hilfst, und frag direkt nach der Spieleranzahl und der Zeit zusammen in einer Frage.]"
          : "[Begrüß mich kurz und locker mit deinem Namen Pip, und frag dann in einem knappen Satz, worum es heute gehen soll — OHNE selbst Optionen aufzuzählen, die kommen separat als Buttons.]";
        const raw = await aiChat(aiWorkerUrl, [
          { role: "system", content: systemPrompt() },
          { role: "user", content: greeting },
        ], 1.0);
        const { text, options } = parseReply(raw);
        // Die drei Grundrichtungen kommen als feste, im Code hinterlegte Buttons
        // statt vom Modell frei generierten OPTIONS — zuverlässiger als sich
        // darauf zu verlassen, dass das Modell exakt dieselben drei Texte jedes
        // Mal korrekt ausgibt.
        setChatMessages([{ role: "assistant", content: text, options, showFlowButtons: !guestMode }]);
      } catch {
        setChatMessages([{ role: "assistant", content: "Hey, ich bin Pip! Ich helf dir, das passende Spiel für heute zu finden. Wie viele seid ihr denn und wie viel Zeit habt ihr?", options: [], showFlowButtons: !guestMode }]);
      } finally {
        setChatLoading(false);
      }
    })();
  }, [aiWorkerUrl, guestMode]);

  return (
    <div className="min-h-full flex flex-col">
      <div className="p-5 pb-3 flex items-center justify-between gap-3">
        <h1 className="font-display text-3xl text-[#F2EDE4]">Was spielen wir heute?</h1>
      </div>

      {!aiWorkerUrl ? (
        <div className="flex-1 flex items-center justify-center p-5 text-center">
          <div className="flex flex-col items-center">
            <div className="relative">
              <PipAvatar size={104} sleeping />
              <span className="absolute -top-1 -right-2 text-2xl" style={{ animation: "float 2.5s ease-in-out infinite" }}>💤</span>
            </div>
            <p className="text-[#F2EDE4] font-display text-xl mt-4">Pip schläft noch</p>
            <p className="text-[#A39C8F] text-sm font-body mt-1.5 max-w-xs">Richte in den Einstellungen den KI-Assistenten ein, damit Pip aufwacht und dir beim Spielefinden helfen kann.</p>
          </div>
        </div>
      ) : (
        <>
          <div className="flex-1 px-5 space-y-3" style={{ paddingBottom: "calc(72px + env(safe-area-inset-bottom) + 76px)" }}>
            {chatMessages.map((m, i) => {
              const isLast = i === chatMessages.length - 1;
              return (
                <div key={i} className={`flex gap-2 items-end ${m.role === "user" ? "justify-end" : "justify-start"}`}>
                  {m.role === "assistant" && <PipAvatar size={30} />}
                  <div className={`max-w-[80%] flex flex-col gap-1.5 ${m.role === "user" ? "items-end" : "items-start"}`}>
                    <div
                      className={`text-sm font-body rounded-2xl px-4 py-2.5 ${m.role === "user" ? "text-white rounded-br-md" : "bg-[#262422] border border-[#3A3631] text-[#F2EDE4] rounded-bl-md"}`}
                      style={m.role === "user" ? {
                        backgroundImage: "linear-gradient(180deg, #ff5a96, #ffc850, #78dcff, #b482ff)",
                        backgroundAttachment: "fixed",
                        backgroundSize: "100vw 100vh",
                      } : undefined}
                    >
                      {m.role === "assistant" ? renderPipMessage(m.content, games, onView) : (m.display || m.content)}
                      {m.role === "assistant" && isLast && m.showFlowButtons && !chatLoading && (
                        <div className="flex flex-col gap-1.5 mt-2.5 pt-2.5 border-t border-white/10">
                          {[
                            { label: "Sammlung verkleinern", msg: "Ich will meine Sammlung verkleinern — zeig mir Kandidaten aus meiner Sammlung zum Aussortieren." },
                            { label: "Passendes Spiel finden", msg: "Ich will ein passendes Spiel für heute finden." },
                            { label: "Neues Spiel entdecken", msg: "Ich will ein neues Spiel entdecken, das noch nicht in meiner Sammlung ist — schlag mir dafür was von BoardGameGeek vor, nicht aus meiner Sammlung." },
                          ].map((f) => (
                            <button key={f.label} onClick={() => sendChat(f.msg, f.label)}
                              className="w-full text-left px-3.5 py-2.5 rounded-[14px] text-sm bg-[#1C1B1A] border border-[#3A3631] text-[#8B9AFA] font-medium flex items-center justify-between">
                              {f.label} <ChevronRight size={15} className="text-[#5C574F] shrink-0" />
                            </button>
                          ))}
                        </div>
                      )}
                    </div>
                    {m.externalGame && (
                      <div className="flex flex-wrap gap-1.5">
                        {m.externalGame.bggId && (
                          <a href={`https://boardgamegeek.com/boardgame/${m.externalGame.bggId}`} target="_blank" rel="noopener noreferrer"
                            className="flex items-center gap-1.5 pl-1 pr-2.5 py-1 rounded-full bg-[#1C1B1A] border border-[#3A3631] text-xs text-[#A39C8F]">
                            {m.externalGame.images && m.externalGame.images[0] ? <img src={m.externalGame.images[0]} alt="" className="w-5 h-5 rounded-full object-cover" /> : <Globe size={12} />}
                            {m.externalGame.name} auf BGG ansehen <ChevronRight size={11} />
                          </a>
                        )}
                        {!games.some((g) => g.bggId && String(g.bggId) === String(m.externalGame.bggId)) && (
                          <button onClick={() => onAddWishlist(m.externalGame)} className="flex items-center gap-1.5 pl-2.5 pr-2.5 py-1 rounded-full bg-[#D4A24C]/15 border border-[#D4A24C]/40 text-xs text-[#D4A24C] font-medium">
                            <Heart size={12} /> Zur Wunschliste
                          </button>
                        )}
                        {onSaveMechanismsNote && (() => {
                          const owned = games.find((g) => g.bggId && String(g.bggId) === String(m.externalGame.bggId));
                          if (!owned) return null;
                          const paragraphs = m.content.split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean);
                          const mechanicsPara = paragraphs.length > 1 ? paragraphs[paragraphs.length - 1] : m.content;
                          return (
                            <button onClick={() => { onSaveMechanismsNote(owned.id, mechanicsPara); haptic(8); }}
                              className="flex items-center gap-1.5 pl-2.5 pr-2.5 py-1 rounded-full bg-[#8B9AFA]/15 border border-[#8B9AFA]/40 text-xs text-[#8B9AFA] font-medium">
                              <Puzzle size={12} /> In Spieldetails speichern
                            </button>
                          );
                        })()}
                      </div>
                    )}
                    {m.role === "assistant" && isLast && m.options && m.options.length > 0 && !m.showFlowButtons && !chatLoading && (
                      <div className="flex gap-1.5 flex-wrap mt-0.5">
                        {m.options.map((opt) => (
                          <button key={opt} onClick={() => sendChat(opt)} className="px-3.5 py-2 rounded-full text-sm bg-[#E85D9C]/15 border border-[#E85D9C]/40 text-[#8B9AFA] font-medium">
                            {opt}
                          </button>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
            {chatLoading && (
              <div className="flex gap-2 justify-start items-end">
                <PipAvatar size={30} />
                <div className="bg-[#262422] border border-[#3A3631] rounded-2xl rounded-bl-md px-4 py-2.5 flex items-center gap-2 text-[#5C574F] text-sm">
                  <Loader2 size={13} /> {chatLoadingLabel}
                </div>
              </div>
            )}
            {chatError && <p className="text-xs text-[#C1443C]">{chatError}</p>}
            <div ref={chatEndRef} />
          </div>

          <div className="fixed left-0 right-0 z-30 p-4" style={{ bottom: "calc(72px + env(safe-area-inset-bottom))" }}>
            <div className="flex gap-2">
              {chatMessages.length > 0 && (
                <button onClick={() => { haptic(6); greetedRef.current = false; setChatMessages([]); }} aria-label="Neuer Chat"
                  className="glass shrink-0 w-12 h-12 rounded-full border border-white/10 text-[#A39C8F] shadow-lg flex items-center justify-center">
                  <Sparkles size={18} />
                </button>
              )}
              <input
                onFocus={handleFocusScroll}
                value={chatInput}
                onChange={(e) => setChatInput(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && sendChat()}
                placeholder="Schreib Pip…"
                disabled={chatLoading}
                className="glass flex-1 min-w-0 h-12 border border-white/10 rounded-full px-4 text-[#F2EDE4] text-base shadow-lg focus:outline-none disabled:opacity-60"
              />
              <button onClick={() => sendChat()} disabled={chatLoading || !chatInput.trim()}
                className="shrink-0 w-12 h-12 rounded-full bg-[conic-gradient(from_0deg,#ff5a96,#ffc850,#78dcff,#b482ff,#ff5a96)] disabled:opacity-40 text-[#F2EDE4] flex items-center justify-center">
                <ChevronRight size={20} />
              </button>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

function GameDetailModal({ game, games, plays, lists, onToggleList, onCreateList, onClose, onEdit, onViewOther, readOnlyLabel, hidePrices, onQuickUpdate }) {

  const gamePlays = plays.filter((p) => p.gameId === game.id);
  const lastPlay = [...gamePlays].sort((a, b) => (b.date || "").localeCompare(a.date || ""))[0];
  const label = complexityLabel(game);
  const labelTone = label ? TONE_HEX[COMPLEXITY_TONE[label]] : "#A39C8F";
  const images = (game.images && game.images.length) ? game.images : (game.image ? [game.image] : []);
  const tags = [...(game.categories || []), ...(game.mechanisms || [])];
  const [detailsOpen, setDetailsOpen] = useState(false);
  const [listPickerOpen, setListPickerOpen] = useState(false);
  const [accentColor, setAccentColor] = useState(() => fallbackAccentColor(game.id || game.name));
  useEffect(() => {
    let cancelled = false;
    if (images[0]) {
      extractDominantColor(images[0]).then((color) => { if (!cancelled) setAccentColor(color || fallbackAccentColor(game.id || game.name)); });
    } else {
      setAccentColor(fallbackAccentColor(game.id || game.name));
    }
    return () => { cancelled = true; };
  }, [images[0]]);
  const memberOfCount = lists ? lists.filter((l) => l.gameIds.includes(game.id)).length : 0;

  const StatBlock = ({ icon: Icon, value, sub, iconSize = 16 }) => (
    <div className="flex-1 p-3 text-center min-w-[70px] flex flex-col items-center">
      <div className="h-7 flex items-end justify-center mb-1">
        <Icon size={iconSize} className="text-[#F2EDE4]" />
      </div>
      <p className="text-sm font-medium text-[#F2EDE4]">{value}</p>
      <p className="text-[11px] text-[#A39C8F]">{sub}</p>

  return (
    <div className="fixed inset-0 z-[56] bg-[#1C1B1A]">
      <div className="w-full h-full max-w-3xl mx-auto flex flex-col overflow-hidden relative font-body">
        <button onClick={onClose} className="glass-icon-btn absolute left-4 z-20 w-10 h-10 flex items-center justify-center rounded-full border border-white/15 text-[#F2EDE4]" style={{ top: "max(1rem, env(safe-area-inset-top))" }} aria-label="Zurück"><ChevronLeft size={22} /></button>
        <div className="absolute right-4 z-20 flex items-center gap-2" style={{ top: "max(1rem, env(safe-area-inset-top))" }}>
          {lists && onToggleList && (
            <div className="relative">
              <button onClick={() => setListPickerOpen(true)} className="glass-icon-btn w-10 h-10 flex items-center justify-center rounded-full border border-white/15 text-[#F2EDE4]" aria-label="Zur Liste hinzufügen">
                <BookmarkPlus size={16} />
              </button>
              {memberOfCount > 0 && (
                <span className="glass absolute -top-1 -right-1 text-[9px] text-[#F2EDE4] w-4 h-4 rounded-full flex items-center justify-center font-semibold border border-white/25 pointer-events-none">{memberOfCount}</span>
              )}
            </div>
          )}
          {onEdit ? (
            <button onClick={onEdit} className="glass-icon-btn w-10 h-10 flex items-center justify-center rounded-full border border-white/15 text-[#F2EDE4]" aria-label="Bearbeiten"><Pencil size={16} /></button>
          ) : readOnlyLabel ? (
            <span className="glass text-[10px] text-[#F2EDE4] px-2 py-1 border border-white/15 rounded-full">{readOnlyLabel}</span>
          ) : null}
        </div>
        <div className="overflow-y-auto flex-1 p-5 space-y-5" style={{ paddingTop: "calc(max(1rem, env(safe-area-inset-top)) + 3rem)", backgroundImage: `linear-gradient(180deg, ${accentColor}35, transparent 220px)` }}>
          <div>
            {(() => {
              const hasGerman = game.germanName && game.germanName.trim() && game.germanName.trim() !== game.name.trim();
              const showGermanFirst = hasGerman && game.primaryTitle === "german";
              const primary = showGermanFirst ? game.germanName : game.name;
              const secondary = hasGerman ? (showGermanFirst ? game.name : game.germanName) : null;
              return (
                <>
                  <h1 className="font-display text-2xl text-[#F2EDE4] leading-tight">{primary}</h1>
                  {secondary && <p className="text-[#A39C8F] text-sm mt-0.5">{secondary}</p>}

            {(game.year || (game.publishers && game.publishers.length > 0)) && (
              <p className="text-[#5C574F] text-sm mt-0.5">
                {game.year}{game.year && game.publishers && game.publishers.length ? " · " : ""}{(game.publishers || []).join(", ")}

            {game.designers && game.designers.length > 0 && (
              <p className="text-[#5C574F] text-xs mt-0.5">Design: {game.designers.join(", ")}</p>
            )}
            {(() => {
              const baseGame = game.expansionOf ? (games || []).find((g) => g.id === game.expansionOf) : null;

              <StatBlock icon={COMPLEXITY_ICON[label] || Block} value={COMPLEXITY_SHORT[label] || label} sub={game.complexity ? `${parseFloat(game.complexity).toFixed(1)}/5` : ""} iconSize={26} />

            <StatBlock
              icon={game.status === "owned" ? Library : game.status === "wishlist" ? Heart : (gamePlays.every(p => p.mode === "bga") && gamePlays.length > 0 ? Globe : Dices)}
              value={game.status === "owned" ? "Besitz" : game.status === "wishlist" ? "Wunsch" : (() => {
                if (gamePlays.length === 0) return "Gespielt";

                const hasAnalog = gamePlays.some(p => p.mode !== "bga");
                if (hasOnline && hasAnalog) return "Gemischt";
                return hasOnline ? "Online" : "Analog";

              sub={game.status === "owned" && game.format === "digital" ? "Status · digital" : "Status"}

          {onQuickUpdate && game.status === "owned" && (
            <div>
              <button type="button" onClick={() => onQuickUpdate(game.id, { lentTo: game.lentTo ? "" : " " })}
                className={`w-full h-12 flex items-center justify-between text-left px-3.5 rounded-[14px] border ${game.lentTo ? "bg-[#D4A24C]/15 border-[#D4A24C]/40" : "bg-transparent border-[#3A3631]"}`}>
                <span className={`text-base flex items-center gap-2 ${game.lentTo ? "text-[#F2EDE4]" : "text-[#5C574F]"}`}>Verliehen</span>
                <div className={`w-10 h-6 rounded-full flex items-center px-0.5 transition-colors ${game.lentTo ? "bg-[#D4A24C] justify-end" : "bg-[#3A3631] justify-start"}`}>
                  <div className="w-5 h-5 rounded-full bg-[#F2EDE4]" />
                </div>
              </button>
              {game.lentTo && (
                <input value={game.lentTo.trim()} onChange={(e) => onQuickUpdate(game.id, { lentTo: e.target.value })} onFocus={handleFocusScroll} placeholder="An wen?"
                  className="w-full h-11 bg-[#262422] border border-[#3A3631] rounded-[14px] px-3.5 text-[#F2EDE4] text-base mt-2 focus:outline-none focus:border-[#D4A24C]" />
              )}
            </div>
          )}

          {game.summary && (
            <div>
              <p className="text-xs text-[#5C574F] uppercase tracking-wide mb-1">Zusammenfassung</p>
              <div className="rte-content text-base text-[#F2EDE4]" dangerouslySetInnerHTML={{ __html: game.summary }} />
            </div>

          {game.playerTypes && game.playerTypes.length > 0 && (

                    <p className="text-base text-[#F2EDE4]">{game.mechanismsNote}</p>

                  <div>
                    <p className="text-xs text-[#5C574F] uppercase tracking-wide mb-1.5">{game.saleStatus === "sold" ? "Verkauft" : "Zum Verkauf"}</p>

                      {game.purchasePrice && <span className="text-xs text-[#5C574F]">Kaufpreis: <span className="text-[#F2EDE4]">{game.purchasePrice} €</span></span>}
                      {game.saleStatus === "sold" && game.salePrice && <span className="text-xs text-[#5C574F]">Verkaufspreis: <span className="text-[#D4A24C]">{game.salePrice} €</span></span>}

                  </div>

          <div>
            <p className="text-xs text-[#5C574F] uppercase tracking-wide mb-1">Partien</p>
            {gamePlays.length === 0 ? (

            ) : (
              <p className="text-sm text-[#F2EDE4]">{gamePlays.length}× gespielt{lastPlay ? `, zuletzt am ${formatDate(lastPlay.date)}` : ""}</p>

        </div>
      </div>
      {listPickerOpen && lists && (
        <ListPickerModal
          lists={lists}
          gameId={game.id}
          onToggle={(listId) => onToggleList(listId, game.id)}
          onCreate={(name) => { const id = onCreateList(name); if (id) onToggleList(id, game.id); }}
          onClose={() => setListPickerOpen(false)}
        />
      )}
    </div>
  );
}

/* ---------------- MAIN APP ---------------- */
function App() {
  // Local persistence: this is the always-on baseline so data survives page
  // reloads even when no cloud sync is configured. Cloud sync (below, if a
  // syncUrl is set) layers on top of this — it overwrites these on pull and
  // pushes them up on change, but it is never the *only* place data lives.
  const [games, setGames] = useState(() => loadKey(GAMES_KEY, []));
  const [plays, setPlays] = useState(() => loadKey(PLAYS_KEY, []));
  const [customCategories, setCustomCategories] = useState(() => loadKey(CUSTOM_CATEGORIES_KEY, []));
  const [customMechanisms, setCustomMechanisms] = useState(() => loadKey(CUSTOM_MECHANISMS_KEY, []));
  const [customPlayerTypes, setCustomPlayerTypes] = useState(() => loadKey(CUSTOM_PLAYER_TYPES_KEY, []));
  const [customPlayerTypeDescriptions, setCustomPlayerTypeDescriptions] = useState(() => loadKey(CUSTOM_PLAYER_TYPE_DESCRIPTIONS_KEY, {}));
  const [settingsModalOpen, setSettingsModalOpen] = useState(false);
  const [commandBarOpen, setCommandBarOpen] = useState(false);
  const [demoMode, setDemoMode] = useState(false);
  // Guest mode: hand the phone to someone so they can pick a game to play.
  // Unlike demo mode, it shows the REAL collection — just read-only, and with
  // financial info (prices, sale status) hidden. Persisted across reloads on
  // purpose, so it doesn't accidentally fall back to full access.
  const [guestMode, setGuestMode] = useState(() => loadKey("spielregal:guestMode", false));
  useEffect(() => { saveKey("spielregal:guestMode", guestMode); }, [guestMode]);
  const readOnly = demoMode || guestMode;
  const [lists, setLists] = useState(() => loadKey(LISTS_KEY, []));
  const [players, setPlayersList] = useState(() => loadKey(PLAYERS_KEY, []));
  const [celebrate, setCelebrate] = useState(false);

  // Persist every core data slice to localStorage as soon as it changes —
  // independent of whether cloud sync is set up. This is what makes "add a
  // player", "log a play", etc. actually stick across reloads.
  useEffect(() => { saveKey(GAMES_KEY, games); }, [games]);
  useEffect(() => { saveKey(PLAYS_KEY, plays); }, [plays]);
  useEffect(() => { saveKey(LISTS_KEY, lists); }, [lists]);
  useEffect(() => { saveKey(PLAYERS_KEY, players); }, [players]);
  useEffect(() => { saveKey(CUSTOM_CATEGORIES_KEY, customCategories); }, [customCategories]);
  useEffect(() => { saveKey(CUSTOM_MECHANISMS_KEY, customMechanisms); }, [customMechanisms]);
  useEffect(() => { saveKey(CUSTOM_PLAYER_TYPES_KEY, customPlayerTypes); }, [customPlayerTypes]);
  useEffect(() => { saveKey(CUSTOM_PLAYER_TYPE_DESCRIPTIONS_KEY, customPlayerTypeDescriptions); }, [customPlayerTypeDescriptions]);

  // Whenever anything becomes focused — a text field, a textarea, or a dropdown/picker
  // button — make sure it's actually within the visible area (keyboard included).
  useEffect(() => {
    const onFocusIn = (e) => {
      const el = e.target;
      if (!el || typeof el.scrollIntoView !== "function") return;
      const tag = el.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "BUTTON" || tag === "SELECT" || el.isContentEditable) {
        setTimeout(() => { el.scrollIntoView({ block: "nearest", behavior: "smooth" }); }, 300);
      }
    };
    document.addEventListener("focusin", onFocusIn);
    return () => document.removeEventListener("focusin", onFocusIn);
  }, []);
  const [dashboardOrder, setDashboardOrder] = useState(() => {
    try { const saved = localStorage.getItem("spielregal:dashboardOrder"); return saved ? JSON.parse(saved) : DEFAULT_DASHBOARD_ORDER; }
    catch { return DEFAULT_DASHBOARD_ORDER; }
  });
  useEffect(() => { try { localStorage.setItem("spielregal:dashboardOrder", JSON.stringify(dashboardOrder)); } catch {} }, [dashboardOrder]);
  const [hiddenDashboardSections, setHiddenDashboardSections] = useState(() => {
    try { const saved = localStorage.getItem("spielregal:hiddenDashboardSections"); return saved ? JSON.parse(saved) : []; }
    catch { return []; }
  });
  useEffect(() => { try { localStorage.setItem("spielregal:hiddenDashboardSections", JSON.stringify(hiddenDashboardSections)); } catch {} }, [hiddenDashboardSections]);
  const moveDashboardSection = (key, dir) => {
    setDashboardOrder((prev) => {
      const arr = [...prev];
      const i = arr.indexOf(key);
      const j = i + dir;
      if (i < 0 || j < 0 || j >= arr.length) return prev;
      [arr[i], arr[j]] = [arr[j], arr[i]];
      return arr;
    });
  };
  const displayGames = demoMode ? DEMO_GAMES : games;
  const displayPlays = demoMode ? DEMO_PLAYS : plays;
  const displayLists = demoMode ? DEMO_LISTS : lists;
  // Unlike games/plays/lists, newly created players can't collide with or
  // pollute the curated demo set (fresh uid()s), so we layer them on top
  // instead of hiding them — otherwise "add a player" would silently never
  // work for anyone testing with demo mode on.
  const displayPlayers = demoMode ? [...DEMO_PLAYERS, ...players] : players;
  const [tab, setTab] = useState("dashboard");
  // Übersicht und Partien gibt's im Gästemodus nicht (keine Statistiken/Verlauf
  // für Gäste) — falls man genau dort steht, wenn der Modus aktiviert wird,
  // auf einen noch vorhandenen Tab ausweichen, statt eine leere/kaputte Seite zu zeigen.
  useEffect(() => {
    if (guestMode && (tab === "dashboard" || tab === "playlog")) setTab("collection");
  }, [guestMode]);
  const [titleCollapsed, setTitleCollapsed] = useState(false);
  const TAB_TITLES = { dashboard: "Spielregal", collection: "Sammlung", playlog: "Partien", recommendations: "Was spielen wir heute?", settings: "Mehr" };
  const [aiChatMessages, setAiChatMessages] = useState([]);
  const requestTabSwitch = (nextTab) => {
    haptic(6);
    setTab(nextTab);
    setTitleCollapsed(false);
    if (nextTab !== "collection") setQuickFilter(null);
  };
  const [gameModal, setGameModal] = useState(null);
  const [detailGame, setDetailGame] = useState(null);
  // detailGame only tracks WHICH game is open (by identity at the time it was
  // opened) — always re-resolve the actual data to display from the live
  // array, so edits made while the detail view is open (photo, rating,
  // Verliehen, etc.) show up immediately instead of needing a close/reopen.
  const liveDetailGame = detailGame ? (displayGames.find((g) => g.id === detailGame.id) || detailGame) : null;
  const [detailList, setDetailList] = useState(null);
  const [playModal, setPlayModal] = useState(null);
  const [quickFilter, setQuickFilter] = useState(null);
  const [syncUrl, setSyncUrl] = useState(() => localStorage.getItem(SYNC_URL_KEY) || "");
  const [apiKey, setApiKey] = useState(() => localStorage.getItem(AUTH_KEYS.apiKey) || "");
  const [aiWorkerUrl, setAiWorkerUrl] = useState(() => localStorage.getItem(AI_WORKER_URL_KEY) || "");
  const saveAiWorkerUrl = (url) => { const trimmed = url.trim(); localStorage.setItem(AI_WORKER_URL_KEY, trimmed); setAiWorkerUrl(trimmed); };
  const [authEmail, setAuthEmail] = useState(() => localStorage.getItem(AUTH_KEYS.email) || "");
  const [syncModalOpen, setSyncModalOpen] = useState(false);
  const [syncStatus, setSyncStatus] = useState("idle");
  const [lastSynced, setLastSynced] = useState(null);
  const categoryOptions = useMemo(() => {
    const merged = [...DEFAULT_CATEGORIES];
    customCategories.forEach((c) => { if (!merged.includes(c)) merged.push(c); });
    return merged;
  }, [customCategories]);
  const mechanismOptions = useMemo(() => {
    const merged = [...DEFAULT_MECHANISMS];
    customMechanisms.forEach((m) => { if (!merged.includes(m)) merged.push(m); });
    return merged;
  }, [customMechanisms]);
  const playerTypeOptions = useMemo(() => {
    const merged = [...DEFAULT_PLAYER_TYPES];
    customPlayerTypes.forEach((t) => { if (!merged.includes(t)) merged.push(t); });
    return merged;
  }, [customPlayerTypes]);
  const publisherOptions = useMemo(() => {
    const set = new Set();
    games.forEach((g) => (g.publishers || []).forEach((p) => set.add(p)));
    return Array.from(set).sort();
  }, [games]);
  const designerOptions = useMemo(() => {
    const set = new Set();
    games.forEach((g) => (g.designers || []).forEach((d) => set.add(d)));
    return Array.from(set).sort();
  }, [games]);
  const addCustomCategory = (name) => setCustomCategories((prev) => (prev.includes(name) || DEFAULT_CATEGORIES.includes(name) ? prev : [...prev, name]));
  const removeCustomCategory = (name) => setCustomCategories((prev) => prev.filter((c) => c !== name));
  const addCustomMechanism = (name) => setCustomMechanisms((prev) => (prev.includes(name) || DEFAULT_MECHANISMS.includes(name) ? prev : [...prev, name]));
  const removeCustomMechanism = (name) => setCustomMechanisms((prev) => prev.filter((m) => m !== name));
  const addCustomPlayerType = (name, description) => {
    setCustomPlayerTypes((prev) => (prev.includes(name) || DEFAULT_PLAYER_TYPES.includes(name) ? prev : [...prev, name]));
    if (description && description.trim()) {
      setCustomPlayerTypeDescriptions((prev) => ({ ...prev, [name]: description.trim() }));
    }
  };
  const removeCustomPlayerType = (name) => {
    setCustomPlayerTypes((prev) => prev.filter((t) => t !== name));
    setCustomPlayerTypeDescriptions((prev) => { const next = { ...prev }; delete next[name]; return next; });
  };
  const addList = (name) => {
    const list = { id: uid(), name, gameIds: [] };
    setLists((prev) => [...prev, list]);
    return list.id;
  };
  const removeList = (id) => setLists((prev) => prev.filter((l) => l.id !== id));
  const toggleGameInList = (listId, gameId) => {
    setLists((prev) => prev.map((l) => {
      if (l.id !== listId) return l;
      const has = l.gameIds.includes(gameId);
      return { ...l, gameIds: has ? l.gameIds.filter((id) => id !== gameId) : [...l.gameIds, gameId] };
    }));
  };
  const addPlayer = (name, photo, presetId) => {
    const p = { id: presetId || uid(), name, photo: photo || "" };
    setPlayersList((prev) => [...prev, p]);
    return p.id;
  };
  const updatePlayerPhoto = (id, photo) => setPlayersList((prev) => prev.map((p) => (p.id === id ? { ...p, photo } : p)));
  const updatePlayerName = (id, name) => setPlayersList((prev) => prev.map((p) => (p.id === id ? { ...p, name } : p)));
  const removePlayer = (id) => setPlayersList((prev) => prev.filter((p) => p.id !== id));
  const reorderPlayers = (orderedIds) => setPlayersList((prev) => orderedIds.map((id) => prev.find((p) => p.id === id)).filter(Boolean));
  const skipNextPush = React.useRef(true);
  const pushTimer = React.useRef(null);
  const scrollElRef = React.useRef(null);
  const touchStartY = React.useRef(0);
  const tracking = React.useRef(false);
  const [pullY, setPullY] = useState(0);
  const [refreshing, setRefreshing] = useState(false);
  const PULL_THRESHOLD = 70;

  const pullLatest = () => {
    setRefreshing(true);
    // Force a truly fresh load of the app itself (bypasses any stale cached version,
    // including the stubborn home-screen-icon cache) — safe because nothing is stored
    // locally; all data lives in Firebase and reloads automatically on next mount.
    const url = window.location.pathname + "?refresh=" + Date.now() + window.location.hash;
    window.location.href = url;
  };

  const onTouchStart = (e) => {
    if (scrollElRef.current && scrollElRef.current.scrollTop <= 0) {
      touchStartY.current = e.touches[0].clientY;
      tracking.current = true;
    }
  };
  const onTouchMove = (e) => {
    if (!tracking.current || refreshing) return;
    const delta = e.touches[0].clientY - touchStartY.current;
    if (delta > 0 && scrollElRef.current && scrollElRef.current.scrollTop <= 0) {
      setPullY(Math.min(delta * 0.5, 110));
    } else {
      tracking.current = false;
      setPullY(0);
    }
  };
  const onTouchEnd = () => {
    if (!tracking.current) return;
    tracking.current = false;
    if (pullY >= PULL_THRESHOLD) {
      setPullY(56);
      pullLatest();
    } else {
      setPullY(0);
    }
  };

  // On mount: if a cloud sync backend is configured, pull from it and let it
  // take over as the source of truth (overwriting whatever was loaded from
  // localStorage above). Without a syncUrl, the localStorage-loaded state
  // from above is simply what's used — no cloud round-trip needed.
  useEffect(() => {
    if (!syncUrl) return;
    setSyncStatus("syncing");
    cloudPull(syncUrl, apiKey).then((remote) => {
      setGames((remote && remote.games) || []);
      setPlays((remote && remote.plays) || []);
      setCustomCategories((remote && remote.customCategories) || []);
      setCustomMechanisms((remote && remote.customMechanisms) || []);
      setCustomPlayerTypes((remote && remote.customPlayerTypes) || []);
      setCustomPlayerTypeDescriptions((remote && remote.customPlayerTypeDescriptions) || {});
      setLists((remote && remote.lists) || []);
      setPlayersList((remote && remote.players) || []);
      setSyncStatus("synced");
      setLastSynced(Date.now());
      skipNextPush.current = true;
    }).catch(() => setSyncStatus("error"));
  }, []);

  // Write to Firebase (debounced) whenever games/plays/taxonomy change, on top
  // of the localStorage write above. Both always happen; cloud sync is an
  // optional extra layer for cross-device sync, not the only persistence.
  useEffect(() => {
    if (!syncUrl) return;
    if (skipNextPush.current) { skipNextPush.current = false; return; }
    if (pushTimer.current) clearTimeout(pushTimer.current);
    pushTimer.current = setTimeout(() => {
      setSyncStatus("syncing");
      cloudPush(syncUrl, { games, plays, customCategories, customMechanisms, customPlayerTypes, customPlayerTypeDescriptions, lists, players }, apiKey).then(() => {
        setSyncStatus("synced");
        setLastSynced(Date.now());
      }).catch(() => setSyncStatus("error"));
    }, 1200);
    return () => clearTimeout(pushTimer.current);
  }, [games, plays, customCategories, customMechanisms, customPlayerTypes, customPlayerTypeDescriptions, lists, players, syncUrl, apiKey]);

  const saveSyncUrl = (url, key, email, password) => {
    const trimmed = url.trim();
    const trimmedKey = (key || "").trim();
    const trimmedEmail = (email || "").trim();
    localStorage.setItem(SYNC_URL_KEY, trimmed);
    if (trimmedKey) localStorage.setItem(AUTH_KEYS.apiKey, trimmedKey);
    if (trimmedEmail) localStorage.setItem(AUTH_KEYS.email, trimmedEmail);
    if (password) localStorage.setItem(AUTH_KEYS.password, password);
    // Force a fresh sign-in with the (possibly new) credentials instead of reusing an old token.
    localStorage.removeItem(AUTH_KEYS.idToken);
    localStorage.removeItem(AUTH_KEYS.refreshToken);
    localStorage.removeItem(AUTH_KEYS.expiresAt);
    setSyncUrl(trimmed);
    setApiKey(trimmedKey);
    setAuthEmail(trimmedEmail);
    skipNextPush.current = true;
    setSyncStatus("syncing");
    cloudPull(trimmed, trimmedKey).then((remote) => {
      if (remote && (remote.games || remote.plays)) {
        setGames(remote.games || []);
        setPlays(remote.plays || []);
        setCustomCategories(remote.customCategories || []);
        setCustomMechanisms(remote.customMechanisms || []);
        setCustomPlayerTypes(remote.customPlayerTypes || []);
        setCustomPlayerTypeDescriptions(remote.customPlayerTypeDescriptions || {});
        setLists(remote.lists || []);
        setPlayersList(remote.players || []);
      } else {
        cloudPush(trimmed, { games, plays, customCategories, customMechanisms, customPlayerTypes, customPlayerTypeDescriptions, lists, players }, trimmedKey);
      }
      setSyncStatus("synced");
      setLastSynced(Date.now());
    }).catch(() => setSyncStatus("error"));
    setSyncModalOpen(false);
  };

  const syncNow = () => {
    if (!syncUrl) return;
    setSyncStatus("syncing");
    cloudPush(syncUrl, { games, plays, customCategories, customMechanisms, customPlayerTypes, customPlayerTypeDescriptions, lists, players }, apiKey).then(() => {
      setSyncStatus("synced");
      setLastSynced(Date.now());
    }).catch(() => setSyncStatus("error"));
  };

  const removeSync = () => {
    localStorage.removeItem(SYNC_URL_KEY);
    localStorage.removeItem(AUTH_KEYS.apiKey);
    localStorage.removeItem(AUTH_KEYS.email);
    localStorage.removeItem(AUTH_KEYS.password);
    localStorage.removeItem(AUTH_KEYS.idToken);
    localStorage.removeItem(AUTH_KEYS.refreshToken);
    localStorage.removeItem(AUTH_KEYS.expiresAt);
    setSyncUrl("");
    setApiKey("");
    setAuthEmail("");
    setSyncStatus("idle");
    setSyncModalOpen(false);
  };

  const applyGameSave = (game) => {
    setGames(prev => {
      const exists = prev.find(g => g.id === game.id);
      let next = exists ? prev.map(g => g.id === game.id ? game : g) : [...prev, game];
      // Resolve this game's own base-game link, if BGG told us it's an expansion.
      if (game.baseGameBggId) {
        const base = next.find(g => g.bggId && String(g.bggId) === String(game.baseGameBggId));
        if (base) next = next.map(g => g.id === game.id ? { ...g, baseGameId: base.id } : g);
      }
      // Resolve any OTHER games that turn out to be expansions of this one
      // (handles adding the base game after its expansions were already imported).
      next = next.map(g => (g.id !== game.id && g.baseGameBggId && String(g.baseGameBggId) === String(game.bggId)) ? { ...g, baseGameId: game.id } : g);
      return next;
    });
  };
  const saveGame = (game) => { applyGameSave(game); setGameModal(null); };
  const updateGameField = (id, patch) => setGames((prev) => prev.map((g) => (g.id === id ? { ...g, ...patch } : g)));
  const saveGameAndNavigate = (game, direction) => {
    applyGameSave(game);
    const list = displayGames;
    const idx = list.findIndex(g => g.id === game.id);
    if (idx === -1) { setGameModal(null); return; }
    const nextIdx = direction === "next" ? idx + 1 : idx - 1;
    if (nextIdx < 0 || nextIdx >= list.length) return; // stay put at the boundary
    setGameModal({ editing: list[nextIdx] });
  };
  const deleteGame = (id) => { setGames(prev => prev.filter(g => g.id !== id)); setGameModal(null); };
  const mergeGames = (keepId, dropId) => {
    if (keepId === dropId) return;
    setPlays(prev => prev.map(p => (p.gameId === dropId ? { ...p, gameId: keepId, gameName: games.find(g => g.id === keepId)?.name || p.gameName } : p)));
    setGames(prev => prev.filter(g => g.id !== dropId));
  };

  const [bggImportStatus, setBggImportStatus] = useState("idle"); // idle | importing | done | error
  const [bggImportResult, setBggImportResult] = useState(null);
  const [bggImportError, setBggImportError] = useState("");

  const importBggPlays = async (username) => {
    const name = (username || "").trim();
    if (!name) return;
    setBggImportStatus("importing");
    setBggImportError("");
    const newGames = [];
    const newPlays = [];
    const failures = [];
    let fetchIncomplete = false;
    let allPlays = [];
    try {
      try {
        allPlays = await bggFetchAllPlays(name);
        fetchIncomplete = !!allPlays.incomplete;
      } catch (e) {
        setBggImportError(e.message || "Import fehlgeschlagen");
        setBggImportStatus("error");
        return;
      }
      const existingBggPlayCounts = new Map();
      plays.forEach((p) => { if (p.bggPlayId) existingBggPlayCounts.set(p.bggPlayId, (existingBggPlayCounts.get(p.bggPlayId) || 0) + 1); });
      const bggIdToGame = new Map(games.filter((g) => g.bggId).map((g) => [String(g.bggId), g]));
      const nameToGame = new Map(games.map((g) => [g.name.toLowerCase(), g]));

      for (const p of allPlays) {
        try {
          const already = existingBggPlayCounts.get(p.bggPlayId) || 0;
          const needed = Math.max(0, (p.quantity || 1) - already);
          if (needed === 0) continue;
          let game = p.objectid ? bggIdToGame.get(String(p.objectid)) : null;
          if (!game && p.itemName) {
            const norm = (s) => s.toLowerCase().replace(/\s*\([^)]*\)\s*/g, "").replace(/[^a-z0-9]+/g, " ").trim();
            const wanted = norm(p.itemName);
            game = nameToGame.get(p.itemName.toLowerCase())
              || games.find((g) => norm(g.name) === wanted || norm(g.name).includes(wanted) || wanted.includes(norm(g.name)));
          }
          if (!game) {
            let details = {};
            if (p.objectid) {
              try { details = await bggThing(p.objectid); await new Promise((r) => setTimeout(r, 1200)); } catch { /* best effort — fall back to bare name below */ }
            }
            game = {
              id: uid(), bggId: p.objectid || "", name: details.name || p.itemName || "Unbekanntes Spiel", year: details.year || "",
              publishers: details.publishers || [], designers: details.designers || [], images: details.images || [],
              minPlayers: details.minPlayers || "", maxPlayers: details.maxPlayers || "", bestPlayersMin: "", bestPlayersMax: "",
              minTime: details.minTime || "", maxTime: details.maxTime || "", age: details.age || "",
              complexity: details.complexity || "", mechanisms: details.mechanisms || [], categories: details.categories || [],
              playerTypes: [], status: "none", location: "", summary: details.summary || "", notes: "", rating: "",
              addedDate: new Date().toISOString().slice(0, 10),
            };
            newGames.push(game);
            if (p.objectid) bggIdToGame.set(String(p.objectid), game);
            nameToGame.set(game.name.toLowerCase(), game);
          }
          const winner = p.players.find((pl) => pl.win);
          for (let i = 0; i < needed; i++) {
            newPlays.push({
              id: uid(), gameId: game.id, gameName: game.name, date: p.date || "", mode: "physical-owned",
              players: p.players.map((pl) => pl.name).filter(Boolean).join(", "), playerIds: [],
              winner: winner ? winner.name : "", notes: p.comments || "", images: [], bggPlayId: p.bggPlayId,
            });
          }
        } catch (err) { failures.push(`${p.itemName || "?"} (${p.date || "?"}): ${err.message || err}`); }
      }

      if (newGames.length) setGames((prev) => [...prev, ...newGames]);
      if (newPlays.length) setPlays((prev) => [...prev, ...newPlays]);
      setBggImportResult({ playsImported: newPlays.length, gamesAdded: newGames.length, totalFound: allPlays.length, incomplete: fetchIncomplete, failures });
      setBggImportStatus("done");
    } catch (e) {
      // Even here, save whatever we managed to gather before the unexpected failure.
      if (newGames.length) setGames((prev) => [...prev, ...newGames]);
      if (newPlays.length) setPlays((prev) => [...prev, ...newPlays]);
      setBggImportResult({ playsImported: newPlays.length, gamesAdded: newGames.length, totalFound: allPlays.length || newPlays.length, incomplete: true, failures });
      setBggImportError(e.message || "Import teilweise fehlgeschlagen — bereits gefundene Partien wurden trotzdem gespeichert.");
      setBggImportStatus(newPlays.length ? "done" : "error");
    }
  };
  const addToWishlistFromRecommendation = (rec) => {
    setGames(prev => {
      if (rec.id && prev.some(g => g.id === rec.id)) {
        return prev.map(g => g.id === rec.id ? { ...g, status: "wishlist" } : g);
      }
      return [...prev, {
        id: uid(), bggId: rec.bggId || "", name: rec.name, year: rec.year || "",
        publishers: rec.publishers || [], designers: rec.designers || [], images: rec.images || [],
        minPlayers: rec.minPlayers || "", maxPlayers: rec.maxPlayers || "", bestPlayersMin: "", bestPlayersMax: "",
        minTime: rec.minTime || "", maxTime: rec.maxTime || "", age: rec.age || "",
        complexity: rec.complexity || "", mechanisms: rec.mechanisms || [], categories: rec.categories || [],
        playerTypes: [], summary: rec.summary || "",
        status: "wishlist", location: "", notes: "", rating: "", addedDate: new Date().toISOString().slice(0, 10),
      }];
    });
  };
  const savePlay = (playOrPlays) => {
    const list = Array.isArray(playOrPlays) ? playOrPlays : [playOrPlays];
    setPlays(prev => {
      const isNew = !prev.find(p => p.id === list[0].id);
      if (isNew) { haptic([10, 40, 10]); setCelebrate(true); playChime(); setTimeout(() => setCelebrate(false), 1600); }
      const ids = new Set(list.map(p => p.id));
      return [...prev.filter(p => !ids.has(p.id)), ...list];
    });
    setPlayModal(null);
  };
  const deletePlay = (id) => { setPlays(prev => prev.filter(p => p.id !== id)); setPlayModal(null); };

  const tabs = guestMode
    ? [
        { id: "collection", label: "Sammlung", icon: Library },
        { id: "recommendations", label: "Ideen", icon: Sparkles },
        { id: "settings", label: "Mehr", icon: Settings },
      ]
    : [
        { id: "dashboard", label: "Übersicht", icon: Home },
        { id: "collection", label: "Sammlung", icon: Library },
        { id: "playlog", label: "Partien", icon: ListChecks },
        { id: "recommendations", label: "Ideen", icon: Sparkles },
        { id: "settings", label: "Mehr", icon: Settings },
      ];

  return (
    <div className="fixed inset-0 font-body flex flex-col max-w-3xl mx-auto overflow-hidden" style={{ backgroundColor: "transparent" }}>
      <svg width="0" height="0" style={{ position: "absolute" }} aria-hidden="true">
        <defs>
          <filter id="glass-distort" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="7" result="noise" />
            <feGaussianBlur in="noise" stdDeviation="2" result="blurredNoise" />
            <feDisplacementMap in="SourceGraphic" in2="blurredNoise" scale="18" xChannelSelector="R" yChannelSelector="G" />
          </filter>
        </defs>
      </svg>
      <div
        className="shrink-0 glass-strong border-b border-white/10 flex items-center justify-center overflow-hidden"
        style={{
          paddingTop: "max(0.75rem, env(safe-area-inset-top))",
          height: titleCollapsed && tab !== "dashboard" && tab !== "collection" && tab !== "playlog" ? "calc(2.75rem + max(0.75rem, env(safe-area-inset-top)))" : "max(0.75rem, env(safe-area-inset-top))",
          opacity: titleCollapsed && tab !== "dashboard" && tab !== "collection" && tab !== "playlog" ? 1 : 0,
          transition: "height 0.25s ease, opacity 0.2s ease",
        }}
      >
        <p className="font-display text-base text-[#F2EDE4] truncate px-4">{TAB_TITLES[tab]}</p>
      </div>
      {demoMode && (
        <div className="shrink-0 mx-4 mb-2 px-3.5 py-2 bg-[#E85D9C]/15 border border-[#E85D9C]/30 rounded-[14px] flex items-center justify-between gap-2">
          <span className="text-xs text-[#E85D9C] font-medium">Demo-Vorschau — wird nicht gespeichert</span>
          <button onClick={() => setDemoMode(false)} className="text-xs text-[#E85D9C] underline shrink-0">Beenden</button>
        </div>
      )}
      <div
        ref={scrollElRef}
        className="flex-1 overflow-y-auto min-h-0 relative"
        onScroll={(e) => setTitleCollapsed(e.currentTarget.scrollTop > 36)}
        onTouchStart={onTouchStart}
        onTouchMove={onTouchMove}
        onTouchEnd={onTouchEnd}
      >
        <div
          className="flex items-center justify-center overflow-hidden transition-[height] duration-200"
          style={{ height: pullY }}
        >
          <Loader2
            size={20}
            className={refreshing ? "text-[#E85D9C]" : "text-[#5C574F]"}
            style={{ opacity: Math.min(pullY / PULL_THRESHOLD, 1) }}
          />
        </div>
        <div key={tab} className="tab-fade">
          {tab === "dashboard" && <Dashboard games={displayGames} plays={displayPlays} onQuickFilter={(fn) => { setQuickFilter(() => fn); setTab("collection"); }} onView={(g) => setDetailGame(g)} sectionOrder={dashboardOrder} onReorder={setDashboardOrder} hiddenSections={hiddenDashboardSections} onToggleHidden={setHiddenDashboardSections} onSearch={() => setCommandBarOpen(true)} aiWorkerUrl={aiWorkerUrl} />}
          {tab === "collection" && <Collection games={displayGames} plays={displayPlays} filterFn={quickFilter} clearFilter={() => setQuickFilter(null)} onAdd={() => !readOnly && setGameModal({ editing: null })} onView={(g) => setDetailGame(g)} onEdit={(g) => setGameModal({ editing: g })} onDelete={(g) => deleteGame(g.id)} categoryOptions={categoryOptions} mechanismOptions={mechanismOptions} demoMode={readOnly} guestMode={guestMode} lists={displayLists} onCreateList={(name) => !readOnly && addList(name)} onOpenList={(l) => setDetailList(l)} />}
          {tab === "playlog" && <PlayLog plays={displayPlays} games={displayGames} onAdd={() => !readOnly && setPlayModal({ editing: null })} onEdit={(p) => !readOnly && setPlayModal({ editing: p })} onDelete={deletePlay} demoMode={readOnly} playerProfiles={displayPlayers} />}
          {tab === "recommendations" && <Recommendations games={displayGames} plays={displayPlays} onView={(g) => setDetailGame(g)} aiWorkerUrl={aiWorkerUrl} chatMessages={aiChatMessages} setChatMessages={setAiChatMessages} onAddWishlist={addToWishlistFromRecommendation} onSaveMechanismsNote={readOnly ? null : (id, text) => updateGameField(id, { mechanismsNote: text })} guestMode={guestMode} />}
          {tab === "settings" && (guestMode ? (
            <div className="p-5 min-h-full flex flex-col items-center justify-center text-center">
              <Eye size={40} className="text-[#5C574F] mb-4" />
              <h1 className="font-display text-2xl text-[#F2EDE4] mb-1.5">Gästemodus aktiv</h1>
              <p className="text-sm text-[#A39C8F] max-w-xs mb-6">Preise, Bearbeiten und Einstellungen sind ausgeblendet. Zum Spiele-Aussuchen reicht das aber allemal.</p>
              <button onClick={() => setGuestMode(false)} className="h-12 px-6 bg-[conic-gradient(from_0deg,#ff5a96,#ffc850,#78dcff,#b482ff,#ff5a96)] text-[#F2EDE4] rounded-[14px] font-medium">
                Gästemodus beenden
              </button>
            </div>
          ) : (
            <SettingsPage
              customCategories={customCategories}
              customMechanisms={customMechanisms}
              customPlayerTypes={customPlayerTypes}
              onAddCategory={addCustomCategory}
              onRemoveCategory={removeCustomCategory}
              onAddMechanism={addCustomMechanism}
              onRemoveMechanism={removeCustomMechanism}
              onAddPlayerType={addCustomPlayerType}
              onRemovePlayerType={removeCustomPlayerType}
              demoMode={demoMode}
              onToggleDemo={() => setDemoMode((d) => !d)}
              guestMode={guestMode}
              onToggleGuest={() => setGuestMode((g) => !g)}
              syncUrl={syncUrl}
              syncStatus={syncStatus}
              onOpenSync={() => setSyncModalOpen(true)}
              bggImportStatus={bggImportStatus}
              bggImportResult={bggImportResult}
              bggImportError={bggImportError}
              onImportBggPlays={importBggPlays}
              games={games}
              plays={plays}
              onMergeGames={mergeGames}
              aiWorkerUrl={aiWorkerUrl}
              onSaveAiWorkerUrl={saveAiWorkerUrl}
            />
          ))}
        </div>
      </div>
      <div className="absolute bottom-0 left-0 right-0 px-4 z-40 pointer-events-none" style={{ paddingBottom: "max(1rem, env(safe-area-inset-bottom))" }}>
        <div className="relative rounded-full px-1.5 py-1.5 overflow-hidden pointer-events-auto" style={{
          background: "rgba(24,22,21,0.18)",
          backdropFilter: "blur(8px) saturate(160%)",
          WebkitBackdropFilter: "blur(8px) saturate(160%)",
          boxShadow: "inset 0 1px 1px rgba(255,255,255,0.22), inset 0 -1px 1px rgba(255,255,255,0.05), 0 8px 28px rgba(0,0,0,0.45)",
        }}>
          <div className="relative grid" style={{ gridTemplateColumns: `repeat(${tabs.length}, 1fr)` }}>
            <div
              className="tab-sheen absolute rounded-full"
              style={{
                left: `calc(${tabs.findIndex((t) => t.id === tab)} * (100% / ${tabs.length}))`,
                width: `calc(100% / ${tabs.length})`,
                top: 0, bottom: 0,
                transition: "left 0.45s cubic-bezier(0.34, 1.56, 0.64, 1)",
                background: "rgba(255,255,255,0.12)",
              }}
            />
            {tabs.map(t => (
              <button
                key={t.id}
                onClick={() => requestTabSwitch(t.id)}
                className="relative flex flex-col items-center justify-center gap-1 py-1.5 rounded-full"
              >
                <t.icon size={19} className={`relative transition-colors duration-300 ${tab === t.id ? "text-white" : "text-[#A39C8F]"}`} strokeWidth={1.5} />
                <span className={`relative text-[9px] font-body leading-none whitespace-nowrap transition-colors duration-300 ${tab === t.id ? "text-white font-semibold" : "text-[#A39C8F]"}`}>{t.label}</span>
              </button>
            ))}
          </div>
        </div>
      </div>
      {detailGame && (
        <GameDetailModal
          game={liveDetailGame}
          games={displayGames}
          plays={displayPlays}
          lists={readOnly ? null : displayLists}
          onToggleList={readOnly ? null : toggleGameInList}
          onCreateList={readOnly ? null : addList}
          onClose={() => setDetailGame(null)}
          onEdit={readOnly ? null : () => { setGameModal({ editing: liveDetailGame }); setDetailGame(null); }}
          onViewOther={(g) => setDetailGame(g)}
          readOnlyLabel={demoMode ? "Demo" : guestMode ? "Gast" : null}
          hidePrices={guestMode}
          onQuickUpdate={readOnly ? null : updateGameField}
        />
      )}
      {detailList && (
        <ListDetailModal
          list={displayLists.find((l) => l.id === detailList.id) || detailList}
          games={displayGames}
          plays={displayPlays}
          demoMode={readOnly}
          guestMode={guestMode}
          onClose={() => setDetailList(null)}
          onView={(g) => setDetailGame(g)}
          onEdit={(g) => setGameModal({ editing: g })}
          onDeleteList={removeList}
          onToggleGame={toggleGameInList}
          aiWorkerUrl={aiWorkerUrl}
        />
      )}
      {gameModal && (
        <GameFormModal
          key={gameModal.editing ? gameModal.editing.id : "new"}
          initial={gameModal.editing}
          categoryOptions={categoryOptions}
          mechanismOptions={mechanismOptions}
          publisherOptions={publisherOptions}
          playerTypeOptions={playerTypeOptions}
          designerOptions={designerOptions}
          customPlayerTypeDescriptions={customPlayerTypeDescriptions}
          onAddCategory={addCustomCategory}
          onAddMechanism={addCustomMechanism}
          onAddPlayerType={addCustomPlayerType}
          onClose={() => setGameModal(null)}
          onSave={saveGame}
          onDelete={deleteGame}
          aiWorkerUrl={aiWorkerUrl}
          games={games}
          onSaveAndNavigate={gameModal.editing ? saveGameAndNavigate : null}
          hasPrev={gameModal.editing ? displayGames.findIndex(g => g.id === gameModal.editing.id) > 0 : false}
          hasNext={gameModal.editing ? displayGames.findIndex(g => g.id === gameModal.editing.id) < displayGames.length - 1 : false}
          onUpdateOtherGame={updateGameField}
        />
      )}
      {playModal && <PlayFormModal games={games} plays={plays} playerProfiles={displayPlayers} onAddPlayer={addPlayer} onUpdatePlayerPhoto={updatePlayerPhoto} onUpdatePlayerName={updatePlayerName} onRemovePlayer={removePlayer} onReorderPlayers={reorderPlayers} initial={playModal.editing} onClose={() => setPlayModal(null)} onSave={savePlay} onDelete={deletePlay} />}
      {syncModalOpen && (
        <SyncModal
          initialUrl={syncUrl}
          initialApiKey={apiKey}
          initialEmail={authEmail}
          status={syncStatus}
          lastSynced={lastSynced}
          onClose={() => setSyncModalOpen(false)}
          onSave={saveSyncUrl}
          onSyncNow={syncNow}
          onRemove={removeSync}
        />
      )}

      {commandBarOpen && (
        <CommandBarModal
          games={displayGames}
          plays={displayPlays}
          lists={displayLists}
          onClose={() => setCommandBarOpen(false)}
          onOpenGame={(g) => { setDetailGame(g); setCommandBarOpen(false); }}
          onOpenList={(l) => { setDetailList(l); setCommandBarOpen(false); }}
          onGoToPlaylog={() => { setTab("playlog"); setCommandBarOpen(false); }}
        />
      )}
      <Confetti active={celebrate} />
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  render() {
    if (this.state.error) {
      return (
        <div className="min-h-screen bg-[#1C1B1A] flex items-center justify-center p-6">
          <div className="max-w-sm text-center">
            <Dices size={32} className="text-[#C1443C] mx-auto mb-3" />
            <p className="text-[#F2EDE4] font-display text-xl mb-2">Kurz gestolpert</p>
            <p className="text-[#A39C8F] text-sm mb-5">Hier ist etwas schiefgelaufen. Deine Daten in Firebase sind davon nicht betroffen.</p>
            <button onClick={() => this.setState({ error: null })} className="w-full h-12 bg-[conic-gradient(from_0deg,#ff5a96,#ffc850,#78dcff,#b482ff,#ff5a96)] text-[#F2EDE4] rounded-[14px] font-medium mb-2">Nochmal versuchen</button>
            <button onClick={() => window.location.reload()} className="w-full h-12 bg-[#262422] border border-[#3A3631] text-[#F2EDE4] rounded-[14px] font-medium">App neu laden</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
