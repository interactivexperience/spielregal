<style>
  html, body {
    height: 100%;
    background-color: #1C1B1A;
    background-image: radial-gradient(circle at 85% 0%, rgba(108,127,224,0.10), transparent 45%), radial-gradient(circle at 0% 55%, rgba(212,162,76,0.06), transparent 40%);
    background-repeat: no-repeat;
    margin:0; overscroll-behavior:none;
  }
  .glass {
    background: rgba(38, 36, 34, 0.55);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    position: relative;
  }
  .glass::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(180deg, rgba(255,255,255,0.28), rgba(255,255,255,0.04) 40%, rgba(255,255,255,0) 70%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }
  .glass-icon-btn {
    background: rgba(20, 19, 18, 0.16);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    position: relative;
  }
  .glass-icon-btn::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0.04) 45%, rgba(255,255,255,0) 75%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }
  .tab-sheen {
    position: relative;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
  }
  @supports (backdrop-filter: url(#glass-distort)) {
    .tab-sheen {
      backdrop-filter: url(#glass-distort) blur(2px) saturate(160%);
      -webkit-backdrop-filter: url(#glass-distort) blur(2px) saturate(160%);
    }
  }
  .glass-strong {
    background: rgba(28, 27, 26, 0.72);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
  }
  button { transition: transform 0.15s cubic-bezier(0.34, 1.2, 0.64, 1), opacity 0.15s ease, background-color 0.2s ease, border-color 0.2s ease; }
  button:active { transform: scale(0.96); }
  button { position: relative; isolation: isolate; overflow: hidden; }
  button::after {
    content: "";
    position: absolute; top: 50%; left: 50%;
    width: 220%; height: 220%;
    transform: translate(-50%, -50%) scale(0);
    border-radius: 50%;
    background: conic-gradient(from 0deg, #ff5a96, #ffc850, #78dcff, #b482ff, #ff5a96);
    opacity: 0;
    pointer-events: none;
    z-index: 5;
  }
  button:active::after { animation: rainbow-ripple 0.5s ease-out; }
  button.no-ripple::after { content: none; }
  button.no-ripple:active { background: rgba(255,255,255,0.05); }
  @keyframes rainbow-ripple {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 0.5; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); opacity: 0.85; }
    50% { transform: translateY(-5px); opacity: 1; }
  }
  .save-pop { animation: savePop 0.38s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes savePop {
    0% { transform: scale(1); }
    35% { transform: scale(0.9); }
    65% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }
  .save-ring {
    position: absolute; top: 50%; left: 50%; width: 40px; height: 40px;
    border: 2px solid #F2EDE4; border-radius: 50%;
    transform: translate(-50%, -50%) scale(0.3);
    opacity: 0.8;
    animation: saveRing 0.5s ease-out forwards;
    pointer-events: none;
  }
  @keyframes saveRing {
    0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0.8; }
    100% { transform: translate(-50%, -50%) scale(2.6); opacity: 0; }
  }
  .font-display { font-family:'Bricolage Grotesque', sans-serif; font-optical-sizing:auto; font-weight: 700; letter-spacing: -0.01em; }
  .font-body { font-family:'Inter', sans-serif; }
  .font-mono { font-family:'IBM Plex Mono', monospace; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:#3A3631; border-radius:4px; }
  @keyframes riseIn { from{opacity:0; transform:translateY(24px);} to{opacity:1; transform:translateY(0);} }
  .rise-in { animation: riseIn .38s cubic-bezier(0.32, 0.72, 0, 1); }
  @keyframes sheetOut { from{opacity:1; transform:translateY(0);} to{opacity:0; transform:translateY(24px);} }
  .sheet-out { animation: sheetOut .22s cubic-bezier(0.32, 0.72, 0, 1) forwards; }
  @keyframes backdropFadeIn { from { opacity: 0; } to { opacity: 1; } }
  .backdrop-fade { animation: backdropFadeIn .25s ease-out; }
  @keyframes backdropFadeOut { from { opacity: 1; } to { opacity: 0; } }
  .backdrop-fade-out { animation: backdropFadeOut .22s ease-out forwards; }
  @keyframes tabFade { from { opacity:0; transform:translateY(8px) scale(0.99); } to { opacity:1; transform:translateY(0) scale(1); } }
  .tab-fade { animation: tabFade .32s cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes confettiFall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(360deg); opacity: 0; } }
  .spin { animation: spin 1s linear infinite; }
  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; padding:24px; text-align:center; color:#F2EDE4; font-family:'Inter',sans-serif; }
  input, textarea, select { font-size: 16px !important; }
  input::placeholder, textarea::placeholder { color: #5C574F !important; opacity: 1 !important; -webkit-text-fill-color: #5C574F !important; }
  .rte-content:empty:before { content: attr(data-placeholder); color: #5C574F; }
  input:focus-visible, textarea:focus-visible, button:focus-visible, [contenteditable]:focus-visible { outline: 2px solid #6C7FE0; outline-offset: 2px; }
  .rte-content h2 { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 1.25rem; margin: 0.4em 0 0.2em; }
  .rte-content h3 { font-family: 'Inter', sans-serif; font-size: 0.95rem; font-weight: 600; color: #A39C8F; margin: 0.4em 0 0.2em; }
  .rte-content ul { list-style: disc; padding-left: 1.4em; margin: 0.3em 0; }
  .rte-content p { margin: 0.3em 0; }
</style>

<body>
<div id="root"><div id="loading">
  <div style="color:#E85D9C;">Lädt…</div>
  <div id="load-hint" style="display:none; color:#A39C8F; font-size:14px; max-width:320px;">
    Das dauert normalerweise nur eine Sekunde. Falls hier nichts weiter passiert: diese App lädt React beim Öffnen einmalig aus dem Internet – bitte prüfe, ob dein iPad gerade online ist, und lade die Seite neu (nach unten ziehen).
  </div>
</div></div>
<script>
  setTimeout(function () {
    var hint = document.getElementById("load-hint");
    var root = document.getElementById("root");
    if (hint && root && root.textContent.indexOf("Lädt") !== -1) {
      hint.style.display = "block";
    }
  }, 4000);

  function setAppHeight() {
    var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    var offsetTop = (window.visualViewport && window.visualViewport.offsetTop) || 0;
    document.documentElement.style.setProperty("--app-height", h + "px");
    document.documentElement.style.setProperty("--app-offset-top", offsetTop + "px");
  }
  setAppHeight();
  window.addEventListener("resize", setAppHeight);
  window.addEventListener("orientationchange", setAppHeight);
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", setAppHeight);
    window.visualViewport.addEventListener("scroll", setAppHeight);
  }
</script>

function formatDate(iso) {
  if (!iso) return "";
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
  if (!m) return iso;
  return `${m[3]}.${m[2]}.${m[1]}`;
}
// A play's `winner` field holds one or more winner names, comma-separated
// (multiple winners = tie). This is the single source of truth for reading it.
function winnersOf(play) {
  return (play && play.winner ? play.winner : "").split(",").map((n) => n.trim()).filter(Boolean);
}
// Search should find a game by either its original or its German title —
// people search for whichever one they remember.
function gameMatchesQuery(g, q) {
  const query = (q || "").trim().toLowerCase();
  if (!query) return true;
  return g.name.toLowerCase().includes(query) || (g.germanName && g.germanName.toLowerCase().includes(query));
}
// For result lists: show both titles together when both exist and differ, so
// it's clear which game matched — e.g. "Vogelflug (Flügelschlag)".
function gameSearchLabel(g) {
  if (g.germanName && g.germanName.trim() && g.germanName.trim() !== g.name.trim()) {
    return `${g.name} (${g.germanName.trim()})`;
  }
  return g.name;
}
function complexityStepTone(v) {
  if (v < 2) return "#4E8C82"; // Familienspiel

}
function ComplexityPicker({ value, onChange }) {

          <button
            key={n}

            className="p-0.5"
            aria-label={`${n} von 5`}

        </p>
      )}
    </div>
  );
}

// Delays a sheet's actual unmount until its exit animation finishes, instead of
// vanishing instantly. Usage: const { closing, requestClose } = useSheetClose(onClose);
// then use requestClose in place of onClose, and add `closing ? "sheet-out" : "rise-in"`
// (and "backdrop-fade-out" on the backdrop) to the relevant className.
function useSheetClose(onClose) {
  const [closing, setClosing] = useState(false);
  const requestClose = () => {
    setClosing(true);
    setTimeout(() => { onClose(); setClosing(false); }, 210);
  };
  return { closing, requestClose };
}
// Recognizes a swipe starting from the left screen edge and moving right —
// the standard iOS "back" gesture. Spread the returned handlers onto the
// outermost element of a page/sub-view.
function useEdgeSwipeBack(onBack) {
  const startX = React.useRef(null);
  const onTouchStart = (e) => {
    startX.current = e.touches[0].clientX < 24 ? e.touches[0].clientX : null;
  };
  const onTouchEnd = (e) => {
    if (startX.current !== null && e.changedTouches[0].clientX - startX.current > 60) onBack();
    startX.current = null;
  };
  return { onTouchStart, onTouchEnd };
}

// A short, cheerful three-note chime synthesized on the fly — no audio files needed.
function playChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    [523.25, 659.25, 783.99].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, now + i * 0.08);
      gain.gain.linearRampToValueAtTime(0.15, now + i * 0.08 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.4);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + i * 0.08);
      osc.stop(now + i * 0.08 + 0.42);
    });
  } catch {}
}

function Confetti({ active }) {
  if (!active) return null;
  const colors = ["#E85D9C", "#E85D9C", "#4E8C82", "#C1443C", "#F2EDE4"];
  const pieces = Array.from({ length: 26 }, (_, i) => ({
    left: 8 + Math.random() * 84,
    delay: Math.random() * 0.25,
    duration: 1.1 + Math.random() * 0.7,
    color: colors[i % colors.length],
    size: 6 + Math.random() * 6,
    rotate: Math.random() * 360,
  }));
  return (
    <div className="fixed inset-0 z-[95] pointer-events-none overflow-hidden">
      {pieces.map((p, i) => (
        <div key={i} style={{
          position: "absolute", left: p.left + "%", top: "-20px",
          width: p.size, height: p.size * 1.6, background: p.color, borderRadius: 2,
          animation: `confettiFall ${p.duration}s ease-in ${p.delay}s forwards`,
          transform: `rotate(${p.rotate}deg)`,
        }} />
      ))}
    </div>
  );
}

// Samples a cover image to find a representative accent color. Falls back silently
// (resolves null) on any failure — e.g. cross-origin images without CORS headers.
function extractDominantColor(src) {
  return new Promise((resolve) => {
    if (!src) { resolve(null); return; }
    try {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => {
        try {
          const size = 24;
          const canvas = document.createElement("canvas");
          canvas.width = size; canvas.height = size;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, size, size);
          const data = ctx.getImageData(0, 0, size, size).data;
          let r = 0, g = 0, b = 0, count = 0;
          for (let i = 0; i < data.length; i += 4) {
            if (data[i + 3] < 200) continue;
            const rr = data[i], gg = data[i + 1], bb = data[i + 2];
            const max = Math.max(rr, gg, bb), min = Math.min(rr, gg, bb);
            if (max > 235 && min > 210) continue; // skip near-white
            if (max < 30) continue; // skip near-black
            r += rr; g += gg; b += bb; count++;
          }
          if (count === 0) { resolve(null); return; }
          r = Math.round(r / count); g = Math.round(g / count); b = Math.round(b / count);
          resolve("#" + [r, g, b].map((x) => x.toString(16).padStart(2, "0")).join(""));
        } catch { resolve(null); }
      };
      img.onerror = () => resolve(null);
      img.src = src;
    } catch { resolve(null); }
  });
}

// Deterministic per-game fallback accent (used when we can't read the cover's
// pixels — e.g. a cross-origin BGG image without CORS headers) so different
// games at least get different accent colors instead of one fixed default.
const ACCENT_FALLBACK_PALETTE = ["#E85D9C", "#8B9AFA", "#4E8C82", "#D4A24C", "#C1443C", "#6C7FE0", "#7FB3AA", "#B482FF", "#4FA8D8", "#E0975A"];
function fallbackAccentColor(seed) {
  const s = String(seed || "");
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return ACCENT_FALLBACK_PALETTE[h % ACCENT_FALLBACK_PALETTE.length];
}

// Shared cache so the same cover image isn't re-analyzed every time it shows up
// across different Dashboard sections (Top 10, Best of, Wishlist, etc).
const dominantColorCache = new Map();
function useDominantColor(src) {
  const [color, setColor] = useState(() => (src && dominantColorCache.has(src) ? dominantColorCache.get(src) : null));
  useEffect(() => {
    if (!src) { setColor(null); return; }
    if (dominantColorCache.has(src)) { setColor(dominantColorCache.get(src)); return; }
    let cancelled = false;
    extractDominantColor(src).then((c) => {
      if (c) dominantColorCache.set(src, c);
      if (!cancelled) setColor(c);
    });
    return () => { cancelled = true; };
  }, [src]);
  return color;
}

function TopTenCarousel({ games, onView }) {
  const [index, setIndex] = useState(0);
  const touchStartX = React.useRef(0);
  const safeIndex = Math.min(index, games.length - 1);
  const current = games[safeIndex];

  const onTouchStart = (e) => { touchStartX.current = e.touches[0].clientX; };
  const onTouchEnd = (e) => {
    const delta = e.changedTouches[0].clientX - touchStartX.current;
    if (delta < -40 && safeIndex < games.length - 1) setIndex(safeIndex + 1);
    else if (delta > 40 && safeIndex > 0) setIndex(safeIndex - 1);
  };

  return (
    <div className="flex flex-col items-center pt-1">
      <div className="relative w-full flex justify-center">
        <div className="relative" style={{ width: "min(280px, 62vw)", height: "min(280px, 62vw)" }} onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
          {[2, 1, 0].map((offset) => {
            const idx = safeIndex + offset;
            if (idx >= games.length) return null;
            const g = games[idx];
            const img = (g.images && g.images[0]) || g.image;
            const isFront = offset === 0;
            return (
              <div
                key={idx}
                onClick={isFront ? () => onView(g) : undefined}
                className="absolute inset-0 rounded-2xl overflow-hidden border border-[#3A3631] bg-[#2E2B28]"
                style={{
                  transform: isFront ? "none" : `rotate(${offset * 6}deg) translate(${offset * 14}px, ${offset * -10}px)`,
                  transition: "transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.4s ease",
                  zIndex: 10 - offset,
                  boxShadow: isFront ? "0 14px 30px rgba(0,0,0,0.45)" : "0 6px 14px rgba(0,0,0,0.3)",
                }}
              >
                {img ? (
                  <img src={img} alt={g.name} className="w-full h-full block object-cover" />
                ) : (
                  <div className="w-full h-full flex items-center justify-center text-[#5C574F]"><Dices size={28} /></div>
                )}
                {isFront && (
                  <span className="absolute top-2 left-2 w-6 h-6 rounded-full bg-[#E85D9C] text-[#1C1B1A] text-[11px] font-display font-bold flex items-center justify-center border-2 border-[#1C1B1A]">
                    {safeIndex + 1}
                  </span>
                )}
              </div>
            );
          })}
        </div>
        <div
          className="absolute rounded-full pointer-events-none"
          style={{
            bottom: -8, left: "50%", transform: "translateX(-50%)",
            width: "min(220px, 50vw)", height: 18,
            background: "radial-gradient(ellipse, rgba(0,0,0,0.5), transparent 72%)",
            filter: "blur(5px)",
          }}
        />
      </div>
      <p className="text-[#F2EDE4] text-sm font-medium mt-4 text-center truncate max-w-[220px]">{current.name}</p>
      <p className="text-[#E85D9C] text-xs font-mono flex items-center gap-1 mt-0.5"><Star size={11} fill="#E85D9C" className="text-[#E85D9C]" /> {current.rating}/10</p>
      <div className="flex gap-1 mt-2">
        {games.map((_, i) => (
          <div key={i} className={`w-1.5 h-1.5 rounded-full ${i === safeIndex ? "bg-[#F2EDE4]" : "bg-[#F2EDE4]/30"}`} />
        ))}
      </div>
    </div>
  );
}

// Finds games actually mentioned as whole words in a text — avoids false
// positives like a game named "Ra" matching inside "Radlands".
function findMentionedGames(text, games) {
  return games.filter((g) => {
    const escaped = g.name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    return new RegExp(`(^|[^\\p{L}\\p{N}])${escaped}([^\\p{L}\\p{N}]|$)`, "u").test(text);
  });
}

// Renders Pip's chat replies with a small amount of structure: a line that is
// ENTIRELY a "**Game Name**" becomes a little heading (used when Pip lists
// several game suggestions), inline "**bold**" elsewhere just highlights
// (e.g. a game name mentioned mid-sentence), and blank lines become spaced
// paragraphs/segments instead of one dense block of text.
function renderPipMessage(text, games = [], onView) {
  const paragraphs = text.split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean);
  const findGame = (name) => games.find((g) => g.name.trim().toLowerCase() === name.trim().toLowerCase());
  const renderInline = (line, key) => {
    const bits = line.split(/(\*\*[^*]+\*\*)/g).filter((s) => s !== "");
    return (
      <p key={key} className="leading-snug">
        {bits.map((bit, j) => {
          const m = /^\*\*([^*]+)\*\*$/.exec(bit);
          return m ? <strong key={j} className="font-semibold text-[#E85D9C]">{m[1]}</strong> : <React.Fragment key={j}>{bit}</React.Fragment>;
        })}
      </p>
    );
  };
  return (
    <div className="space-y-2.5">
      {paragraphs.map((para, i) => {
        const lines = para.split("\n");
        return (
          <div key={i} className={i > 0 ? "pt-0.5" : ""}>
            {lines.map((line, j) => {
              const headingMatch = /^\*\*([^*]+)\*\*$/.exec(line.trim());
              if (headingMatch) {
                const g = findGame(headingMatch[1]);
                return (
                  <div key={j} className="mb-1">
                    {g && (
                      <button onClick={(e) => { e.stopPropagation(); onView && onView(g); }} className="block w-16 mb-1.5">
                        <Cover game={g} size="lg" className="!rounded-xl" />
                      </button>
                    )}
                    <p className={`font-display text-base text-[#F2EDE4] ${g ? "underline decoration-[#5C574F]/50 underline-offset-2" : ""}`}
                      onClick={g ? () => onView && onView(g) : undefined}
                      style={g ? { cursor: "pointer" } : undefined}>
                      {headingMatch[1]}
                    </p>
                  </div>
                );
              }
              return renderInline(line, j);
            })}
          </div>
        );
      })}
    </div>
  );
}

function TextWithGameLinks({ text, games, onView, color }) {
  const mentioned = findMentionedGames(text, games);
  if (mentioned.length === 0) return <p className="text-[#F2EDE4] text-sm font-body leading-snug">{text}</p>;
  const escaped = mentioned.map((g) => g.name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).sort((a, b) => b.length - a.length);
  const parts = text.split(new RegExp(`(${escaped.join("|")})`, "g"));
  return (
    <p className="text-[#F2EDE4] text-sm font-body leading-snug">
      {parts.map((part, i) => {
        const g = mentioned.find((x) => x.name === part);
        if (!g) return <span key={i}>{part}</span>;
        return (
          <span key={i} onClick={() => onView(g)} className="font-semibold underline underline-offset-2 cursor-pointer inline-flex items-center gap-1" style={{ color }}>
            {(() => {
              const label = complexityLabel(g);
              const CIcon = label && COMPLEXITY_ICON[label];
              return CIcon ? <CIcon size={13} className="shrink-0" /> : null;
            })()}
            {part}
          </span>
        );
      })}
    </p>
  );
}

/* ---------------- IMAGE RESIZE (for uploaded photos, keeps storage/sync small) ---------------- */
function resizeImageFile(file, maxDim = 1200, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Lesen fehlgeschlagen"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Bild ungültig"));
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) {
          height = Math.round((height * maxDim) / width);
          width = maxDim;
        } else if (height > maxDim) {
          width = Math.round((width * maxDim) / height);
          height = maxDim;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        // WebP compresses noticeably smaller than JPEG at the same visual
        // quality, so raising resolution/quality here doesn't blow up storage
        // the way it would with JPEG. Fall back to JPEG on the rare browser
        // that reports webp support but silently fails to encode it (some
        // very old WebViews return a blank/garbage data URL instead of
        // throwing, so check the resulting prefix rather than trust support
        // detection alone).
        let dataUrl = canvas.toDataURL("image/webp", quality);
        if (!dataUrl || !dataUrl.startsWith("data:image/webp")) {
          dataUrl = canvas.toDataURL("image/jpeg", quality);
        }
        resolve(dataUrl);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------------- COMPLEXITY CLASSIFICATION ---------------- */
// Based on community consensus around BGG's "weight" (1-5): under ~2.0 reads as a family
// game, ~2.0-3.5 as an enthusiast ("Kenner") game, above that as an expert game. Party games
// are classified by genre (BGG category) rather than weight, since they're often light but
// play very differently from a family strategy game.

}
function complexityLabel(game) {

  if (w < 2.0) return "Familienspiel";
  if (w < 2.5) return "Gehobenes Familienspiel";
  if (w < 3.0) return "Leichtes Kennerspiel";
  if (w < 3.5) return "Kennerspiel";
  if (w < 4.0) return "Anspruchsvolles Kennerspiel";

}

function tagIcon(name) {
  const n = name.toLowerCase();
  if (/card|hand management|deck building|drafting/.test(n)) return CardIcon;
  if (/^dice$|dice rolling|roll.*spin|push your luck/.test(n)) return Dices;
  if (/^party/.test(n)) return Sparkles;
  if (/humor/.test(n)) return Laugh;
  if (/fantasy|mytholog/.test(n)) return Star;
  if (/sci-?fi|space exploration|video game/.test(n)) return Rocket;
  if (/economic|city building|industry|trains?|transport/.test(n)) return Building;
  if (/civilization|political|medieval/.test(n)) return Crown;
  if (/fighting|wargame|military|miniature/.test(n)) return Sword;
  if (/horror|zombies/.test(n)) return Skull;
  if (/puzzle|pattern building/.test(n)) return Puzzle;
  if (/deduction|memory|spies/.test(n)) return Eye;
  if (/bluffing|murder.?mystery/.test(n)) return MaskIcon;
  if (/negotiat|trading|auction|bidding/.test(n)) return Handshake;
  if (/voting/.test(n)) return Users;
  if (/real-time|action points|simultaneous/.test(n)) return Zap;
  if (/time$/.test(n)) return Clock;
  if (/travel|nautical|explorat|racing|adventure|route.?network|point to point/.test(n)) return Compass;
  if (/animals/.test(n)) return PawPrint;
  if (/movies|tv|radio/.test(n)) return Tv;
  if (/word game|storytelling|role playing/.test(n)) return BookOpen;
  if (/grid movement|hex-and-counter|modular board|tile placement/.test(n)) return Grid3x3;
  if (/legacy game/.test(n)) return Archive;
  if (/cooperative/.test(n)) return Heart;
  if (/area control|territory building|worker placement|engine building/.test(n)) return Shield;
  if (/set collection|trick-taking|variable player powers/.test(n)) return Layers;
  if (/abstract strategy/.test(n)) return Block;
  if (/action.*dexterity/.test(n)) return Zap;
  if (/sports/.test(n)) return TrendingUp;
  return Dices;
}

/* ---------------- RICH TEXT EDITOR (Bold, Kursiv, Liste, Titel, Subheadline, Text) ---------------- */
function RichTextEditor({ value, onChange, placeholder, minHeight = 100 }) {
  const editorRef = React.useRef(null);
  const initialized = React.useRef(false);
  const [focused, setFocused] = useState(false);
  const [colorPickerOpen, setColorPickerOpen] = useState(false);
  const blurTimer = React.useRef(null);

  useEffect(() => {
    if (editorRef.current && !initialized.current) {
      editorRef.current.innerHTML = value || "";
      initialized.current = true;
    }
  }, []);

  const exec = (cmd, arg) => {
    if (editorRef.current) editorRef.current.focus();
    document.execCommand(cmd, false, arg || null);
    if (editorRef.current) onChange(editorRef.current.innerHTML);
  };

  const handlePaste = (e) => {
    // Force plain text on paste — strips all foreign formatting and colors from the source.
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData("text/plain");
    document.execCommand("insertText", false, text);
    if (editorRef.current) onChange(editorRef.current.innerHTML);
  };

  const handleInput = (e) => onChange(e.currentTarget.innerHTML);

  const clearAll = () => {
    if (!editorRef.current) return;
    editorRef.current.innerHTML = "";
    onChange("");
    editorRef.current.focus();
  };

  const handleFocus = () => { if (blurTimer.current) clearTimeout(blurTimer.current); setFocused(true); };
  const handleBlur = () => { blurTimer.current = setTimeout(() => setFocused(false), 180); };
  // Toolbar buttons must not steal focus/selection from the editor before their
  // click runs — mousedown+preventDefault keeps the current text selection intact.
  const keepFocus = (e) => e.preventDefault();

  const TEXT_COLORS = [
    { label: "Standard", value: "#F2EDE4" },
    { label: "Flieder", value: "#6C7FE0" },
    { label: "Amber", value: "#E85D9C" },
    { label: "Türkis", value: "#4E8C82" },
    { label: "Rot", value: "#C1443C" },
  ];

  const ToolBtn = ({ children, onClick, className: cn = "", ariaLabel }) => (
    <button type="button" onMouseDown={keepFocus} onClick={onClick} aria-label={ariaLabel} className={`h-9 px-2.5 flex items-center justify-center rounded-lg glass border border-white/15 text-[#F2EDE4] text-xs shrink-0 ${cn}`}>
      {children}
    </button>
  );

  return (
    <div className="relative">
      {focused && (
        <div className="relative mb-2">
          <div className="flex items-center gap-1.5 overflow-x-auto pb-1">
            <ToolBtn ariaLabel="Fett" onClick={() => exec("bold")}><b>B</b></ToolBtn>
            <ToolBtn ariaLabel="Kursiv" onClick={() => exec("italic")}><i>I</i></ToolBtn>
            <ToolBtn ariaLabel="Aufzählung" onClick={() => exec("insertUnorderedList")}>• Liste</ToolBtn>
            <ToolBtn ariaLabel="Titel" onClick={() => exec("formatBlock", "H2")} className="font-semibold">Titel</ToolBtn>
            <ToolBtn ariaLabel="Subheadline" onClick={() => exec("formatBlock", "H3")}>Subheadline</ToolBtn>
            <ToolBtn ariaLabel="Normaler Text" onClick={() => exec("formatBlock", "P")} className="text-[#A39C8F]">Text</ToolBtn>
            <ToolBtn ariaLabel="Textfarbe" onClick={() => setColorPickerOpen((o) => !o)}>
              <span className="w-3.5 h-3.5 rounded-full border border-[#F2EDE4]/40" style={{ background: "conic-gradient(#E85D9C,#E85D9C,#4E8C82,#C1443C,#E85D9C)" }} />
            </ToolBtn>
            <ToolBtn ariaLabel="Gesamten Text löschen" onClick={clearAll} className="text-[#C1443C]"><Trash2 size={13} /></ToolBtn>
          </div>
          {colorPickerOpen && (
            <div className="absolute top-11 left-0 z-10 bg-[#262422] border border-[#3A3631] rounded-[14px] p-2 flex gap-2 shadow-lg">
              {TEXT_COLORS.map((c) => (
                <button
                  key={c.value}
                  type="button"
                  onMouseDown={keepFocus}
                  aria-label={c.label}
                  onClick={() => { exec("foreColor", c.value); setColorPickerOpen(false); }}
                  className="w-8 h-8 rounded-full border-2 border-[#1C1B1A]"
                  style={{ backgroundColor: c.value }}
                />
              ))}
            </div>
          )}
        </div>
      )}
      <div
        ref={editorRef}
        contentEditable
        suppressContentEditableWarning
        onInput={handleInput}
        onPaste={handlePaste}
        onFocus={handleFocus}
        onBlur={handleBlur}
        role="textbox"
        aria-multiline="true"
        aria-label={placeholder}
        className="rte-content w-full border border-[#3A3631] rounded-[14px] px-3.5 py-3 text-[#F2EDE4] text-base focus:outline-none focus:border-[#E85D9C]"
        style={{ minHeight }}
        data-placeholder={placeholder}
      />
    </div>
  );
}

/* ---------------- IMAGE CROP (Zuschneiden/Zoomen vor dem Speichern) ---------------- */
function ImageCropModal({ src, onConfirm, onCancel }) {
  const CROP = 300;
  const [natSize, setNatSize] = useState(null);
  const [loadFailed, setLoadFailed] = useState(false);
  const [corsBlocked, setCorsBlocked] = useState(false);
  const [zoom, setZoom] = useState(1);
  const [offset, setOffset] = useState({ x: 0, y: 0 });
  const imgRef = React.useRef(null);
  const drag = React.useRef(null);
  const pinch = React.useRef(null);

  const coverScale = natSize ? Math.max(CROP / natSize.w, CROP / natSize.h) : 1;
  const totalScale = coverScale * zoom;

  const clampOffset = (o, scale) => {
    if (!natSize) return o;
    const drawW = natSize.w * scale, drawH = natSize.h * scale;
    const maxX = Math.max(0, (drawW - CROP) / 2);
    const maxY = Math.max(0, (drawH - CROP) / 2);
    return { x: Math.min(maxX, Math.max(-maxX, o.x)), y: Math.min(maxY, Math.max(-maxY, o.y)) };
  };

  const onTouchStart = (e) => {
    if (e.touches.length === 2) {
      const [t1, t2] = e.touches;
      pinch.current = { dist: Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY), zoom };
      drag.current = null;
    } else if (e.touches.length === 1) {
      drag.current = { x: e.touches[0].clientX, y: e.touches[0].clientY, offset };
      pinch.current = null;
    }
  };
  const onTouchMove = (e) => {
    e.preventDefault();
    if (e.touches.length === 2 && pinch.current) {
      const [t1, t2] = e.touches;
      const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
      const newZoom = Math.min(3, Math.max(1, pinch.current.zoom * (dist / pinch.current.dist)));
      setZoom(newZoom);
      setOffset((o) => clampOffset(o, coverScale * newZoom));
    } else if (e.touches.length === 1 && drag.current) {
      const dx = e.touches[0].clientX - drag.current.x;
      const dy = e.touches[0].clientY - drag.current.y;
      setOffset(clampOffset({ x: drag.current.offset.x + dx, y: drag.current.offset.y + dy }, totalScale));
    }
  };
  const onTouchEnd = () => { drag.current = null; pinch.current = null; };

  const handleZoomSlider = (v) => {
    setZoom(v);
    setOffset((o) => clampOffset(o, coverScale * v));
  };

  const confirm = () => {
    if (!natSize || !imgRef.current) return;
    const OUT = 640;
    const canvas = document.createElement("canvas");
    canvas.width = OUT; canvas.height = OUT;
    const ctx = canvas.getContext("2d");
    const drawW = natSize.w * totalScale, drawH = natSize.h * totalScale;
    const outScale = OUT / CROP;
    const dx = (CROP - drawW) / 2 + offset.x;
    const dy = (CROP - drawH) / 2 + offset.y;
    try {
      ctx.drawImage(imgRef.current, dx * outScale, dy * outScale, drawW * outScale, drawH * outScale);
      let dataUrl = canvas.toDataURL("image/webp", 0.88);
      if (!dataUrl || !dataUrl.startsWith("data:image/webp")) dataUrl = canvas.toDataURL("image/jpeg", 0.9);
      onConfirm(dataUrl);
    } catch {
      // Cross-origin images (e.g. loaded straight from BGG's CDN) taint the
      // canvas — the browser refuses to let us read pixel data back out, so
      // there is no cropped version to save. Tell the person clearly instead
      // of silently pretending it worked by handing back the original image.
      setCorsBlocked(true);
    }
  };

  return (
    <div className="fixed inset-0 bg-black z-[75] flex flex-col">
      <div className="shrink-0 flex items-center justify-between px-5" style={{ paddingTop: "max(1rem, env(safe-area-inset-top))", paddingBottom: "1rem" }}>
        <button onClick={onCancel} className="glass-icon-btn w-10 h-10 flex items-center justify-center rounded-full border border-white/10 text-[#A39C8F]" aria-label="Abbrechen"><X size={20} /></button>
        <span className="text-[#F2EDE4] font-display text-lg">Zuschneiden</span>
        <button onClick={confirm} disabled={!natSize} className="glass-icon-btn w-10 h-10 flex items-center justify-center rounded-full border border-white/15 text-[#E85D9C] disabled:opacity-40" aria-label="Übernehmen">
          {natSize ? <Check size={20} /> : <Loader2 size={18} className="animate-spin" />}
        </button>
      </div>
      {corsBlocked && (
        <div className="shrink-0 mx-5 mb-3 bg-[#E85D9C]/10 border border-[#E85D9C]/30 rounded-[14px] px-4 py-3">
          <p className="text-[#F2EDE4] text-sm mb-1">Zuschneiden hier nicht möglich</p>
          <p className="text-[#A39C8F] text-xs leading-relaxed">Dieses Bild kommt direkt von BGG — aus Sicherheitsgründen kann dein Browser es nicht zuschneiden. Lade es stattdessen per Kamera oder aus deiner Fotomediathek hoch, dann klappt der Zuschnitt.</p>
        </div>
      )}
      <div className="flex-1 flex items-center justify-center">
        {loadFailed ? (
          <div className="text-center px-8">
            <p className="text-[#A39C8F] text-sm mb-4">Bild konnte nicht zum Zuschneiden geladen werden.</p>
            <button onClick={() => onConfirm(src)} className="bg-[#262422] border border-[#3A3631] text-[#F2EDE4] px-4 py-2.5 rounded-[14px] text-sm font-medium">Unverändert übernehmen</button>
          </div>
        ) : (
        <div
          className="relative overflow-hidden rounded-2xl border-2 border-[#F2EDE4]/40"
          style={{ width: CROP, height: CROP, touchAction: "none" }}
          onTouchStart={onTouchStart}
          onTouchMove={onTouchMove}
          onTouchEnd={onTouchEnd}
        >
          <img
            ref={imgRef}
            src={src}
            alt="Zuschneiden"
            onLoad={(e) => { const { naturalWidth: w, naturalHeight: h } = e.target; setNatSize({ w, h }); }}
            onError={() => setLoadFailed(true)}
            style={{
              position: "absolute", left: "50%", top: "50%",
              width: natSize ? natSize.w : "auto", height: natSize ? natSize.h : "auto",
              transform: `translate(-50%, -50%) translate(${offset.x}px, ${offset.y}px) scale(${totalScale})`,
              maxWidth: "none",
            }}
            draggable={false}
          />
        </div>
        )}
      </div>
      <div className="shrink-0 px-8" style={{ paddingBottom: "max(1.5rem, env(safe-area-inset-bottom))" }}>
        <p className="text-center text-xs text-[#5C574F] mb-3">Ziehen zum Verschieben, Regler zum Zoomen</p>
        <input
          type="range" min={1} max={3} step={0.01} value={zoom}
          onChange={(e) => handleZoomSlider(parseFloat(e.target.value))}
          className="w-full"
        />
      </div>
    </div>
  );
}

function ImagePickerSheet({ onAdd, onClose }) {
  const { closing, requestClose } = useSheetClose(onClose);
  const [urlMode, setUrlMode] = useState(false);
  const [url, setUrl] = useState("");
  const [urlChecking, setUrlChecking] = useState(false);
  const [urlError, setUrlError] = useState("");
  const [cropSrc, setCropSrc] = useState(null);
  const cameraRef = React.useRef(null);
  const uploadRef = React.useRef(null);

  const [bulkUploading, setBulkUploading] = useState(false);
  const handleFile = async (e) => {
    const files = e.target.files ? Array.from(e.target.files) : [];
    e.target.value = "";
    if (files.length === 0) return;
    if (files.length === 1) {
      const dataUrl = await resizeImageFile(files[0]);
      setCropSrc(dataUrl);
      return;
    }
    // Mehrere Dateien auf einmal: Zuschneiden pro Bild wäre zu umständlich —
    // alle werden direkt in voller Größe hinzugefügt. Wichtig: onAdd wird nur
    // EINMAL mit dem kompletten Array aufgerufen, nicht einmal pro Bild in
    // einer Schleife — sonst greifen die meisten onAdd-Handler beim schnellen
    // Hintereinander-Aufrufen noch auf den alten (veralteten) Bilder-Stand zu
    // und überschreiben sich gegenseitig, sodass am Ende nur 1 Bild ankommt.
    setBulkUploading(true);
    const newImages = [];
    for (const file of files) {
      try {
        newImages.push(await resizeImageFile(file));
      } catch { /* skip files that fail to load/resize, keep going with the rest */ }
    }
    if (newImages.length > 0) onAdd(newImages);
    setBulkUploading(false);
    requestClose();
  };

  const submitUrl = () => {
    const trimmed = url.trim();
    if (!trimmed) return;
    setUrlChecking(true);
    setUrlError("");
    const img = new Image();
    const timer = setTimeout(() => { setUrlChecking(false); setUrlError("Diese Karte zieht nicht — Bild-Adresse nochmal prüfen."); }, 8000);
    img.onload = () => { clearTimeout(timer); setUrlChecking(false); onAdd(trimmed); requestClose(); };
    img.onerror = () => { clearTimeout(timer); setUrlChecking(false); setUrlError("Diese Karte zieht nicht — Bild-Adresse nochmal prüfen."); };
    img.src = trimmed;
  };

  return (
    <div className={`fixed top-0 left-0 right-0 bg-black/70 z-[70] flex items-end justify-center p-0 ${closing ? "backdrop-fade-out" : "backdrop-fade"}`} style={{ height: "var(--app-height, 100dvh)", top: "var(--app-offset-top, 0px)" }} onClick={requestClose}>
      <div className={`glass border border-white/10 rounded-t-[28px] w-full font-body p-5 space-y-2 ${closing ? "sheet-out" : "rise-in"}`} onClick={(e) =>
        e.stopPropagation()}>
        <div className="flex justify-center pt-2 pb-1"><div className="w-9 h-1 rounded-full bg-[#3A3631]" /></div>
        <h3 className="font-display text-lg text-[#F2EDE4] mb-1">Foto hinzufügen</h3>
        {!urlMode ? (
          <>
            <button onClick={() => cameraRef.current && cameraRef.current.click()} className="w-full flex items-center gap-3 bg-[#262422] border border-[#3A3631] rounded-[14px] px-4 py-3 text-[#F2EDE4] text-sm">
              <Camera size={18} className="text-[#E85D9C]" /> Foto aufnehmen
            </button>
            <button onClick={() => uploadRef.current && uploadRef.current.click()} disabled={bulkUploading} className="w-full flex items-center gap-3 bg-[#262422] border border-[#3A3631] rounded-[14px] px-4 py-3 text-[#F2EDE4] text-sm disabled:opacity-50">
              {bulkUploading ? <Loader2 size={18} className="text-[#E85D9C]" /> : <Upload size={18} className="text-[#E85D9C]" />}
              {bulkUploading ? "Fotos werden hinzugefügt…" : "Hochladen (mehrere möglich)"}
            </button>
            <button onClick={() => setUrlMode(true)} className="w-full flex items-center gap-3 bg-[#262422] border border-[#3A3631] rounded-[14px] px-4 py-3 text-[#F2EDE4] text-sm">
              <LinkIcon size={18} className="text-[#E85D9C]" /> Per URL einfügen
            </button>
          </>
        ) : (
          <div className="space-y-2">
            <input onFocus={handleFocusScroll} autoFocus value={url} onChange={(e) => setUrl(e.target.value)} placeholder="https://…"
              className="w-full bg-[#262422] border border-[#3A3631] rounded-[14px] px-3 py-2 text-[#F2EDE4] text-sm focus:outline-none focus:border-[#E85D9C]" />
            {urlError && <p className="text-xs text-[#C1443C]">{urlError}</p>}
            <button onClick={submitUrl} disabled={urlChecking || !url.trim()}
              className="w-full bg-[conic-gradient(from_0deg,#ff5a96,#ffc850,#78dcff,#b482ff,#ff5a96)] disabled:opacity-50 text-[#F2EDE4] rounded-[14px] py-2.5 text-sm font-medium flex items-center justify-center gap-2">
              {urlChecking ? <Loader2 size={14} /> : <Check size={14} />} {urlChecking ? "Prüfe Bild…" : "Hinzufügen"}
            </button>
          </div>
        )}
        <input
          ref={cameraRef}
          type="file"
          accept="image/*"
          style={{ position: "absolute", width: 1, height: 1, padding: 0, margin: -1, overflow: "hidden", clip: "rect(0,0,0,0)", border: 0 }}
          onChange={handleFile}
        />
        <input
          ref={uploadRef}
          type="file"
          accept="image/*"
          multiple
          style={{ position: "absolute", width: 1, height: 1, padding: 0, margin: -1, overflow: "hidden", clip: "rect(0,0,0,0)", border: 0 }}
          onChange={handleFile}
        />
        <button onClick={onClose} className="w-full text-center py-2 text-[#A39C8F] text-sm">Abbrechen</button>
      </div>
      {cropSrc && (
        <ImageCropModal
          src={cropSrc}
          onConfirm={(cropped) => { onAdd(cropped); setCropSrc(null); requestClose(); }}
          onCancel={() => setCropSrc(null)}
        />
      )}
    </div>
  );
}

// A full-screen photo viewer with pinch-to-zoom, double-tap-to-zoom, and
// panning while zoomed in — used for the lightbox everywhere in the app.
function ZoomableLightboxImage({ images, index, onIndexChange, onClose, children }) {
  const [scale, setScale] = useState(1);
  const [offset, setOffset] = useState({ x: 0, y: 0 });
  const pinch = React.useRef(null); // { startDist, startScale, startOffset, midpoint }
  const pan = React.useRef(null); // { startX, startY, startOffset }
  const swipe = React.useRef(null); // { startX } — page-through-images swipe when not zoomed
  const lastTap = React.useRef(0);
  const containerRef = React.useRef(null);
  const src = images[index];

  const clampOffset = (o, s) => {
    const el = containerRef.current;
    if (!el) return o;
    const rect = el.getBoundingClientRect();
    const maxX = Math.max(0, (rect.width * (s - 1)) / 2);
    const maxY = Math.max(0, (rect.height * (s - 1)) / 2);
    return { x: Math.max(-maxX, Math.min(maxX, o.x)), y: Math.max(-maxY, Math.min(maxY, o.y)) };
  };

  const resetZoom = () => { setScale(1); setOffset({ x: 0, y: 0 }); };
  // Reset zoom whenever the page changes, so swiping to the next photo always
  // starts fresh instead of carrying over a zoomed-in state.
  useEffect(() => { resetZoom(); }, [index]);

  const onTouchStart = (e) => {
    if (e.touches.length === 2) {
      const [a, b] = e.touches;
      const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      pinch.current = { startDist: dist, startScale: scale, startOffset: offset };
      pan.current = null; swipe.current = null;
    } else if (e.touches.length === 1) {
      if (scale > 1) {
        pan.current = { startX: e.touches[0].clientX, startY: e.touches[0].clientY, startOffset: offset };
      } else if (images.length > 1) {
        swipe.current = { startX: e.touches[0].clientX };
      }
      const now = Date.now();
      if (now - lastTap.current < 300) {
        if (scale > 1) resetZoom();
        else { setScale(2.5); setOffset({ x: 0, y: 0 }); }
        lastTap.current = 0;
      } else {
        lastTap.current = now;
      }
    }
  };
  const onTouchMove = (e) => {
    if (e.touches.length === 2 && pinch.current) {
      e.preventDefault();
      const [a, b] = e.touches;
      const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      const next = Math.max(1, Math.min(5, pinch.current.startScale * (dist / pinch.current.startDist)));
      setScale(next);
      setOffset(clampOffset(pinch.current.startOffset, next));
    } else if (e.touches.length === 1 && pan.current && scale > 1) {
      e.preventDefault();
      const dx = e.touches[0].clientX - pan.current.startX;
      const dy = e.touches[0].clientY - pan.current.startY;
      setOffset(clampOffset({ x: pan.current.startOffset.x + dx, y: pan.current.startOffset.y + dy }, scale));
    }
    // swipe-to-page tracked passively on touchend below — no live transform
    // needed here, keeps this simple and avoids fighting the zoom transform.
  };
  const onTouchEnd = (e) => {
    if (swipe.current && e.changedTouches && e.changedTouches.length > 0) {
      const delta = e.changedTouches[0].clientX - swipe.current.startX;
      if (delta < -50 && index < images.length - 1) onIndexChange(index + 1);
      else if (delta > 50 && index > 0) onIndexChange(index - 1);
    }
    if (e.touches.length === 0) { pinch.current = null; pan.current = null; swipe.current = null; }
  };

  return (
    <div ref={containerRef} className="fixed inset-0 bg-black/90 z-[70] flex items-center justify-center p-3 overflow-hidden"
      onClick={() => { if (scale === 1) onClose(); }}
      onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}
      style={{ touchAction: "none" }}>
      <img src={src} alt="Foto vergrößert" draggable={false}
        className="max-w-full max-h-[88vh] block object-contain rounded-lg select-none"
        style={{ transform: `translate(${offset.x}px, ${offset.y}px) scale(${scale})`, transition: pinch.current || pan.current ? "none" : "transform .2s ease-out" }}
        onClick={(e) => { if (scale > 1) e.stopPropagation(); }} />
      {scale === 1 && images.length > 1 && (
        <div className="absolute z-10 flex gap-1.5" style={{ bottom: "max(1.25rem, env(safe-area-inset-bottom))" }} onClick={(e) => e.stopPropagation()}>
          {images.map((_, i) => (
            <button key={i} onClick={() => onIndexChange(i)} aria-label={`Foto ${i + 1}`}
              className={`w-1.5 h-1.5 rounded-full transition-all ${i === index ? "w-4 bg-[#F2EDE4]" : "bg-[#F2EDE4]/35"}`} />
          ))}
        </div>
      )}
      {scale === 1 && children}
    </div>
  );
}
function PhotoGallerySection({ images, onAdd, onRemove, onReplace, hero = false, editable = true }) {

// A text input that doubles as a search: typing filters a live, alphabetically
// sorted dropdown of matching games; tapping a result selects it.
function GameSearchPicker({ games, excludeId, filter, selectedId, onSelect, placeholder }) {
  const selectedGame = (games || []).find((g) => g.id === selectedId);
  const [query, setQuery] = useState(selectedGame ? selectedGame.name : "");
  const [focused, setFocused] = useState(false);
  useEffect(() => { setQuery(selectedGame ? selectedGame.name : ""); }, [selectedId]);
  const results = useMemo(() => {
    let pool = (games || []).filter((g) => g.id !== excludeId);
    if (filter) pool = pool.filter(filter);
    const sorted = [...pool].sort((a, b) => a.name.localeCompare(b.name, "de"));
    if (!query.trim() || query === (selectedGame && selectedGame.name)) return sorted;
    return sorted.filter((g) => gameMatchesQuery(g, query));
  }, [games, excludeId, filter, query, selectedGame]);
  return (
    <div className="relative">
      <input
        value={query}
        onChange={(e) => { setQuery(e.target.value); if (selectedId) onSelect(""); }}
        onFocus={(e) => { handleFocusScroll(e); setFocused(true); }}
        onBlur={() => setTimeout(() => setFocused(false), 150)}
        placeholder={placeholder}
        className={`w-full h-12 border border-[#3A3631] rounded-[14px] px-3.5 text-base focus:outline-none focus:border-[#E85D9C] ${selectedId ? "bg-[#262422] text-[#F2EDE4]" : "bg-transparent text-[#F2EDE4] placeholder-[#5C574F]"}`}
      />
      {focused && results.length > 0 && (
        <div className="absolute z-10 left-0 right-0 mt-1.5 max-h-56 overflow-y-auto bg-[#262422] border border-[#3A3631] rounded-[14px] py-1.5 shadow-lg">
          {results.map((g) => (
            <button
              key={g.id}
              onMouseDown={(e) => e.preventDefault()}
              onClick={() => { onSelect(g.id); setQuery(g.name); setFocused(false); }}
              className="w-full text-left px-3.5 py-2 text-sm text-[#F2EDE4] active:bg-white/5 truncate"
            >
              {gameSearchLabel(g)}
            </button>
          ))}
        </div>
      )}
      {focused && query.trim() && results.length === 0 && (
        <div className="absolute z-10 left-0 right-0 mt-1.5 bg-[#262422] border border-[#3A3631] rounded-[14px] py-2.5 px-3.5">
          <p className="text-xs text-[#5C574F]">Kein Spiel gefunden.</p>
        </div>
      )}
    </div>
  );
}

// A bottom sheet for picking SEVERAL games at once (checkbox list + search),
// used where a single-value GameSearchPicker isn't enough — e.g. linking

function MultiGamePickerSheet({ games, excludeId, filter, initialSelected = [], onConfirm, onClose, title }) {
  const { closing, requestClose } = useSheetClose(onClose);

  const pool = useMemo(() => {
    let p = (games || []).filter((g) => g.id !== excludeId);
    if (filter) p = p.filter(filter);
    return [...p].sort((a, b) => a.name.localeCompare(b.name, "de"));
  }, [games, excludeId, filter]);
  const results = query.trim() ? pool.filter((g) => gameMatchesQuery(g, query)) : pool;
  const toggle = (id) => setSelected((s) => (s.includes(id) ? s.filter((x) => x !== id) : [...s, id]));

  return (
    <div className={`fixed top-0 left-0 right-0 bg-black/70 z-[66] flex items-end justify-center p-0 ${closing ? "backdrop-fade-out" : "backdrop-fade"}`} style={{ height: "var(--app-height, 100dvh)", top: "var(--app-offset-top, 0px)" }} onClick={requestClose}>
      <div className={`glass border border-white/10 rounded-t-[28px] w-full font-body flex flex-col ${closing ? "sheet-out" : "rise-in"}`} style={{ maxHeight: "calc(var(--app-height, 100dvh) - 2rem)" }} onClick={(e) => e.stopPropagation()}>

        <div className="shrink-0 px-5 py-4 flex items-center justify-between">

          <button onClick={() => { onConfirm(selected); requestClose(); }} className="text-[#E85D9C] text-sm font-medium px-2 py-1">Fertig{selected.length > 0 ? ` (${selected.length})` : ""}</button>
        </div>
        <div className="shrink-0 px-5 pb-3">
          <SearchInput value={query} onChange={setQuery} placeholder="Suchen…" inputClassName="h-11 bg-[#262422] border border-[#3A3631] rounded-[14px] text-sm" />
        </div>
        <div className="flex-1 overflow-y-auto px-5 pb-5 space-y-1.5" style={{ paddingBottom: "max(1.25rem, env(safe-area-inset-bottom))" }}>
          {results.length === 0 && <p className="text-xs text-[#5C574F] text-center mt-4">Kein Spiel gefunden.</p>}
          {results.map((g) => {
            const isSel = selected.includes(g.id);
            return (
              <button key={g.id} onClick={() => toggle(g.id)} type="button"
                className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-[14px] border text-left ${isSel ? "bg-[#E85D9C]/10 border-[#E85D9C]/40" : "bg-[#262422] border-[#3A3631]"}`}>
                <div className={`w-5 h-5 rounded-full border-2 flex items-center justify-center shrink-0 ${isSel ? "bg-[#E85D9C] border-[#E85D9C]" : "border-[#5C574F]"}`}>
                  {isSel && <Check size={12} className="text-white" />}
                </div>
                <span className="text-sm text-[#F2EDE4] truncate">{gameSearchLabel(g)}</span>
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function SettingsPage({ customCategories, customMechanisms, customPlayerTypes, onAddCategory, onRemoveCategory, onAddMechanism, onRemoveMechanism, onAddPlayerType, onRemovePlayerType, demoMode, onToggleDemo, guestMode, onToggleGuest, syncUrl, syncStatus, onOpenSync, bggImportStatus, bggImportResult, bggImportError, onImportBggPlays, games, plays, onMergeGames, aiWorkerUrl, onSaveAiWorkerUrl }) {
  const [view, setView] = useState("menu"); // menu | sync | ai | bggImport | customize | duplicates | demo
  const [aiUrlInput, setAiUrlInput] = useState(aiWorkerUrl || "");
  const [bggUsername, setBggUsername] = useState("");
  const duplicateGroups = useMemo(() => {
    if (!games) return [];
    const norm = (s) => s.toLowerCase().replace(/\s*\([^)]*\)\s*/g, "").replace(/[^a-z0-9]+/g, " ").trim();
    const groups = [];
    const used = new Set();
    games.forEach((g, i) => {
      if (used.has(g.id)) return;
      const gNorm = norm(g.name);
      const matches = games.filter((h, j) => j !== i && !used.has(h.id) && norm(h.name) === gNorm);
      if (matches.length > 0) {
        const group = [g, ...matches];
        group.forEach((x) => used.add(x.id));
        groups.push(group);
      }
    });
    return groups;

function normalizeSyncUrl(url) {
  if (!url) return "";
  let u = url.trim();
  if (!u) return "";
  if (!u.endsWith("/")) u += "/";
  return u;
}

/* ---------------- EMAIL/PASSWORD AUTH (lightweight REST, no SDK) ----------------
   Signs in with your own email/password against the Firebase project so the
   database rules can require `auth != null` in a way that's actually locked —
   unlike anonymous auth, nobody else can get a token without your password.
   Runs automatically in the background — no login screen for daily use. */
const AUTH_KEYS = { apiKey: "spielregal:apiKey", email: "spielregal:authEmail", password: "spielregal:authPassword", idToken: "spielregal:idToken", refreshToken: "spielregal:refreshToken", expiresAt: "spielregal:tokenExpiresAt" };

async function signInWithPassword(apiKey, email, password) {
  const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${apiKey}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password, returnSecureToken: true }),
  });
  if (!res.ok) throw new Error("Anmeldung fehlgeschlagen — E-Mail, Passwort oder API-Schlüssel prüfen");
  const json = await res.json();
  const expiresAt = Date.now() + (parseInt(json.expiresIn, 10) || 3600) * 1000;
  localStorage.setItem(AUTH_KEYS.idToken, json.idToken);
  localStorage.setItem(AUTH_KEYS.refreshToken, json.refreshToken);
  localStorage.setItem(AUTH_KEYS.expiresAt, String(expiresAt));
  return json.idToken;
}

async function refreshIdToken(apiKey, refreshToken) {
  const res = await fetch(`https://securetoken.googleapis.com/v1/token?key=${apiKey}`, {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(refreshToken)}`,
  });
  if (!res.ok) throw new Error("Token-Erneuerung fehlgeschlagen");
  const json = await res.json();
  const expiresAt = Date.now() + (parseInt(json.expires_in, 10) || 3600) * 1000;
  localStorage.setItem(AUTH_KEYS.idToken, json.id_token);
  localStorage.setItem(AUTH_KEYS.refreshToken, json.refresh_token);
  localStorage.setItem(AUTH_KEYS.expiresAt, String(expiresAt));
  return json.id_token;
}

// Returns a currently-valid ID token, signing in or refreshing as needed.
// Returns "" (no token) when no API key/credentials are configured — falls
// back to unauthenticated requests so older setups without a key keep working.
async function getValidIdToken(apiKey) {
  if (!apiKey) return "";
  const storedToken = localStorage.getItem(AUTH_KEYS.idToken);
  const expiresAt = parseInt(localStorage.getItem(AUTH_KEYS.expiresAt) || "0", 10);
  const refreshToken = localStorage.getItem(AUTH_KEYS.refreshToken);
  if (storedToken && Date.now() < expiresAt - 60000) return storedToken;
  if (refreshToken) {
    try { return await refreshIdToken(apiKey, refreshToken); } catch { /* fall through to fresh sign-in */ }
  }
  const email = localStorage.getItem(AUTH_KEYS.email);
  const password = localStorage.getItem(AUTH_KEYS.password);
  if (!email || !password) return "";
  return signInWithPassword(apiKey, email, password);
}

async function cloudPush(syncUrl, data, apiKey) {
  const base = normalizeSyncUrl(syncUrl);
  if (!base) return;
  const payload = { ...data, updatedAt: Date.now() };
  const token = await getValidIdToken(apiKey).catch(() => "");
  const url = base + "data.json" + (token ? `?auth=${token}` : "");
  const res = await fetch(url, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  if (!res.ok) throw new Error("Der Spielzug wurde nicht gewertet — Speichern in der Cloud fehlgeschlagen");
  return payload.updatedAt;
}
async function cloudPull(syncUrl, apiKey) {
  const base = normalizeSyncUrl(syncUrl);
  if (!base) return null;
  const token = await getValidIdToken(apiKey).catch(() => "");
  const url = base + "data.json" + (token ? `?auth=${token}` : "");
  const res = await fetch(url);
  if (!res.ok) throw new Error("Karten ziehen fehlgeschlagen — Cloud-Abruf hat nicht geklappt");
  const json = await res.json();
  return json;
}

/* ---------------- BGG API (best effort, needs internet) ---------------- */
async function bggSearch(query) {
  const fetchResults = async (exact) => {
    const url = `https://shiny-grass-80ec.contact-mdinh.workers.dev/xmlapi2/search?query=${encodeURIComponent(query)}&type=boardgame${exact ? "&exact=1" : ""}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("BGG würfelt gerade nicht mit — nicht erreichbar");
    const text = await res.text();
    const xml = new DOMParser().parseFromString(text, "text/xml");
    return Array.from(xml.getElementsByTagName("item")).slice(0, 8).map((it) => ({
      bggId: it.getAttribute("id"),
      name: it.getElementsByTagName("name")[0]?.getAttribute("value") || "Unbekannt",
      year: it.getElementsByTagName("yearpublished")[0]?.getAttribute("value") || "",
    }));
  };
  // Try an exact-title match first — BGG's plain fuzzy search can bury a
  // short, common title (e.g. "My City") under unrelated partial matches
  // within the first few results. If nothing exact turns up, fall back to
  // the normal fuzzy search.
  const exactResults = await fetchResults(true);
  if (exactResults.length > 0) return exactResults;
  return fetchResults(false);
}
async function bggThing(bggId) {
  const url = `https://shiny-grass-80ec.contact-mdinh.workers.dev/xmlapi2/thing?id=${bggId}&stats=1`;
  const res = await fetch(url);
  if (!res.ok) throw new Error("BGG würfelt gerade nicht mit — nicht erreichbar");
  const text = await res.text();
  const xml = new DOMParser().parseFromString(text, "text/xml");
  const item = xml.getElementsByTagName("item")[0];
  if (!item) throw new Error("Fehlwurf — kein Ergebnis gefunden");
  const nameEl = Array.from(item.getElementsByTagName("name")).find(n => n.getAttribute("type") === "primary") || item.getElementsByTagName("name")[0];
  const alternateNames = Array.from(item.getElementsByTagName("name")).filter(n => n.getAttribute("type") === "alternate").map(n => n.getAttribute("value"));
  // BGG doesn't tag alternate-name languages at all — best-effort guess via German
  // diacritics/umlauts or very common German connector words.
  const GERMAN_HINTS = [" der ", " die ", " das ", " und ", " von ", " ein ", " eine ", "ä", "ö", "ü", "ß"];
  const germanName = alternateNames.find(n => GERMAN_HINTS.some(h => n.toLowerCase().includes(h))) || null;
  const getTxt = (tag) => item.getElementsByTagName(tag)[0]?.textContent || "";
  const getAttr = (tag) => item.getElementsByTagName(tag)[0]?.getAttribute("value") || "";
  const mechanisms = Array.from(item.getElementsByTagName("link")).filter(l => l.getAttribute("type") === "boardgamemechanic").map(l => l.getAttribute("value"));
  const categories = Array.from(item.getElementsByTagName("link")).filter(l => l.getAttribute("type") === "boardgamecategory").map(l => l.getAttribute("value"));
  const allPublishers = Array.from(item.getElementsByTagName("link")).filter(l => l.getAttribute("type") === "boardgamepublisher").map(l => l.getAttribute("value"));
  // BGG lists every regional publisher with no "primary" flag. Best-effort: keep the
  // first (usually the original publisher) plus any recognizable German-market publisher.
  const KNOWN_GERMAN_PUBLISHERS = [
    "kosmos", "pegasus spiele", "hans im glück", "hans im gluck", "amigo", "schmidt spiele", "ravensburger",
    "asmodee deutschland", "feuerland spiele", "frosted games", "skellig games", "spielworxx", "huch!", "huch & friends",
    "kobold spieleverlag", "abacusspiele", "queen games", "eggertspiele", "moses verlag", "lookout games", "lookout spiele",
    "zoch verlag", "zoch", "noris spiele", "nürnberger-spielkarten-verlag", "nsv", "pd-verlag", "argentum verlag",
    "deep print games", "heidelberger spieleverlag", "corax games", "edition spielwiese", "2f-spiele", "irongames",
    "game factory", "franckh-kosmos", "klemmer spiele", "piatnik", "united games entertainment", "iq-spiele", "drei magier spiele",
  ];
  const germanMatches = allPublishers.filter(p => KNOWN_GERMAN_PUBLISHERS.some(k => p.toLowerCase().includes(k)));
  const publishers = [...new Set([allPublishers[0], ...germanMatches].filter(Boolean))];
  const designers = Array.from(item.getElementsByTagName("link")).filter(l => l.getAttribute("type") === "boardgamedesigner").map(l => l.getAttribute("value"));
  const weight = item.getElementsByTagName("averageweight")[0]?.getAttribute("value");
  const bggImage = getTxt("image");
  // Expansion links: inbound="true" means THIS item is an expansion of the linked
  // (base) game. Links without inbound mean the linked item is an expansion OF this one.
  const expansionLinks = Array.from(item.getElementsByTagName("link")).filter(l => l.getAttribute("type") === "boardgameexpansion");
  const baseLink = expansionLinks.find(l => l.getAttribute("inbound") === "true");
  const baseGameBggId = baseLink ? baseLink.getAttribute("id") : null;
  const baseGameName = baseLink ? baseLink.getAttribute("value") : null;
  const expansionBggIds = expansionLinks.filter(l => l.getAttribute("inbound") !== "true").map(l => l.getAttribute("id"));
  const rawDescription = getTxt("description");
  const summary = rawDescription
    ? rawDescription.split(/\n\s*\n|\r\n\r\n/).map(p => `<p>${p.trim()}</p>`).join("")
    : "";
  return {
    bggId, name: nameEl?.getAttribute("value") || "Unbekannt", year: getAttr("yearpublished"),
    images: bggImage ? [bggImage] : [], minPlayers: getAttr("minplayers"), maxPlayers: getAttr("maxplayers"),
    minTime: getAttr("minplaytime"), maxTime: getAttr("maxplaytime"), age: getAttr("minage"),
    publishers, designers, mechanisms, categories, summary,
    complexity: weight ? Math.round(parseFloat(weight) * 10) / 10 : null,
    baseGameBggId, baseGameName, expansionBggIds, germanName, alternateNames, allPublishers,
  };
}

// Fetches a handful of real user reviews/ratings from BGG for a game — gives
// Pip actual player opinions to draw on, not just the official description.
async function bggThingComments(bggId, pageSize = 6) {
  const url = `https://shiny-grass-80ec.contact-mdinh.workers.dev/xmlapi2/thing?id=${bggId}&ratingcomments=1&pagesize=${pageSize}&page=1`;

  if (!res.ok) return [];

  return comments
    .map((c) => ({ rating: c.getAttribute("rating"), text: (c.getAttribute("value") || "").trim() }))

    .slice(0, pageSize);

async function aiElevatorPitch(workerUrl, gameName, originalSummary) {
  const prompt = `Du bist ein Brettspiel-Experte und schreibst kurze, klare Zusammenfassungen auf Deutsch.

  const titleMatch = raw.match(/TITEL:\s*(.+)/i);

// Builds a compact text summary of the collection + recent play history to
// give the AI real context, without sending full game objects.
// Full, uncapped export for pasting into an external AI (Gemini, ChatGPT, etc.)
// that the person wants to ask specific questions about their collection — no
// token-budget trimming needed here since it's a one-off manual copy, not an
// API call Anthropic/us would pay for on every message.
function buildFullCollectionExport(games) {
  const owned = games.filter((g) => g.status === "owned");
  const wishlist = games.filter((g) => g.status === "wishlist");
  const onlyPlayed = games.filter((g) => g.status === "none");

  const gameLine = (g) => {
    const tags = [...(g.categories || []), ...(g.mechanisms || [])].join(", ") || "-";
    const players2 = g.minPlayers ? `${g.minPlayers}-${g.maxPlayers} Spieler${formatBestPlayers(g) ? ` (am besten zu ${formatBestPlayers(g)})` : ""}` : "unbekannt";
    const time = g.minTime ? `${g.minTime}-${g.maxTime} Min.` : "unbekannt";
    const comp = complexityLabel(g) ? `${complexityLabel(g)} (${g.complexity}/5)` : "unbekannt";
    const rating = g.rating ? `${g.rating}/10` : "keine";
    const base = g.expansionOf ? games.find((x) => x.id === g.expansionOf) : null;
    const expansionNote = base ? ` | Erweiterung von: ${base.name}` : "";
    const expansions = games.filter((x) => x.expansionOf === g.id).map((x) => x.name);
    const expansionsNote = expansions.length ? ` | Eigene Erweiterungen: ${expansions.join(", ")}` : "";
    const format = g.format === "digital" ? " | Digital besessen" : "";
    const desc = g.summary ? `\n  Beschreibung: ${g.summary.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim()}` : "";
    return `- ${g.name}${g.germanName && g.germanName !== g.name ? ` (${g.germanName})` : ""} (${g.year || "?"}) | ${(g.publishers || []).join(", ") || "Verlag unbekannt"} | ${players2} | ${time} | Komplexität: ${comp} | Bewertung: ${rating} | Themen: ${tags}${format}${expansionNote}${expansionsNote}${desc}`;
  };

  return `SPIELREGAL-SAMMLUNGSEXPORT (erzeugt am ${new Date().toLocaleDateString("de-DE")})
Dies ist eine Übersicht einer Brettspielsammlung, exportiert aus der App "Spielregal". Nutze sie, um Fragen zur Sammlung zu beantworten. Enthält bewusst keine Partien-Historie oder sonstige persönlichen Daten — nur die Spiele selbst.

=== IM BESITZ (${owned.length}) ===
${owned.map(gameLine).join("\n") || "keine"}

=== WUNSCHLISTE (${wishlist.length}) ===
${wishlist.map(gameLine).join("\n") || "keine"}

${onlyPlayed.length > 0 ? `=== NUR GESPIELT, NICHT IM BESITZ (${onlyPlayed.length}) ===\n${onlyPlayed.map(gameLine).join("\n")}` : ""}`;
}

function buildCollectionContextForAI(games, plays) {
  const owned = games.filter((g) => g.status !== "wishlist");
  const playCounts = {};
  plays.forEach((p) => { playCounts[p.gameId] = (playCounts[p.gameId] || 0) + 1; });
  // Keep the context focused: prioritize games with a real description or recent
  // play activity so the model reasons over relevant, well-described games first.
  const sorted = [...owned].sort((a, b) => {
    const scoreA = (a.summary ? 2 : 0) + (playCounts[a.id] ? 1 : 0);
    const scoreB = (b.summary ? 2 : 0) + (playCounts[b.id] ? 1 : 0);
    return scoreB - scoreA;
  });
  const capped = sorted.slice(0, 60);
  const lines = capped.map((g) => {
    const count = playCounts[g.id] || 0;
    const tags = [...(g.categories || []), ...(g.mechanisms || [])].slice(0, 4).join(", ");
    const players = g.minPlayers ? `${g.minPlayers}-${g.maxPlayers} Spieler` : "Spieleranzahl unbekannt";
    const time = g.minTime ? `${g.minTime}-${g.maxTime} Min.` : "Dauer unbekannt";
    const comp = complexityLabel(g) || "Komplexität unbekannt";
    const rating = g.rating ? `, deine Bewertung ${g.rating}/10` : "";
    const sale = g.saleStatus === "sold" ? " | STATUS: bereits verkauft" : g.saleStatus === "forSale" ? " | STATUS: zum Verkauf markiert" : "";
    const desc = g.summary ? ` | Beschreibung: ${g.summary.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim().slice(0, 220)}` : "";
    return `- ${g.name} | ${players} | ${time} | ${comp} | Themen: ${tags || "-"} | ${count}× gespielt${count === 0 ? " (noch nie gespielt)" : ""}${rating}${sale}${desc}`;
  });
  const recentPlays = [...plays].sort((a, b) => (b.date || "").localeCompare(a.date || "")).slice(0, 8)
    .map((p) => `${p.gameName} am ${formatDate(p.date)}`).join("; ");
  const omittedNote = sorted.length > capped.length ? `\n(${sorted.length - capped.length} weitere Spiele mit weniger Info nicht aufgeführt, um fokussiert zu bleiben.)` : "";
  const wishlist = games.filter((g) => g.status === "wishlist");
  const wishlistLine = wishlist.length > 0 ? `\n\nAuf der Wunschliste: ${wishlist.map((g) => g.name).join(", ")}` : "";
  return `Sammlung des Nutzers (${owned.length} Spiele im Besitz):\n${lines.join("\n")}${omittedNote}\n\nZuletzt gespielt: ${recentPlays || "noch keine Partien eingetragen"}${wishlistLine}`;
}

async function aiChat(workerUrl, messages, temperature = 0.9) {
  const res = await fetch(workerUrl.replace(/\/$/, ""), {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ messages, temperature }),
  });
  if (!res.ok) {
    let detail = "";
    try { detail = (await res.text()).slice(0, 150); } catch { /* ignore */ }
    throw new Error(`KI-Worker antwortete mit Fehler ${res.status}${detail ? ": " + detail : ""}`);
  }
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return (json.text || "").trim();
}

// Suggests which candidate games best fit an existing list, based on the
// list's name and whatever's already in it (theme inferred from both).
async function aiSuggestForList(workerUrl, listName, gamesInList, candidates) {
  const describe = (g) => `${g.name} (${g.minPlayers || "?"}-${g.maxPlayers || "?"} Sp., ${complexityLabel(g) || "?"}, ${[...(g.categories || []), ...(g.mechanisms || [])].slice(0, 3).join(", ") || "-"})`;
  const prompt = `Eine Liste in einer Brettspielsammlung heißt "${listName}".
${gamesInList.length ? `Bereits enthaltene Spiele: ${gamesInList.map(describe).join("; ")}` : "Die Liste ist noch leer — leite das Thema nur vom Namen ab."}

Kandidaten, die noch nicht in der Liste sind:
${candidates.map(describe).join("\n")}

Welche der Kandidaten passen inhaltlich gut zu dieser Liste (Thema/Anlass/Spieleranzahl)? Antworte NUR mit den exakten Namen, kommagetrennt, ohne weitere Erklärung. Falls nichts wirklich passt, antworte mit "keine".`;

  const raw = await aiChat(workerUrl, [{ role: "user", content: prompt }]);
  if (/^keine\.?$/i.test(raw.trim())) return [];
  return raw.split(",").map((s) => s.trim()).filter(Boolean);
}

// Fetches ALL plays BGG has stored for a username (paginated, 100 per page,
// oldest requests slowed down slightly to stay within BGG's rate limit).
async function bggFetchAllPlays(username) {
  let page = 1;
  const all = [];
  let incomplete = false;
  while (true) {
    const url = `https://shiny-grass-80ec.contact-mdinh.workers.dev/xmlapi2/plays?username=${encodeURIComponent(username)}&page=${page}`;
    let text = null;
    // BGG occasionally answers a page with a transient 500/503 under load —
    // retry a few times with backoff. If it still won't budge, stop paging
    // here but keep everything gathered so far rather than losing it all.
    for (let attempt = 1; attempt <= 4; attempt++) {
      let res;
      try { res = await fetch(url); } catch { res = null; }
      if (res && res.ok) { text = await res.text(); break; }
      if (attempt === 4) {
        if (page === 1) throw new Error("BGG-Partien konnten nicht geladen werden — Nutzername oder Verbindung prüfen");
        incomplete = true;
      } else {
        await new Promise((r) => setTimeout(r, 1500 * attempt));
      }
    }
    if (text === null) break; // gave up on this page after retries — stop here, keep what we have
    const xml = new DOMParser().parseFromString(text, "text/xml");
    const playEls = Array.from(xml.getElementsByTagName("play"));
    if (playEls.length === 0) break;
    playEls.forEach((el) => {
      const itemEl = el.getElementsByTagName("item")[0];
      const playerEls = Array.from(el.getElementsByTagName("player"));
      const commentsEl = el.getElementsByTagName("comments")[0];
      all.push({
        bggPlayId: el.getAttribute("id"),
        date: el.getAttribute("date"),
        quantity: Math.max(1, parseInt(el.getAttribute("quantity"), 10) || 1),
        objectid: itemEl ? itemEl.getAttribute("objectid") : "",
        itemName: itemEl ? itemEl.getAttribute("name") : "",
        comments: commentsEl ? commentsEl.textContent : "",
        players: playerEls.map((pl) => ({
          name: pl.getAttribute("name") || pl.getAttribute("username") || "",
          win: pl.getAttribute("win") === "1",
        })),
      });
    });
    if (playEls.length < 100) break;
    page++;
    await new Promise((r) => setTimeout(r, 1200)); // stay well under BGG's rate limit
  }
  all.incomplete = incomplete;
  return all;
}
