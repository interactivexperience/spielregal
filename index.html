const DEFAULT_DASHBOARD_ORDER = ["month", "achievements", "records", "bestof", "wishlist", "topRated", "dust", "digital"];

function DashboardReorderScreen({ order, sections, labels, onSave, onClose }) {
  const [items, setItems] = useState(order.filter((key) => sections[key]));
  const dragIndex = React.useRef(null);
  const [draggingKey, setDraggingKey] = useState(null);
  const itemRefs = React.useRef({});

  const moveItem = (from, to) => {
    setItems((prev) => {
      const next = [...prev];
      const [moved] = next.splice(from, 1);
      next.splice(to, 0, moved);
      return next;
    });
  };

  const handleTouchStart = (idx) => {
    dragIndex.current = idx;
    setDraggingKey(items[idx]);
  };
  const handleTouchMove = (e) => {
    if (dragIndex.current === null) return;
    const touchY = e.touches[0].clientY;
    items.forEach((key, idx) => {
      if (idx === dragIndex.current) return;
      const el = itemRefs.current[key];
      if (!el) return;
      const rect = el.getBoundingClientRect();
      const mid = rect.top + rect.height / 2;
      if ((touchY < mid && idx < dragIndex.current) || (touchY > mid && idx > dragIndex.current)) {
        moveItem(dragIndex.current, idx);
        dragIndex.current = idx;
      }
    });
  };
  const handleTouchEnd = () => {
    dragIndex.current = null;
    setDraggingKey(null);
  };

  return (
    <div className="fixed inset-0 z-[80] bg-[#1C1B1A] flex flex-col">
      <div className="shrink-0 border-b border-[#3A3631] px-5 flex items-center justify-between" style={{ paddingTop: "max(1rem, env(safe-area-inset-top))", paddingBottom: "1rem" }}>
        <button onClick={onClose} className="text-[#A39C8F] p-1" aria-label="Abbrechen"><ChevronLeft size={22} /></button>
        <h2 className="font-display text-xl text-[#F2EDE4]">Neu anordnen</h2>
        <button onClick={() => onSave(items)} className="text-[#6C7FE0] text-sm font-medium px-2 py-1">Fertig</button>
      </div>
      <p className="shrink-0 text-xs text-[#5C574F] px-5 pt-3 pb-1">Am Griff-Symbol ziehen, um die Reihenfolge zu ändern.</p>
      <div className="flex-1 overflow-y-auto p-4 space-y-2" style={{ touchAction: draggingKey ? "none" : "auto" }}>
        {items.map((key, idx) => (
          <div
            key={key}
            ref={(el) => { itemRefs.current[key] = el; }}
            className="flex items-center gap-3 bg-[#262422] border rounded-[14px] px-3.5 h-14"
            style={{
              borderColor: draggingKey === key ? "#6C7FE0" : "#3A3631",
              transform: draggingKey === key ? "scale(1.03)" : "none",
              boxShadow: draggingKey === key ? "0 8px 20px rgba(0,0,0,0.4)" : "none",
              zIndex: draggingKey === key ? 10 : 1,
              transition: "border-color .15s, transform .15s, box-shadow .15s",
            }}
          >
            <span className="text-sm text-[#F2EDE4] flex-1">{labels[key] || key}</span>
            <div
              className="text-[#5C574F] p-2 -mr-2"
              onTouchStart={() => handleTouchStart(idx)}
              onTouchMove={handleTouchMove}
              onTouchEnd={handleTouchEnd}
            >
              <GripVertical size={18} />
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function Dashboard({ games, plays, onQuickFilter, onView, sectionOrder, onReorder, onSearch, aiWorkerUrl }) {
  const owned = games.filter(g => g.status === "owned");
  const playCounts = useMemo(() => {
    const map = {}; plays.forEach(p => { map[p.gameId] = (map[p.gameId] || 0) + 1; }); return map;
  }, [plays]);
  const lastPlays = [...plays].sort((a, b) => (b.date || "").localeCompare(a.date || "")).slice(0, 6);
  const dustCollectors = owned.filter(g => !playCounts[g.id]).sort((a, b) => (a.addedDate || "").localeCompare(b.addedDate || "")).slice(0, 6);
  const topRated = [...owned].filter(g => g.rating).sort((a, b) => parseInt(b.rating) - parseInt(a.rating)).slice(0, 10);
  const complexGames = owned.filter(g => g.complexity);
  const avgComplexity = complexGames.length ? (complexGames.reduce((s, g) => s + parseFloat(g.complexity), 0) / complexGames.length).toFixed(1) : "—";
  const thirtyDaysAgo = new Date(); thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
  const recentPlayCounts = {};
  plays.forEach(p => { if (p.date && new Date(p.date) >= thirtyDaysAgo) recentPlayCounts[p.gameId] = (recentPlayCounts[p.gameId] || 0) + 1; });
  const topMonth = Object.entries(recentPlayCounts).sort((a, b) => b[1] - a[1])[0];
  const topMonthGame = topMonth ? games.find(g => g.id === topMonth[0]) : null;
  const tasteProfile = useMemo(() => {
    const rated = games.filter((g) => g.rating && parseFloat(g.rating) >= 8);
    const tally = {};
    rated.forEach((g) => { [...(g.mechanisms || []), ...(g.categories || [])].forEach((t) => { tally[t] = (tally[t] || 0) + 1; }); });
    return Object.entries(tally).sort((a, b) => b[1] - a[1]).slice(0, 8);
  }, [games]);
  const digitalCount = plays.filter(p => p.mode === "bga").length;
  const physicalCount = plays.filter(p => p.mode !== "bga").length;
  const genreMix = useMemo(() => {
    const tally = {};
    owned.forEach(g => (g.categories || []).forEach(c => { tally[c] = (tally[c] || 0) + 1; }));
    return Object.entries(tally).sort((a, b) => b[1] - a[1]).slice(0, 7);
  }, [owned]);
  const findGame = (id) => games.find(g => g.id === id);

  const mostPlayed = useMemo(() => {
    const entries = Object.entries(playCounts).sort((a, b) => b[1] - a[1])[0];
    return entries ? { game: findGame(entries[0]), count: entries[1] } : null;
  }, [playCounts, games]);

  // Echte persönliche Rekorde aus dem tatsächlichen Spielverhalten — jeder erscheint erst, wenn er wirklich erreicht wurde.
  const bestDay = useMemo(() => {
    const tally = {};
    plays.forEach(p => { if (p.date) tally[p.date] = (tally[p.date] || 0) + 1; });
    const entry = Object.entries(tally).sort((a, b) => b[1] - a[1])[0];
    return entry && entry[1] >= 2 ? { date: entry[0], count: entry[1] } : null;
  }, [plays]);
  const bestStreak = useMemo(() => {
    const dates = [...new Set(plays.map(p => p.date).filter(Boolean))].sort();
    let best = 1, cur = 1;
    for (let i = 1; i < dates.length; i++) {
      const diff = (new Date(dates[i]) - new Date(dates[i - 1])) / 86400000;
      cur = diff === 1 ? cur + 1 : 1;
      best = Math.max(best, cur);
    }
    return dates.length && best >= 2 ? best : null;
  }, [plays]);
  const biggestPlayGroup = useMemo(() => {
    const sizes = plays.map(p => (p.players || "").split(",").map(s => s.trim()).filter(Boolean).length).filter(n => n > 0);
    const max = sizes.length ? Math.max(...sizes) : 0;
    return max >= 2 ? max : null;
  }, [plays]);

  const wishlist = games.filter(g => g.status === "wishlist").slice(0, 6);

  // Best-of: abgeleitet aus tatsächlich gespielten Partien, nicht nur aus der Sammlung.
  const bestOf = useMemo(() => {
    if (plays.length === 0) return null;
    const thisYear = new Date().getFullYear();
    const yearPlayCounts = {};
    plays.forEach(p => { if (p.date && new Date(p.date).getFullYear() === thisYear) yearPlayCounts[p.gameId] = (yearPlayCounts[p.gameId] || 0) + 1; });
    const topYearEntry = Object.entries(yearPlayCounts).sort((a, b) => b[1] - a[1])[0];
    const topYear = topYearEntry ? { game: findGame(topYearEntry[0]), count: topYearEntry[1] } : null;

    const playerCountTally = {};
    plays.forEach(p => { const n = (p.players || "").split(",").map(s => s.trim()).filter(Boolean).length; if (n > 0) playerCountTally[n] = (playerCountTally[n] || 0) + 1; });
    const favCountEntry = Object.entries(playerCountTally).sort((a, b) => b[1] - a[1])[0];

    const playedGameIds = [...new Set(plays.map(p => p.gameId))];
    const playedGames = playedGameIds.map(id => games.find(g => g.id === id)).filter(Boolean);
    const catTally = {}, mechTally = {};
    playedGames.forEach(g => {
      const count = plays.filter(p => p.gameId === g.id).length;
      (g.categories || []).forEach(c => { catTally[c] = (catTally[c] || 0) + count; });
      (g.mechanisms || []).forEach(m => { mechTally[m] = (mechTally[m] || 0) + count; });
    });
    const favCat = Object.entries(catTally).sort((a, b) => b[1] - a[1])[0];
    const favMech = Object.entries(mechTally).sort((a, b) => b[1] - a[1])[0];

    let complexitySum = 0, complexityCount = 0;
    playedGames.forEach(g => { if (g.complexity) { const c = plays.filter(p => p.gameId === g.id).length; complexitySum += parseFloat(g.complexity) * c; complexityCount += c; } });
    const avgPlayedComplexity = complexityCount ? complexitySum / complexityCount : null;
    const complexityLabelFromValue = avgPlayedComplexity == null ? null : avgPlayedComplexity < 2 ? "Familienspiel" : avgPlayedComplexity < 3.5 ? "Kennerspiel" : "Expertenspiel";

    return { topYear, favCount: favCountEntry ? { count: favCountEntry[0], times: favCountEntry[1] } : null, favCat, favMech, complexityLabel: complexityLabelFromValue, avgPlayedComplexity };
  }, [plays, games]);

  // Erfolge: rein aus vorhandenen Daten berechnet, kein zusätzlicher Speicherzustand nötig.
  const distinctPlayedGames = new Set(plays.map(p => p.gameId)).size;
  const distinctPlayedCategories = new Set(owned.filter(g => plays.some(p => p.gameId === g.id)).flatMap(g => g.categories || [])).size;
  const seriesCount = mostPlayed ? mostPlayed.count : 0;
  const allRated = owned.length > 0 && owned.every(g => g.rating);
  const campaignMastery = games.some(g => g.isCampaign && plays.filter(p => p.gameId === g.id).length >= 3);
  const achievements = [
    { id: "first", label: "Erste Partie", emoji: "🎉", unlocked: plays.length >= 1 },
    { id: "many", label: "Vielspieler", emoji: "🔥", unlocked: plays.length >= 10 },
    { id: "pro", label: "Spielprofi", emoji: "🏅", unlocked: plays.length >= 50 },
    { id: "collector", label: "Sammler", emoji: "📚", unlocked: owned.length >= 10 },
    { id: "megacollector", label: "Großsammler", emoji: "🏛️", unlocked: owned.length >= 25 },
    { id: "series", label: "Serientäter", emoji: "🔁", unlocked: seriesCount >= 5 },
    { id: "explorer", label: "Genre-Entdecker", emoji: "🧭", unlocked: distinctPlayedCategories >= 5 },
    { id: "variety", label: "Vielfalt", emoji: "🎨", unlocked: distinctPlayedGames >= 10 },
    { id: "campaign", label: "Kampagnen-Meister", emoji: "🗺️", unlocked: campaignMastery },
    { id: "rated", label: "Perfektionist", emoji: "⭐", unlocked: allRated },
  ].sort((a, b) => (b.unlocked === a.unlocked ? 0 : b.unlocked ? 1 : -1));

  const [justUnlocked, setJustUnlocked] = useState(null);
  const [weeklyTip, setWeeklyTip] = useState(() => { try { return JSON.parse(localStorage.getItem("spielregal:weeklyTip") || "null"); } catch { return null; } });
  const [yearlyInsight, setYearlyInsight] = useState(() => { try { return JSON.parse(localStorage.getItem("spielregal:yearlyInsight") || "null"); } catch { return null; } });
  const [tipLoading, setTipLoading] = useState(false);

  useEffect(() => {
    if (!aiWorkerUrl || plays.length === 0) return;
    const now = Date.now();
    const weekMs = 7 * 24 * 60 * 60 * 1000;
    const yearKey = new Date().getFullYear();

    const needsWeekly = !weeklyTip || (now - weeklyTip.generatedAt) > weekMs;
    const needsYearly = !yearlyInsight || yearlyInsight.year !== yearKey;
    if (!needsWeekly && !needsYearly) return;

    (async () => {
      setTipLoading(true);
      const context = buildCollectionContextForAI(games, plays);
      try {
        if (needsWeekly) {
          const text = await aiChat(aiWorkerUrl, [{ role: "user", content: `Du bist ein Brettspiel-Kumpel. Schreib EINEN kurzen, persönlichen Tipp (max. 2 Sätze) auf Deutsch für diese Woche, basierend auf dem Spielverhalten unten — z.B. ein Spiel, das lange nicht dran war, ein Muster das auffällt, oder eine Ermutigung. Kein Grußwort, direkt der Tipp.\n\n${context}` }]);
          const val = { text, generatedAt: now };
          setWeeklyTip(val);
          localStorage.setItem("spielregal:weeklyTip", JSON.stringify(val));
        }
        if (needsYearly) {
          const text = await aiChat(aiWorkerUrl, [{ role: "user", content: `Du bist ein Brettspiel-Kumpel. Schreib EINE kurze, interessante Beobachtung (max. 2-3 Sätze) auf Deutsch über das Spieljahr ${yearKey} des Nutzers, basierend auf den Daten unten — z.B. ein Muster, eine Entwicklung, ein Rekord. Kein Grußwort, direkt die Beobachtung.\n\n${context}` }]);
          const val = { text, year: yearKey, generatedAt: now };
          setYearlyInsight(val);
          localStorage.setItem("spielregal:yearlyInsight", JSON.stringify(val));
        }
      } catch { /* silently skip — these are a nice-to-have, not critical */ }
      setTipLoading(false);
    })();
  }, [aiWorkerUrl, plays.length]);
  const unlockedIdsKey = achievements.filter((a) => a.unlocked).map((a) => a.id).sort().join(",");
  useEffect(() => {
    const seenKey = "spielregal:seenAchievements";
    const seen = new Set(JSON.parse(localStorage.getItem(seenKey) || "[]"));
    const unlockedIds = unlockedIdsKey ? unlockedIdsKey.split(",") : [];
    const newlyUnlocked = unlockedIds.filter((id) => !seen.has(id));
    if (newlyUnlocked.length > 0 && seen.size > 0) { // skip the very first load so old data doesn't all "celebrate" at once
      const first = achievements.find((a) => a.id === newlyUnlocked[0]);
      if (first) {
        setJustUnlocked(first);
        haptic([12, 50, 12, 50, 25]);
        setTimeout(() => setJustUnlocked(null), 3200);
      }
    }
    localStorage.setItem(seenKey, JSON.stringify(unlockedIds));
  }, [unlockedIdsKey]);

  // Kontextuelle Vorschläge: das am längsten wartende Spiel mit einer kleinen freundlichen Nachricht.

  const sections = {
    month: topMonthGame && (
      <button key="month" onClick={() => onView(topMonthGame)} className="w-full text-left bg-[#262422] border border-[#3A3631] rounded-xl px-3.5 py-2.5 flex items-center gap-2.5">

        <div className="min-w-0 flex-1">

          <p className="text-[#F2EDE4] font-body text-sm font-medium truncate">{topMonthGame.name} <span className="text-[#5C574F] font-normal">· {topMonth[1]}× diesen Monat</span></p>
        </div>
      </button>
    ),
    achievements: (
      <div key="achievements">
        <h2 className="font-body text-sm font-semibold text-[#A39C8F] uppercase tracking-wide mb-2">Erfolge</h2>
        <div className="flex gap-3 overflow-x-auto pb-1 px-1">
          {achievements.map((a, i) => {
            const palette = ["#6C7FE0", "#E85D9C", "#4E8C82", "#C1443C", "#8B5FBF"];
            const c = palette[i % palette.length];
            return (
              <div key={a.id} className="shrink-0 flex flex-col items-center gap-1.5 w-16 text-center">
                <div className={`w-14 h-14 rounded-full flex items-center justify-center text-2xl ${a.unlocked ? "" : "grayscale"}`}
                  style={a.unlocked ? {
                    background: `radial-gradient(circle at 32% 26%, ${c}f0, ${c}99 55%, ${c}cc 100%)`,
                    boxShadow: `0 3px 8px ${c}66, 0 1px 0 rgba(255,255,255,0.25) inset, 0 -4px 8px rgba(0,0,0,0.3) inset`,
                    border: `1px solid ${c}`,
                  } : {
                    background: "#242220",
                    boxShadow: "0 -3px 6px rgba(0,0,0,0.3) inset",
                    border: "1px solid #3A3631",
                    opacity: 0.35,
                  }}>
                  {a.emoji}
                </div>
                <p className={`text-[10px] leading-tight ${a.unlocked ? "text-[#F2EDE4]" : "text-[#5C574F]"}`}>{a.label}</p>
              </div>
            );
          })}
        </div>
      </div>
    ),
    bestof: bestOf && (
      <div key="bestof">
        <h2 className="font-body text-sm font-semibold text-[#A39C8F] uppercase tracking-wide mb-2">Best of</h2>
        {plays.length < 5 ? (
          <p className="text-xs text-[#5C574F]">Trag noch ein paar mehr Partien ein, dann zeigen wir dir hier deine Vorlieben.</p>

          {bestOf.topYear && bestOf.topYear.game && (

              <p className="text-[10px] text-[#5C574F] font-body mb-1">📅 Meistgespielt {new Date().getFullYear()}</p>
              <p className="text-[#F2EDE4] text-sm font-body font-medium truncate">{bestOf.topYear.game.name}</p>
              <p className="text-[#6C7FE0] text-xs font-mono">{bestOf.topYear.count}× dieses Jahr</p>
            </button>

              <p className="text-[10px] text-[#5C574F] font-body mb-1">👤 Liebste Spielerzahl</p>
              <p className="text-[#F2EDE4] text-sm font-body font-medium">{bestOf.favCount.count} Spieler</p>
              <p className="text-[#E85D9C] text-xs font-mono">{bestOf.favCount.times}× so gespielt</p>

              <p className="text-[#4E8C82] text-xs font-mono">am häufigsten gespielt</p>
            </div>
          )}
          {bestOf.favMech && (
            <div className="bg-[#262422] border border-[#3A3631] rounded-2xl p-3">
              <p className="text-[10px] text-[#5C574F] font-body mb-1">⚙️ Lieblingsmechanismus</p>
              <p className="text-[#F2EDE4] text-sm font-body font-medium truncate">{bestOf.favMech[0]}</p>
              <p className="text-[#C1443C] text-xs font-mono">am häufigsten gespielt</p>
            </div>
          )}
          {bestOf.complexityLabel && (
            <div className="bg-[#262422] border border-[#3A3631] rounded-2xl p-3">
              <p className="text-[10px] text-[#5C574F] font-body mb-1">{COMPLEXITY_SHORT[bestOf.complexityLabel] === "Familie" ? "🏠" : COMPLEXITY_SHORT[bestOf.complexityLabel] === "Kenner" ? "🧩" : "🧠"} Deine Komplexität</p>
              <p className="text-[#F2EDE4] text-sm font-body font-medium">{COMPLEXITY_SHORT[bestOf.complexityLabel]}</p>
              <p className="text-[#A39C8F] text-xs font-mono">Ø {bestOf.avgPlayedComplexity.toFixed(1)}/5 gespielt</p>
            </div>

        </div>
        )}
      </div>
    ),
    records: (mostPlayed || bestDay || bestStreak || biggestPlayGroup) && (

        <div className="grid grid-cols-2 gap-2.5">
          {mostPlayed && mostPlayed.game && mostPlayed.count >= 2 && (
            <button onClick={() => onView(mostPlayed.game)} className="text-left bg-[#262422] rounded-2xl p-4 border-l-[3px]" style={{ borderColor: "#6C7FE0" }}>
              <div className="flex items-baseline gap-2">
                <span className="text-lg">🏆</span>

            </button>
          )}
          {bestStreak && (
            <div className="bg-[#262422] rounded-2xl p-4 border-l-[3px]" style={{ borderColor: "#C1443C" }}>
              <div className="flex items-baseline gap-2">
                <span className="text-lg">🔥</span>
                <p className="font-display text-2xl text-[#F2EDE4]">{bestStreak}</p>
              </div>
              <p className="text-xs text-[#A39C8F] mt-1.5">Tage-Serie am Stück</p>
            </div>
          )}
          {bestDay && (
            <div className="bg-[#262422] rounded-2xl p-4 border-l-[3px]" style={{ borderColor: "#4E8C82" }}>

              <TextWithGameLinks text={yearlyInsight.text} games={games} onView={onView} color="#E85D9C" />
            </div>

        </div>
      )}
      {tasteProfile.length > 0 && (
        <div className="rounded-3xl p-5 border border-[#6C7FE0]/25 glass" style={{ backgroundImage: "radial-gradient(circle at 85% 100%, rgba(108,127,224,0.18), transparent 60%)" }}>
          <p className="text-xs font-semibold text-[#8B9AFA] uppercase tracking-wide mb-3 flex items-center gap-1.5"><Sparkles size={13} /> Dein Geschmack</p>
          {(() => {
            const TopIcon = tagIcon(tasteProfile[0][0]);
            return (
              <div className="flex items-center gap-3 mb-4">
                <div className="w-11 h-11 rounded-full bg-[#6C7FE0]/20 border border-[#6C7FE0]/40 flex items-center justify-center text-[#8B9AFA] shrink-0">
                  <TopIcon size={19} />

                <div className="min-w-0">
                  <p className="text-[#F2EDE4] font-display text-xl leading-tight truncate">{tasteProfile[0][0]}</p>
                  <p className="text-[#5C574F] text-xs font-body">Dein Lieblingsthema · {tasteProfile[0][1]}× bei deinen 8+-Bewertungen</p>
                </div>
              </div>
            );
          })()}
          {tasteProfile.length > 1 && (
            <div className="flex flex-wrap gap-1.5">
              {tasteProfile.slice(1).map(([tag, weight]) => {
                const TIcon = tagIcon(tag);
                return (
                  <span key={tag} className="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs bg-[#1C1B1A]/50 border border-[#3A3631] text-[#A39C8F] font-body">

}

/* ---------------- ADD GAMES TO LIST (search + toggle, Audible-style) ---------------- */
function AddGamesToListModal({ games, plays, list, onToggle, onClose, aiWorkerUrl }) {
  const [query, setQuery] = useState("");
  const [aiPicks, setAiPicks] = useState(null); // null = not run, [] = run but no matches, [...] = matched names
  const [aiLoading, setAiLoading] = useState(false);
  const [aiError, setAiError] = useState("");
  const filtered = games.filter((g) => g.name.toLowerCase().includes(query.toLowerCase()));

  const runAiSuggest = async () => {
    setAiLoading(true); setAiError("");
    try {
      const gamesInList = games.filter((g) => list.gameIds.includes(g.id));
      const candidates = games.filter((g) => !list.gameIds.includes(g.id));
      const picks = await aiSuggestForList(aiWorkerUrl, list.name, gamesInList, candidates);
      setAiPicks(picks);
      haptic(8);
    } catch (e) { setAiError(e.message || "Fehlgeschlagen"); }
    finally { setAiLoading(false); }
  };

  return (
    <div className="fixed top-0 left-0 right-0 bg-black/70 z-[65] flex items-end sm:items-center justify-center p-0 sm:p-6" style={{ height: "var(--app-height, 100dvh)", top: "var(--app-offset-top, 0px)" }} onClick={onClose}>
      <div className="bg-[#1C1B1A] border border-[#3A3631] rounded-t-2xl sm:rounded-2xl w-full sm:max-w-sm max-h-[var(--app-height,100dvh)] flex flex-col rise-in font-body" onClick={(e) => e.stopPropagation()}>
        <div className="shrink-0 border-b border-[#3A3631] px-5 py-4 flex items-center justify-between">
          <h2 className="font-display text-xl text-[#F2EDE4]">Spiele hinzufügen</h2>
          <button onClick={onClose} className="text-[#A39C8F] p-1"><X size={22} /></button>
        </div>
        <div className="shrink-0 p-4 border-b border-[#3A3631] space-y-2.5">
          <div className="relative">
            <Search size={16} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#5C574F]" />
            <input onFocus={handleFocusScroll} value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Suchen…"
              className="w-full h-11 bg-[#262422] border border-[#3A3631] rounded-[14px] pl-10 pr-3.5 text-[#F2EDE4] text-sm focus:outline-none focus:border-[#6C7FE0]" />
          </div>
          {aiWorkerUrl && (
            <button onClick={runAiSuggest} disabled={aiLoading} className="w-full h-10 rounded-[14px] text-xs font-medium bg-[#6C7FE0]/15 text-[#6C7FE0] disabled:opacity-50 flex items-center justify-center gap-1.5">
              {aiLoading ? <Loader2 size={12} /> : <Sparkles size={12} />} Passende Spiele von KI hervorheben lassen
            </button>
          )}
          {aiError && <p className="text-[11px] text-[#C1443C]">{aiError}</p>}
          {aiPicks && aiPicks.length === 0 && !aiLoading && <p className="text-[11px] text-[#5C574F]">Keine der übrigen Spiele passt der KI zufolge besonders gut.</p>}
        </div>
        <div className="p-4 overflow-y-auto flex-1 space-y-2">
          {filtered.length === 0 && <p className="text-sm text-[#5C574F] px-1">Keine Spiele gefunden.</p>}
          {filtered.map((g) => {
            const checked = list.gameIds.includes(g.id);
            const playCount = (plays || []).filter((p) => p.gameId === g.id).length;
            const isPlayed = playCount > 0;
            const aiMatch = aiPicks && aiPicks.includes(g.name);
            return (
              <button key={g.id} onClick={() => onToggle(g.id)}
                className={`w-full flex items-center gap-3 px-2 py-2 rounded-[14px] bg-[#262422] border ${aiMatch ? "border-[#6C7FE0]" : "border-[#3A3631]"} ${isPlayed ? "opacity-60" : ""}`}
                style={aiMatch ? { boxShadow: "0 0 0 1px #6C7FE0, 0 0 16px rgba(108,127,224,0.35)" } : undefined}>
                <Cover game={g} size="sm" />
                <div className="flex-1 min-w-0 text-left">
                  <p className="text-sm text-[#F2EDE4] truncate flex items-center gap-1.5">
                    {g.name}
                    {aiMatch && <Sparkles size={11} className="text-[#6C7FE0] shrink-0" />}
                  </p>
                  <div className="flex items-center gap-1.5 mt-0.5 flex-wrap">
                    {g.status === "owned" && <Pill tone="teal">Besitz</Pill>}
                    {g.status === "wishlist" && <Pill tone="amber">Wunschliste</Pill>}
                    {isPlayed && <span className="text-[10px] text-[#5C574F] font-body">{playCount}× gespielt</span>}
                  </div>
                </div>
                <div className={`w-6 h-6 rounded-full border flex items-center justify-center shrink-0 ${checked ? "bg-[conic-gradient(from_0deg,#ff5a96,#ffc850,#78dcff,#b482ff,#ff5a96)] border-transparent" : "border-[#3A3631]"}`}>
                  {checked && <Check size={14} className="text-[#F2EDE4]" />}
                </div>
              </button>
            );
          })}
        </div>
        <div className="shrink-0 p-4 border-t border-[#3A3631]">
          <button onClick={onClose} className="w-full h-12 bg-[#262422] border border-[#3A3631] text-[#F2EDE4] rounded-[14px] font-medium">Fertig</button>
        </div>
      </div>
    </div>
  );
}

/* ---------------- LIST DETAIL PAGE (view/add/remove games, delete the list) ---------------- */
function ListDetailModal({ list, games, plays, onClose, onView, onEdit, onDeleteList, onToggleGame, demoMode }) {
  const [addOpen, setAddOpen] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [contextGame, setContextGame] = useState(null);
  const longPressTimer = React.useRef(null);
  const longPressFired = React.useRef(false);
  const listGames = list.gameIds.map((id) => games.find((g) => g.id === id)).filter(Boolean);
  const playCounts = useMemo(() => {
    const map = {}; plays.forEach((p) => { map[p.gameId] = (map[p.gameId] || 0) + 1; }); return map;
  }, [plays]);
  const startLongPress = (g) => {
    if (demoMode) return;
    longPressFired.current = false;
    longPressTimer.current = setTimeout(() => { longPressFired.current = true; setContextGame(g); }, 500);
  };
  const cancelLongPress = () => { if (longPressTimer.current) clearTimeout(longPressTimer.current); };

  return (
    <div className="fixed inset-0 z-[55] bg-[#1C1B1A]">
      <div className="w-full h-full max-w-3xl mx-auto flex flex-col overflow-hidden">
        <div className="shrink-0 border-b border-[#3A3631] px-5 flex items-center justify-between" style={{ paddingTop: "max(1rem, env(safe-area-inset-top))", paddingBottom: "1rem" }}>
          <button onClick={onClose} className="text-[#A39C8F] p-1" aria-label="Zurück"><ChevronLeft size={22} /></button>
          <h2 className="font-display text-xl text-[#F2EDE4] truncate px-2">{list.name}</h2>
          {!demoMode ? (
            <button onClick={() => setConfirmDelete(true)} className="text-[#C1443C] p-1.5 bg-[#262422] border border-[#3A3631] rounded-full" aria-label="Liste löschen"><Trash2 size={16} /></button>
          ) : <span className="w-8" />}
        </div>
        {confirmDelete && (
          <div className="shrink-0 bg-[#C1443C]/15 border-b border-[#C1443C]/30 px-5 py-3 flex items-center justify-between gap-3">
            <p className="text-sm text-[#F2EDE4]">Liste "{list.name}" wirklich löschen?</p>
            <div className="flex gap-2 shrink-0">
              <button onClick={() => setConfirmDelete(false)} className="h-9 px-3 rounded-lg bg-[#262422] border border-[#3A3631] text-[#F2EDE4] text-xs">Abbrechen</button>
              <button onClick={() => { onDeleteList(list.id); onClose(); }} className="h-9 px-3 rounded-lg bg-[#C1443C] text-[#F2EDE4] text-xs font-medium">Löschen</button>
            </div>
          </div>
        )}
        <div className="flex-1 overflow-y-auto p-5">
          {!demoMode && (
            <button onClick={() => setAddOpen(true)} className="w-full h-12 mb-4 flex items-center justify-center gap-2 bg-[conic-gradient(from_0deg,#ff5a96,#ffc850,#78dcff,#b482ff,#ff5a96)] text-[#F2EDE4] rounded-[14px] font-medium">
              <Plus size={16} /> Spiele hinzufügen
            </button>
          )}
          {listGames.length === 0 ? (
            <p className="text-[#5C574F] text-sm text-center mt-8">Noch keine Spiele in dieser Liste.</p>
          ) : (
            <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
              {listGames.map((g) => (
                <button
                  key={g.id}
                  onClick={() => { if (longPressFired.current) { longPressFired.current = false; return; } onView(g); }}
                  onTouchStart={() => startLongPress(g)}
                  onTouchEnd={cancelLongPress}
                  onTouchMove={cancelLongPress}
                  className="text-left bg-[#262422] border border-[#3A3631] rounded-2xl p-3 flex flex-col"
                >
                  <Cover game={g} size="lg" />
                  <p className="font-body text-[#F2EDE4] text-sm font-medium mt-2 leading-tight truncate">{g.name}</p>
                  <div className="flex items-center gap-1.5 mt-1.5 flex-wrap">
                    {g.minPlayers && <span className="flex items-center gap-0.5 text-[10px] text-[#A39C8F] font-mono"><Users size={10} /> {g.minPlayers}-{g.maxPlayers}</span>}
                    {!playCounts[g.id] && g.status === "owned" && <Pill tone="amber">ungespielt</Pill>}
                  </div>
                </button>
              ))}
            </div>
          )}
        </div>
      </div>
      {addOpen && (
        <AddGamesToListModal games={games} plays={plays} list={list} onToggle={(gameId) => onToggleGame(list.id, gameId)} onClose={() => setAddOpen(false)} />
      )}

function Collection({ games, plays, filterFn, clearFilter, onAdd, onView, onEdit, onDelete, categoryOptions, mechanismOptions, demoMode, lists, onCreateList, onOpenList }) {
  const [query, setQuery] = useState("");
  const [searchOpen, setSearchOpen] = useState(false);
  const [gridCols, setGridCols] = useState(2);
  const [statusFilter, setStatusFilter] = useState("owned");
  const [filterModalOpen, setFilterModalOpen] = useState(false);
  const [filters, setFilters] = useState({ categories: [], mechanisms: [], publishers: [], players: "", minRating: "" });
  const [sortBy, setSortBy] = useState("name-asc");
  const [contextGame, setContextGame] = useState(null);
  const [newListName, setNewListName] = useState("");
  const [createListOpen, setCreateListOpen] = useState(false);
  const longPressTimer = React.useRef(null);
  const longPressFired = React.useRef(false);
  const startLongPress = (g) => {
    if (demoMode) return;
    longPressFired.current = false;
    longPressTimer.current = setTimeout(() => { longPressFired.current = true; setContextGame(g); }, 500);
  };
  const cancelLongPress = () => { if (longPressTimer.current) clearTimeout(longPressTimer.current); };
  const activeFilterCount = filters.categories.length + filters.mechanisms.length + filters.publishers.length + (filters.players ? 1 : 0) + (filters.minRating ? 1 : 0) + (statusFilter !== "owned" ? 1 : 0);
  const presentCategories = useMemo(() => {
    const counts = {};
    games.forEach((g) => (g.categories || []).forEach((c) => { counts[c] = (counts[c] || 0) + 1; }));
    return Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([tag]) => tag);
  }, [games]);
  const presentMechanisms = useMemo(() => {
    const counts = {};
    games.forEach((g) => (g.mechanisms || []).forEach((m) => { counts[m] = (counts[m] || 0) + 1; }));
    return Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([tag]) => tag);
  }, [games]);
  const presentPublishers = useMemo(() => {
    const counts = {};
    games.forEach((g) => (g.publishers || []).forEach((p) => { counts[p] = (counts[p] || 0) + 1; }));
    return Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([tag]) => tag);
  }, [games]);
  const playCounts = useMemo(() => {
    const map = {}; plays.forEach(p => { map[p.gameId] = (map[p.gameId] || 0) + 1; }); return map;
  }, [plays]);
  let list = games.filter(g => (statusFilter === "all" ? true : g.status === statusFilter));
  if (query) list = list.filter(g => g.name.toLowerCase().includes(query.toLowerCase()));
  if (filterFn) list = list.filter(filterFn);
  if (filters.categories.length) list = list.filter(g => filters.categories.every(c => (g.categories || []).includes(c)));
  if (filters.mechanisms.length) list = list.filter(g => filters.mechanisms.every(m => (g.mechanisms || []).includes(m)));
  if (filters.publishers.length) list = list.filter(g => filters.publishers.every(p => (g.publishers || []).includes(p)));
  if (filters.players) list = list.filter(g => g.minPlayers && g.maxPlayers && parseInt(filters.players) >= parseInt(g.minPlayers) && parseInt(filters.players) <= parseInt(g.maxPlayers));
  if (filters.minRating) list = list.filter(g => g.rating && parseInt(g.rating) >= parseInt(filters.minRating));

  list = [...list].sort((a, b) => {
    switch (sortBy) {
      case "name-asc": return a.name.localeCompare(b.name, "de");
      case "name-desc": return b.name.localeCompare(a.name, "de");
      case "rating-desc": return (parseFloat(b.rating) || 0) - (parseFloat(a.rating) || 0);
      case "rating-asc": return (parseFloat(a.rating) || 0) - (parseFloat(b.rating) || 0);
      case "plays-desc": return (playCounts[b.id] || 0) - (playCounts[a.id] || 0);
      case "added-desc": return (b.addedDate || "").localeCompare(a.addedDate || "");
      case "added-asc": return (a.addedDate || "").localeCompare(b.addedDate || "");
      case "complexity-desc": return (parseFloat(b.complexity) || 0) - (parseFloat(a.complexity) || 0);
      case "complexity-asc": return (parseFloat(a.complexity) || 0) - (parseFloat(b.complexity) || 0);
      default: return 0;
    }
  });

  return (
    <div className="p-5 pb-6 overflow-x-hidden min-h-full flex flex-col">

/* ---------------- SWIPEABLE ROW (swipe left to reveal delete) ---------------- */
function SwipeableRow({ onDelete, children, disabled }) {
  const [dragX, setDragX] = useState(0);
  const startX = React.useRef(0);
  const dragging = React.useRef(false);
  const REVEAL = 76;

  const onTouchStart = (e) => {
    if (disabled) return;
    startX.current = e.touches[0].clientX;
    dragging.current = true;
  };
  const onTouchMove = (e) => {
    if (!dragging.current || disabled) return;
    const delta = e.touches[0].clientX - startX.current;
    if (delta < 0) setDragX(Math.max(delta, -REVEAL - 20));
    else setDragX(0);
  };
  const onTouchEnd = () => {
    if (!dragging.current) return;
    dragging.current = false;
    const revealed = dragX < -REVEAL / 2;
    if (revealed) haptic(8);
    setDragX(revealed ? -REVEAL : 0);
  };

  return (
    <div className="relative overflow-hidden rounded-[14px]">
      <button
        onClick={() => { haptic(15); onDelete(); setDragX(0); }}
        className="absolute inset-y-0 right-0 w-[76px] bg-[#C1443C] text-white flex flex-col items-center justify-center gap-0.5 text-[10px]"
        aria-label="Löschen"
      >
        <Trash2 size={16} /> Löschen
      </button>
      <div
        onTouchStart={onTouchStart}
        onTouchMove={onTouchMove}
        onTouchEnd={onTouchEnd}
        style={{ transform: `translateX(${dragX}px)`, transition: dragging.current ? "none" : "transform 200ms" }}
        className="relative bg-[#1C1B1A]"
      >
        {children}
      </div>
    </div>
  );
}

function PlayLog({ plays, games, onAdd, onEdit, onDelete, demoMode }) {
  const [detailGroupKey, setDetailGroupKey] = useState(null);
  const [viewMode, setViewMode] = useState("game"); // "game" | "evening"
  const [detailEveningDate, setDetailEveningDate] = useState(null);
  const [searchOpen, setSearchOpen] = useState(false);
  const [query, setQuery] = useState("");
  const [filterModalOpen, setFilterModalOpen] = useState(false);
  const [filters, setFilters] = useState({ mode: "all", winner: "", from: "", to: "" });
  const modeIcon = { "physical-owned": Home, "physical-other": Sofa, bga: Globe };
  const modeLabel = { "physical-owned": "Eigene Sammlung", "physical-other": "Geliehen / Event", bga: "BoardGameArena" };
  const activeFilterCount = (filters.mode !== "all" ? 1 : 0) + (filters.winner ? 1 : 0) + (filters.from ? 1 : 0) + (filters.to ? 1 : 0);
  const allWinners = useMemo(() => {
    const names = new Set();
    plays.forEach((p) => { if (p.winner && p.winner.trim()) names.add(p.winner.trim()); });
    return [...names].sort();
  }, [plays]);

  let filteredPlays = plays;
  if (query.trim()) filteredPlays = filteredPlays.filter((p) => p.gameName.toLowerCase().includes(query.toLowerCase()));
  if (filters.mode !== "all") filteredPlays = filteredPlays.filter((p) => p.mode === filters.mode);
  if (filters.winner) filteredPlays = filteredPlays.filter((p) => (p.winner || "").trim() === filters.winner);
  if (filters.from) filteredPlays = filteredPlays.filter((p) => p.date && p.date >= filters.from);
  if (filters.to) filteredPlays = filteredPlays.filter((p) => p.date && p.date <= filters.to);

  const sorted = [...filteredPlays].sort((a, b) => (b.date || "").localeCompare(a.date || ""));

  // Plays from the same date grouped into one "evening" card, newest first.
  const eveningGroups = useMemo(() => {
    const byDate = new Map();
    sorted.forEach((p) => {
      const key = p.date || "Ohne Datum";
      if (!byDate.has(key)) byDate.set(key, []);
      byDate.get(key).push(p);
    });
    return Array.from(byDate.entries()).sort((a, b) => b[0].localeCompare(a[0]));
  }, [sorted]);

  // Same game's plays grouped together; groups ordered by their most recent play, newest first.
  const grouped = useMemo(() => {
    const byGame = new Map();
    sorted.forEach((p) => {
      const key = p.gameId || p.gameName;
      if (!byGame.has(key)) byGame.set(key, []);
      byGame.get(key).push(p); // sorted already comes newest-first, so this stays newest-first per group
    });
    const groups = Array.from(byGame.values());
    const todayStr = new Date().toISOString().slice(0, 10); // re-evaluated on every render, so "today" is always current
    groups.sort((a, b) => {
      const aToday = a.some((p) => p.date === todayStr);
      const bToday = b.some((p) => p.date === todayStr);
      if (aToday !== bToday) return aToday ? -1 : 1; // played today always floats to the top
      return b.length - a.length; // otherwise most-played first
    });
    return groups;
  }, [sorted]);

  const currentYear = new Date().getFullYear();
  const yearPlays = plays.filter(p => p.date && new Date(p.date).getFullYear() === currentYear);
  const yearGameCount = new Set(yearPlays.map(p => p.gameId)).size;
  const estimatedMinutes = yearPlays.reduce((sum, p) => {
    const g = games.find(x => x.id === p.gameId);
    if (!g || !g.minTime) return sum;
    const avg = (parseInt(g.minTime) + parseInt(g.maxTime || g.minTime)) / 2;
    return sum + avg;
  }, 0);
  const estimatedHours = Math.round((estimatedMinutes / 60) * 10) / 10;

  const winCounts = useMemo(() => {
    const tally = {};
    plays.forEach(p => { if (p.winner && p.winner.trim()) { const name = p.winner.trim(); tally[name] = (tally[name] || 0) + 1; } });
    return Object.entries(tally).sort((a, b) => b[1] - a[1]).slice(0, 5);
  }, [plays]);
  const medals = ["🥇", "🥈", "🥉"];

  const allPlayerNames = useMemo(() => {
    const names = new Set();
    plays.forEach((p) => (p.players || "").split(",").map((s) => s.trim()).filter(Boolean).forEach((n) => names.add(n)));
    return [...names].sort();
  }, [plays]);
  const [h2hA, setH2hA] = useState("");
  const [h2hB, setH2hB] = useState("");
  const h2hStats = useMemo(() => {
    if (!h2hA || !h2hB || h2hA === h2hB) return null;
    const together = plays.filter((p) => {
      const names = (p.players || "").split(",").map((s) => s.trim());
      return names.includes(h2hA) && names.includes(h2hB);
    });
    const aWins = together.filter((p) => (p.winner || "").trim() === h2hA).length;
    const bWins = together.filter((p) => (p.winner || "").trim() === h2hB).length;
    return { total: together.length, aWins, bWins };
  }, [plays, h2hA, h2hB]);

  return (
    <div className="p-5 pb-6 min-h-full flex flex-col">
      <div className="flex items-center justify-between mb-4">
        <h1 className="font-display text-3xl text-[#F2EDE4]">Partien</h1>
      </div>

      <div className="flex bg-[#262422] border border-[#3A3631] rounded-[14px] p-1 gap-1 mb-4">

        <button onClick={() => setViewMode("evening")} className={`flex-1 py-2 rounded-[10px] text-xs font-body ${viewMode === "evening" ? "bg-[#F2EDE4] text-[#1C1B1A] font-medium" : "text-[#A39C8F]"}`}>Nach Abend</button>
      </div>
      {!demoMode && (
        <button onClick={() => { haptic(8); onAdd(); }} aria-label="Partie eintragen"

          style={{ background: "linear-gradient(160deg, #8b98ee, #6C7FE0 55%, #5a68d6)", boxShadow: "0 8px 24px rgba(108,127,224,0.45), inset 0 1px 1px rgba(255,255,255,0.4)", bottom: "calc(96px + env(safe-area-inset-bottom))" }}>
          <Plus size={22} />
        </button>
      )}
      {plays.length > 0 && (
        <>
          <button onClick={() => setSearchOpen((o) => !o)} aria-label="Suchen"
            className={`glass fixed z-30 w-11 h-11 flex items-center justify-center rounded-full border shadow-lg ${searchOpen ? "bg-[#F2EDE4] border-[#F2EDE4] text-[#1C1B1A]" : "border-white/15 text-[#A39C8F]"}`}
            style={{ left: "calc(50% - 76px)", transform: "translateX(-50%)", bottom: "calc(96px + env(safe-area-inset-bottom))" }}>
            <Search size={17} />
          </button>
          <div className="fixed z-30" style={{ left: "calc(50% + 76px)", transform: "translateX(-50%)", bottom: "calc(96px + env(safe-area-inset-bottom))" }}>
            <button onClick={() => setFilterModalOpen(true)} aria-label="Filter"
              className="glass w-11 h-11 flex items-center justify-center border border-white/15 rounded-full text-[#A39C8F] shadow-lg">
              <SlidersFilter size={17} />
            </button>
            {activeFilterCount > 0 && (
              <span
                className="absolute -top-1 -right-1 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-semibold border-2 border-[#1C1B1A]"

      {filterModalOpen && (

      {yearPlays.length > 0 && (

/* ---------------- RECOMMENDATIONS ---------------- */
function Recommendations({ games, plays, onView, aiWorkerUrl, chatMessages, setChatMessages }) {
  const [chatInput, setChatInput] = useState("");
  const [chatLoading, setChatLoading] = useState(false);
  const [chatError, setChatError] = useState("");
  const chatEndRef = React.useRef(null);
  const greetedRef = React.useRef(false);

  // Parses a trailing "OPTIONS: a | b | c" line off a reply into quick-reply chips.
  const parseReply = (raw) => {
    const match = raw.match(/\n?OPTIONS:\s*(.+)$/i);
    if (!match) return { text: raw.trim(), options: [] };
    const options = match[1].split("|").map((s) => s.trim()).filter(Boolean);
    return { text: raw.slice(0, match.index).trim(), options };
  };

  const systemPrompt = () => `Du bist Pip, der beste Kumpel des Nutzers, wenn's um Brettspiele geht. Ihr kennt euch gut. Du redest locker und natürlich wie ein guter erwachsener Freund im Chat — entspannt, direkt, mit eigener Meinung, gern mal mit einer Prise Humor. Aber KEIN übertriebener Jugendslang (kein "Alter", "was geht ab", "Bock auf", "yo" o.ä.) — das wirkt aufgesetzt. Einfach normal und warmherzig reden, wie unter Erwachsenen, die sich gut verstehen. NIEMALS wie ein Assistent, Kundenservice oder Verkäufer. Auf Deutsch, meistens richtig kurz (1-3 Sätze) — lange Erklärungen nervt niemand im Chat.

Wichtige Chat-Regeln, damit es sich nicht wie ein Bot anfühlt:
- Wiederhol NIE, was du schon gesagt hast, und stell nie zweimal dieselbe Frage anders formuliert.
- Geh wirklich auf das ein, was der Nutzer zuletzt geschrieben hat — reagier konkret drauf, nicht generisch.
- Variier deinen Satzbau und Einstieg von Nachricht zu Nachricht — kein Muster wie "Achtung Frage:" oder immer dieselbe Struktur.
- Du darfst auch mal was Beiläufiges einwerfen (z.B. "Oh, [Spiel] ist übrigens richtig gut für sowas") statt immer nur Frage-Antwort-Frage.
- Sei entscheidungsfreudig — wenn du genug weißt, empfiehl direkt statt ewig nachzufragen.

Empfiehl in erster Linie Spiele aus der Sammlung unten. Wenn wirklich nichts passt, darfst du auch ein fremdes Spiel nennen — dann klar als "nicht in deiner Sammlung" kennzeichnen und kurz begründen, warum es besser passt. Berücksichtige die Partien-Historie (nicht gerade erst Gespieltes bevorzugt vorschlagen, außer gewünscht; schlag gern auch mal was lange nicht Gespieltes vor).

WICHTIG, sobald du ein KONKRETES Spiel empfiehlst: erklär in ein bis zwei knappen Sätzen, WIE es gespielt wird bzw. was die Kernmechanik ist. Stütz dich dabei NUR auf die "Beschreibung" (falls vorhanden) und die "Themen" in der Sammlung unten — erfinde keine Regeldetails, die dort nicht stehen. Gibt es zu einem Spiel keine Beschreibung, sag das ehrlich (z.B. "genauer kenn ich die Regeln nicht, aber laut Kategorie ist es...") statt generische Floskeln wie "macht Laune" oder "clever einsetzen" zu benutzen, die nichts Konkretes aussagen.

Lies zwischen den Zeilen: wenn der Nutzer z.B. erwähnt "die Kinder sind da", "wir sind neu dabei", "nach der Arbeit noch schnell", "größere Familienrunde an Weihnachten" — zieh daraus selbst Schlüsse (Zielgruppe, Energielevel, Regelkenntnis, verfügbare Zeit), statt stur nach Spieleranzahl/Zeit zu fragen, wenn's schon impliziert ist. Merk dir außerdem alles, was im bisherigen Gespräch schon gesagt wurde, und frag das nie nochmal.

Wenn du noch was Wichtiges nicht weißt, frag GEZIELT nach der einen Sache, die deine Empfehlung gerade am meisten einschränkt — nicht nach einem Standard-Set von Fragen (Spieleranzahl/Zeit) nach Schema F. Manchmal ist die entscheidende Frage etwas anderes: ob schon mal gespielt wurde, wie viel Konzentration gerade drin ist, ob's ums Gewinnen oder ums Zusammensein geht, wer dabei ist. Wähl die Frage, die dich am schnellsten zu einer guten, konkreten Empfehlung bringt. Höchstens EINE Rückfrage pro Nachricht, und nur wenn's wirklich nötig ist — reicht das Gesagte schon aus, empfiehl direkt.

Die OPTIONS-Zeile ist NUR für kurze Antwortmöglichkeiten gedacht, die der NUTZER als nächstes plausibel sagen würde — niemals Spielnamen, Erweiterungsnamen oder andere Datenfragmente. Beispiele für gute Optionen bei einer Rückfrage: "2 Spieler" | "4 Spieler" | "Egal". Nachdem du ein KONKRETES Spiel empfohlen hast, sind die einzig sinnvollen Optionen kurze Reaktionen wie "Klingt gut" | "Zeig mir eine Alternative" | "Erzähl mehr dazu" — nie mehrere andere Spiele auf einmal ohne dass der Nutzer danach gefragt hat. Häng die Zeile nur an, wenn sie wirklich sinnvolle, kurze Nutzer-Antworten enthält, sonst ganz weglassen, in exakt diesem Format:
OPTIONS: Option1 | Option2 | Option3

${buildCollectionContextForAI(games, plays)}`;

  const sendChat = async (text) => {
    const question = (text || chatInput).trim();
    if (!question || chatLoading) return;
    haptic(6);
    const nextMessages = [...chatMessages, { role: "user", content: question }];
    setChatMessages(nextMessages);
    setChatInput("");
    setChatLoading(true);
    setChatError("");
    try {
      const apiMessages = [{ role: "system", content: systemPrompt() }, ...nextMessages];
      const raw = await aiChat(aiWorkerUrl, apiMessages);
      const { text: replyText, options } = parseReply(raw);
      setChatMessages([...nextMessages, { role: "assistant", content: replyText, options }]);
      setTimeout(() => chatEndRef.current?.scrollIntoView({ behavior: "smooth" }), 100);
    } catch (e) {
      setChatError(e.message || "Fehlgeschlagen");
    } finally {
      setChatLoading(false);
    }
  };

  // Pip greets you first, as a real chat message — once per fresh conversation.
  useEffect(() => {
    if (!aiWorkerUrl || chatMessages.length > 0 || greetedRef.current) return;
    greetedRef.current = true;
    (async () => {
      setChatLoading(true);
      try {
        const greetingVariants = [
          "[Begrüß mich kurz und locker mit deinem Namen Pip (nicht immer gleich formuliert), erwähn beiläufig dass du beim Spielefinden hilfst, und frag direkt nach der Spieleranzahl.]",
          "[Begrüß mich kurz, leger, mit deinem Namen Pip, und frag direkt, wie viel Zeit heute für ein Spiel da ist.]",
          "[Begrüß mich kurz und locker als Pip und frag gleich, worauf ich heute Lust hab — eher was Entspanntes oder was Kniffliges.]",
          "[Begrüß mich kurz, mit deinem Namen Pip, und frag direkt, ob's heute eher eine kleine oder größere Runde wird.]",
        ];
        const greeting = greetingVariants[Math.floor(Math.random() * greetingVariants.length)];
        const raw = await aiChat(aiWorkerUrl, [
          { role: "system", content: systemPrompt() },
          { role: "user", content: greeting },
        ], 1.0);
        const { text, options } = parseReply(raw);
        setChatMessages([{ role: "assistant", content: text, options }]);
      } catch {
        setChatMessages([{ role: "assistant", content: "Hey, ich bin Pip! Ich helf dir, das passende Spiel für heute zu finden. Wie viele seid ihr denn und wie viel Zeit habt ihr?", options: [] }]);
      } finally {
        setChatLoading(false);
      }
    })();
  }, [aiWorkerUrl]);

  return (
    <div className="min-h-full flex flex-col">
      <div className="p-5 pb-3 flex items-center justify-between gap-3">
        <h1 className="font-display text-3xl text-[#F2EDE4]">Was spielen wir heute?</h1>
        {aiWorkerUrl && chatMessages.length > 0 && (
          <button
            onClick={() => { haptic(6); greetedRef.current = false; setChatMessages([]); }}
            className="shrink-0 flex items-center gap-1.5 px-3 py-2 rounded-full bg-[#262422] border border-[#3A3631] text-[#A39C8F] text-xs font-body"
          >
            <Sparkles size={12} /> Neuer Chat
          </button>
        )}
      </div>

      {!aiWorkerUrl ? (
        <div className="flex-1 flex items-center justify-center p-5 text-center">
          <div className="flex flex-col items-center">
            <PipAvatar size={104} />
            <p className="text-[#F2EDE4] font-display text-xl mt-4">Hier ist noch niemand</p>
            <p className="text-[#A39C8F] text-sm font-body mt-1.5 max-w-xs">Richte in den Einstellungen den KI-Assistenten ein, damit Pip dir beim Spielefinden helfen kann.</p>
          </div>
        </div>
      ) : (
        <>
          <div className="flex-1 px-5 space-y-3" style={{ paddingBottom: "calc(84px + env(safe-area-inset-bottom) + 96px)" }}>
            {chatMessages.map((m, i) => {
              const mentioned = m.role === "assistant" ? findMentionedGames(m.content, games) : [];
              const isLast = i === chatMessages.length - 1;
              return (
                <div key={i} className={`flex gap-2 items-end ${m.role === "user" ? "justify-end" : "justify-start"}`}>
                  {m.role === "assistant" && <PipAvatar size={30} />}
                  <div className={`max-w-[80%] flex flex-col gap-1.5 ${m.role === "user" ? "items-end" : "items-start"}`}>
                    <div className={`text-sm font-body rounded-2xl px-4 py-2.5 ${m.role === "user" ? "bg-[conic-gradient(from_0deg,#ff5a96,#ffc850,#78dcff,#b482ff,#ff5a96)] text-white rounded-br-md" : "bg-[#262422] border border-[#3A3631] text-[#F2EDE4] rounded-bl-md"}`}>
                      {m.content}
                    </div>
                    {mentioned.length > 0 && (
                      <div className="flex gap-1.5 flex-wrap">
                        {mentioned.map((g) => (
                          <button key={g.id} onClick={() => onView(g)} className="flex items-center gap-1.5 pl-1 pr-2.5 py-1 rounded-full bg-[#1C1B1A] border border-[#3A3631] text-xs text-[#A39C8F]">
                            <Cover game={g} size="sm" className="!w-5 !h-5" />
                            {g.name} <ChevronRight size={11} />
                          </button>
                        ))}
                      </div>
                    )}
                    {m.role === "assistant" && isLast && m.options && m.options.length > 0 && !chatLoading && (
                      <div className="flex gap-1.5 flex-wrap mt-0.5">
                        {m.options.map((opt) => (
                          <button key={opt} onClick={() => sendChat(opt)} className="px-3.5 py-2 rounded-full text-sm bg-[#6C7FE0]/15 border border-[#6C7FE0]/40 text-[#8B9AFA] font-medium">
                            {opt}
                          </button>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
            {chatLoading && (
              <div className="flex gap-2 justify-start items-end">
                <PipAvatar size={30} />
                <div className="bg-[#262422] border border-[#3A3631] rounded-2xl rounded-bl-md px-4 py-2.5 flex items-center gap-2 text-[#5C574F] text-sm">
                  <Loader2 size={13} /> tippt…
                </div>
              </div>
            )}
            {chatError && <p className="text-xs text-[#C1443C]">{chatError}</p>}
            <div ref={chatEndRef} />
          </div>

          <div className="fixed left-0 right-0 z-30 p-4" style={{ bottom: "calc(84px + env(safe-area-inset-bottom))" }}>
            <div className="flex gap-2">
              <input
                onFocus={handleFocusScroll}
                value={chatInput}
                onChange={(e) => setChatInput(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && sendChat()}
                placeholder="Schreib Pip…"
                disabled={chatLoading}
                className="flex-1 min-w-0 h-12 bg-[#262422] border-0 rounded-full px-4 text-[#F2EDE4] text-base shadow-lg focus:outline-none disabled:opacity-60"
              />
              <button onClick={() => sendChat()} disabled={chatLoading || !chatInput.trim()}
                className="shrink-0 w-12 h-12 rounded-full bg-[conic-gradient(from_0deg,#ff5a96,#ffc850,#78dcff,#b482ff,#ff5a96)] disabled:opacity-40 text-[#F2EDE4] flex items-center justify-center">
                <ChevronRight size={20} />
              </button>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

      extractDominantColor(images[0]).then((color) => { if (!cancelled && color) setAccentColor(color); });
    } else {
      setAccentColor("#6C7FE0");
    }
    return () => { cancelled = true; };
  }, [images[0]]);
  const memberOfCount = lists ? lists.filter((l) => l.gameIds.includes(game.id)).length : 0;

  const StatBlock = ({ icon: Icon, value, sub }) => (
    <div className="flex-1 p-3 text-center min-w-[70px]">
      <Icon size={16} className="mx-auto mb-1 text-[#F2EDE4]" />
      <p className="text-sm font-medium text-[#F2EDE4]">{value}</p>
      <p className="text-[11px] text-[#A39C8F]">{sub}</p>
    </div>

  return (
    <div className="fixed top-0 left-0 right-0 bg-black/90 z-[56] flex items-end sm:items-center justify-center p-0 sm:p-6" style={{ height: "var(--app-height, 100dvh)", top: "var(--app-offset-top, 0px)" }}>
      <div className="bg-[#1C1B1A] border border-[#3A3631] rounded-t-2xl sm:rounded-2xl w-full sm:max-w-lg max-h-[var(--app-height,100dvh)] flex flex-col overflow-hidden rise-in font-body">
        <div className="shrink-0 bg-[#1C1B1A] border-b px-5 py-4 flex items-center justify-between" style={{ borderColor: accentColor + "30" }}>
          <button onClick={onClose} className="text-[#A39C8F] p-1" aria-label="Zurück"><ChevronLeft size={22} /></button>
          {onEdit ? (
            <button onClick={onEdit} className="p-1.5 bg-[#262422] border border-[#3A3631] rounded-full" style={{ color: accentColor }} aria-label="Bearbeiten"><Pencil size={16} /></button>

            <span className="text-[10px] text-[#5C574F] px-2 py-1 bg-[#262422] border border-[#3A3631] rounded-full">Demo</span>
          )}
        </div>
        <div className="overflow-y-auto flex-1 p-5 space-y-5" style={{ backgroundImage: `linear-gradient(180deg, ${accentColor}35, transparent 220px)` }}>
          <div>
            <h1 className="font-display text-2xl text-[#F2EDE4] leading-tight">{game.name}</h1>
            {game.germanName && game.germanName !== game.name && (
              <p className="text-[#A39C8F] text-sm mt-0.5">{game.germanName}</p>

            {(game.year || (game.publishers && game.publishers.length > 0)) && (

          <div className="flex items-stretch bg-[#262422] border border-[#3A3631] rounded-2xl overflow-hidden divide-x divide-[#3A3631]">
            {game.minPlayers && (

              <StatBlock icon={Clock} value={`${game.minTime}–${game.maxTime || game.minTime}`} sub="Minuten" />

            <StatBlock
              icon={game.status === "owned" ? Library : game.status === "wishlist" ? Heart : (gamePlays.every(p => p.mode === "bga") && gamePlays.length > 0 ? Globe : Dices)}

                if (gamePlays.length === 0) return "Gespielt";
                const hasOnline = gamePlays.some(p => p.mode === "bga");
                const hasAnalog = gamePlays.some(p => p.mode !== "bga");

          <div className="w-full h-full max-w-3xl mx-auto overflow-y-auto font-body">

              <button onClick={() => setCampaignOpen(false)} className="text-[#A39C8F] p-1" aria-label="Zurück"><ChevronLeft size={22} /></button>
              <h2 className="font-display text-xl text-[#F2EDE4] truncate px-2">Kampagnen-Verlauf</h2>
              <span className="w-6" />
            </div>
            <div className="p-5 space-y-3">
              {[...gamePlays].sort((a, b) => (a.date || "").localeCompare(b.date || "")).map((p, i, arr) => (
                <div key={p.id} className="flex gap-3">
                  <div className="flex flex-col items-center shrink-0">
                    <div className="w-2.5 h-2.5 rounded-full bg-[conic-gradient(from_0deg,#ff5a96,#ffc850,#78dcff,#b482ff,#ff5a96)] mt-1.5" />
                    {i < arr.length - 1 && <div className="flex-1 w-px bg-[#3A3631] mt-1" />}
                  </div>

                    <p className="text-xs text-[#5C574F] font-mono">{p.date}</p>
                    {p.images && p.images.length > 0 && (
                      <div className="flex gap-2 mt-1.5 overflow-x-auto">
                        {p.images.map((img, j) => (
                          <img key={j} src={img} alt="Spielstand" className="w-20 h-20 rounded-lg block object-cover border border-[#3A3631] shrink-0" />
                        ))}
                      </div>
                    )}
                    {p.notes && <p className="text-sm text-[#F2EDE4] mt-1.5">{p.notes}</p>}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
      {listPickerOpen && lists && (
        <ListPickerModal
          lists={lists}
          gameId={game.id}
          onToggle={(listId) => onToggleList(listId, game.id)}
          onCreate={(name) => { const id = onCreateList(name); if (id) onToggleList(id, game.id); }}
          onClose={() => setListPickerOpen(false)}
        />
      )}
    </div>
  );
}

      <div onFocus={handleFocusScroll} className="bg-[#1C1B1A] border border-[#3A3631] rounded-t-2xl sm:rounded-2xl w-full sm:max-w-lg max-h-[var(--app-height,100dvh)] overflow-y-auto rise-in font-body">
        <div className="glass-strong sticky top-0 border-b border-white/10 px-5 py-4 flex items-center justify-between">
