<style>
  html, body { background:#1C1B1A; margin:0; overscroll-behavior:none; }
  .glass {
    background: rgba(38, 36, 34, 0.55);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    position: relative;
  }
  .glass::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(180deg, rgba(255,255,255,0.28), rgba(255,255,255,0.04) 40%, rgba(255,255,255,0) 70%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }
  .glass-strong {
    background: rgba(28, 27, 26, 0.72);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
  }
  button { transition: transform 0.15s cubic-bezier(0.34, 1.2, 0.64, 1), opacity 0.15s ease, background-color 0.2s ease, border-color 0.2s ease; }
  button:active { transform: scale(0.96); }
  button { position: relative; isolation: isolate; overflow: hidden; }
  button::after {
    content: "";
    position: absolute; top: 50%; left: 50%;
    width: 220%; height: 220%;
    transform: translate(-50%, -50%) scale(0);
    border-radius: 50%;
    background: conic-gradient(from 0deg, #ff5a96, #ffc850, #78dcff, #b482ff, #ff5a96);
    opacity: 0;
    pointer-events: none;
    z-index: 5;
  }
  button:active::after { animation: rainbow-ripple 0.5s ease-out; }
  @keyframes rainbow-ripple {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 0.5; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
  }
  .save-pop { animation: savePop 0.38s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes savePop {
    0% { transform: scale(1); }
    35% { transform: scale(0.9); }
    65% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }
  .save-ring {
    position: absolute; top: 50%; left: 50%; width: 40px; height: 40px;
    border: 2px solid #F2EDE4; border-radius: 50%;
    transform: translate(-50%, -50%) scale(0.3);
    opacity: 0.8;
    animation: saveRing 0.5s ease-out forwards;
    pointer-events: none;
  }
  @keyframes saveRing {
    0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0.8; }
    100% { transform: translate(-50%, -50%) scale(2.6); opacity: 0; }
  }
  .font-display { font-family:'Fraunces', serif; font-optical-sizing:auto; }
  .font-body { font-family:'IBM Plex Sans', sans-serif; }
  .font-mono { font-family:'IBM Plex Mono', monospace; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:#3A3631; border-radius:4px; }
  @keyframes riseIn { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .rise-in { animation: riseIn .25s ease-out; }
  @keyframes tabFade { from { opacity:0; transform:translateY(8px) scale(0.99); } to { opacity:1; transform:translateY(0) scale(1); } }
  .tab-fade { animation: tabFade .32s cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes confettiFall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(360deg); opacity: 0; } }
  .spin { animation: spin 1s linear infinite; }
  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; padding:24px; text-align:center; color:#F2EDE4; font-family:'IBM Plex Sans',sans-serif; }
  input, textarea, select { font-size: 16px !important; }
  input::placeholder, textarea::placeholder { color: #5C574F !important; opacity: 1 !important; -webkit-text-fill-color: #5C574F !important; }
  .rte-content:empty:before { content: attr(data-placeholder); color: #5C574F; }
  input:focus-visible, textarea:focus-visible, button:focus-visible, [contenteditable]:focus-visible { outline: 2px solid #6C7FE0; outline-offset: 2px; }
  .rte-content h2 { font-family: 'Fraunces', serif; font-size: 1.25rem; margin: 0.4em 0 0.2em; }
  .rte-content h3 { font-family: 'IBM Plex Sans', sans-serif; font-size: 0.95rem; font-weight: 600; color: #A39C8F; margin: 0.4em 0 0.2em; }
  .rte-content ul { list-style: disc; padding-left: 1.4em; margin: 0.3em 0; }
  .rte-content p { margin: 0.3em 0; }
</style>

<div id="root"><div id="loading">
  <div style="color:#6C7FE0;">Lädt…</div>
  <div id="load-hint" style="display:none; color:#A39C8F; font-size:14px; max-width:320px;">
    Das dauert normalerweise nur eine Sekunde. Falls hier nichts weiter passiert: diese App lädt React beim Öffnen einmalig aus dem Internet – bitte prüfe, ob dein iPad gerade online ist, und lade die Seite neu (nach unten ziehen).
  </div>
</div></div>
<script>
  setTimeout(function () {
    var hint = document.getElementById("load-hint");
    var root = document.getElementById("root");
    if (hint && root && root.textContent.indexOf("Lädt") !== -1) {
      hint.style.display = "block";
    }
  }, 4000);

  function setAppHeight() {
    var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    var offsetTop = (window.visualViewport && window.visualViewport.offsetTop) || 0;
    document.documentElement.style.setProperty("--app-height", h + "px");
    document.documentElement.style.setProperty("--app-offset-top", offsetTop + "px");
  }
  setAppHeight();
  window.addEventListener("resize", setAppHeight);
  window.addEventListener("orientationchange", setAppHeight);
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", setAppHeight);
    window.visualViewport.addEventListener("scroll", setAppHeight);
  }
</script>

// A short, cheerful three-note chime synthesized on the fly — no audio files needed.
function playChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    [523.25, 659.25, 783.99].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, now + i * 0.08);
      gain.gain.linearRampToValueAtTime(0.15, now + i * 0.08 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.4);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + i * 0.08);
      osc.stop(now + i * 0.08 + 0.42);
    });
  } catch {}
}

// Samples a cover image to find a representative accent color. Falls back silently
// (resolves null) on any failure — e.g. cross-origin images without CORS headers.
function extractDominantColor(src) {
  return new Promise((resolve) => {
    if (!src) { resolve(null); return; }
    try {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => {
        try {
          const size = 24;
          const canvas = document.createElement("canvas");
          canvas.width = size; canvas.height = size;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, size, size);
          const data = ctx.getImageData(0, 0, size, size).data;
          let r = 0, g = 0, b = 0, count = 0;
          for (let i = 0; i < data.length; i += 4) {
            if (data[i + 3] < 200) continue;
            const rr = data[i], gg = data[i + 1], bb = data[i + 2];
            const max = Math.max(rr, gg, bb), min = Math.min(rr, gg, bb);
            if (max > 235 && min > 210) continue; // skip near-white
            if (max < 30) continue; // skip near-black
            r += rr; g += gg; b += bb; count++;
          }
          if (count === 0) { resolve(null); return; }
          r = Math.round(r / count); g = Math.round(g / count); b = Math.round(b / count);
          resolve("#" + [r, g, b].map((x) => x.toString(16).padStart(2, "0")).join(""));
        } catch { resolve(null); }
      };
      img.onerror = () => resolve(null);
      img.src = src;
    } catch { resolve(null); }
  });
}

// Shared cache so the same cover image isn't re-analyzed every time it shows up
// across different Dashboard sections (Top 10, Best of, Wishlist, etc).
const dominantColorCache = new Map();
function useDominantColor(src) {
  const [color, setColor] = useState(() => (src && dominantColorCache.has(src) ? dominantColorCache.get(src) : null));
  useEffect(() => {
    if (!src) { setColor(null); return; }
    if (dominantColorCache.has(src)) { setColor(dominantColorCache.get(src)); return; }
    let cancelled = false;
    extractDominantColor(src).then((c) => {
      if (c) dominantColorCache.set(src, c);
      if (!cancelled) setColor(c);
    });
    return () => { cancelled = true; };
  }, [src]);
  return color;
}

// Finds games actually mentioned as whole words in a text — avoids false
// positives like a game named "Ra" matching inside "Radlands".
function findMentionedGames(text, games) {
  return games.filter((g) => {
    const escaped = g.name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    return new RegExp(`(^|[^\\p{L}\\p{N}])${escaped}([^\\p{L}\\p{N}]|$)`, "u").test(text);
  });
}

function TextWithGameLinks({ text, games, onView, color }) {
  const mentioned = findMentionedGames(text, games);
  if (mentioned.length === 0) return <p className="text-[#F2EDE4] text-sm font-body leading-snug">{text}</p>;
  const escaped = mentioned.map((g) => g.name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).sort((a, b) => b.length - a.length);
  const parts = text.split(new RegExp(`(${escaped.join("|")})`, "g"));
  return (
    <p className="text-[#F2EDE4] text-sm font-body leading-snug">
      {parts.map((part, i) => {
        const g = mentioned.find((x) => x.name === part);
        if (!g) return <span key={i}>{part}</span>;
        return (
          <span key={i} onClick={() => onView(g)} className="font-semibold underline underline-offset-2 cursor-pointer" style={{ color }}>
            {part}
          </span>
        );
      })}
    </p>
  );
}

function resizeImageFile(file, maxDim = 640, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Lesen fehlgeschlagen"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Bild ungültig"));
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) {
          height = Math.round((height * maxDim) / width);
          width = maxDim;
        } else if (height > maxDim) {
          width = Math.round((width * maxDim) / height);
          height = maxDim;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------------- COMPLEXITY CLASSIFICATION ---------------- */
// Based on community consensus around BGG's "weight" (1-5): under ~2.0 reads as a family
// game, ~2.0-3.5 as an enthusiast ("Kenner") game, above that as an expert game. Party games
// are classified by genre (BGG category) rather than weight, since they're often light but
// play very differently from a family strategy game.
function formatBestPlayers(game) {
  const min = game.bestPlayersMin, max = game.bestPlayersMax;
  if (min && max && min !== max) return `${min}–${max}`;
  if (min || max) return min || max;
  return game.bestPlayers || ""; // ältere Einträge mit nur einem Wert
}
function complexityLabel(game) {
  const categories = game.categories || [];
  if (categories.some((c) => /party/i.test(c))) return "Partyspiel";
  const w = parseFloat(game.complexity);
  if (!w || isNaN(w)) return null;
  if (w < 1.5) return "Einsteigerspiel";
  if (w < 2.0) return "Familienspiel";
  if (w < 2.5) return "Gehobenes Familienspiel";
  if (w < 3.0) return "Leichtes Kennerspiel";
  if (w < 3.5) return "Kennerspiel";
  if (w < 4.0) return "Anspruchsvolles Kennerspiel";
  return "Expertenspiel";
}

  if (/deduction|memory|spies/.test(n)) return Eye;
  if (/bluffing|murder.?mystery/.test(n)) return MaskIcon;
  if (/negotiat|trading|auction|bidding/.test(n)) return Handshake;
  if (/voting/.test(n)) return Users;
  if (/real-time|action points|simultaneous/.test(n)) return Zap;
  if (/time$/.test(n)) return Clock;
  if (/travel|nautical|explorat|racing|adventure|route.?network|point to point/.test(n)) return Compass;
  if (/animals/.test(n)) return PawPrint;
  if (/movies|tv|radio/.test(n)) return Tv;
  if (/word game|storytelling|role playing/.test(n)) return BookOpen;
  if (/grid movement|hex-and-counter|modular board|tile placement/.test(n)) return Grid3x3;
  if (/legacy game/.test(n)) return Archive;
  if (/cooperative/.test(n)) return Heart;
  if (/area control|territory building|worker placement|engine building/.test(n)) return Shield;
  if (/set collection|trick-taking|variable player powers/.test(n)) return Layers;
  if (/abstract strategy/.test(n)) return Block;
  if (/action.*dexterity/.test(n)) return Zap;
  if (/sports/.test(n)) return TrendingUp;
  return Dices;
}

/* ---------------- RICH TEXT EDITOR (Bold, Kursiv, Liste, Titel, Subheadline, Text) ---------------- */
function RichTextEditor({ value, onChange, placeholder, minHeight = 100 }) {
  const editorRef = React.useRef(null);
  const initialized = React.useRef(false);
  const [focused, setFocused] = useState(false);
  const [colorPickerOpen, setColorPickerOpen] = useState(false);
  const blurTimer = React.useRef(null);

  useEffect(() => {
    if (editorRef.current && !initialized.current) {
      editorRef.current.innerHTML = value || "";
      initialized.current = true;
    }
  }, []);

  const exec = (cmd, arg) => {
    if (editorRef.current) editorRef.current.focus();
    document.execCommand(cmd, false, arg || null);
    if (editorRef.current) onChange(editorRef.current.innerHTML);
  };

  const handlePaste = (e) => {
    // Force plain text on paste — strips all foreign formatting and colors from the source.
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData("text/plain");
    document.execCommand("insertText", false, text);
    if (editorRef.current) onChange(editorRef.current.innerHTML);
  };

  const handleInput = (e) => onChange(e.currentTarget.innerHTML);

  const clearAll = () => {
    if (!editorRef.current) return;
    editorRef.current.innerHTML = "";
    onChange("");
    editorRef.current.focus();
  };

  const handleFocus = () => { if (blurTimer.current) clearTimeout(blurTimer.current); setFocused(true); };
  const handleBlur = () => { blurTimer.current = setTimeout(() => setFocused(false), 180); };
  // Toolbar buttons must not steal focus/selection from the editor before their
  // click runs — mousedown+preventDefault keeps the current text selection intact.
  const keepFocus = (e) => e.preventDefault();

  const TEXT_COLORS = [
    { label: "Standard", value: "#F2EDE4" },
    { label: "Flieder", value: "#6C7FE0" },
    { label: "Amber", value: "#E85D9C" },
    { label: "Türkis", value: "#4E8C82" },
    { label: "Rot", value: "#C1443C" },
  ];

  const ToolBtn = ({ children, onClick, className: cn = "", ariaLabel }) => (
    <button type="button" onMouseDown={keepFocus} onClick={onClick} aria-label={ariaLabel} className={`h-9 px-2.5 flex items-center justify-center rounded-lg bg-[#262422] border border-[#3A3631] text-[#F2EDE4] text-xs shrink-0 ${cn}`}>
      {children}
    </button>
  );

  return (
    <div className="relative">
      {focused && (
        <div className="relative mb-2">
          <div className="flex items-center gap-1.5 overflow-x-auto pb-1">
            <ToolBtn ariaLabel="Fett" onClick={() => exec("bold")}><b>B</b></ToolBtn>
            <ToolBtn ariaLabel="Kursiv" onClick={() => exec("italic")}><i>I</i></ToolBtn>
            <ToolBtn ariaLabel="Aufzählung" onClick={() => exec("insertUnorderedList")}>• Liste</ToolBtn>
            <ToolBtn ariaLabel="Titel" onClick={() => exec("formatBlock", "H2")} className="font-semibold">Titel</ToolBtn>
            <ToolBtn ariaLabel="Subheadline" onClick={() => exec("formatBlock", "H3")}>Subheadline</ToolBtn>
            <ToolBtn ariaLabel="Normaler Text" onClick={() => exec("formatBlock", "P")} className="text-[#A39C8F]">Text</ToolBtn>
            <ToolBtn ariaLabel="Textfarbe" onClick={() => setColorPickerOpen((o) => !o)}>
              <span className="w-3.5 h-3.5 rounded-full border border-[#F2EDE4]/40" style={{ background: "conic-gradient(#6C7FE0,#E85D9C,#4E8C82,#C1443C,#6C7FE0)" }} />
            </ToolBtn>
            <ToolBtn ariaLabel="Gesamten Text löschen" onClick={clearAll} className="text-[#C1443C]"><Trash2 size={13} /></ToolBtn>
          </div>
          {colorPickerOpen && (
            <div className="absolute top-11 left-0 z-10 bg-[#262422] border border-[#3A3631] rounded-[14px] p-2 flex gap-2 shadow-lg">
              {TEXT_COLORS.map((c) => (
                <button
                  key={c.value}
                  type="button"
                  onMouseDown={keepFocus}
                  aria-label={c.label}
                  onClick={() => { exec("foreColor", c.value); setColorPickerOpen(false); }}
                  className="w-8 h-8 rounded-full border-2 border-[#1C1B1A]"
                  style={{ backgroundColor: c.value }}
                />
              ))}
            </div>
          )}
        </div>
      )}
      <div
        ref={editorRef}
        contentEditable
        suppressContentEditableWarning
        onInput={handleInput}
        onPaste={handlePaste}
        onFocus={handleFocus}
        onBlur={handleBlur}
        role="textbox"
        aria-multiline="true"
        aria-label={placeholder}
        className="rte-content w-full border border-[#3A3631] rounded-[14px] px-3.5 py-3 text-[#F2EDE4] text-base focus:outline-none focus:border-[#6C7FE0]"
        style={{ minHeight }}
        data-placeholder={placeholder}
      />
    </div>
  );
}

/* ---------------- IMAGE CROP (Zuschneiden/Zoomen vor dem Speichern) ---------------- */
function ImageCropModal({ src, onConfirm, onCancel }) {
  const CROP = 300;
  const [natSize, setNatSize] = useState(null);
  const [zoom, setZoom] = useState(1);
  const [offset, setOffset] = useState({ x: 0, y: 0 });
  const imgRef = React.useRef(null);
  const drag = React.useRef(null);
  const pinch = React.useRef(null);

  const coverScale = natSize ? Math.max(CROP / natSize.w, CROP / natSize.h) : 1;
  const totalScale = coverScale * zoom;

  const clampOffset = (o, scale) => {
    if (!natSize) return o;
    const drawW = natSize.w * scale, drawH = natSize.h * scale;
    const maxX = Math.max(0, (drawW - CROP) / 2);
    const maxY = Math.max(0, (drawH - CROP) / 2);
    return { x: Math.min(maxX, Math.max(-maxX, o.x)), y: Math.min(maxY, Math.max(-maxY, o.y)) };
  };

  const onTouchStart = (e) => {
    if (e.touches.length === 2) {
      const [t1, t2] = e.touches;
      pinch.current = { dist: Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY), zoom };
      drag.current = null;
    } else if (e.touches.length === 1) {
      drag.current = { x: e.touches[0].clientX, y: e.touches[0].clientY, offset };
      pinch.current = null;
    }
  };
  const onTouchMove = (e) => {
    e.preventDefault();
    if (e.touches.length === 2 && pinch.current) {
      const [t1, t2] = e.touches;
      const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
      const newZoom = Math.min(3, Math.max(1, pinch.current.zoom * (dist / pinch.current.dist)));
      setZoom(newZoom);
      setOffset((o) => clampOffset(o, coverScale * newZoom));
    } else if (e.touches.length === 1 && drag.current) {
      const dx = e.touches[0].clientX - drag.current.x;
      const dy = e.touches[0].clientY - drag.current.y;
      setOffset(clampOffset({ x: drag.current.offset.x + dx, y: drag.current.offset.y + dy }, totalScale));
    }
  };
  const onTouchEnd = () => { drag.current = null; pinch.current = null; };

  const handleZoomSlider = (v) => {
    setZoom(v);
    setOffset((o) => clampOffset(o, coverScale * v));
  };

  const confirm = () => {
    if (!natSize || !imgRef.current) return;
    const OUT = 640;
    const canvas = document.createElement("canvas");
    canvas.width = OUT; canvas.height = OUT;
    const ctx = canvas.getContext("2d");
    const drawW = natSize.w * totalScale, drawH = natSize.h * totalScale;
    const outScale = OUT / CROP;
    const dx = (CROP - drawW) / 2 + offset.x;
    const dy = (CROP - drawH) / 2 + offset.y;
    try {
      ctx.drawImage(imgRef.current, dx * outScale, dy * outScale, drawW * outScale, drawH * outScale);
      onConfirm(canvas.toDataURL("image/jpeg", 0.9));
    } catch {
      onConfirm(src); // fallback: use the untouched image if cropping fails for any reason
    }
  };

  return (
    <div className="fixed inset-0 bg-black z-[75] flex flex-col">
      <div className="shrink-0 flex items-center justify-between px-5" style={{ paddingTop: "max(1rem, env(safe-area-inset-top))", paddingBottom: "1rem" }}>
        <button onClick={onCancel} className="text-[#A39C8F] p-1" aria-label="Abbrechen"><X size={22} /></button>
        <span className="text-[#F2EDE4] font-display text-lg">Zuschneiden</span>
        <button onClick={confirm} className="text-[#6C7FE0] p-1" aria-label="Übernehmen"><Check size={22} /></button>
      </div>
      <div className="flex-1 flex items-center justify-center">
        <div
          className="relative overflow-hidden rounded-2xl border-2 border-[#F2EDE4]/40"
          style={{ width: CROP, height: CROP, touchAction: "none" }}
          onTouchStart={onTouchStart}
          onTouchMove={onTouchMove}
          onTouchEnd={onTouchEnd}
        >
          <img
            ref={imgRef}
            src={src}
            alt="Zuschneiden"
            onLoad={(e) => { const { naturalWidth: w, naturalHeight: h } = e.target; setNatSize({ w, h }); }}
            style={{
              position: "absolute", left: "50%", top: "50%",
              width: natSize ? natSize.w : "auto", height: natSize ? natSize.h : "auto",
              transform: `translate(-50%, -50%) translate(${offset.x}px, ${offset.y}px) scale(${totalScale})`,
              maxWidth: "none",
            }}
            draggable={false}
          />
        </div>
      </div>
      <div className="shrink-0 px-8" style={{ paddingBottom: "max(1.5rem, env(safe-area-inset-bottom))" }}>
        <p className="text-center text-xs text-[#5C574F] mb-3">Ziehen zum Verschieben, Regler zum Zoomen</p>
        <input
          type="range" min={1} max={3} step={0.01} value={zoom}
          onChange={(e) => handleZoomSlider(parseFloat(e.target.value))}
          className="w-full"
        />
      </div>
    </div>
  );
}

function ImagePickerSheet({ onAdd, onClose }) {
  const [urlMode, setUrlMode] = useState(false);
  const [url, setUrl] = useState("");
  const [urlChecking, setUrlChecking] = useState(false);
  const [urlError, setUrlError] = useState("");
  const [cropSrc, setCropSrc] = useState(null);
  const cameraRef = React.useRef(null);
  const uploadRef = React.useRef(null);

  const handleFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const dataUrl = await resizeImageFile(file);
    setCropSrc(dataUrl);
  };

  const submitUrl = () => {
    const trimmed = url.trim();
    if (!trimmed) return;
    setUrlChecking(true);
    setUrlError("");
    const img = new Image();
    const timer = setTimeout(() => { setUrlChecking(false); setUrlError("Diese Karte zieht nicht — Bild-Adresse nochmal prüfen."); }, 8000);
    img.onload = () => { clearTimeout(timer); setUrlChecking(false); onAdd(trimmed); };
    img.onerror = () => { clearTimeout(timer); setUrlChecking(false); setUrlError("Diese Karte zieht nicht — Bild-Adresse nochmal prüfen."); };
    img.src = trimmed;
  };

  return (
    <div className="fixed top-0 left-0 right-0 bg-black/70 z-[70] flex items-end sm:items-center justify-center p-0 sm:p-6" style={{ height: "var(--app-height, 100dvh)", top: "var(--app-offset-top, 0px)" }} onClick={onClose}>

        <h3 className="font-display text-lg text-[#F2EDE4] mb-1">Foto hinzufügen</h3>
        {!urlMode ? (
          <>
            <button onClick={() => cameraRef.current && cameraRef.current.click()} className="w-full flex items-center gap-3 bg-[#262422] border border-[#3A3631] rounded-[14px] px-4 py-3 text-[#F2EDE4] text-sm">
              <Camera size={18} className="text-[#6C7FE0]" /> Foto aufnehmen

            <button onClick={() => uploadRef.current && uploadRef.current.click()} className="w-full flex items-center gap-3 bg-[#262422] border border-[#3A3631] rounded-[14px] px-4 py-3 text-[#F2EDE4] text-sm">
              <Upload size={18} className="text-[#6C7FE0]" /> Hochladen
            </button>
            <button onClick={() => setUrlMode(true)} className="w-full flex items-center gap-3 bg-[#262422] border border-[#3A3631] rounded-[14px] px-4 py-3 text-[#F2EDE4] text-sm">
              <LinkIcon size={18} className="text-[#6C7FE0]" /> Per URL einfügen
            </button>
          </>
        ) : (
          <div className="space-y-2">
            <input onFocus={handleFocusScroll} autoFocus value={url} onChange={(e) => setUrl(e.target.value)} placeholder="https://…"
              className="w-full bg-[#262422] border border-[#3A3631] rounded-lg px-3 py-2 text-[#F2EDE4] text-sm focus:outline-none focus:border-[#6C7FE0]" />
            {urlError && <p className="text-xs text-[#C1443C]">{urlError}</p>}
            <button onClick={submitUrl} disabled={urlChecking || !url.trim()}
              className="w-full bg-[conic-gradient(from_0deg,#ff5a96,#ffc850,#78dcff,#b482ff,#ff5a96)] disabled:opacity-50 text-[#F2EDE4] rounded-lg py-2.5 text-sm font-medium flex items-center justify-center gap-2">
              {urlChecking ? <Loader2 size={14} /> : <Check size={14} />} {urlChecking ? "Prüfe Bild…" : "Hinzufügen"}
            </button>
          </div>
        )}
        <input
          ref={cameraRef}
          type="file"
          accept="image/*"
          style={{ position: "absolute", width: 1, height: 1, padding: 0, margin: -1, overflow: "hidden", clip: "rect(0,0,0,0)", border: 0 }}
          onChange={handleFile}
        />

          ref={uploadRef}
          type="file"
          accept="image/*"
          style={{ position: "absolute", width: 1, height: 1, padding: 0, margin: -1, overflow: "hidden", clip: "rect(0,0,0,0)", border: 0 }}
          onChange={handleFile}
        />

          onCancel={() => setCropSrc(null)}
        />
      )}
    </div>
  );

/* ---------------- PHOTO GALLERY (used in game form, play form, and detail view) ---------------- */
function PhotoGallerySection({ images, onAdd, onRemove, onReplace, hero = false, editable = true }) {
  const [sheetOpen, setSheetOpen] = useState(false);
  const [lightboxIndex, setLightboxIndex] = useState(null);
  const [cropIndex, setCropIndex] = useState(null);
  const [carouselIndex, setCarouselIndex] = useState(0);
  const touchStartX = React.useRef(0);
  const safeIndex = Math.min(carouselIndex, Math.max(images.length - 1, 0));

  const onCarouselTouchStart = (e) => { touchStartX.current = e.touches[0].clientX; };
  const onCarouselTouchEnd = (e) => {
    const delta = e.changedTouches[0].clientX - touchStartX.current;
    if (delta < -40 && safeIndex < images.length - 1) setCarouselIndex(safeIndex + 1);
    else if (delta > 40 && safeIndex > 0) setCarouselIndex(safeIndex - 1);
  };

  return (
    <div>
      {hero && (
        <div className="flex justify-center mb-6 pt-2 pb-1">
          <div className="relative" style={{ width: 200, height: 200, maxWidth: "55vw", maxHeight: "55vw" }}>
            {images.length === 0 ? (
              <div className="w-full h-full rounded-2xl overflow-hidden border border-[#3A3631] bg-[#2E2B28] flex items-center justify-center">
                <Dices size={40} className="text-[#5C574F]" />
              </div>
            ) : (
              [2, 1, 0].map((offset) => {
                const idx = safeIndex + offset;
                if (idx >= images.length) return null;
                const isFront = offset === 0;
                return (
                  <div
                    key={idx}
                    className="absolute inset-0 rounded-2xl overflow-hidden border border-[#3A3631] bg-[#2E2B28]"
                    style={{
                      transform: isFront ? "none" : `rotate(${offset * 6}deg) translate(${offset * 10}px, ${offset * -8}px)`,
                      transition: "transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.4s ease",
                      zIndex: 10 - offset,
                      boxShadow: isFront ? "0 8px 20px rgba(0,0,0,0.35)" : "0 4px 10px rgba(0,0,0,0.25)",
                    }}
                    onTouchStart={isFront ? onCarouselTouchStart : undefined}
                    onTouchEnd={isFront ? onCarouselTouchEnd : undefined}
                  >
                    <img src={images[idx]} alt="Foto" className="w-full h-full block object-cover" onClick={isFront ? () => setLightboxIndex(idx) : undefined} />
                  </div>
                );
              })
            )}
            {images.length > 1 && (
              <div className="absolute -bottom-4 left-0 right-0 flex justify-center gap-1.5 z-20">
                {images.map((_, i) => (
                  <div key={i} className={`w-1.5 h-1.5 rounded-full ${i === safeIndex ? "bg-[#F2EDE4]" : "bg-[#F2EDE4]/30"}`} />
                ))}
              </div>
            )}
            {editable && (
              <button type="button" onClick={() => setSheetOpen(true)} aria-label="Foto hinzufügen"
                className="absolute -bottom-2 -right-2 z-20 bg-[conic-gradient(from_0deg,#ff5a96,#ffc850,#78dcff,#b482ff,#ff5a96)] text-[#F2EDE4] rounded-full p-3 border-4 border-[#1C1B1A] active:scale-95">
                {images.length > 0 ? <Plus size={16} /> : <Camera size={16} />}
              </button>
            )}
          </div>
        </div>
      )}
      {!hero && (images.length > 0 || editable) && (
        <div className="flex gap-2 overflow-x-auto pb-1">
          {images.map((img, i) => (
            <button key={i} type="button" onClick={() => setLightboxIndex(i)} className="shrink-0 w-16 h-16 rounded-lg overflow-hidden border border-[#3A3631]">
              <img src={img} alt="Foto" className="w-full h-full block object-cover" />
            </button>
          ))}
          {editable && (
            <button type="button" onClick={() => setSheetOpen(true)} className="shrink-0 w-16 h-16 rounded-lg border-2 border-dashed border-[#3A3631] flex items-center justify-center text-[#5C574F]">
              <Plus size={18} />
            </button>
          )}
        </div>
      )}
      {sheetOpen && <ImagePickerSheet onAdd={(img) => { onAdd(img); setCarouselIndex(images.length); setSheetOpen(false); }} onClose={() => setSheetOpen(false)} />}
      {lightboxIndex !== null && images[lightboxIndex] && (
        <div className="fixed inset-0 bg-black/90 z-[70] flex items-center justify-center p-3" onClick={() => setLightboxIndex(null)}>
          <img src={images[lightboxIndex]} alt="Foto vergrößert" className="max-w-full max-h-[88vh] block object-contain rounded-lg" />
          {editable && (
            <div className="absolute bottom-6 flex gap-2">
              {onReplace && (
                <button
                  onClick={(e) => { e.stopPropagation(); setCropIndex(lightboxIndex); }}
                  className="bg-[#262422] border border-[#3A3631] text-[#F2EDE4] px-4 py-2.5 rounded-[14px] flex items-center gap-2 text-sm font-medium"
                >
                  <Maximize2 size={16} /> Ausschnitt anpassen
                </button>
              )}
              <button
                onClick={(e) => { e.stopPropagation(); onRemove(lightboxIndex); setLightboxIndex(null); }}
                className="bg-[#C1443C] text-white px-4 py-2.5 rounded-[14px] flex items-center gap-2 text-sm font-medium"
              >
                <Trash2 size={16} /> Foto entfernen
              </button>
            </div>
          )}
        </div>
      )}
      {cropIndex !== null && images[cropIndex] && (
        <ImageCropModal
          src={images[cropIndex]}
          onConfirm={(cropped) => { onReplace(cropIndex, cropped); setCropIndex(null); }}
          onCancel={() => setCropIndex(null)}
        />
      )}
    </div>
  );
}

function TagPickerModal({ title, options, selected, onToggle, onAddCustom, onClose, showIcons = true, descriptions = null }) {
  const [query, setQuery] = useState("");
  const [expandedInfo, setExpandedInfo] = useState(null);
  const filtered = options.filter((o) => o.toLowerCase().includes(query.toLowerCase()));
  const exists = options.some((o) => o.toLowerCase() === query.trim().toLowerCase());

  return (
    <div className="fixed top-0 left-0 right-0 bg-black/70 z-[60] flex items-end sm:items-center justify-center p-0 sm:p-6" style={{ height: "var(--app-height, 100dvh)", top: "var(--app-offset-top, 0px)" }}>
      <div className="bg-[#1C1B1A] border border-[#3A3631] rounded-t-2xl sm:rounded-2xl w-full sm:max-w-lg max-h-[var(--app-height,100dvh)] flex flex-col rise-in font-body">
        <div className="shrink-0 border-b border-[#3A3631] px-5 py-4 flex items-center justify-between">
          <h2 className="font-display text-xl text-[#F2EDE4]">{title}</h2>
          <button onClick={onClose} className="text-[#A39C8F] p-1"><X size={22} /></button>
        </div>
        {descriptions && <p className="shrink-0 px-4 pt-3 text-xs text-[#5C574F]">Tippe auf das <span className="inline-flex items-center justify-center w-4 h-4 rounded-full border border-[#5C574F] text-[10px] mx-0.5">i</span> für eine kurze Erklärung.</p>}
        <div className="shrink-0 p-4 border-b border-[#3A3631] space-y-2">
          <input
            onFocus={handleFocusScroll}
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            placeholder="Suchen oder Neues eintragen…"
            className="w-full h-12 bg-[#262422] border border-[#3A3631] rounded-[14px] px-3.5 text-[#F2EDE4] text-base focus:outline-none focus:border-[#6C7FE0]"
          />
          {query.trim() && !exists && (
            <button
              onClick={() => { onAddCustom(query.trim()); onToggle(query.trim()); setQuery(""); }}
              className="w-full h-12 bg-[conic-gradient(from_0deg,#ff5a96,#ffc850,#78dcff,#b482ff,#ff5a96)] text-[#F2EDE4] rounded-[14px] text-sm flex items-center justify-center gap-1.5"
            >
              <Plus size={14} /> „{query.trim()}" hinzufügen
            </button>
          )}
        </div>
        <div className={descriptions ? "p-4 overflow-y-auto flex-1 flex flex-col gap-2" : "p-4 overflow-y-auto flex-1 flex flex-wrap gap-2 content-start"}>
          {filtered.map((opt) => {
            const isSel = selected.includes(opt);
            const OptIcon = showIcons ? tagIcon(opt) : null;
            const desc = descriptions && descriptions[opt];
            if (descriptions) {
              return (
                <div key={opt} className={`w-full rounded-[14px] border ${isSel ? "bg-[#F2EDE4] border-[#F2EDE4]" : "bg-[#262422] border-[#3A3631]"}`}>
                  <div className="w-full flex items-center px-3.5 py-3 gap-2">
                    <button
                      type="button"
                      onClick={() => onToggle(opt)}
                      className={`flex-1 text-left text-sm ${isSel ? "text-[#1C1B1A] font-medium" : "text-[#A39C8F]"}`}
                    >
                      {opt}
                    </button>
                    {desc && (
                      <button
                        type="button"
                        onClick={() => setExpandedInfo(expandedInfo === opt ? null : opt)}
                        aria-label="Erklärung anzeigen"
                        className={`shrink-0 w-7 h-7 rounded-full border flex items-center justify-center text-sm font-semibold ${isSel ? "border-[#1C1B1A]/30 text-[#1C1B1A]" : "border-[#5C574F] text-[#5C574F]"}`}
                      >
                        i
                      </button>
                    )}
                  </div>
                  {expandedInfo === opt && desc && (
                    <p className={`px-3.5 pb-3 text-xs ${isSel ? "text-[#1C1B1A]" : "text-[#A39C8F]"}`}>{desc}</p>
                  )}
                </div>
              );
            }
            return (
              <button
                key={opt}
                onClick={() => onToggle(opt)}
                className={`px-3 py-1.5 rounded-full text-xs border flex items-center gap-1.5 ${isSel ? "bg-[#F2EDE4] border-[#F2EDE4] text-[#1C1B1A] font-medium" : "bg-[#262422] border-[#3A3631] text-[#A39C8F]"}`}
              >
                {OptIcon && <OptIcon size={12} />}
                {opt}
              </button>
            );
          })}
          {filtered.length === 0 && <p className="text-sm text-[#5C574F] w-full">Kein Treffer — trag oben einen neuen Begriff ein.</p>}
        </div>
        <div className="shrink-0 p-4 border-t border-[#3A3631]">
          <button onClick={onClose} className="w-full bg-[#262422] border border-[#3A3631] text-[#F2EDE4] rounded-[14px] py-3 font-medium">
            Fertig ({selected.length} ausgewählt)
          </button>
        </div>
      </div>
    </div>
  );
}

function SettingsPage({ customCategories, customMechanisms, customPlayerTypes, onAddCategory, onRemoveCategory, onAddMechanism, onRemoveMechanism, onAddPlayerType, onRemovePlayerType, demoMode, onToggleDemo, syncUrl, syncStatus, onOpenSync, bggImportStatus, bggImportResult, bggImportError, onImportBggPlays, games, plays, onMergeGames, aiWorkerUrl, onSaveAiWorkerUrl }) {
  const [view, setView] = useState("menu"); // menu | sync | ai | bggImport | customize | duplicates | demo
  const [aiUrlInput, setAiUrlInput] = useState(aiWorkerUrl || "");
  const [bggUsername, setBggUsername] = useState("");
  const duplicateGroups = useMemo(() => {
    if (!games) return [];
    const norm = (s) => s.toLowerCase().replace(/\s*\([^)]*\)\s*/g, "").replace(/[^a-z0-9]+/g, " ").trim();
    const groups = [];
    const used = new Set();
    games.forEach((g, i) => {
      if (used.has(g.id)) return;
      const gNorm = norm(g.name);
      const matches = games.filter((h, j) => j !== i && !used.has(h.id) && norm(h.name) === gNorm);
      if (matches.length > 0) {

function normalizeSyncUrl(url) {
  if (!url) return "";
  let u = url.trim();
  if (!u) return "";
  if (!u.endsWith("/")) u += "/";
  return u;
}

/* ---------------- EMAIL/PASSWORD AUTH (lightweight REST, no SDK) ----------------
   Signs in with your own email/password against the Firebase project so the
   database rules can require `auth != null` in a way that's actually locked —
   unlike anonymous auth, nobody else can get a token without your password.
   Runs automatically in the background — no login screen for daily use. */
const AUTH_KEYS = { apiKey: "spielregal:apiKey", email: "spielregal:authEmail", password: "spielregal:authPassword", idToken: "spielregal:idToken", refreshToken: "spielregal:refreshToken", expiresAt: "spielregal:tokenExpiresAt" };

async function signInWithPassword(apiKey, email, password) {
  const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${apiKey}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password, returnSecureToken: true }),
  });
  if (!res.ok) throw new Error("Anmeldung fehlgeschlagen — E-Mail, Passwort oder API-Schlüssel prüfen");
  const json = await res.json();
  const expiresAt = Date.now() + (parseInt(json.expiresIn, 10) || 3600) * 1000;
  localStorage.setItem(AUTH_KEYS.idToken, json.idToken);
  localStorage.setItem(AUTH_KEYS.refreshToken, json.refreshToken);
  localStorage.setItem(AUTH_KEYS.expiresAt, String(expiresAt));
  return json.idToken;
}

async function refreshIdToken(apiKey, refreshToken) {
  const res = await fetch(`https://securetoken.googleapis.com/v1/token?key=${apiKey}`, {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(refreshToken)}`,
  });
  if (!res.ok) throw new Error("Token-Erneuerung fehlgeschlagen");
  const json = await res.json();
  const expiresAt = Date.now() + (parseInt(json.expires_in, 10) || 3600) * 1000;
  localStorage.setItem(AUTH_KEYS.idToken, json.id_token);
  localStorage.setItem(AUTH_KEYS.refreshToken, json.refresh_token);
  localStorage.setItem(AUTH_KEYS.expiresAt, String(expiresAt));
  return json.id_token;
}

// Returns a currently-valid ID token, signing in or refreshing as needed.
// Returns "" (no token) when no API key/credentials are configured — falls
// back to unauthenticated requests so older setups without a key keep working.
async function getValidIdToken(apiKey) {
  if (!apiKey) return "";
  const storedToken = localStorage.getItem(AUTH_KEYS.idToken);
  const expiresAt = parseInt(localStorage.getItem(AUTH_KEYS.expiresAt) || "0", 10);
  const refreshToken = localStorage.getItem(AUTH_KEYS.refreshToken);
  if (storedToken && Date.now() < expiresAt - 60000) return storedToken;
  if (refreshToken) {
    try { return await refreshIdToken(apiKey, refreshToken); } catch { /* fall through to fresh sign-in */ }
  }
  const email = localStorage.getItem(AUTH_KEYS.email);
  const password = localStorage.getItem(AUTH_KEYS.password);
  if (!email || !password) return "";
  return signInWithPassword(apiKey, email, password);
}

async function cloudPush(syncUrl, data, apiKey) {
  const base = normalizeSyncUrl(syncUrl);
  if (!base) return;
  const payload = { ...data, updatedAt: Date.now() };
  const token = await getValidIdToken(apiKey).catch(() => "");
  const url = base + "data.json" + (token ? `?auth=${token}` : "");
  const res = await fetch(url, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  if (!res.ok) throw new Error("Der Spielzug wurde nicht gewertet — Speichern in der Cloud fehlgeschlagen");
  return payload.updatedAt;
}
async function cloudPull(syncUrl, apiKey) {
  const base = normalizeSyncUrl(syncUrl);
  if (!base) return null;
  const token = await getValidIdToken(apiKey).catch(() => "");
  const url = base + "data.json" + (token ? `?auth=${token}` : "");
  const res = await fetch(url);
  if (!res.ok) throw new Error("Karten ziehen fehlgeschlagen — Cloud-Abruf hat nicht geklappt");

  return json;
}

  const alternateNames = Array.from(item.getElementsByTagName("name")).filter(n => n.getAttribute("type") === "alternate").map(n => n.getAttribute("value"));
  // BGG doesn't tag alternate-name languages at all — best-effort guess via German

  const germanName = alternateNames.find(n => GERMAN_HINTS.some(h => n.toLowerCase().includes(h))) || null;

  const mechanisms = Array.from(item.getElementsByTagName("link")).filter(l => l.getAttribute("type") === "boardgamemechanic").map(l => l.getAttribute("value"));

  // BGG lists every regional publisher with no "primary" flag. Best-effort: keep the

    "game factory", "franckh-kosmos", "klemmer spiele", "piatnik", "united games entertainment", "iq-spiele", "drei magier spiele",
  ];
  const germanMatches = allPublishers.filter(p => KNOWN_GERMAN_PUBLISHERS.some(k => p.toLowerCase().includes(k)));
  const publishers = [...new Set([allPublishers[0], ...germanMatches].filter(Boolean))];
  const designers = Array.from(item.getElementsByTagName("link")).filter(l => l.getAttribute("type") === "boardgamedesigner").map(l => l.getAttribute("value"));
  const weight = item.getElementsByTagName("averageweight")[0]?.getAttribute("value");
  const bggImage = getTxt("image");
  // Expansion links: inbound="true" means THIS item is an expansion of the linked
  // (base) game. Links without inbound mean the linked item is an expansion OF this one.
  const expansionLinks = Array.from(item.getElementsByTagName("link")).filter(l => l.getAttribute("type") === "boardgameexpansion");

// Builds a compact text summary of the collection + recent play history to
// give the AI real context, without sending full game objects.
function buildCollectionContextForAI(games, plays) {
  const owned = games.filter((g) => g.status !== "wishlist");
  const playCounts = {};
  plays.forEach((p) => { playCounts[p.gameId] = (playCounts[p.gameId] || 0) + 1; });
  // Keep the context focused: prioritize games with a real description or recent
  // play activity so the model reasons over relevant, well-described games first.
  const sorted = [...owned].sort((a, b) => {
    const scoreA = (a.summary ? 2 : 0) + (playCounts[a.id] ? 1 : 0);
    const scoreB = (b.summary ? 2 : 0) + (playCounts[b.id] ? 1 : 0);
    return scoreB - scoreA;
  });
  const capped = sorted.slice(0, 60);
  const lines = capped.map((g) => {
    const count = playCounts[g.id] || 0;
    const tags = [...(g.categories || []), ...(g.mechanisms || [])].slice(0, 4).join(", ");
    const players = g.minPlayers ? `${g.minPlayers}-${g.maxPlayers} Spieler` : "Spieleranzahl unbekannt";
    const time = g.minTime ? `${g.minTime}-${g.maxTime} Min.` : "Dauer unbekannt";
    const comp = complexityLabel(g) || "Komplexität unbekannt";
    const desc = g.summary ? ` | Beschreibung: ${g.summary.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim().slice(0, 220)}` : "";
    return `- ${g.name} | ${players} | ${time} | ${comp} | Themen: ${tags || "-"} | ${count}× gespielt${count === 0 ? " (noch nie gespielt)" : ""}${desc}`;
  });
  const recentPlays = [...plays].sort((a, b) => (b.date || "").localeCompare(a.date || "")).slice(0, 8)
    .map((p) => `${p.gameName} am ${p.date}`).join("; ");
  const omittedNote = sorted.length > capped.length ? `\n(${sorted.length - capped.length} weitere Spiele mit weniger Info nicht aufgeführt, um fokussiert zu bleiben.)` : "";
  return `Sammlung des Nutzers:\n${lines.join("\n")}${omittedNote}\n\nZuletzt gespielt: ${recentPlays || "noch keine Partien eingetragen"}`;
}

// Fetches ALL plays BGG has stored for a username (paginated, 100 per page,

async function bggFetchAllPlays(username) {

    for (let attempt = 1; attempt <= 4; attempt++) {
      let res;
      try { res = await fetch(url); } catch { res = null; }
      if (res && res.ok) { text = await res.text(); break; }
      if (attempt === 4) {
        if (page === 1) throw new Error("BGG-Partien konnten nicht geladen werden — Nutzername oder Verbindung prüfen");
        incomplete = true;
      } else {
        await new Promise((r) => setTimeout(r, 1500 * attempt));
      }
    }
    if (text === null) break; // gave up on this page after retries — stop here, keep what we have
    const xml = new DOMParser().parseFromString(text, "text/xml");
    const playEls = Array.from(xml.getElementsByTagName("play"));
    if (playEls.length === 0) break;
    playEls.forEach((el) => {
      const itemEl = el.getElementsByTagName("item")[0];
      const playerEls = Array.from(el.getElementsByTagName("player"));
      const commentsEl = el.getElementsByTagName("comments")[0];
      all.push({
        bggPlayId: el.getAttribute("id"),
        date: el.getAttribute("date"),
        quantity: Math.max(1, parseInt(el.getAttribute("quantity"), 10) || 1),
        objectid: itemEl ? itemEl.getAttribute("objectid") : "",
        itemName: itemEl ? itemEl.getAttribute("name") : "",
        comments: commentsEl ? commentsEl.textContent : "",
        players: playerEls.map((pl) => ({
          name: pl.getAttribute("name") || pl.getAttribute("username") || "",
          win: pl.getAttribute("win") === "1",
        })),
      });
    });
    if (playEls.length < 100) break;
    page++;
    await new Promise((r) => setTimeout(r, 1200)); // stay well under BGG's rate limit
  }
  all.incomplete = incomplete;
  return all;
}

const Pill = ({ children, tone = "default" }) => {
  const tones = {
    default: "bg-[#2E2B28] text-[#A39C8F] border-[#3A3631]",

const Cover = ({ game, size = "md", className: extraClass = "" }) => {

  const handleSaveClick = () => {
    if (!initial) {
      haptic([10, 30, 15]);

      setTimeout(() => onSave(form), 380);
    } else {
      onSave(form);
    }
  };
  const [typesLoading, setTypesLoading] = useState(false);
  const [germanLookupLoading, setGermanLookupLoading] = useState(false);
  const [publisherTrimLoading, setPublisherTrimLoading] = useState(false);
  useEffect(() => {
    if (!aiWorkerUrl || !initial || !initial.bggId || (initial.publishers || []).length <= 2) return;
    let cancelled = false;
    (async () => {
      setPublisherTrimLoading(true);
      try {
        const fresh = await bggThing(initial.bggId);
        let publishers = fresh.publishers || [];
        if (publishers.length === 0 && (fresh.allPublishers || []).length > 0) {
          const aiGuess = await aiIdentifyGermanInfo(aiWorkerUrl, fresh.name, fresh.alternateNames, fresh.allPublishers);
          publishers = [fresh.allPublishers[0], ...(aiGuess.germanPublishers || [])].filter(Boolean);
        }
        if (!cancelled && publishers.length > 0) setForm((f) => ({ ...f, publishers: [...new Set(publishers)] }));
      } catch { /* silent — best-effort cleanup, not critical */ }
      finally { if (!cancelled) setPublisherTrimLoading(false); }
    })();
    return () => { cancelled = true; };
  }, [initial]);
  const [germanLookupError, setGermanLookupError] = useState("");
  const [typesError, setTypesError] = useState("");
  const [summaryVersion, setSummaryVersion] = useState(0);
  const [pitchError, setPitchError] = useState("");

  const [searchError, setSearchError] = useState("");

    id: uid(), bggId: "", name: "", year: "", publishers: [], designers: [], images: [],

    complexity: "", mechanisms: [], categories: [], playerTypes: [], status: "owned",

  const runSearch = async () => {
    if (!query.trim()) return;
    setSearching(true); setSearchError("");
    try {
      const r = await bggSearch(query);
      setResults(r);
      if (r.length === 0) setSearchError("Keine Treffer bei BGG. Manuell anlegen?");
    } catch (e) { setSearchError("BGG macht gerade Pause vom Brett. Leg das Spiel einfach manuell an."); }
    finally { setSearching(false); }

  const pickResult = async (r) => {
    setSearching(true);
    try {
      const details = await bggThing(r.bggId);
      setForm((f) => ({ ...f, ...details, status: "owned", addedDate: f.addedDate }));
      setStep("manual");
      // Best-effort fallback: if neither a German title nor a German publisher
      // could be confidently guessed, and the AI worker is set up, ask it.
      const needsGermanName = !details.germanName && (details.alternateNames || []).length > 0;
      const needsGermanPublisher = !(details.publishers || []).some(p => p !== details.publishers[0]) && (details.allPublishers || []).length > 1;
      if (aiWorkerUrl && (needsGermanName || needsGermanPublisher)) {
        try {
          const guess = await aiIdentifyGermanInfo(aiWorkerUrl, details.name, details.alternateNames, details.allPublishers);

            const next = { ...f };

            if (needsGermanPublisher && (guess.germanPublishers || []).length) next.publishers = [...new Set([...next.publishers, ...guess.germanPublishers])];

                  }) : "Kategorien auswählen…"}

                <span className="flex-1 min-w-0 flex flex-wrap gap-1.5 items-center">
                  {form.playerTypes.length ? form.playerTypes.map((t) => <Pill key={t}>{t}</Pill>) : "Spielertyp auswählen…"}
                </span>
                <ChevronDown size={16} className="shrink-0 text-[#5C574F] mt-1.5" />
              </button>
            </div>
            {aiWorkerUrl && (
              <button
                type="button"
                disabled={typesLoading}
                onClick={async () => {
                  setTypesLoading(true); setTypesError("");
                  try {
                    const result = await aiSuggestGameTags(aiWorkerUrl, form, categoryOptions || [], mechanismOptions || [], playerTypeOptions || []);
                    result.categories.forEach((c) => { if (!(categoryOptions || []).includes(c)) onAddCategory(c); });
                    result.mechanisms.forEach((m) => { if (!(mechanismOptions || []).includes(m)) onAddMechanism(m); });
                    result.playerTypes.forEach((t) => { if (!(playerTypeOptions || []).includes(t)) onAddPlayerType(t, ""); });
                    setForm((f) => ({
                      ...f,
                      categories: [...new Set([...f.categories, ...result.categories])],
                      mechanisms: [...new Set([...f.mechanisms, ...result.mechanisms])],
                      playerTypes: [...new Set([...f.playerTypes, ...result.playerTypes])],
                    }));
                  } catch (e) { setTypesError(e.message || "Fehlgeschlagen"); }
                  finally { setTypesLoading(false); }
                }}

              >
                {typesLoading ? <Loader2 size={11} /> : <Sparkles size={11} />} Kategorien, Mechanismen &amp; Spielertyp von KI vorschlagen lassen
              </button>
            )}
            {typesError && <p className="text-[11px] text-[#C1443C] -mt-2">{typesError}</p>}

            <Segmented
              options={[{ v: "owned", label: "Besitz" }, { v: "wishlist", label: "Wunschliste" }, { v: "none", label: "Nur gespielt" }]}
              value={form.status}
              onChange={(v) => update("status", v)}
            />

            <button type="button" onClick={() => update("isCampaign", !form.isCampaign)}
              className={`w-full h-12 flex items-center justify-between px-3.5 rounded-[14px] border ${form.isCampaign ? "bg-[#6C7FE0]/15 border-[#6C7FE0]/40" : "bg-transparent border-[#3A3631]"}`}>
              <span className={`text-sm ${form.isCampaign ? "text-[#F2EDE4]" : "text-[#5C574F]"}`}>Kampagnenspiel (Fortschritts-Historie)</span>
              <div className={`w-10 h-6 rounded-full flex items-center px-0.5 transition-colors ${form.isCampaign ? "bg-[conic-gradient(from_0deg,#ff5a96,#ffc850,#78dcff,#b482ff,#ff5a96)] justify-end" : "bg-[#3A3631] justify-start"}`}>
                <div className="w-5 h-5 rounded-full bg-[#F2EDE4]" />
              </div>
            </button>

            <div>
              <button type="button" onClick={() => update("lentTo", form.lentTo ? "" : " ")}
                className={`w-full h-12 flex items-center justify-between px-3.5 rounded-[14px] border ${form.lentTo ? "bg-[#D4A24C]/15 border-[#D4A24C]/40" : "bg-transparent border-[#3A3631]"}`}>
                <span className={`text-sm flex items-center gap-2 ${form.lentTo ? "text-[#F2EDE4]" : "text-[#5C574F]"}`}><HandCoins size={16} /> Verliehen</span>
                <div className={`w-10 h-6 rounded-full flex items-center px-0.5 transition-colors ${form.lentTo ? "bg-[#D4A24C] justify-end" : "bg-[#3A3631] justify-start"}`}>
                  <div className="w-5 h-5 rounded-full bg-[#F2EDE4]" />
                </div>
              </button>
              {form.lentTo && (
                <input value={form.lentTo.trim()} onChange={(e) => update("lentTo", e.target.value)} placeholder="An wen?"
                  className="w-full h-11 bg-[#262422] border border-[#3A3631] rounded-[14px] px-3.5 text-[#F2EDE4] text-base mt-2 focus:outline-none focus:border-[#D4A24C]" />
              )}
            </div>

            <div>
              <label className="block text-[11px] text-[#5C574F]">Deine Bewertung</label>
              <div className="mt-1.5">
                <StarRating value={form.rating} onChange={(v) => update("rating", v)} />
              </div>
            </div>

            <div>
              <label className="block text-[11px] text-[#5C574F]">Notizen, Hausregeln</label>
              <div className="mt-1.5">
                <RichTextEditor value={form.notes} onChange={(html) => update("notes", html)} placeholder="Notizen, Hausregeln…" />
              </div>
            </div>
          </div>
        )}
        {step === "manual" && (
          <div className="shrink-0 border-t border-[#3A3631] p-4 space-y-2">
            <button disabled={!form.name.trim()} onClick={handleSaveClick}
              className={`w-full bg-[conic-gradient(from_0deg,#ff5a96,#ffc850,#78dcff,#b482ff,#ff5a96)] disabled:opacity-40 text-[#F2EDE4] rounded-[14px] py-3 font-medium active:scale-[0.99] flex items-center justify-center gap-2 relative ${saveCelebrating ? "save-pop" : ""}`}>
              {saveCelebrating && <span className="save-ring" />}
              <Check size={18} /> Speichern
            </button>
            {initial && (
              <button onClick={() => onDelete(initial.id)} className="w-full text-[#C1443C] text-sm font-body py-2 flex items-center justify-center gap-1.5">
                <Trash2 size={14} /> Spiel entfernen
              </button>
            )}
          </div>
        )}
      </div>
      {pickerOpen === "mechanisms" && (
        <TagPickerModal
          title="Mechanismen"
          options={mechanismOptions}
          selected={form.mechanisms}
          onToggle={(v) => update("mechanisms", form.mechanisms.includes(v) ? form.mechanisms.filter((x) => x !== v) : [...form.mechanisms, v])}
          onAddCustom={onAddMechanism}
          onClose={() => setPickerOpen(null)}
          descriptions={MECHANISM_DESCRIPTIONS}
        />
      )}
      {pickerOpen === "categories" && (
        <TagPickerModal
          title="Kategorien"
          options={categoryOptions}
          selected={form.categories}
          onToggle={(v) => update("categories", form.categories.includes(v) ? form.categories.filter((x) => x !== v) : [...form.categories, v])}
          onAddCustom={onAddCategory}
          onClose={() => setPickerOpen(null)}
          descriptions={CATEGORY_DESCRIPTIONS}
        />
      )}
      {pickerOpen === "publishers" && (
        <TagPickerModal
          title="Verlag"
          options={publisherOptions}
          selected={form.publishers}
          onToggle={(v) => update("publishers", form.publishers.includes(v) ? form.publishers.filter((x) => x !== v) : [...form.publishers, v])}
          onAddCustom={() => {}}
          onClose={() => setPickerOpen(null)}
          showIcons={false}
        />
      )}
      {pickerOpen === "designers" && (
        <TagPickerModal
          title="Designer"
          options={designerOptions}
          selected={form.designers}
          onToggle={(v) => update("designers", form.designers.includes(v) ? form.designers.filter((x) => x !== v) : [...form.designers, v])}
          onAddCustom={() => {}}
          onClose={() => setPickerOpen(null)}
          showIcons={false}
        />
      )}
      {pickerOpen === "playerTypes" && (
        <TagPickerModal
          title="Spielertyp"
          options={playerTypeOptions}
          selected={form.playerTypes}
          onToggle={(v) => update("playerTypes", form.playerTypes.includes(v) ? form.playerTypes.filter((x) => x !== v) : [...form.playerTypes, v])}
          onAddCustom={onAddPlayerType}
          onClose={() => setPickerOpen(null)}
          showIcons={false}
          descriptions={{ ...PLAYER_TYPE_DESCRIPTIONS, ...customPlayerTypeDescriptions }}
        />
      )}
    </div>
  );
}

/* ---------------- ADD PLAY MODAL ---------------- */
function PlayFormModal({ games, plays, playerProfiles, onAddPlayer, onUpdatePlayerPhoto, onUpdatePlayerName, onRemovePlayer, initial, onClose, onSave, onDelete }) {
  const [editingPlayer, setEditingPlayer] = useState(null); // { id, name }
  const playerLongPressTimer = React.useRef(null);
  const playerLongPressFired = React.useRef(false);
  const startPlayerLongPress = (p) => {
    playerLongPressFired.current = false;
    playerLongPressTimer.current = setTimeout(() => {
      playerLongPressFired.current = true;
      if (navigator.vibrate) navigator.vibrate(10);
      setEditingPlayer({ id: p.id, name: p.name });
    }, 500);
  };
  const cancelPlayerLongPress = () => { if (playerLongPressTimer.current) clearTimeout(playerLongPressTimer.current); };
  const [gameQuery, setGameQuery] = useState("");
  const [selectedGame, setSelectedGame] = useState(() =>
    initial ? (games.find(g => g.id === initial.gameId) || { id: initial.gameId, name: initial.gameName }) : null
  );
  const [mode, setMode] = useState(initial ? initial.mode : "physical-owned");
  const [playerIds, setPlayerIds] = useState(initial ? initial.playerIds || [] : []);
  const [newPlayerOpen, setNewPlayerOpen] = useState(false);
  const [newPlayerName, setNewPlayerName] = useState("");
  const [newPlayerPhotoFor, setNewPlayerPhotoFor] = useState(null);
  const togglePlayerId = (id) => { haptic(6); setPlayerIds((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id])); };
  const knownPlayers = useMemo(() => {
    const set = new Set();
    const profileNames = new Set(playerProfiles.map((p) => p.name));
    (plays || []).forEach((p) => (p.players || "").split(",").map((n) => n.trim()).filter(Boolean).forEach((n) => { if (!profileNames.has(n)) set.add(n); }));
    return Array.from(set).sort();
  }, [plays, playerProfiles]);
  const addPlayerName = (name) => {
    const current = players.split(",").map((n) => n.trim()).filter(Boolean);
    if (current.includes(name)) return;
    setPlayers(current.length ? `${current.join(", ")}, ${name}` : name);
  };
  const removePlayerName = (name) => {
    const current = players.split(",").map((n) => n.trim()).filter(Boolean);
    setPlayers(current.filter((n) => n !== name).join(", "));
  };
  const [date, setDate] = useState(initial ? initial.date : new Date().toISOString().slice(0, 10));
  const [players, setPlayers] = useState(initial ? initial.players || "" : "");
  const [winner, setWinner] = useState(initial ? initial.winner || "" : "");
  const [notes, setNotes] = useState(initial ? initial.notes || "" : "");
  const notesRef = React.useRef(null);
  useEffect(() => {
    if (notesRef.current) { notesRef.current.style.height = "auto"; notesRef.current.style.height = notesRef.current.scrollHeight + "px"; }
  }, []);
  const [images, setImages] = useState(initial ? initial.images || [] : []);
  const [quantity, setQuantity] = useState(1);

  const filtered = gameQuery ? games.filter(g => g.name.toLowerCase().includes(gameQuery.toLowerCase())) : games.slice(0, 6);

  const save = () => {
    if (!selectedGame) return;
    const profileNames = playerIds.map((id) => (playerProfiles.find((p) => p.id === id) || {}).name).filter(Boolean);
    const mergedPlayers = [...new Set([...profileNames, ...players.split(",").map((n) => n.trim()).filter(Boolean)])].join(", ");
    if (!initial && quantity > 1) {
      const batch = Array.from({ length: quantity }, () => ({
        id: uid(), gameId: selectedGame.id, gameName: selectedGame.name, date, mode, players: mergedPlayers, playerIds, winner, notes, images,
      }));
      onSave(batch);
    } else {
      onSave({ id: initial ? initial.id : uid(), gameId: selectedGame.id, gameName: selectedGame.name, date, mode, players: mergedPlayers, playerIds, winner, notes, images });
    }
  };

  return (
    <div className="fixed top-0 left-0 right-0 bg-black/90 z-50 flex items-end sm:items-center justify-center p-0 sm:p-6" style={{ height: "var(--app-height, 100dvh)", top: "var(--app-offset-top, 0px)" }}>
      <div onFocus={handleFocusScroll} className="bg-[#1C1B1A] border border-[#3A3631] rounded-t-2xl sm:rounded-2xl w-full sm:max-w-lg max-h-[var(--app-height,100dvh)] flex flex-col overflow-hidden rise-in font-body">
        <div className="shrink-0 bg-[#1C1B1A] border-b border-[#3A3631] px-5 py-4 flex items-center justify-between">
          <h2 className="font-display text-xl text-[#F2EDE4]">{initial ? "Partie bearbeiten" : "Partie eintragen"}</h2>
          <button onClick={onClose} className="text-[#A39C8F] p-1"><X size={22} /></button>
        </div>
        <div className="p-5 space-y-4 overflow-y-auto flex-1">
          {!selectedGame ? (
            <div>
              <input value={gameQuery} onChange={(e) => setGameQuery(e.target.value)} placeholder="Spiel suchen…"
                className="w-full bg-[#262422] border border-[#3A3631] rounded-[14px] px-4 py-3 text-[#F2EDE4] placeholder-[#5C574F] focus:outline-none focus:border-[#E85D9C]" />
              <div className="mt-3 space-y-2">
                {filtered.map((g) => (
                  <button key={g.id} onClick={() => setSelectedGame(g)}
                    className="w-full text-left bg-[#262422] hover:bg-[#2E2B28] border border-[#3A3631] rounded-[14px] px-4 py-2.5 flex items-center gap-3">
                    <Cover game={g} size="sm" /><span className="text-[#F2EDE4]">{g.name}</span>
                  </button>
                ))}
                {filtered.length === 0 && (
                  <p className="text-sm text-[#5C574F] px-1">Nicht in deiner Liste? Lege es erst kurz über „Spiel hinzufügen" in der Sammlung an — auch ungespielt, ohne Besitz.</p>
                )}
              </div>
            </div>
          ) : (
            <>
              <div className="flex items-center gap-3 bg-[#262422] border border-[#3A3631] rounded-[14px] px-4 py-3">
                <Cover game={selectedGame} size="sm" />
                <span className="text-[#F2EDE4] font-medium flex-1 min-w-0 truncate">{selectedGame.name}</span>
                <button onClick={() => setSelectedGame(null)} className="text-[#5C574F] text-xs shrink-0">Ändern</button>
              </div>
              <Segmented
                options={[{ v: "physical-owned", label: "Eigene Sammlung", icon: Home }, { v: "physical-other", label: "Geliehen / Event", icon: Sofa }, { v: "bga", label: "BoardGameArena", icon: Globe }]}
                value={mode}
                onChange={setMode}
              />
              <div>
                <label className="block text-[11px] text-[#5C574F]">Datum</label>
                <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="w-auto min-w-[180px] h-12 bg-[#262422] border border-[#3A3631] rounded-[14px] px-3.5 text-[#F2EDE4] text-base mt-2.5" />
              </div>
              {!initial && (
                <div>
                  <label className="block text-[11px] text-[#5C574F]">Wie oft an diesem Tag gespielt?</label>
                  <div className="flex items-center gap-3 mt-2.5">
                    <button type="button" onClick={() => { haptic(5); setQuantity((q) => Math.max(1, q - 1)); }} className="w-11 h-11 rounded-full bg-[#262422] border border-[#3A3631] text-[#F2EDE4] flex items-center justify-center text-lg">–</button>
                    <span className="font-display text-xl text-[#F2EDE4] w-8 text-center">{quantity}</span>
                    <button type="button" onClick={() => { haptic(5); setQuantity((q) => Math.min(20, q + 1)); }} className="w-11 h-11 rounded-full bg-[#262422] border border-[#3A3631] text-[#F2EDE4] flex items-center justify-center text-lg">+</button>
                    {quantity > 1 && <span className="text-xs text-[#5C574F]">legt {quantity} gleiche Partien an</span>}
                  </div>
                </div>
              )}
              <div>
                <label className="block text-[11px] text-[#5C574F]">Mitspieler <span className="text-[10px]">(antippen zum Auswählen, halten zum Bearbeiten)</span></label>
                <div className="flex items-start gap-3 overflow-x-auto pb-1 mt-1.5">
                  {playerProfiles.map((p) => {
                    const selected = playerIds.includes(p.id);
                    return (
                      <div key={p.id} className="shrink-0 flex flex-col items-center gap-1 w-16">
                        <button
                          type="button"
                          onClick={() => { if (playerLongPressFired.current) { playerLongPressFired.current = false; return; } togglePlayerId(p.id); }}
                          onTouchStart={() => startPlayerLongPress(p)}
                          onTouchEnd={cancelPlayerLongPress}
                          onTouchMove={cancelPlayerLongPress}
                          onContextMenu={(e) => e.preventDefault()}
                          className="relative w-14 h-14 rounded-full overflow-hidden border-2" style={{ borderColor: selected ? "#6C7FE0" : "#3A3631" }}>
                          {p.photo ? (
                            <img src={p.photo} alt={p.name} className="w-full h-full block object-cover" />
                          ) : (
                            <div className="w-full h-full bg-[#262422] flex items-center justify-center"><Camera size={20} className="text-[#5C574F]" /></div>
                          )}
                          {selected && <div className="absolute inset-0 bg-[#6C7FE0]/25 flex items-center justify-center"><Check size={18} className="text-white" /></div>}
                        </button>
                        <p className="text-[10px] text-[#5C574F] truncate w-full text-center">{p.name}</p>
                      </div>
                    );
                  })}
                  <button type="button" onClick={() => setNewPlayerOpen(true)} className="shrink-0 w-14 h-14 rounded-full border-2 border-dashed border-[#3A3631] flex items-center justify-center text-[#5C574F]">
                    <Plus size={18} />
                  </button>
                </div>
              </div>
              <input value={players} onChange={(e) => setPlayers(e.target.value)} placeholder="Weitere Mitspieler (Freitext, optional)"
                className={`w-full h-12 border border-[#3A3631] rounded-[14px] px-3.5 text-[#F2EDE4] text-base focus:outline-none focus:border-[#6C7FE0] ${players ? "bg-[#262422]" : "bg-transparent"}`} />
              {knownPlayers.length > 0 && (
                <div className="flex gap-1.5 overflow-x-auto pb-1 -mt-1.5">
                  {knownPlayers.map((n) => {
                    const active = players.split(",").map((x) => x.trim()).includes(n);
                    return (
                      <button
                        key={n}
                        type="button"
                        onClick={() => (active ? removePlayerName(n) : addPlayerName(n))}
                        className={`shrink-0 px-2.5 py-1 rounded-full text-xs border flex items-center gap-1 ${active ? "bg-[#1C1B1A] border-[#3A3631] text-[#5C574F]" : "bg-[#262422] border-[#3A3631] text-[#A39C8F]"}`}
                      >
                        {active ? <Check size={11} /> : "+"} {n}
                      </button>
                    );
                  })}
                </div>
              )}
              <input value={winner} onChange={(e) => setWinner(e.target.value)} placeholder="Gewinner (optional)"
                className={`w-full h-12 border border-[#3A3631] rounded-[14px] px-3.5 text-[#F2EDE4] text-base focus:outline-none focus:border-[#6C7FE0] ${winner ? "bg-[#262422]" : "bg-transparent"}`} />
              <textarea
                ref={notesRef}
                value={notes}
                onChange={(e) => setNotes(e.target.value)}
                onInput={(e) => { e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px"; }}
                placeholder="Notiz (optional)" rows={2}
                className={`w-full border border-[#3A3631] rounded-[14px] px-3.5 py-3 text-[#F2EDE4] text-base focus:outline-none focus:border-[#6C7FE0] resize-none overflow-hidden ${notes ? "bg-[#262422]" : "bg-transparent"}`} />
              <div>
                <label className="block text-[11px] text-[#5C574F]">Fotos</label>
                <div className="mt-1.5">
                  <PhotoGallerySection
                    images={images}
                    onAdd={(img) => setImages((prev) => [...prev, img])}
                    onRemove={(i) => setImages((prev) => prev.filter((_, idx) => idx !== i))}
                    onReplace={(i, img) => setImages((prev) => prev.map((x, idx) => (idx === i ? img : x)))}
                  />
                </div>
              </div>
            </>
          )}
        </div>
        {selectedGame && (
          <div className="shrink-0 border-t border-[#3A3631] p-4 space-y-2">
            <button onClick={save} className="w-full bg-[conic-gradient(from_0deg,#ff5a96,#ffc850,#78dcff,#b482ff,#ff5a96)] text-[#F2EDE4] rounded-[14px] py-3 font-medium active:scale-[0.99] flex items-center justify-center gap-2">
              <Check size={18} /> Partie speichern
            </button>
            {initial && (
              <button onClick={() => onDelete(initial.id)} className="w-full text-[#C1443C] text-sm font-body py-2 flex items-center justify-center gap-1.5">
                <Trash2 size={14} /> Partie löschen
              </button>
            )}
          </div>
        )}
      </div>
      {newPlayerOpen && (
        <div className="fixed top-0 left-0 right-0 bg-black/70 z-[65] flex items-end sm:items-center justify-center p-0 sm:p-6" style={{ height: "var(--app-height, 100dvh)", top: "var(--app-offset-top, 0px)" }} onClick={() => setNewPlayerOpen(false)}>
          <div className="bg-[#1C1B1A] border border-[#3A3631] rounded-t-2xl sm:rounded-2xl w-full sm:max-w-sm rise-in font-body p-5 space-y-3" onClick={(e) => e.stopPropagation()}>
            <h3 className="font-display text-lg text-[#F2EDE4]">Neuer Mitspieler</h3>
            <input onFocus={handleFocusScroll} value={newPlayerName} onChange={(e) => setNewPlayerName(e.target.value)} placeholder="Name"
              className="w-full h-12 bg-[#262422] border border-[#3A3631] rounded-[14px] px-3.5 text-[#F2EDE4] text-base focus:outline-none focus:border-[#6C7FE0]" />
            <button onClick={() => { if (newPlayerName.trim()) { const id = onAddPlayer(newPlayerName.trim()); setPlayerIds((prev) => [...prev, id]); setNewPlayerName(""); setNewPlayerOpen(false); } }}
              className="w-full h-12 bg-[conic-gradient(from_0deg,#ff5a96,#ffc850,#78dcff,#b482ff,#ff5a96)] text-[#F2EDE4] rounded-[14px] font-medium">Anlegen</button>
            <p className="text-xs text-[#5C574F] text-center">Ein Profilbild kannst du danach über den Namen ergänzen.</p>
          </div>

        <ImagePickerSheet onAdd={(img) => { onUpdatePlayerPhoto(newPlayerPhotoFor, img); setNewPlayerPhotoFor(null); }} onClose={() => setNewPlayerPhotoFor(null)} />

          <div className="bg-[#1C1B1A] border border-[#3A3631] rounded-t-2xl sm:rounded-2xl w-full sm:max-w-sm rise-in font-body p-5 space-y-3" onClick={(e) => e.stopPropagation()}>
            <h3 className="font-display text-lg text-[#F2EDE4]">Mitspieler bearbeiten</h3>

            >

              <div className="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 active:opacity-100">

            >

              onClick={() => { onRemovePlayer(editingPlayer.id); setPlayerIds((prev) => prev.filter((id) => id !== editingPlayer.id)); setEditingPlayer(null); }}

            >

  );
}
