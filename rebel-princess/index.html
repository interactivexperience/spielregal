<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F6F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prinzessinnenball">
<title>Prinzessinnenball</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#161616;--paper:#F7F6F2;--white:#FFFFFF;--gray:#E9E7E1;--muted:#6b6862}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{overflow-x:hidden;background:var(--paper);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior-y:contain}
#app{position:relative}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.hand{font-family:"Caveat Brush","Comic Sans MS",cursive}
.mono{font-family:"Space Mono",ui-monospace,monospace}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 24px}
.ill{display:block;width:100%;height:100%;overflow:visible}
.start{padding-top:16px;text-align:center}
.start h1{font-size:clamp(34px,11vw,52px);line-height:.95;margin:6px 0 4px;overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--muted);margin:0 0 14px}
.hero{width:100%;max-width:420px;margin:0 auto;aspect-ratio:360/250}
.panel{background:var(--white);border:2.5px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--ink);padding:16px;text-align:left;margin:14px 0}
.label{font-family:"Space Mono",monospace;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 6px}
.input{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:2px solid var(--ink);border-radius:12px;background:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--ink);border-radius:999px;padding:7px 14px;background:#fff;font-weight:600}
.chip.on{background:var(--ink);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border:2.5px solid var(--ink);border-radius:14px;background:var(--ink);color:#fff;box-shadow:3px 3px 0 #9a978f;font-weight:700;font-size:16px;text-decoration:none}
.btn.white{background:#fff;color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.35;box-shadow:none;transform:none}
.btn.wide{width:100%}
.link{text-decoration:underline;text-underline-offset:3px;font-weight:600}
.note{font-size:12.5px;color:#3b3934;background:#fff;border:1.5px dashed var(--ink);border-radius:10px;padding:6px 9px;margin-top:8px}
.top{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:2.5px solid var(--ink);padding:calc(6px + env(safe-area-inset-top)) 0 6px}
.top .row{max-width:560px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:10px}
.round{font-size:26px;line-height:1;white-space:nowrap}
.round small{font-family:"Space Mono",monospace;font-size:11px;color:var(--muted);display:block;margin-top:2px}
.icobtn{width:40px;height:40px;border:2px solid var(--ink);border-radius:50%;background:#fff;font-weight:800;font-size:18px;flex:none;display:grid;place-items:center}
.rule{flex:1;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:4px 8px;font-size:11.5px;line-height:1.2;text-align:left;min-width:0}
.rule b{font-family:"Caveat Brush",cursive;font-size:16px;font-weight:400;display:block;line-height:1}
/* Tisch */
.opps{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.opp{display:flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:14px;background:#fff;padding:4px 6px 4px 4px;text-align:left;width:100%;min-width:0}
.opp.cur{box-shadow:3px 3px 0 var(--ink);background:#fff}
.opp.cur .av{outline:3px solid var(--ink);outline-offset:1px}
.opp .av{width:34px;height:34px;border-radius:50%;overflow:hidden;border:2px solid var(--ink);flex:none;background:#fff}
.opp .nm{font-weight:700;font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opp .pr{font-size:10.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opp .pr s{opacity:.6}
.opp .sc{margin-left:auto;text-align:right;font-family:"Space Mono",monospace;font-size:10px;line-height:1.2;flex:none}
.opp .sc b{font-size:15px}
.opp .cnt{display:inline-flex;gap:1px}
.opp .cnt i{width:5px;height:9px;border:1.2px solid var(--ink);border-radius:1.5px;background:#fff;display:block}
.table{margin-top:12px;border:2.5px solid var(--ink);border-radius:22px;background:#fff;padding:10px;min-height:178px;position:relative;
  background-image:radial-gradient(circle,#161616 1px,transparent 1.2px);background-size:14px 14px;background-color:#fff}
.table .lbl{position:absolute;left:10px;top:6px;font-family:"Space Mono",monospace;font-size:10.5px;background:#fff;padding:0 4px;border-radius:4px}
.table .pen{position:absolute;right:10px;top:6px;font-family:"Space Mono",monospace;font-size:10.5px;background:#fff;padding:0 4px;border-radius:4px}
.trick{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.tp{text-align:center;width:66px}
.tp .who{font-size:10.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#fff;border-radius:4px}
.tp.win .card{box-shadow:0 0 0 3px #fff,0 0 0 5.5px var(--ink)}
.tp .pw{font-size:9.5px;background:var(--ink);color:#fff;border-radius:5px;padding:0 3px;margin-top:2px;display:inline-block}
/* Karten */
.card{width:62px;height:90px;border:2.5px solid var(--ink);border-radius:9px;background:#fff;position:relative;overflow:hidden;flex:none;display:block}
.card .v{position:absolute;left:4px;top:1px;font-family:"Caveat Brush",cursive;font-size:21px;line-height:1}
.card .v2{position:absolute;right:4px;bottom:0;font-family:"Caveat Brush",cursive;font-size:15px;line-height:1;transform:rotate(180deg)}
.card .s{position:absolute;right:3px;top:3px;width:16px;height:16px}
.card .art{position:absolute;left:6px;right:6px;top:20px;bottom:12px}
.card.P{background:#161616;color:#fff;border-color:#161616}
.card.P .art svg path,.card.P .art svg circle{}
.card.frog{background:repeating-linear-gradient(45deg,#fff 0 5px,#e9e7e1 5px 7px)}
.card .badge{position:absolute;left:3px;bottom:3px;font-family:"Space Mono",monospace;font-size:8.5px;font-weight:700;background:#fff;color:#161616;border:1.5px solid #161616;border-radius:5px;padding:0 3px}
.handsec{position:sticky;bottom:0;z-index:20;background:var(--paper);border-top:2.5px solid var(--ink);padding:8px 0 calc(10px + env(safe-area-inset-bottom));margin-top:14px}
.handsec .in{max-width:560px;margin:0 auto;padding:0 12px}
.handbar{display:flex;align-items:center;gap:8px;margin-bottom:6px;min-height:38px}
.handbar .msg{flex:1;font-size:12.5px;line-height:1.2}
.cards{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.cards .card{width:52px;height:76px;transition:transform .12s}
.cards .card .v{font-size:18px}
.cards .card .art{top:18px;bottom:8px;left:4px;right:4px}
.cards .card.no{opacity:.35}
.cards .card.sel{transform:translateY(-10px);box-shadow:3px 3px 0 var(--ink)}
.cards .card.ok{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--ink)}
.toggle{display:flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:99px;padding:4px 10px 4px 4px;background:#fff;font-size:12px;font-weight:700}
.toggle i{width:30px;height:18px;border-radius:99px;border:2px solid var(--ink);position:relative;background:#fff;flex:none}
.toggle i::after{content:"";position:absolute;left:1px;top:1px;width:12px;height:12px;border-radius:50%;background:var(--ink);transition:left .15s}
.toggle.on i{background:var(--ink)}
.toggle.on i::after{left:13px;background:#fff}
.toggle:disabled{opacity:.35}
.sec{margin-top:16px}
.sech{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 6px}
.sech h2{font-size:26px;margin:0;line-height:1}
.score{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
.score th,.score td{padding:5px 4px;border-bottom:1.5px dashed #b9b6ae;text-align:right}
.score th:first-child,.score td:first-child{text-align:left}
.score tr.tot td{font-weight:800;border-bottom:0;font-size:15px}
.ov{position:fixed;inset:0;z-index:60;background:rgba(22,22,22,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:90vh;overflow:auto;border:2.5px solid var(--ink);border-bottom:0;border-radius:22px 22px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));position:relative}
.sheet h3{font-family:"Caveat Brush",cursive;font-size:30px;font-weight:400;margin:0 0 4px;line-height:1;padding-right:48px}
.sheet .x{position:absolute;right:12px;top:12px}
.grab{width:44px;height:5px;border-radius:9px;background:var(--ink);opacity:.25;margin:0 auto 10px}
.pcards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.pcard{border:2.5px solid var(--ink);border-radius:16px;background:#fff;padding:8px;text-align:center;box-shadow:3px 3px 0 var(--ink)}
.pcard.on{background:var(--ink);color:#fff}
.pcard .pi{height:110px}
.pcard b{font-family:"Caveat Brush",cursive;font-size:20px;font-weight:400;display:block;line-height:1.05;margin-top:4px}
.pcard small{font-size:12px;display:block;margin-top:3px;line-height:1.25}
.btnrow{display:flex;gap:8px;margin-top:12px}
.btnrow .btn{flex:1}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);z-index:70;background:var(--ink);color:#fff;padding:8px 14px;border-radius:12px;font-size:13px;max-width:min(92vw,520px);box-shadow:3px 3px 0 #9a978f}
.rules h4{font-family:"Caveat Brush",cursive;font-size:22px;font-weight:400;margin:16px 0 2px}
.rules p,.rules li{font-size:14px}
.rules ul{padding-left:18px;margin:4px 0}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:8px;margin:8px 0}
.podium .pp{text-align:center;width:96px}
.podium .pp .ill{height:110px}
.podium .pl{border:2.5px solid var(--ink);border-radius:10px 10px 0 0;font-family:"Caveat Brush",cursive;font-size:26px;display:grid;place-items:center;background:#fff}
.podium .pp:nth-child(2) .pl{background:var(--ink);color:#fff}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="wob" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="p-dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.5" fill="#161616"/><circle cx="7.5" cy="7.5" r="1.5" fill="#161616"/></pattern>
    <pattern id="p-dots-w" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.5" fill="#FFFFFF"/><circle cx="7.5" cy="7.5" r="1.5" fill="#FFFFFF"/></pattern>
    <pattern id="p-stripes" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,0 V8" stroke="#161616" stroke-width="2.2"/></pattern>
    <pattern id="p-stripes-w" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,0 V8" stroke="#FFFFFF" stroke-width="2.2"/></pattern>
    <pattern id="p-checks" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0,0 V10 M0,0 H10" stroke="#161616" stroke-width="1.6"/></pattern>
    <pattern id="p-checks-w" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0,0 V10 M0,0 H10" stroke="#FFFFFF" stroke-width="1.6"/></pattern>
    <pattern id="p-dash" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M2,3 l3,4 M8,1 l2,5 M4,9 l3,2" stroke="#161616" stroke-width="1.6" stroke-linecap="round"/></pattern>
    <pattern id="p-dash-w" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M2,3 l3,4 M8,1 l2,5 M4,9 l3,2" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/></pattern>
  </defs>
</svg>
<div id="app"></div>
<script>
'use strict';
/* =====================================================================
   Prinzessinnenball – ein Stichspiel nach dem Spielprinzip von
   „Rebel Princess“. Prinzessinnen weichen fünf Ballnächte lang den
   Heiratsanträgen der Prinzen aus. Karten, Fähigkeiten, Rundenregeln
   und Illustrationen (schwarz-weiß) sind eigene Neuschöpfungen.
   ===================================================================== */
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function prng(seed) {
  let a = (typeof seed === 'number' ? seed : hashStr(String(seed))) >>> 0;
  return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

// ---------- Figuren (gemeinsam mit Grand Hotel Wien) ----------
const SKINS = ['#F7D6BF', '#EFC09C', '#D99B70', '#A86B45', '#7A4A2E'];
const BODIES = ['#E4472E', '#2C47B5', '#F1B02B', '#F28AA6', '#1F8A4D', '#161616', '#FFF9EE'];
const HAIRC = ['#161616', '#161616', '#161616', '#6B3E22', '#C8452B', '#E8C15A'];

function propSvg(p) {
  switch (p) {
    case 'tray': return '<path d="M62,98 H94" stroke-width="3.2"/><path d="M68,98 C68,88 88,88 88,98 Z" fill="#FFF9EE"/><circle cx="78" cy="87" r="2" fill="#161616"/>';
    case 'key': return '<circle cx="80" cy="98" r="6" fill="#F1B02B"/><circle cx="80" cy="98" r="2" fill="#FFF9EE"/><path d="M86,98 H97 M93,98 V103 M96,98 V102" fill="none"/>';
    case 'cup': return '<path d="M70,94 H88 V100 C88,106 84,109 79,109 C74,109 70,106 70,100 Z" fill="#FFF9EE"/><path d="M88,97 C94,97 94,104 88,104" fill="none"/><ellipse cx="79" cy="94" rx="9" ry="2" fill="#161616"/><path d="M76,88 q-3,-4 0,-7 M82,88 q-3,-4 0,-7" fill="none" stroke-width="1.6"/>';
    case 'cake': return '<path d="M66,106 H94 V96 L66,100 Z" fill="#F28AA6"/><path d="M66,100 L94,96" stroke="#FFF9EE" stroke-width="2.6"/><path d="M66,100 L94,96 V106 H66Z" fill="none"/><circle cx="88" cy="91" r="3.4" fill="#E4472E"/><path d="M88,88 q2,-4 5,-4" fill="none" stroke-width="1.6"/>';
    case 'bottle': return '<path d="M79,78 h6 v9 c4,2 5,6 5,9 v16 h-16 v-16 c0,-3 1,-7 5,-9 z" fill="#1F8A4D"/><rect x="75" y="98" width="14" height="7" fill="#FFF9EE"/>';
    case 'coins': return '<ellipse cx="80" cy="106" rx="10" ry="4" fill="#F1B02B"/><ellipse cx="80" cy="101" rx="10" ry="4" fill="#F1B02B"/><ellipse cx="80" cy="96" rx="10" ry="4" fill="#F1B02B"/><text x="80" y="98.5" font-size="6" text-anchor="middle" font-family="Space Mono,monospace" font-weight="700" stroke="none" fill="#161616">K</text>';
    case 'bell': return '<path d="M70,106 H92" stroke-width="3.2"/><path d="M72,106 C72,92 90,92 90,106 Z" fill="#F1B02B"/><circle cx="81" cy="91" r="2" fill="#161616"/>';
    case 'book': return '<path d="M66,92 L80,95 L94,92 V108 L80,111 L66,108 Z" fill="#E4472E"/><path d="M80,95 V111" fill="none"/>';
    case 'paper': return '<rect x="68" y="84" width="24" height="26" rx="2" fill="#FFF9EE" transform="rotate(8 80 97)"/><path d="M72,92 H88 M72,97 H86 M72,102 H88" fill="none" stroke-width="1.5" transform="rotate(8 80 97)"/>';
    case 'note': return '<path d="M74,108 V86 L92,82 V102" fill="none" stroke-width="2.6"/><ellipse cx="70.5" cy="108" rx="5" ry="3.6" fill="#161616"/><ellipse cx="88.5" cy="102" rx="5" ry="3.6" fill="#161616"/>';
    case 'broom': return '<path d="M86,70 L78,104" fill="none" stroke-width="2.6"/><path d="M70,104 L86,104 L84,116 L68,116 Z" fill="#F1B02B"/><path d="M72,106 L71,115 M77,106 L76,115 M82,106 L81,115" fill="none" stroke-width="1.4"/>';
    case 'suitcase': return '<rect x="66" y="94" width="28" height="20" rx="3" fill="#B8692F"/><path d="M74,94 V89 H86 V94" fill="none"/><path d="M66,102 H94" stroke="#F1B02B" stroke-width="2"/>';
    case 'basket': return '<path d="M66,98 H94 L90,114 H70 Z" fill="#B8692F"/><path d="M70,98 C70,86 90,86 90,98" fill="none"/><circle cx="76" cy="96" r="3.5" fill="#E4472E"/><circle cx="84" cy="96" r="3.5" fill="#1F8A4D"/>';
    case 'flower': return '<path d="M80,112 V92" fill="none"/><circle cx="80" cy="88" r="6" fill="#F28AA6"/><circle cx="80" cy="88" r="2.4" fill="#F1B02B"/><path d="M80,102 q6,-6 10,-2 q-4,6 -10,2Z" fill="#1F8A4D"/>';
    case 'flag': return '<path d="M78,116 V78" fill="none" stroke-width="2.4"/><path d="M78,78 L96,84 L78,90 Z" fill="#E4472E"/>';
    case 'strudel': return '<path d="M64,104 C64,94 96,94 96,104 C96,110 64,110 64,104 Z" fill="#C9772E"/><path d="M71,99 l3,9 M79,98 l3,10 M87,98 l3,9" fill="none" stroke-width="1.6"/>';
    default: return '';
  }
}

function person(seed, o = {}, vb = '0 0 100 120') {
  const r = prng(seed);
  const pk = a => a[Math.floor(r() * a.length)];
  const skin = o.skin || pk(SKINS);
  const body = o.body || pk(BODIES);
  const pat = o.pat || pk(['dots', 'stripes', 'checks', 'dash', 'none', 'none']);
  const hair = o.hair || pk(['bun', 'bob', 'short', 'curls', 'side', 'long']);
  const hairC = o.hairC || pk(HAIRC);
  const hat = o.hat || 'none';
  const dark = body === '#161616';
  const ink = '#161616';
  let s = `<svg viewBox="${vb}" class="ill" aria-hidden="true"><g filter="url(#wob)" stroke="${ink}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">`;
  if (hair === 'long') s += `<path d="M30,38 C25,66 32,74 40,74 L60,74 C68,74 75,66 70,38 Z" fill="${hairC}"/>`;
  if (hair === 'bun') s += `<circle cx="50" cy="17" r="7.5" fill="${hairC}"/>`;
  s += `<rect x="44" y="48" width="12" height="14" fill="${skin}" stroke="none"/><path d="M44,49 V61 M56,49 V61" fill="none"/>`;
  const bodyD = 'M21,122 C19,92 25,66 50,60 C75,66 81,92 79,122 Z';
  s += `<path d="${bodyD}" fill="${body}"/>`;
  if (pat !== 'none') s += `<path d="${bodyD}" fill="url(#p-${pat}${dark ? '-w' : ''})" stroke="none"/>`;
  s += `<path d="M42,61 L50,71 L58,61" fill="${o.collar || (dark ? '#FFF9EE' : '#FFF9EE')}"/>`;
  s += `<path d="M31,78 C25,94 27,106 34,113" fill="none"/><path d="M69,78 C75,94 73,106 66,113" fill="none"/>`;
  s += `<circle cx="50" cy="38" r="16.5" fill="${skin}"/>`;
  switch (hair) {
    case 'bun': case 'long': s += `<path d="M33.5,38 C33,20 67,20 66.5,38 C60,28 40,28 33.5,38 Z" fill="${hairC}"/>`; break;
    case 'bob': s += `<path d="M31,48 C26,17 74,17 69,48 L65,48 L64.5,33 C56,30 44,30 35.5,33 L35,48 Z" fill="${hairC}"/>`; break;
    case 'short': s += `<path d="M33.5,35 C33,19 67,19 66.5,35 C62,28 54,27 50,30 C45,27 38,29 33.5,35 Z" fill="${hairC}"/>`; break;
    case 'curls': s += [[36, 29], [42, 22.5], [50, 20.5], [58, 22.5], [64, 29]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="6.2" fill="${hairC}"/>`).join(''); break;
    case 'side': s += `<path d="M33.5,37 C32,19 68,17 66.5,37 C63,27 51,27 44,24 C40,29 37,32 33.5,37 Z" fill="${hairC}"/>`; break;
    case 'bald': s += `<path d="M34,40 C33,33 35,31 37,30 M66,40 C67,33 65,31 63,30" fill="none" stroke="${hairC}" stroke-width="3.2"/>`; break;
  }
  // Gesicht
  if (o.sleepy) s += `<path d="M41,39 q3,2.5 6,0 M53,39 q3,2.5 6,0" fill="none" stroke-width="1.8"/>`;

// ---------- Spiel ----------
function newGame(name, nBots, seed) {
  S = { v: 1, id: 'rp-' + Date.now().toString(36) + '-' + ((seed >>> 0) % 1679616).toString(36), rng: seed | 0, round: 0, players: [], log: [], recorded: false, screen: 'game', history: [] };
  const n = nBots + 1;
  const bots = shuffle(BOT_NAMES.slice()).slice(0, nBots);
  const mk = (nm, bot, look) => ({ name: nm, bot, look, hand: [], won: [], roundPts: 0, total: 0, princess: null, used: false });
  if (name !== null) S.players.push(mk(name || 'Du', false, { hair: 'bob', hat: 'tiara', body: '#161616', pat: 'dots' }));
  bots.forEach(b => S.players.push(mk(b[0], true, b[1])));
  if (name === null) S.players.push(mk('Prinzessin Test', true, { hair: 'bun', hat: 'crown' }));
  const prs = shuffle(PRINCESSES.map(p => p.k));
  S.rules = shuffle(RULES.map(r => r.k)).slice(0, ROUNDS);
  S.players.forEach(p => { if (p.bot) p.princess = prs.pop(); });
  const me = S.players.find(p => !p.bot);
  if (me) { S.princessChoice = [prs.pop(), prs.pop()]; S.phase = 'princess'; }
  log(`Der Ball beginnt: ${n} Prinzessinnen, ${ROUNDS} Ballnächte.`);
  if (!me) startRound();
}
function startRound() {
  S.round++;
  S.rule = S.rules[S.round - 1];
  const n = S.players.length;
  let deck = [];
  for (const s of SUITS) for (let v = 1; v <= 12; v++) deck.push(s + v);
  deck = deck.filter(c => !(REMOVE[n] || []).includes(c));
  shuffle(deck);
  const per = deck.length / n;
  S.players.forEach((p, i) => { p.hand = sortHand(deck.slice(i * per, (i + 1) * per)); p.won = []; p.roundPts = 0; p.used = false; });
  S.tricksLeft = per;
  S.trickNo = 0;
  S.leader = (S.round - 1) % n;
  S.broken = false;
  S.trick = [];
  S.lastTrick = null;
  log(`— Ballnacht ${S.round}: „${rule().n}“ – ${rule().tx}`);
  if (rule().pass) {
    S.phase = 'pass';
    S.passSel = S.players.map(p => p.bot ? botPass(p, rule().pass[0]) : null);
    if (!S.players.some(p => !p.bot)) doPass();

function botPass(p, k) {

}

  const last = S.trick.length === S.players.length - 1;
  const danger = c => (c === FROG ? 30 : 0) + (suit(c) === 'P' ? 8 + val(c) / 3 : 0) + (c === 'K12' && S.rule === 'tee' ? -5 : 0);
  const low = S.rule === 'umgekehrt';

  let best = null, bv = -Infinity;
  for (const pw of powerOpts) {
    for (const c of legal(p, pw === 'schnee')) {
      let v = 0;
      if (!S.trick.length) {

        const wins = trickWinner(trick) === pi;
        const cards = trick.map(t => t.c);
        const pts = trickPts(cards, pi);

        if (wins) v = -(pts + expectExtra) * 3 - (last ? 0 : rank(c) * 0.3) + (pts <= 0 && last ? rank(c) * 0.4 : 0);

  if (!sh) return '';
  if (sh.type === 'rules') return sheetWrap(rulesHtml());
  if (sh.type === 'menu') return sheetWrap(`<h3>Menü</h3><div class="btnrow" style="flex-direction:column"><button class="btn white wide" data-a="rules">Spielregeln</button>${S && S.history.length ? '<button class="btn white wide" data-a="scores">Punktestand</button>' : ''}<button class="btn white wide" data-a="restart">Partie abbrechen &amp; neu starten</button></div>`);
  if (sh.type === 'scores') return sheetWrap(`<h3>Punktestand</h3>${scoreTable()}`);
  if (sh.type === 'pinfo') { const p = S.players[sh.p], pr = princess(p); return sheetWrap(`<h3>${esc(p.name)}</h3>${pr ? `<div style="display:flex;gap:12px;align-items:center"><div style="width:90px;height:108px;flex:none">${princessArt(pr.k)}</div><div><b>${esc(pr.n)}</b><p style="font-size:13px;margin:4px 0">${esc(pr.tx)}</p><p style="font-size:12px;color:#6b6862">${pr.when === 'passive' ? 'wirkt dauerhaft' : p.used ? 'in dieser Runde schon genutzt' : 'in dieser Runde noch verfügbar'}</p></div></div>` : ''}<p class="label" style="margin-top:12px">Gewonnene Karten mit Anträgen</p><div style="display:flex;gap:4px;flex-wrap:wrap">${p.won.filter(c => cardPts(c, sh.p)).map(c => cardHtml(c, '', 'disabled')).join('') || '<span style="font-size:13px">keine</span>'}</div>`); }
  return '';
}

// ---------- Render & Events ----------
const $app = document.getElementById('app');
function render() {
  const nm = document.getElementById('nm'); if (nm) U.setup.name = nm.value;
  let h = !S || S.screen !== 'game' && S.screen !== 'end' ? viewStart() : S.screen === 'end' ? viewEnd()
    : S.phase === 'princess' ? `<div class="wrap start"><div class="hero">${heroSvg()}</div><h1 class="hand">Prinzessinnenball</h1></div>` : viewGame();
  h += viewSheet();
  if (U.toast) h += `<div class="toast">${esc(U.toast)}</div>`;
  $app.innerHTML = h;
  save();
  pump();
}
function pump() {
  if (!S || S.screen !== 'game' || U.busy) return;
  const need = S.phase === 'collect' || (S.phase === 'play' && cur().bot);
  if (!need) return;
  U.busy = true;
  const delay = S.phase === 'collect' ? (U.fast ? 450 : 1300) : (U.fast ? 200 : 700);
  setTimeout(() => {
    U.busy = false;
    if (!S || S.screen !== 'game') return;
    if (S.phase === 'collect' || (S.phase === 'play' && cur().bot)) botStep();
    render();
  }, delay);
}
const H = {
  bots: d => { U.setup.bots = +d.n; },
  pickname: d => { U.setup.name = d.n; const nm = document.getElementById('nm'); if (nm) nm.value = d.n; },
  start: () => { const nm = document.getElementById('nm'); U.setup.name = nm ? nm.value.trim() : ''; U.pick = null; newGame(U.setup.name || 'Du', U.setup.bots, (Date.now() ^ (Math.random() * 1e9)) | 0); window.scrollTo(0, 0); },
  resume: () => { S = load(); U.sheet = null; U.sel = null; U.passSel = []; },
  rules: () => { U.sheet = { type: 'rules' }; },
  menu: () => { U.sheet = { type: 'menu' }; },
  scores: () => { U.sheet = { type: 'scores' }; },
  restart: () => { if (confirm('Laufende Partie wirklich abbrechen?')) { clearSave(); S = null; U.sheet = null; } },
  newgame: () => { clearSave(); S = null; U.sheet = null; },
  close: () => { U.sheet = null; }, ovclose: () => { U.sheet = null; },
  pinfo: d => { U.sheet = { type: 'pinfo', p: +d.p }; },
  pick: d => { U.pick = d.k; },
  pickok: () => { human().princess = U.pick; S.phase = 'ready'; startRound(); },
  fast: () => { U.fast = !U.fast; },
  power: () => { U.power = !U.power; if (U.sel && !legal(human(), U.power && princess(human()).k === 'schnee').includes(U.sel)) U.sel = null; },
  card: d => {
    const me = human(), c = d.c;
    if (S.phase === 'pass') {
      const k = rule().pass[0];
      const i = U.passSel.indexOf(c);
      if (i >= 0) U.passSel.splice(i, 1); else if (U.passSel.length < k) U.passSel.push(c);
      return;
    }
    if (!isMyTurn()) return;
    if (U.sel === c) return H.play();
    U.sel = c;
  },
  play: () => {
    const me = human();
    const pw = U.power && canUsePower(me, 'play') ? princess(me).k : null;
    if (playCard(me, U.sel, pw)) { if (pw) log(`${me.name} nutzt ${princess(me).n}.`); U.sel = null; U.power = false; }
  },
  dopass: () => { const me = human(); S.passSel[S.players.indexOf(me)] = U.passSel.slice(); U.passSel = []; doPass(); const got = S.passed[(S.players.indexOf(me) - rule().pass[1] + S.players.length) % S.players.length]; toast(`Du bekommst: ${got.map(c => SUIT_1[suit(c)] + ' ' + val(c)).join(', ')}`); },
  ascheyes: () => { const { w, cards } = S.pending; S.pending = null; passPrinces(w, cards); },
  ascheno: () => { const { w, cards } = S.pending; S.pending = null; finishTrick(w, cards); },
  nextround: () => { startRound(); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || !$app.contains(el)) return;
  if (el.dataset.a === 'ovclose' && e.target.closest('[data-stop]')) return;
  if (el.disabled) return;
  const fn = H[el.dataset.a]; if (!fn) return;
  fn(el.dataset); render();
});
window.__rp = {
  simulate(n, seed) {
    newGame(null, n - 1, seed);
    let guard = 0;
    while (S.screen === 'game' && guard++ < 2000) botStep();
    return { final: S.final, guard, history: S.history };
  },
  state: () => S,
  reset: () => { S = null; U.sheet = null; clearSave(); render(); },
};
render();
</script>
</body>
