<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F0E4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Saum">
<title>Saum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Lora:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;500;600;700;800&display=swap">
<style>
/* Layout: ein ruhiger Spieltisch – Lage oben, dein Plan in der Mitte, Hand und Auslage darunter, eine schlanke Aktionsleiste unten.
   Farben und Schriften nach dem Style-Board des Owners: Papier, Dunkelgrün, Aubergine; Akzente Lila, Gelb, Koralle, Blau, Salbei.
   Wortmarke Fraunces Black, Überschriften/Kartentitel Lora Bold, Fließtext DM Sans. */
:root{
  --bg:#F5F0E4;      /* Papier */
  --paper:#FBF8F1;   /* helles Papier für Karten und Fenster */
  --ink:#1F2B27;     /* Schrift, Knöpfe (Dunkelgrün) */
  --logo:#1C302B;    /* Wortmarke */
  --head:#251737;    /* Überschriften (Aubergine) */
  --muted:#6E6B63;
  --line:#E6DDCB;
  --stadt:#D2614F;   /* Koralle, vertieft – Stadt */
  --stadt-soft:#FBE3DE;
  --wild:#5E8052;    /* Salbei, vertieft – Wildnis */
  --wild-soft:#E6EDDF;
  --saum:#F2A744;    /* Gelb – Akzent, du bist dran */
  --saum-soft:#FCEACB;
  --dusk:#F58A7E;    /* Koralle */
  --lilac:#5E4E6F;   /* Lila */
  --blue:#6DA1DB;    /* Himmelblau */
  --teal:#3F6B69;    /* Unterzeile der Wortmarke */
  --bad:#C0452F; --good:#5E8052;
  --f-logo:"Fraunces",Georgia,serif; --f-display:"Lora",Georgia,serif; --f-body:"DM Sans",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17201D; --paper:#1F2A26; --ink:#F2EDE2; --logo:#F2EDE2; --head:#EDE4F7; --muted:#A9A79D; --line:#33413B;
  --stadt:#F08C7C; --stadt-soft:#3A2724; --wild:#A9C29A; --wild-soft:#26332A;
  --saum:#F2A744; --saum-soft:#3D3220; --dusk:#F58A7E; --lilac:#B9AFCB; --blue:#8DB6E6; --teal:#8FC0BC; --bad:#F08C7C; --good:#A9C29A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17201D; --paper:#1F2A26; --ink:#F2EDE2; --logo:#F2EDE2; --head:#EDE4F7; --muted:#A9A79D; --line:#33413B;
  --stadt:#F08C7C; --stadt-soft:#3A2724; --wild:#A9C29A; --wild-soft:#26332A;
  --saum:#F2A744; --saum-soft:#3D3220; --dusk:#F58A7E; --lilac:#B9AFCB; --blue:#8DB6E6; --teal:#8FC0BC; --bad:#F08C7C; --good:#A9C29A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);margin:0;-webkit-font-smoothing:antialiased}
#app{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:14px 132px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;color:var(--head);margin:0;text-wrap:balance;letter-spacing:.005em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible{outline:2px solid var(--saum);outline-offset:2px}
/* Kopf: fest und deckend in der Seitenfarbe (kein Blur), Ansage kompakt, Vorräte immer sichtbar */
.thead{position:sticky;top:0;z-index:4;background:var(--bg);margin:0 -16px;padding:10px 16px 8px;box-shadow:0 1px 0 var(--line)}
.hrow{display:flex;align-items:center;gap:10px;min-height:38px}
.hrow h1{font:900 26px/1 var(--f-logo);text-transform:uppercase;letter-spacing:.01em;color:var(--logo);flex:none;transition:font-size .2s,opacity .2s}
.ann{flex:1;min-width:0;text-align:left;font-size:13px;line-height:1.25;color:var(--ink);background:var(--paper);border-radius:99px;padding:7px 12px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ann.me{background:var(--saum-soft);box-shadow:inset 0 0 0 1.5px var(--saum)}
.ann b{font-weight:700}
.ico{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:600 16px/1 var(--f-body);text-decoration:none;transition:opacity .2s,width .2s,margin .2s}
.thead.scr .hrow h1{font-size:0;opacity:0}
.thead.scr .hrow .ico{opacity:0;width:0;margin-left:-10px;border-width:0;pointer-events:none}
.opps{display:flex;gap:6px;margin:6px -2px 0;padding:2px;overflow-x:auto;scrollbar-width:none;max-height:44px;transition:max-height .22s,opacity .2s,margin .22s,padding .22s}
.thead.scr{padding-top:6px;padding-bottom:6px}
.thead.scr .opps{max-height:0;opacity:0;margin-top:0;padding:0 2px}
.thead.scr .res{margin-top:4px}
.opp{flex:0 0 auto;display:flex;gap:7px;align-items:baseline;border-radius:99px;padding:5px 12px;font-size:12px;color:var(--muted);background:var(--paper);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.opp b{font-weight:600;color:var(--ink)}
.opp .sc{font:700 16px/1 var(--f-display);color:var(--ink)}
.opp.cur{border-color:var(--saum);box-shadow:0 0 0 1px var(--saum)}
.opp.vis{background:var(--saum-soft)}
.res{display:flex;align-items:center;gap:12px;margin-top:8px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.res>span{display:flex;align-items:center;gap:4px}
.res .tk{width:20px;height:20px}
.res .rw{font-size:11.5px;font-weight:700;color:var(--wild);background:var(--wild-soft);border-radius:99px;padding:3px 8px}
.res .rd{margin-left:auto;font-weight:500;color:var(--muted);font-size:12px}
.res .rd.last{color:var(--bad);font-weight:700}
.flash{animation:flash 1.1s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--saum);border-radius:var(--r)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}.hrow h1,.ico{transition:none}}
.me-bar{display:flex;gap:18px;margin:14px 0 4px;font-variant-numeric:tabular-nums;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.me-bar span:first-child{font-family:var(--f-display);font-size:20px;font-weight:700;color:var(--head);margin-right:auto;font-variant-numeric:normal}
.phase{margin:12px 0;padding:12px 14px;border-radius:var(--r);background:var(--paper);border:1px solid var(--line);font-size:14px}
.phase b{font-weight:700}
/* Plan */
.board{container-type:inline-size;display:grid;gap:9px;margin-top:8px}
.row{--th:calc((100cqw - 20px) / 6 * 1.3333);position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));align-items:start;gap:4px;border-radius:12px}
.row.closed{background:color-mix(in srgb,var(--saum) 16%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--saum) 16%,transparent)}
.row.tired .tile{filter:saturate(.45) brightness(1.08);opacity:.7}
.rn{position:absolute;z-index:2;left:-15px;top:calc(var(--th) / 2 - 9px);width:13px;height:18px;border-radius:5px;display:grid;place-items:center;font:700 10px/1 var(--f-body);color:var(--bg);background:var(--ink)}
.row.closed .rn{background:var(--saum);color:#1C302B}
.rz{position:absolute;z-index:2;right:-15px;top:calc(var(--th) / 2 - 8px);font-size:12px;line-height:1;color:var(--muted)}
.cell{height:var(--th);border-radius:9px;border:1px dashed var(--line)}
.tile{border-radius:9px;padding:5px;font-size:11px;line-height:1.15;position:relative;text-align:left;overflow:hidden;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;color:var(--ink);background:var(--paper);container-type:inline-size}
.tile.S{box-shadow:inset 0 -3px 0 var(--stadt),inset 0 0 0 1px var(--line)}
.tile.W{box-shadow:inset 0 -3px 0 var(--wild),inset 0 0 0 1px var(--line)}
.tile b{display:block;font:700 10.5px/1 var(--f-display);margin-bottom:-1px;hyphens:manual;-webkit-hyphens:manual;overflow-wrap:normal;text-shadow:0 1px 6px rgba(20,30,27,.5)}
.tile .tico{position:absolute;left:4px;top:4px;right:4px;display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.tile .tl{--k:.87;display:flex;align-items:center;flex-wrap:wrap;row-gap:1px;max-width:100%}
.tile .tico .tk{width:calc(15px * var(--k));height:calc(15px * var(--k));flex:none}.tile .tico .stk{display:flex}.tile .tico .stk .tk+.tk{margin-left:calc(-6px * var(--k))}
.tile .tico .arr{font-size:calc(9px * var(--k));margin:0 1px;color:#FBF8F1;text-shadow:0 0 3px rgba(0,0,0,.6)}
.tile .tico .pl,.tile .tico .x2,.tile .tico .n{font:800 calc(10px * var(--k))/1 var(--f-body);color:#FBF8F1;text-shadow:0 0 3px rgba(0,0,0,.6)}
.tile .tico .wd{font:700 calc(8px * var(--k))/1 var(--f-body);background:rgba(251,248,241,.9);color:#1F2B27;border-radius:99px;padding:2px 3px}
.tile .tico .gap{width:2px}
.tile .tico{background:linear-gradient(rgba(20,30,27,.34),rgba(20,30,27,0));margin:-4px;padding:4px 4px 8px;border-radius:9px 9px 0 0}
.tw{position:relative;min-width:0;display:flex;flex-direction:column}
.tw .tile{height:var(--th);z-index:1}
.tile .mstar{position:absolute;right:4px;bottom:4px;font-size:14px;color:var(--saum);text-shadow:0 1px 3px rgba(0,0,0,.5)}
/* untergeschobene Upgrades: nur ihre Upgrade-Leiste schaut unter dem Plättchen hervor */
.ups{display:flex;flex-direction:column;margin:-9px 2px 0;padding-top:9px;border-radius:0 0 8px 8px;background:color-mix(in srgb,var(--saum-soft) 92%,var(--paper));box-shadow:0 0 0 1px color-mix(in srgb,var(--saum) 45%,transparent),0 2px 4px rgba(20,30,27,.12);overflow:hidden}
.ust{position:relative;display:flex;align-items:center;justify-content:center;padding:4px 3px;cursor:default}
.ust+.ust{border-top:1px solid color-mix(in srgb,var(--saum) 40%,transparent)}
.ust .pm{width:12px;height:12px;flex:none}
.ust .uic{--k:.87;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:2px 1px;min-width:0;max-width:100%}
.ust .uic .tk{width:calc(15px * var(--k));height:calc(15px * var(--k));flex:none}.ust .uic .stk{display:flex}.ust .uic .stk .tk+.tk{margin-left:calc(-6px * var(--k))}
.ust .uic .arr{font-size:calc(9px * var(--k));margin:0 1px}.ust .uic .pl,.ust .uic .x2,.ust .uic .n{font:800 calc(10px * var(--k))/1 var(--f-body)}
.ust .uic .wd{font:700 calc(8px * var(--k))/1 var(--f-body);background:var(--line);border-radius:99px;padding:2px 3px}
.ust .uic .gap{width:3px}
.tile.mst{box-shadow:inset 0 0 0 2px var(--saum)}
.cell.zs{border:1.5px dashed color-mix(in srgb,var(--stadt) 55%,transparent);background:color-mix(in srgb,var(--stadt) 13%,transparent)}
.cell.zw{border:1.5px dashed color-mix(in srgb,var(--wild) 60%,transparent);background:color-mix(in srgb,var(--wild) 15%,transparent)}
.cell.zf{border:1px dashed var(--line);background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--saum) 10%,transparent) 6px 8px)}
.tile.S{--tint:var(--stadt)}.tile.W{--tint:var(--wild)}
.cell.land{border:2px solid var(--stadt);background:color-mix(in srgb,var(--stadt) 28%,transparent);display:grid;place-items:center;animation:landp 1.2s ease-in-out infinite}
.cell.land.W{border-color:var(--wild);background:color-mix(in srgb,var(--wild) 30%,transparent)}
.cell.land::after{content:"hier";font:700 11px/1 var(--f-body);color:var(--ink)}
@keyframes landp{50%{filter:brightness(1.15)}}
.row.pickrow{cursor:pointer}
.me-bar .dir{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}.me-bar .dir i{width:10px;height:10px;border-radius:3px;margin-left:4px}.me-bar .dir .ds{background:var(--stadt)}.me-bar .dir .dw{background:var(--wild)}
.tile.has-art{color:#FBF8F1;background-size:cover;background-position:center 25%}
.tw[style*="span 2"] .tile.has-art{background-position:center 48%}
.tile.has-art::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(28,48,43,.68),rgba(28,48,43,0) 55%)}
.tile>*{position:relative}
.tile.pick{outline:2px solid var(--saum);outline-offset:1px}
/* Abschnitte */
.sec{margin-top:22px}
.sec h3{font-size:19px;margin-bottom:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
/* Karte im Hochformat 2:3 wie die Bilder: Bild randlos, Text auf Papierfeld im ruhigen unteren Drittel */
.card{isolation:isolate;position:relative;aspect-ratio:3/4;border-radius:var(--r);background:var(--paper);text-align:left;display:flex;flex-direction:column;justify-content:flex-end;min-width:0;overflow:hidden;box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}
.card .art{position:absolute;inset:0;z-index:-1;background:var(--saum-soft);background-size:cover;background-position:center top}
.card .art::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(28,48,43,.6),rgba(28,48,43,0) 55%)}
.card .cost{position:absolute;top:6px;right:6px;line-height:0;filter:drop-shadow(0 1px 3px rgba(28,48,43,.35))}
.card .cost .tk{width:30px;height:30px}
.card .body{container-type:inline-size;position:absolute;left:5px;right:5px;bottom:5px;height:calc(33.333% - 5px);display:grid;grid-template-rows:52fr 48fr;overflow:hidden;border-radius:calc(var(--r) - 4px);background:color-mix(in srgb,var(--paper) 95%,transparent)}
.card .body.solo{grid-template-rows:1fr}
.card .ln{--k:1;display:flex;align-items:center;gap:2.5cqw;min-width:0;overflow:hidden;padding:0 3.5cqw 0 6cqw;position:relative}
.card .ln::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2.6cqw;background:var(--wild)}
.card .ln.up::before{background:var(--saum)}
.card .ln .pm{width:11cqw;height:11cqw;flex:none}
.card .up{background:color-mix(in srgb,var(--saum-soft) 88%,transparent);border-top:1px dashed color-mix(in srgb,var(--saum) 55%,transparent)}
.card .rls{display:flex;flex-direction:column;gap:2cqw;justify-content:center}
.card .acts{position:absolute;top:7px;left:7px;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.card .chip{display:flex;align-items:center;gap:3px;min-height:34px;padding:4px;border-radius:10px;background:#251737;box-shadow:0 0 0 2px rgba(251,248,241,.85),0 3px 8px rgba(20,30,27,.35)}
.card .chip .tk,.card .chip .ic{width:24px;height:24px}
.card .chip .cg{display:flex;align-items:center;color:#FBF8F1;font:800 12px/1 var(--f-body)}
.card .chip .cg .tk{width:18px;height:18px}
.card .chip .ct{color:#FBF8F1;font:700 10px/1 var(--f-body);padding-right:3px}
.card .wtag{position:absolute;top:46px;right:7px;font:700 9.5px/1 var(--f-body);color:#1F2B27;background:rgba(251,248,241,.9);border-radius:99px;padding:4px 7px}
.card:not(:has(.cost)) .wtag{top:9px}
.card .acts{padding-left:9px;padding-top:7px}
.card .acts .bolt{position:absolute;left:-3px;top:-3px;z-index:1;line-height:0}
.card .acts .bolt .pm{width:20px;height:20px;filter:drop-shadow(0 1px 2px rgba(20,30,27,.4))}
.fan .card .acts .bolt .pm{width:15px;height:15px}.fan .card .acts{padding-left:6px;padding-top:5px}
.bigcard .card .acts .bolt .pm{width:26px;height:26px}
.intro.rules .pm{width:20px;height:20px;vertical-align:-5px}
/* große Karte beim langen Drücken: Karte plus Text zu jedem Symbol */
.bigx{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:13;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(20,30,27,.55);color:#FBF8F1;font:600 15px/1 var(--f-body);pointer-events:none}
.bigtxt{width:min(100%,420px);background:var(--paper);border-radius:18px;padding:16px 18px 4px;flex:none}
.bigtxt h3{font-size:23px;line-height:1.1}
.bigtxt .bm{margin:3px 0 14px;font-size:13px;color:var(--muted)}
.bigtxt section{padding:14px 0 16px;border-top:1px solid var(--line)}
.bigtxt{width:min(100%,420px);background:var(--paper);border-radius:18px;padding:16px 18px 4px;flex:none}
.bigtxt h3{font-size:23px;line-height:1.1}
.bigtxt .bm{margin:3px 0 14px;font-size:13px;color:var(--muted)}
.bigtxt section{padding:14px 0 16px;border-top:1px solid var(--line)}
.bigtxt .bhd{display:flex;flex-wrap:wrap;align-items:center;gap:2px 9px;margin-bottom:11px}
.bigtxt .bhd>b{font:700 16px/1.2 var(--f-display);color:var(--head)}
.bigtxt .bhd>small{flex-basis:100%;font:400 12.5px/1.35 var(--f-body);color:var(--muted)}
.bigtxt .bhd .pm{width:24px;height:24px}
.bigtxt .bhd .sw{width:6px;height:18px;border-radius:3px;background:var(--wild);margin:0 1px 0 0}
.bigtxt .bhd .sw.u{background:var(--saum)}
.bigtxt .br{display:flex;align-items:center;gap:12px}
.bigtxt .br+.br{margin-top:13px}
.bigtxt .br.wide{flex-direction:column;align-items:flex-start;gap:6px}
.bigtxt .bsym{display:flex;align-items:center;flex:none;min-width:34px;--k:1}
.bigtxt .btx{font-size:14.5px;line-height:1.4;flex:1;min-width:0}
.bigtxt .bsym .tk,.bigtxt .bsym .ic,.bigtxt .bsym .pm{width:26px;height:26px;flex:none}
.bigtxt .bsym .stk{display:flex}.bigtxt .bsym .stk .tk+.tk{margin-left:-9px}
.bigtxt .bsym .arr{font-size:14px;margin:0 3px}.bigtxt .bsym .pl,.bigtxt .bsym .x2,.bigtxt .bsym .n{font:800 15px/1 var(--f-body);margin:0 2px}
.bigtxt .bsym .wd{font:700 11px/1 var(--f-body);background:var(--line);border-radius:99px;padding:3px 6px}
.bigtxt .bsym .gap{width:6px}
.bigtxt .bchip{display:inline-flex;align-items:center;justify-content:center;gap:2px;min-width:38px;height:38px;padding:4px;border-radius:11px;background:#251737;color:#FBF8F1}
.bigtxt .bchip .tk,.bigtxt .bchip .ic{width:26px;height:26px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--wild);margin-right:6px;vertical-align:0}.sw.u{background:var(--saum)}
.big{position:fixed;inset:0;z-index:12;background:rgba(20,30,27,.62);display:flex;flex-direction:column;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 16px;overflow-y:auto;animation:bub .18s ease-out}
.bigcard{width:min(62vw,270px);flex:none}
.bigcard .card{width:100%;box-shadow:0 20px 50px -12px rgba(0,0,0,.55);cursor:default}
.bigcard .card .ttl{font-size:28px}
.bigcard .card .chip{min-height:44px;padding:5px;border-radius:12px}.bigcard .card .chip .tk,.bigcard .card .chip .ic{width:32px;height:32px}
.card .ttl{position:absolute;left:0;right:0;bottom:calc(33.333% + 2px);padding:0 10px 4px;font:700 19px/1.02 var(--f-display);color:#FBF8F1;text-shadow:0 1px 8px rgba(28,48,43,.45)}
.card .rl{display:flex;align-items:center;flex-wrap:nowrap;white-space:nowrap;min-width:0;overflow:hidden}
.card .tk{width:calc(14cqw * var(--k));height:calc(14cqw * var(--k));flex:none;display:block}
.card .stk{display:flex}.card .stk .tk+.tk{margin-left:calc(-5.5cqw * var(--k))}
.card .arr{color:var(--ink);font-size:calc(8cqw * var(--k));margin:0 calc(.6cqw * var(--k));opacity:.8}
.card .pl,.card .n,.card .x2{font:800 calc(8.5cqw * var(--k))/1 var(--f-body);color:var(--ink);margin:0 calc(.6cqw * var(--k))}
.card .wd{font:700 calc(6.4cqw * var(--k))/1 var(--f-body);color:var(--ink);background:var(--line);border-radius:99px;padding:calc(2.2cqw * var(--k)) calc(3.4cqw * var(--k));margin-right:calc(1cqw * var(--k))}
.card .gap{width:calc(4cqw * var(--k));flex:none}
.tk{width:22px;height:22px;flex:none}
.card .meta{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);margin-bottom:1px}
.card .meta .card .meta .w{display:flex;gap:2px}.card .meta .w i{width:6px;height:6px;border-radius:1.5px;background:var(--stadt)}
.card.W .meta .w i{background:var(--wild)}
/* Info-Blase beim langen Drücken */

  G1('kraeuterhang','Kräuterhang','W',[{t:'src',g:'bluete',n:2},{t:'combo',a:'brot',b:'honig',vp:4,max:1}]),
];
const DRAFT=2,ENDM=6,MSTVP=4; // je 2 Startplättchen; Ende bei 6 Meisterstücken oder vollem Plan; Meisterstück = 4 Ruhm (v0.8)
const CARDS=Object.fromEntries([...START,...MARKET_TYPES,...GRUND].map(c=>[c.id,c]));
const RAW=['korn','holz','bluete'];
const GOALS=[{k:'brot',n:5,tx:'5 Brot erzeugt'},{k:'honig',n:6,tx:'6 Honig erzeugt'},{k:'moebel',n:4,tx:'4 Möbel erzeugt'},{k:'meister',n:2,tx:'2 Meisterstücke'},{k:'rows',n:2,tx:'2 Reihen gesäumt'},{k:'chain',n:5,tx:'Kette mit 5 Gliedern'}];
const G={korn:'Korn',mehl:'Mehl',brot:'Brot',holz:'Holz',brett:'Bretter',moebel:'Möbel',bluete:'Blüten',honig:'Honig'};
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const shuffle=(a,r)=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clone=o=>JSON.parse(JSON.stringify(o));
function newPlayer(name,bot,r){const deck=shuffle([...START,...START].map(c=>c.id),r);const p={name,bot,vp:0,coins:4,deck,hand:[],disc:[],rows:[...Array(ROWS)].map(()=>({S:[],W:[]})),made:{},maxChain:0,chains:[],tired:{}};draw(p,5,r);return p}
function draw(p,n,r){for(let i=0;i<n;i++){if(!p.deck.length){if(!p.disc.length)return;p.deck=shuffle(p.disc,r);p.disc=[]}p.hand.push(p.deck.pop())}}
const used=row=>row.S.reduce((s,t)=>s+CARDS[t.id].w,0)+row.W.reduce((s,t)=>s+CARDS[t.id].w,0);
const sideW=(row,sd)=>row[sd].reduce((s,t)=>s+CARDS[t.id].w,0);
const closed=row=>used(row)>=COLS&&sideW(row,'S')>=MINSIDE&&sideW(row,'W')>=MINSIDE;
const closedCount=p=>p.rows.filter(closed).length;
const tilesOf=p=>p.rows.flatMap(rw=>[...rw.S,...rw.W]);
// eine Reihe darf nie so voll werden, dass sie nicht mehr gesäumt werden kann
const canPlace=(row,c)=>{const free=COLS-used(row)-c.w;if(free<0)return false;const own=sideW(row,c.side)+c.w,other=sideW(row,c.side==='S'?'W':'S');return free>=Math.max(0,MINSIDE-own)+Math.max(0,MINSIDE-other)};
function runChain(p,ri,dir,start,dry=false,trace=null){
  const row=p.rows[ri],cl=closed(row);
  const ord=(rw,d)=>{const c2=closed(rw);return d==='LR'?(c2?[...rw.S,...[...rw.W].reverse()]:rw.S):(c2?[...rw.W,...[...rw.S].reverse()]:rw.W)};
  let order=ord(row,dir).map(t=>[t,ri]);
  if(cl){let d=dir;for(let n=ri+1;n<ROWS&&closed(p.rows[n]);n++){d=d==='LR'?'RL':'LR';order=order.concat(ord(p.rows[n],d).map(t=>[t,n]))}}
  const b={...start};let vp=0,coins=0,links=0;
  for(const [t] of order){
    const rules=[...CARDS[t.id].tile,...t.edges.map(e=>CARDS[e].edge).flat()];
    const made={};let acted=false,step=[];
    for(const ru of rules){
      if(ru.t==='src'){b[ru.g]=(b[ru.g]||0)+ru.n;acted=true;step.push('+'+ru.n+' '+G[ru.g])}
      else if(ru.t==='conv'){const k=Math.min(b[ru.from]||0,ru.max);if(k){b[ru.from]-=k;b[ru.to]=(b[ru.to]||0)+k;made[ru.to]=(made[ru.to]||0)+k;acted=true;step.push(k+' '+G[ru.from]+'→'+G[ru.to])}}
      else if(ru.t==='score'){const k=Math.min(b[ru.g]||0,ru.max);if(k){b[ru.g]-=k;vp+=k*ru.vp;acted=true;step.push(k+' '+G[ru.g]+'→'+(k*ru.vp)+' Ruhm')}}
      else if(ru.t==='sell'){let k=ru.max;const gs=ru.gs==='any'?Object.keys(b):ru.gs;for(const g of gs){const x=Math.min(b[g]||0,k);if(x){b[g]-=x;k-=x;coins+=x*ru.coin;vp+=x*(ru.vp||0);acted=true;step.push(x+' '+G[g]+'→'+(x*ru.coin)+' Mz.')}}}
      else if(ru.t==='combo'){const k=Math.min(b[ru.a]||0,b[ru.b]||0,ru.max);if(k){b[ru.a]-=k;b[ru.b]-=k;vp+=k*ru.vp;acted=true;step.push(k+'×('+G[ru.a]+'+'+G[ru.b]+')→'+(k*ru.vp)+' Ruhm')}}
      else if(ru.t==='dup'){let k=ru.max;for(const g of RAW){if(k&&b[g]){b[g]++;k--;acted=true;step.push('+1 '+G[g])}}}
      else if(ru.t==='vpPer'){if(made[ru.g]){vp+=made[ru.g]*ru.vp;step.push('+'+(made[ru.g]*ru.vp)+' Ruhm')}}
    }
    if(!dry)for(const g in made)p.made[g]=(p.made[g]||0)+made[g];
    if(acted){links++;if(trace)trace.push(CARDS[t.id].n+': '+step.join(', '))}
  }
  coins+=Math.floor(Object.values(b).reduce((x,y)=>x+y,0)/2);
  let conv=0;if(!cl){conv=vp;coins+=vp;vp=0}
  if(dry)return{vp,coins,links,conv};
  p.vp+=vp;p.coins+=coins;p.maxChain=Math.max(p.maxChain,links);p.chains.push(links);
  return{vp,coins,links,conv};
}
// Rückenwind (v0.8, nur zu zweit): wer am wenigsten Ruhm hat (und nicht mit der Führenden gleichauf liegt), kauft und baut aus der Auslage 1 billiger
const isLast=(S,pi)=>{if(S.players.length!==2)return false;const sc=S.players.map(q=>finalScore(q)),me=sc[pi];return me===Math.min(...sc)&&me<Math.max(...sc)};
const price=(S,i,pi=S.cur)=>Math.max(0,CARDS[S.market[i]].cost-(i<2?1:0)-(isLast(S,pi)?1:0));
const surcharge=i=>1+Math.floor(i/2); // Aufpreis fürs Bauen direkt aus der Auslage: +1/+1/+2/+2/+3/+3
const mprice=(S,i,pi=S.cur)=>price(S,i,pi)+surcharge(i);
const UPMAX=2; // Upgrades im Abschluss
function landMoves(S,pi){
  const p=S.players[pi],out=[];
  p.hand.forEach((id,hi)=>{const c=CARDS[id];
    if(c.fam!=='start')for(let r=0;r<ROWS;r++)if(canPlace(p.rows[r],c))out.push({k:'build',hi,r});
    if(p.coins>=TUCKCOST)p.rows.forEach((rw,r)=>['S','W'].forEach(sd=>rw[sd].forEach((t,ti)=>{if(t.edges.length<3)out.push({k:'tuck',hi,r,sd,ti})})));
    out.push({k:'brache',hi});
  });
  S.market.forEach((id,mi)=>{const c=CARDS[id];if(p.coins>=mprice(S,mi))for(let r=0;r<ROWS;r++)if(canPlace(p.rows[r],c))out.push({k:'mbuild',mi,r})});
  return out;
}
const rowTired=(S,p,r)=>RUHE&&S.round-(p.tired[r]??-99)<=RUHE;
function tatMoves(S,pi){
  const p=S.players[pi],out=[{k:'ruhe'}];
  p.hand.forEach((id,hi)=>{const c=CARDS[id];
    if(c.eff.act){for(let r=0;r<ROWS;r++){if(rowTired(S,p,r))continue;out.push({k:'eff',hi,r,d:S.season})}}
    else out.push({k:'eff',hi})});
  return out;
}
function applyMove(S,pi,m,r){
  const p=S.players[pi];let disc=0;
  if(m.k==='ruhe'){if(m.take!=null){p.hand.push(S.market[m.take]);S.market.splice(m.take,1);refill(S);return 0}p.coins+=2;return 0}
  if(m.k==='brache'){const id=p.hand.splice(m.hi,1)[0];p.disc.push(id);p.coins+=1;return 0}
  if(m.k==='mbuild'){const id=S.market[m.mi],c=CARDS[id];p.coins-=mprice(S,m.mi);S.market.splice(m.mi,1);refill(S);p.rows[m.r][c.side].push({id,edges:[]});return 0}
  const id=p.hand.splice(m.hi,1)[0],c=CARDS[id];
  if(m.k==='eff'){
    if(c.eff.coins)p.coins+=c.eff.coins;
    if(c.eff.act){m.res=runChain(p,m.r,m.d,c.eff.add||{},false,m.trace=[]);p.tired[m.r]=S.round}
    if(c.eff.buyDisc)disc=c.eff.buyDisc;
    p.disc.push(id);
    if(c.eff.draw)draw(p,c.eff.draw,r);
  }else if(m.k==='build'){p.rows[m.r][c.side].push({id,edges:[]})} // aus der Hand gratis: beim Kauf schon bezahlt
  else if(m.k==='tuck'){p.coins-=TUCKCOST;p.rows[m.r][m.sd][m.ti].edges.push(id)}
  return disc;
}
function finalScore(p,detail){
  let s=p.vp,bal=0,mst=0,end=0;const cl=closedCount(p);
  for(const rw of p.rows)if(closed(rw))bal+=2*Math.min(sideW(rw,'S'),sideW(rw,'W'));
  for(const t of tilesOf(p)){if(t.edges.length>=3)mst+=MSTVP;for(const ru of [...CARDS[t.id].tile,...t.edges.map(e=>CARDS[e].edge).flat()])if(ru.t==='endRows')end+=ru.vp*cl}
  const coin=Math.floor(p.coins/4);
  if(detail)return{ruhm:p.vp,bal,mst,end,coin,total:s+bal+mst+end+coin};
  return s+bal+mst+end+coin;
}
const meisterCount=p=>tilesOf(p).filter(t=>t.edges.length>=3).length;
const filledCount=p=>p.rows.reduce((a,rw)=>a+used(rw),0);
const planFull=p=>filledCount(p)>=ROWS*COLS;
function goalProgress(p,g){if(g.k==='meister')return tilesOf(p).filter(t=>t.edges.length>=3).length;if(g.k==='rows')return closedCount(p);if(g.k==='chain')return p.maxChain;return p.made[g.k]||0}
function checkGoals(S){S.goals.forEach(g=>S.players.forEach((p,pi)=>{if(g.by.includes(pi)||g.by.length>=2)return;if(goalProgress(p,g)>=g.n){const v=g.by.length?3:6;p.vp+=v;g.by.push(pi);say(`${p.name} erreicht „${g.tx}“: +${v} Ruhm`,!p.bot)}}))}
function refill(S){while(S.market.length<6&&S.supply.length){const id=S.supply.pop();if(id==='WINTER'){if(S.winterAt==null){S.winterAt=S.round;say('Der Winter ist aufgedeckt! Diese Runde wird zu Ende gespielt, dann folgt eine letzte Runde.',true)}continue}S.market.push(id)}}
// ---- Bot (wie in der Simulation: Bewertung 1 Zug voraus, Strategie „ausgewogen“) ----
const W8={e:1.0,c:2.0,f:0.5,t:0.8};
const TYPICAL={korn:1,holz:1,bluete:1};
function engineValue(S,p){const per=[];for(let r=0;r<ROWS;r++){let best=0;for(const d of['LR','RL']){const res=runChain(p,r,d,TYPICAL,true);best+=(res.vp+res.coins*0.45+res.links*0.15)/2}per.push(best)}per.sort((a,b)=>b-a);return per[0]+0.5*per[1]}
function evalState(S,pi){
  const p=S.players[pi],w=W8;
  const lead=Math.max(...S.players.map(o=>o.rows.reduce((a,rw)=>a+used(rw),0)));
  const rem=S.winterAt!=null?0.6:Math.max(1,(ROWS*COLS-lead)/3)*0.45;
  const filled=p.rows.reduce((a,rw)=>a+used(rw),0);
  const tucks=tilesOf(p).reduce((a,t)=>a+t.edges.length+(t.edges.length>=3?1:0),0);
  let v=finalScore(p)+Math.min(p.coins,8)*0.3+Math.max(0,p.coins-8)*0.08+p.hand.length*0.3;
  for(const rw of p.rows)if(!closed(rw)){const sc=sideW(rw,'S'),wc=sideW(rw,'W');v+=1.4*Math.min(sc,wc)+0.25*(sc+wc)}
  v+=w.e*rem*engineValue(S,p)+w.c*closedCount(p)+w.f*filled+w.t*tucks;
  S.goals.forEach(g=>{if(g.by.length<2&&!g.by.includes(pi))v+=Math.min(1,goalProgress(p,g)/g.n)*2});
  return v;
}
function botTurn(S,pi,r){
  const p=S.players[pi],msgs=[];
  const land=landMoves(S,pi);
  const lite=x=>{const T=clone(S);T.log=[];return T};
  const cand=land.map(m=>{const T=lite(S);applyMove(T,pi,m,rng(3));return[m,evalState(T,pi)]}).sort((a,b)=>b[1]-a[1]).slice(0,6).map(x=>x[0]);
  let best=-1e9,bl=null,bt=null;
  for(const lm of cand){const T=lite(S);applyMove(T,pi,lm,rng(3));for(const tm of tatMoves(T,pi)){const U=clone(T);applyMove(U,pi,tm,rng(4));const v=evalState(U,pi)+r()*0.3;if(v>best){best=v;bl=lm;bt=tm}}}
  if(bl){msgs.push(describe(S,pi,bl));applyMove(S,pi,bl,r)}
  let tm=bt||{k:'ruhe'};if(tm.k==='ruhe'&&S.market.length){let bi=null,bv=1.7;S.market.forEach((id,i)=>{const c=CARDS[id];const tv=c.tile.reduce((a,ru)=>a+({src:ru.n*0.6,conv:1.2,score:ru.vp*0.8,sell:0.8,combo:2.5,dup:1,vpPer:ru.vp,endRows:ru.vp*1.2}[ru.t]||0),0)+0.5+c.cost*0.3;if(tv>bv){bv=tv;bi=i}});if(bi!=null)tm={k:'ruhe',take:bi}}
  const tdesc=describe(S,pi,tm);let disc=applyMove(S,pi,tm,r)||0;msgs.push(tdesc+(tm.res?` → ${tm.res.links} Glieder, +${tm.res.vp} Ruhm, +${tm.res.coins} Mz.`:''));
  for(let k=0;k<UPMAX&&p.hand.length;k++){const tucks=landMoves(S,pi).filter(m=>m.k==='tuck');let bv=evalState(S,pi)+0.5,bm=null;for(const m of tucks){const T=lite(S);applyMove(T,pi,m,rng(5+k));const v=evalState(T,pi);if(v>bv){bv=v;bm=m}}if(!bm)break;msgs.push(describe(S,pi,bm));applyMove(S,pi,bm,r)}
  // Kauf
  let bi=null,bvv=0.8;S.market.forEach((id,i)=>{const pr=Math.max(0,price(S,i)-disc);if(pr>p.coins)return;const c=CARDS[id];const tv=c.tile.reduce((a,ru)=>a+({src:ru.n*0.6,conv:1.2,score:ru.vp*0.8,sell:0.8,combo:2.5,dup:1,vpPer:ru.vp,endRows:ru.vp*1.2}[ru.t]||0),0);const v=tv+0.5-pr*0.45+r()*0.2;if(v>bvv){bvv=v;bi=i}});
  if(bi!==null){const id=S.market[bi];p.coins-=Math.max(0,price(S,bi)-disc);p.hand.push(id);S.market.splice(bi,1);refill(S);msgs.push('kauft '+CARDS[id].n)}
  draw(p,Math.max(0,5-p.hand.length),r);
  msgs.forEach(m=>say(p.name+' '+m));
}
function describe(S,pi,m){const p=S.players[pi];
  if(m.k==='ruhe')return m.take!=null?'ruht und nimmt '+CARDS[S.market[m.take]].n+' aus der Auslage':'ruht (+2 Mz.)';
  if(m.k==='brache')return 'legt '+CARDS[p.hand[m.hi]].n+' brach';
  if(m.k==='mbuild')return 'baut '+CARDS[S.market[m.mi]].n+' aus der Auslage in Reihe '+(m.r+1);
  const c=CARDS[p.hand[m.hi]];
  if(m.k==='build')return 'baut '+c.n+' in Reihe '+(m.r+1);
  if(m.k==='tuck')return 'schiebt '+c.n+' unter '+CARDS[p.rows[m.r][m.sd][m.ti].id].n;
  if(m.k==='eff')return 'spielt '+c.n+(c.eff.act?' auf Reihe '+(m.r+1):'');
  return ''}

// ======================= Spielablauf & Oberfläche =======================
let S=null, U={phase:null,sel:null,disc:0,toast:null,view:0}, R=null;
const LOGMAX=60;
function say(t,me){if(!S)return;S.log.unshift({t,me:!!me});S.log.length=Math.min(S.log.length,LOGMAX)}
function newGame(nBots){
  const seed=(Date.now()^Math.floor(Math.random()*1e9))>>>0;R=rng(seed);
  const names=['Mara','Gustav'];
  S={seed,season:'LR',round:0,winterAt:null,over:false,cur:0,log:[],
    players:[newPlayer('Du',false,R),...names.slice(0,nBots).map(n=>newPlayer(n,true,R))],
    supply:shuffle(MARKET_TYPES.flatMap(c=>Array(COPIES).fill(c.id)),R),market:[],
    goals:shuffle([...GOALS],R).slice(0,3).map(g=>({...g,by:[]}))};
  refill(S);
  // offener Schlangen-Draft: wer zuletzt am Zug ist, wählt zuerst
  const n=S.players.length,order=[];for(let k=0;k<DRAFT;k++){const o=[...Array(n).keys()].reverse();order.push(...(k%2?o.reverse():o))}
  S.draft={disp:shuffle(GRUND.map(c=>c.id),R).slice(0,DRAFT*n+1),order,step:0};S.endAt=null;
  U={phase:'draft',sel:null,disc:0,view:0};say('Neue Partie. Zuerst wählt jede Person 2 Startplättchen – sie kommen sofort auf den Plan.',true);save();runDraft();
}
function endRound(){
  if(S.endAt!=null){S.over=true;return}
  S.round++;S.season=S.season==='LR'?'RL':'LR';
  if(S.market.length)S.supply.unshift(S.market.shift());refill(S);
  say(`Runde ${S.round+1} · ${S.season==='LR'?'Frühling: Stadt → Wildnis':'Herbst: Wildnis → Stadt'}`,true);
}
function nextTurn(){
  checkGoals(S);
  {const q=S.players[S.cur];if(S.endAt==null&&(meisterCount(q)>=ENDM||planFull(q))){S.endAt=S.cur;say(`${q.bot?q.name+' hat':'Du hast'} ${meisterCount(q)>=ENDM?ENDM+' Meisterstücke':'den Plan voll'} – diese Runde wird zu Ende gespielt, dann ist Schluss.`,true)}}
  S.cur=(S.cur+1)%S.players.length;
  if(S.cur===0){endRound();if(S.over){recordPlay();save();render();return}}
  if(S.players[S.cur].bot){render();setTimeout(()=>{botTurn(S,S.cur,R);nextTurn()},botDelay())}
  else{U={phase:'land',sel:null,disc:0,view:0};save();render()}
}
function me(){return S.players[0]}
function draftWho(){return S.draft?S.draft.order[S.draft.step]:null}
function draftPlace(qi,di,r){const q=S.players[qi],id=S.draft.disp.splice(di,1)[0];q.rows[r][CARDS[id].side].push({id,edges:[]});say(`${q.bot?q.name+' wählt':'Du wählst'} ${CARDS[id].n} (Reihe ${r+1})`,!q.bot);S.draft.step++}
function draftBot(qi){let best=null,bv=-1e9;S.draft.disp.forEach((id,di)=>{for(let r=0;r<ROWS;r++){if(!canPlace(S.players[qi].rows[r],CARDS[id]))continue;const T=clone(S);T.players[qi].rows[r][CARDS[id].side].push({id,edges:[]});const v=evalState(T,qi)+Math.random()*0.3;if(v>bv){bv=v;best=[di,r]}}});draftPlace(qi,best[0],best[1])}
function runDraft(){
  if(!S.draft)return;
  if(S.draft.step>=S.draft.order.length){S.draft=null;S.cur=0;U={phase:'land',sel:null,disc:0,view:0};say('Draft beendet. Frühling: Ketten fließen von der Stadt (links) in die Wildnis.',true);save();render();return}
  const qi=draftWho();if(qi===0){save();render();return}
  render();setTimeout(()=>{draftBot(qi);runDraft()},botDelay());
}
function toast(t){U.toast=t;render();setTimeout(()=>{U.toast=null;render()},1800)}
function save(){if(S&&S.tut)return;try{localStorage.setItem('saum:save',JSON.stringify({screen:S&&!S.over?'game':'start',S,U:{phase:U.phase,disc:U.disc}}))}catch(e){}}
// Partie an Spielregal melden (Eingangskorb, wie bei den anderen Browserspielen)
const INBOX_KEY='spielregal:inbox:plays';
function localDate(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function myName(){if(SETUP.name.trim())return SETUP.name.trim();try{const p=(JSON.parse(localStorage.getItem('spielregal:players')||'[]')||[]).filter(x=>x&&x.name);return p.length?p[0].name:'Du'}catch(e){return 'Du'}}
function recordPlay(){if(!S||!S.over||S.recorded||S.tut)return;const sc=S.players.map(q=>finalScore(q)),best=Math.max(...sc),nm=myName();
  const entry={id:'saum-'+S.seed,source:'saum',app:'Saum',bggId:'',gameName:'Saum',date:localDate(),human:nm,
    results:S.players.map((q,i)=>({name:q.bot?q.name:nm,bot:!!q.bot,total:sc[i]})),winners:S.players.filter((q,i)=>sc[i]===best).map(q=>q.bot?q.name:nm)};
  try{const inbox=JSON.parse(localStorage.getItem(INBOX_KEY)||'[]');if(!inbox.some(e=>e.id===entry.id))inbox.push(entry);localStorage.setItem(INBOX_KEY,JSON.stringify(inbox));S.recorded=true}catch(e){}}

function bigHtml(id,edges){const c=CARDS[id],cap=t=>t.replace(/^./,m=>m.toUpperCase());

const ruleLong=r=>({src:()=>`bringt ${r.n} ${G[r.g]} in die Kette.`,conv:()=>`tauscht bis zu ${r.max} ${G[r.from]} aus der Kette in ${G[r.to]}.`,
  score:()=>`verbraucht bis zu ${r.max} ${G[r.g]} aus der Kette für je ${r.vp} Ruhm.`,
  sell:()=>`verkauft bis zu ${r.max} ${r.gs==='any'?'beliebige Waren':r.gs.map(g=>G[g]).join('/')} aus der Kette für je ${r.coin} Münze${r.coin>1?'n':''}${r.vp?` und ${r.vp} Ruhm`:''}.`,
  combo:()=>`jedes Paar ${G[r.a]} + ${G[r.b]} aus der Kette bringt ${r.vp} Ruhm (bis ${r.max} Paar${r.max>1?'e':''}).`,
  dup:()=>`verdoppelt bis zu ${r.max} ${RAWN}: je Sorte, die die Kette trägt, kommt 1 dazu.`,
  vpPer:()=>`+${r.vp} Ruhm für jedes ${G[r.g]}, das dieses Plättchen in der Kette erzeugt.`,
  endRows:()=>`bei Spielende +${r.vp} Ruhm für jede gesäumte Reihe.`}[r.t]());

function cardInfo(c){const L=[`${c.n} · ${c.side==='S'?'Stadt':'Wildnis'} · ${c.w} Feld${c.w>1?'er':''}`,
  `◆ Plättchen – wirkt jedes Mal, wenn eine Kette hindurchläuft: ${c.tile.map(ruleLong).join(' Außerdem ')}`];
  if(c.fam!=='grund'){L.push(`▸ Aktion – einmal ausspielen: ${effLong(c.eff)}`);L.push(`↧ Upgrade – unter ein Plättchen geschoben, wirkt es dort mit: ${c.edge.map(ruleLong).join(' Außerdem ')}`)}

function fitK(html,avail,cap=1){const stk=[...html.matchAll(/<span class="stk[^"]*">(.*?)<\/span>/g)].reduce((n,m)=>n+Math.max(0,(m[1].match(/<svg/g)||[]).length-1),0);
  const words=[...html.matchAll(/<span class="wd">([^<]*)<\/span>/g)].reduce((n,m)=>n+0.45+m[1].length*0.33,0);
  const u=(html.match(/<svg/g)||[]).length-stk*0.4+words+(html.match(/class="arr"/g)||[]).length*0.6+(html.match(/class="pl"/g)||[]).length*0.45+(html.match(/class="x2"/g)||[]).length*0.8+(html.match(/class="gap"/g)||[]).length*0.3;

function rulesHtml(){return `<h2>Spielregeln</h2>
 <p><b>Ziel:</b> Am Ende hat die Person mit dem meisten <b>Ruhm</b> gewonnen. Ruhm gibt es vor allem aus <b>Ketten</b> in gesäumten Reihen.</p>
 <h3>Dein Plan</h3>
 <p>4 Reihen mit je 6 Feldern. <b>Stadtkarten</b> wachsen vom linken Rand (Stadttor), <b>Wildniskarten</b> vom rechten Rand (Waldrand). Eine Reihe ist <b>gesäumt</b>, wenn alle 6 Felder belegt sind und beide Seiten mindestens 2 Felder haben.</p>
 <h3>Die Karten lesen</h3>
 <ul><li>${BOLT} <b>Aktion</b> (⚡ und Chips oben links): einmal ausspielen, dann auf den Ablagestapel.</li>
 <li><i class="sw"></i><b>Plättchen</b> (grüner Streifen): Liegt die Karte in deinem Plan, wirkt sie bei jeder Kette, die durch sie läuft.</li>
 <li><i class="sw u"></i><b>Upgrade</b> (goldener Streifen): Unter ein Plättchen geschoben, wirkt diese Zeile dort zusätzlich. 3 Upgrades unter einem Plättchen = <b>Meisterstück</b>.</li>
 <li>Lange auf eine Karte drücken zeigt sie groß mit Text zu jedem Symbol.</li></ul>
 <h3>Vor dem ersten Zug</h3>
 <p>Reihum wählt jede Person 2 <b>Startplättchen</b> aus einer offenen Auslage und legt sie sofort auf ihren Plan. Wer zuletzt am Zug ist, wählt zuerst, die zweite Wahl läuft in Gegenrichtung.</p>
 <h3>Ein Zug in drei Schritten</h3><p>Jede Handkarte kann dreierlei: <b>bauen</b> (Plättchen), als <b>Upgrade</b> unterschieben oder ihre <b>Aktion</b> ausführen (dann kommt sie auf den Ablagestapel). Beim Bauen und Unterschieben tippst du das Ziel direkt im Plan an.</p>
 <ol><li><b>Plättchen:</b> eine Karte wird Teil deines Plans.
  <ul><li>Aus der <b>Hand bauen: gratis</b> (bezahlt hast du beim Kauf).</li><li>Direkt aus der <b>Auslage bauen:</b> Kaufpreis plus Aufpreis je Platz (+1/+1/+2/+2/+3/+3).</li><li>Als <b>Upgrade</b> unter ein eigenes Plättchen schieben: 1 Münze.</li><li>Oder <b>nicht bauen:</b> Karte ablegen, +1 Münze.</li></ul></li>
 <li><b>Aktion:</b> eine andere Handkarte ausspielen (die Reihenfolge von Plättchen und Aktion ist frei) – oder ausruhen: +2 Münzen <i>oder</i> eine Karte aus der Auslage gratis auf die Hand.</li>
 <li><b>Abschluss</b> (freiwillig): bis zu 2 Upgrades (je 1 Münze) und 1 Kauf aus der Auslage. Die beiden ältesten Plätze kosten 1 weniger. Gekaufte Karten kommen sofort auf die Hand.</li></ol>
 <p>Danach ziehst du auf 5 Karten nach. Am Rundenende fällt die älteste Karte der Auslage heraus.</p>
 <h3>Ketten</h3>
 <ul><li>Eine Aktion „Kette auslösen“ schickt Waren durch eine deiner Reihen. Jedes Plättchen wirkt einmal: Quellen geben Waren, Werkstätten wandeln um (Korn → Mehl → Brot, Holz → Bretter → Möbel, Blüten → Honig), Abnehmer machen daraus Ruhm oder Münzen.</li>
 <li><b>Jahreszeit:</b> Im Frühling laufen Ketten von der Stadt nach rechts, im Herbst von der Wildnis nach links. Sie wechselt jede Runde.</li>
 <li>In einer <b>offenen</b> Reihe läuft die Kette nur durch die Startseite, und erzeugter Ruhm zählt als Münzen. In einer <b>gesäumten</b> Reihe läuft sie durch alles und bringt echten Ruhm.</li>
 <li><b>Schlange:</b> Ist auch die Reihe darunter gesäumt, fließt der Rest dort in Gegenrichtung weiter.</li>
 <li>Am Ende der Kette werden übrige Waren verkauft: je 2 Waren 1 Münze.</li>
 <li><b>Ruhe:</b> Eine aktivierte Reihe darf in der nächsten Runde nicht erneut aktiviert werden.</li></ul>
 <h3>Jahresziele</h3><p>3 gemeinsame Ziele. Wer eines zuerst erreicht, bekommt 6 Ruhm, die zweite Person 3.</p>
 <h3>Rückenwind (nur zu zweit)</h3><p>Wer gerade am wenigsten Ruhm hat, kauft und baut aus der Auslage 1 Münze billiger.</p>
 <h3>Spielende und Wertung</h3>
 <p>Hat jemand am Ende des Zuges <b>6 Meisterstücke</b> oder einen <b>vollen Plan</b>, wird die Runde zu Ende gespielt. Dann zählen: Ruhm aus Ketten und Zielen, je gesäumter Reihe 2 × die kleinere Seite (Stadt oder Wildnis), je Meisterstück 4, Endwertungen (z. B. Rathaus) und je 4 Münzen 1 Ruhm.</p>`}

function resumeGame(){const sv=load();if(!sv)return;S=sv.S;R=rng(S.seed+S.round*7919+S.log.length);U={phase:sv.U.phase||'land',sel:null,disc:sv.U.disc||0,view:0};if(S.draft){U.phase='draft';runDraft();return}if(S.cur!==0){S.cur=S.players.length-1;nextTurn()}else render()}
document.addEventListener('saum:resume',resumeGame);
document.addEventListener('input',e=>{if(e.target.id==='nm'){SETUP.name=e.target.value;lsSet('saum:name',SETUP.name)}});
function render(){
  const app=document.getElementById('app');themeFor(!S);
  if(!S){app.innerHTML=startHtml()+(U.rules?rulesOverlay():'');return}
  if(U.page==null)U.page=1;if(pagesBusy()){U.rpend=true;return}U.rpend=false;if(TUT)tutCheck();autoPage();
  const p=me(),pick=pickFor(),view=U.view||0,vp=S.players[view];
  const winter=S.draft?'Startplättchen-Draft':S.endAt!=null?'Letzte Runde':`Ende: ${ENDM} ★ · voller Plan`;
  let intro=false;try{intro=!localStorage.getItem('saum:intro')}catch(_){intro=!U.introSeen}if(U.introSeen||S.tut)intro=false;
  app.innerHTML=`${U.toast?`<div class="toast">${esc(U.toast)}</div>`:''}
  <div class="thead ${U.scr?'scr':''}"><div class="hrow"><h1>Saum</h1><button class="ann ${annMine()?'me':''}" data-a="go" data-info="${esc(annLong())}">${annShort()}</button><button class="ico" data-a="menu" aria-label="Menü">☰</button></div>
  <div class="opps">${S.players.map((q,i)=>`<button class="opp ${S.cur===i?'cur':''} ${view===i?'vis':''}" data-a="view" data-p="${i}" data-info="${esc(q.name)}
${finalScore(q)} Ruhm · ${q.coins} Münzen · ${closedCount(q)}/4 Reihen gesäumt · ${meisterCount(q)}/${ENDM} Meisterstücke · ${filledCount(q)}/24 Felder. Antippen zeigt den Plan."><b>${esc(q.name)}</b><span class="sc">${finalScore(q)}</span></button>`).join('')}</div>
  <div class="res"><span data-info="Ruhm (Punkte), Stand jetzt inklusive Endwertung">${ruhmT('')}${finalScore(p)}</span><span data-info="Münzen">${coinT('')}${p.coins}</span>${!S.over&&!S.draft&&isLast(S,0)?'<span class="rw" data-info="Rückenwind: Du hast gerade am wenigsten Ruhm. Kauf und Bauen aus der Auslage kosten dich 1 Münze weniger – die Preise in der Auslage sind schon verbilligt.">Rückenwind −1</span>':''}<span data-info="Handkarten">${cardT('')}${p.hand.length}</span><span data-info="Meisterstücke (Plättchen mit 3 Upgrades). Bei ${ENDM} endet das Spiel.">★ ${meisterCount(p)}/${ENDM}</span><span data-info="Belegte Felder. Bei 24 endet das Spiel.">▦ ${filledCount(p)}/24</span><span class="rd ${S.endAt!=null?'last':''}" data-info="${S.season==='LR'?'Frühling: Ketten laufen von der Stadt (links) zur Wildnis':'Herbst: Ketten laufen von der Wildnis (rechts) zur Stadt'}. ${winter}.">${S.endAt!=null?'Letzte Runde':`R${S.round+1} · ${S.season==='LR'?'Frühling →':'← Herbst'}`}</span></div></div>
  ${intro&&!S.over?introHtml():''}
  ${S.over?endHtml():''}
  <div class="pages"><div class="page"><div class="me-bar" id="plan"><span>${view===0?'Dein Plan':esc(vp.name)+'s Plan'}</span><span class="dir" data-info="Stadtplättchen wachsen vom linken Rand, Wildnisplättchen vom rechten. Jede Seite braucht mindestens 2 Felder – diese sind rot bzw. grün getönt. Die schraffierten Felder dazwischen gehören dem, der sie zuerst belegt. Wo beide Seiten sich treffen, liegt die gelbe Naht – der Saum."><i class="ds"></i>Stadt <i class="dw"></i>Wildnis</span>${view===0?'':`<span>Ruhm ${finalScore(vp)}</span><span>Münzen ${vp.coins}</span><span>Hand ${vp.hand.length}</span>`}</div>
  ${boardHtml(vp,view,view===0?pick:null)}</div><div class="page">
  ${S.draft?`<div class="sec" id="draft"><h3>Startplättchen</h3><div class="cards">${S.draft.disp.map((id,i)=>cardHtml(id,{a:'gpick',i,sel:U.sel&&U.sel.src==='g'&&U.sel.i===i,off:draftWho()!==0})).join('')}</div></div>`:''}
  <div class="sec" id="markt"><h3>Auslage</h3><div class="cards">${S.market.map((id,i)=>{const pr=Math.max(0,price(S,i,0)-(U.phase==='ende'?U.disc:0)),bp=mprice(S,i,0),take=U.phase==='tat'&&U.mode==='take';return cardHtml(id,{a:'market',i,price:pr,build:bp,sel:U.sel&&U.sel.src==='m'&&U.sel.i===i,off:!take&&(!(S.cur===0&&(U.phase==='land'||(U.phase==='ende'&&!U.bought)))||(U.phase==='land'?bp:pr)>p.coins)})}).join('')}</div></div>
  </div><div class="page">
  <div class="sec" id="ziele"><h3>Jahresziele</h3><div class="goals">${S.goals.map(goalHtml).join('')}</div></div>
  <div class="sec"><h3>Chronik</h3><div class="log">${S.log.map(l=>`<div class="${l.me?'me':''}">${esc(l.t)}</div>`).join('')}</div></div></div></div>
  ${U.help?`<div class="overlay" data-a="help-x"><div class="intro" data-stop="1"><button class="ico xbtn" data-a="help-x" aria-label="Schließen">✕</button>${introHtml().replace('<button class="btn" data-a="intro-ok">Verstanden</button>','<button class="btn" data-a="help-x">Schließen</button>').replace('<div class="intro">','').replace(/<\/div>$/,'')}</div></div>`:''}${U.menu?menuHtml():''}${U.rules?rulesOverlay():''}${TUT?tutHtml():''}
  ${fanHtml()}<div class="actions">${S.over?'':dotsHtml()}<div class="in">${actionsHtml()}</div></div>`;
  pageSync(true);layoutFan();fitSyms();if(TUT)tutDecorate();
}
function endHtml(){
  const rows=S.players.map(q=>({q,d:finalScore(q,true)})).sort((a,b)=>b.d.total-a.d.total);
  return `<div class="phase end"><h2 style="font-size:22px;margin-bottom:6px">${rows[0].q.bot?esc(rows[0].q.name)+' gewinnt':'Du gewinnst!'}</h2>
  <div style="overflow-x:auto"><table style="font-size:13px"><tr><th></th><th>Ketten & Ziele</th><th>Balance</th><th>Meister</th><th>Ende</th><th>Mz.</th><th>Ruhm</th></tr>${rows.map(({q,d})=>`<tr><td>${esc(q.name)}</td><td>${d.ruhm}</td><td>${d.bal}</td><td>${d.mst}</td><td>${d.end}</td><td>${d.coin}</td><td><b>${d.total}</b></td></tr>`).join('')}</table></div>
  <p style="margin:8px 0 0;font-size:13px;color:var(--muted)">Längste Kette: ${Math.max(...S.players.map(q=>q.maxChain))} Glieder (du ${me().maxChain}).</p>${S.recorded?'<p style="margin:10px 0 0;font-size:13px">✓ Als Partie für <b>Saum</b> vorgemerkt – sie erscheint in Spielregal, sobald du die App öffnest.</p>':''}<p style="margin:12px 0 0"><a class="btn alt" href="../" style="text-decoration:none;display:inline-block">Zum Spielregal</a></p></div>`}
// Tipp: was der Bot an deiner Stelle täte
function tipText(){
  const p=me(),lite=()=>{const T=clone(S);T.log=[];return T};
  if(U.phase==='land'){let best=-1e9,bl=null;for(const lm of landMoves(S,0)){const T=lite();applyMove(T,0,lm,rng(3));let v=-1e9;for(const tm of tatMoves(T,0)){const X=clone(T);applyMove(X,0,tm,rng(4));v=Math.max(v,evalState(X,0))}if(v>best){best=v;bl=lm}}return bl?'Tipp: '+describe(S,0,bl).replace(/^baut/,'Baue').replace(/^schiebt/,'Schiebe').replace(/^legt (.*) brach/,'Verzichte mit $1 (+1 Mz.)'):''}
  if(U.phase==='tat'){let best=-1e9,bt=null;for(const tm of tatMoves(S,0)){const T=lite();applyMove(T,0,tm,rng(4));const v=evalState(T,0);if(v>best){best=v;bt=tm}}return 'Tipp: '+describe(S,0,bt).replace(/^spielt/,'Spiele').replace(/^ruht/,'Ruhe dich aus')}
  if(U.phase==='ende'){let bi=null,bv=0.8;S.market.forEach((id,i)=>{const pr=Math.max(0,price(S,i)-U.disc);if(pr>p.coins)return;const c=CARDS[id];const tv=c.tile.reduce((a,ru)=>a+({src:ru.n*0.6,conv:1.2,score:ru.vp*0.8,sell:0.8,combo:2.5,dup:1,vpPer:ru.vp,endRows:ru.vp*1.2}[ru.t]||0),0);const v=tv+0.5-pr*0.45;if(v>bv){bv=v;bi=i}});return bi!=null&&!U.bought?'Tipp: Kaufe '+CARDS[S.market[bi]].n:'Tipp: Zug beenden'}
  return '';
}
// ---- Eingaben ----
function toastLong(t){U.toast=t;render();clearTimeout(U.tt);U.tt=setTimeout(()=>{U.toast=null;render()},4200)}
// Langes Drücken (≈0,45 s) auf ein Element mit data-info zeigt eine Info-Blase
let lpT=null,lpFired=false,lpXY=null;
function showBig(el){const ed=el.dataset.edges?el.dataset.edges.split(',').filter(Boolean):null;document.body.insertAdjacentHTML('beforeend',bigHtml(el.dataset.big,ed));fitSyms(document.querySelector('.big'))}
function hideBubble(){const b=document.querySelector('.bubble');if(b)b.remove()}
function showBubble(el){hideBubble();const b=document.createElement('div');b.className='bubble';{const [t,...r]=el.dataset.info.split('\n');if(r.length){const h=document.createElement('span');h.className='bt';h.textContent=t;b.appendChild(h);b.appendChild(document.createTextNode(r.join('\n')))}else b.textContent=t}document.body.appendChild(b);
  const r=el.getBoundingClientRect(),bw=b.offsetWidth,bh=b.offsetHeight,vw=innerWidth;
  let x=Math.min(Math.max(12,r.left+r.width/2-bw/2),vw-bw-12),y=r.top-bh-10;if(y<12)y=Math.min(r.bottom+10,innerHeight-bh-12);
  b.style.left=x+'px';b.style.top=Math.max(12,y)+'px'}
document.addEventListener('pointerdown',e=>{if(document.querySelector('.big')){document.querySelector('.big').remove();lpFired=true;return}hideBubble();const el=e.target.closest('[data-big],[data-info]');if(!el)return;lpFired=false;lpXY=[e.clientX,e.clientY];
  clearTimeout(lpT);lpT=setTimeout(()=>{lpFired=true;if(el.dataset.big)showBig(el);else showBubble(el);if(navigator.vibrate)try{navigator.vibrate(8)}catch(_){}},450)});
document.addEventListener('pointermove',e=>{if(lpXY&&Math.hypot(e.clientX-lpXY[0],e.clientY-lpXY[1])>10){clearTimeout(lpT);lpXY=null}});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>{clearTimeout(lpT);lpXY=null;if(lpFired&&!document.querySelector('.big'))setTimeout(hideBubble,2600)}));
addEventListener('scroll',()=>{clearTimeout(lpT);hideBubble()},{passive:true});
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-info],[data-big]'))e.preventDefault()});
document.addEventListener('click',e=>{if(lpFired){lpFired=false;e.stopImmediatePropagation();e.preventDefault()}},true);
function handleClick(e){
  const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;
  if(TUT&&S&&S.tut&&!tutAllowed(a,el.dataset)){toast('Folge dem markierten Hinweis im Lernspiel.');return}
  if(e.target.closest('[data-stop]')&&(a==='help-x'||a==='menu-x'||a==='rules-x')&&!e.target.closest('button'))return;
  if(a==='start'){TUT=null;newGame(+el.dataset.n);return}
  if(a==='bots'){SETUP.bots=+el.dataset.n;lsSet('saum:bots',SETUP.bots);render();return}
  if(a==='pickname'){SETUP.name=el.dataset.n;lsSet('saum:name',SETUP.name);render();return}
  if(a==='rules'||a==='help'){U.rules=true;U.menu=false;render();return}
  if(a==='rules-x'){U.rules=false;render();return}
  if(a==='tutorial'){tutSetup();return}
  if(a==='tutnext'){if(TUT){TUT.i=Math.min(TUT.i+1,TUT_STEPS.length-1);TUT.scrolled=null}render();return}
  if(a==='tutend'||a==='tutquit'){tutEnd();return}
  if(a==='resume'){resumeGame();return}
  if(a==='new'){S=null;try{localStorage.removeItem('saum:save')}catch(_){}render();return}
  if(!S)return;
  if(a==='intro-ok'){U.introSeen=true;try{localStorage.setItem('saum:intro','1')}catch(_){}render();return}
  if(a==='menu'){U.menu=true;render();return}
  if(a==='menu-x'){U.menu=false;render();return}
  if(a==='go'){goTo();return}
  if(a==='page'){pageGo(+el.dataset.p,true);return}
  if(a==='fast'){try{localStorage.setItem('spielregal:botFast',fastPref()?'0':'1')}catch(_){}render();return}
  if(a==='reload'){save();location.replace(location.pathname+'?v='+Date.now()+'&resume=1');return}
  if(a==='restart'){if(!confirm('Partie abbrechen und eine neue beginnen?'))return;S=null;U={phase:null,sel:null,disc:0,toast:null,view:0};try{localStorage.removeItem('saum:save')}catch(_){}scrollTo(0,0);render();return}
  if(a==='help-x'){U.help=false;render();return}
  if(a==='view'){U.view=+el.dataset.p;U.page=0;render();window.scrollTo({top:0});return}
  if(a==='tinfo'){const q=S.players[+el.dataset.p],t=q.rows[+el.dataset.r][el.dataset.sd][+el.dataset.ti],c=CARDS[t.id];toastLong(`${c.n}: ${[...c.tile,...t.edges.map(x=>CARDS[x].edge).flat()].map(rule).join('; ')}${t.edges.length?` · Upgrades: ${t.edges.map(x=>CARDS[x].n).join(', ')}`:''}`);return}
  if(S.cur!==0||S.over)return;
  if(S.draft){if(draftWho()!==0)return;if(a==='gpick'){U.sel={src:'g',i:+el.dataset.i};U.page=0;render();window.scrollTo({top:0});return}if(a==='unsel'){U.sel=null;U.page=1;render();return}if((a==='gplace'||a==='row')&&U.sel){const r=+el.dataset.r;if(!canPlace(me().rows[r],CARDS[S.draft.disp[U.sel.i]]))return;draftPlace(0,U.sel.i,r);U.sel=null;U.page=1;runDraft()}return}
  const p=me();
  if(a==='tip'){toastLong(tipText()||'Kein Tipp');return}
  if(a==='cancel'){U.mode=null;render();return}
  if(a==='unsel'){U.sel=null;U.mode=null;render();return}
  if(a==='hand'){if(U.phase==='ende'&&!upLeft())return;if(U.mode==='take')return;U.sel={src:'h',i:+el.dataset.i};U.mode=null;render();return}
  if(a==='market'){const i=+el.dataset.i;if(U.phase==='tat'&&U.mode==='take'){const m={k:'ruhe',take:i};say('Du '+describe(S,0,m),true);applyMove(S,0,m,R);U.mode=null;afterTat(0);return}if(U.phase==='land'||(U.phase==='ende'&&!U.bought)){U.sel={src:'m',i};{const mc=U.phase==='land'?CARDS[S.market[i]]:null;U.mode=mc&&mc.fam!=='start'&&p.coins>=mprice(S,i)&&[0,1,2,3].some(r=>canPlace(p.rows[r],mc))?'build':null}render()}return}
  const done=m=>{say('Du '+describe(S,0,m),true);applyMove(S,0,m,R);U.sel=null;U.mode=null};
  if(U.phase==='land'){
    if(a==='noland'&&!p.hand.length){toTat();return}
    const sel=U.sel;if(!sel)return;
    if(a==='buildmode'){U.mode='build';render();return}
    if(a==='actmode'&&sel.src==='h'&&!U.acted){U.mode='act';render();return}
    if((a==='act'||a==='play')&&sel.src==='h'&&!U.acted){runAct(a,el);return}
    if(a==='build'||a==='row'){const r=+el.dataset.r;const pk=pickFor();if(!pk||!pk.rows||!pk.rows(r))return;done(sel.src==='m'?{k:'mbuild',mi:sel.i,r}:{k:'build',hi:sel.i,r});toTat();return}
    if(a==='tuckmode'&&sel.src==='h'){U.mode='tuck';render();return}
    if(a==='tile'&&U.mode==='tuck'){done({k:'tuck',hi:sel.i,r:+el.dataset.r,sd:el.dataset.sd,ti:+el.dataset.ti});toTat();return}
    if(a==='brache'&&sel.src==='h'){done({k:'brache',hi:sel.i});toTat();return}
  }
  if(U.phase==='tat'){
    if(a==='takemode'){U.sel=null;U.mode='take';render();return}
    if(a==='ruhe'){applyMove(S,0,{k:'ruhe'},R);say('Du ruhst (+2 Mz.)',true);afterTat(0);return}
    if(!U.sel)return;
    if(a==='act'||a==='play'){runAct(a,el);return}
  }
  if(U.phase==='ende'){
    if(a==='tuckmode'&&U.sel&&U.sel.src==='h'&&upLeft()){U.mode='tuck';render();return}
    if(a==='tile'&&U.mode==='tuck'){done({k:'tuck',hi:U.sel.i,r:+el.dataset.r,sd:el.dataset.sd,ti:+el.dataset.ti});U.ups++;maybeFinish();return}
    if(a==='buy'&&U.sel&&U.sel.src==='m'&&!U.bought){const i=U.sel.i,pr=Math.max(0,price(S,i)-U.disc);if(pr>p.coins)return;const id=S.market[i];p.coins-=pr;p.hand.push(id);S.market.splice(i,1);refill(S);say('Du kaufst '+CARDS[id].n+' (auf die Hand)',true);U.bought=true;U.sel=null;maybeFinish();return}
    if(a==='endturn'){finishTurn();return}
  }
}
// Zug rückgängig: Schnappschuss vor jeder eigenen Entscheidung; verfällt, sobald Verdecktes aufgedeckt wird
// (neue Karte in der Auslage, Karten gezogen) oder der Zug endet.
function undoable(){return !!(S&&!S.tut&&!S.over&&!S.draft&&S.cur===0&&U.phase&&U.undo&&U.undo.length)}
function doUndo(){if(!undoable())return;const b=U.undo.pop();S=JSON.parse(b.s);Object.assign(U,b.u,{sel:null,mode:null,menu:false});save();render()}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(el&&el.dataset.a==='undo'){doUndo();return}
  const mine=S&&!S.over&&!S.draft&&S.cur===0&&U.phase;
  const before=mine?{s:JSON.stringify(S),u:{phase:U.phase,disc:U.disc,ups:U.ups,bought:U.bought,acted:U.acted},sup:S.supply.length,dk:S.players[0].deck.length}:null;
  handleClick(e);
  if(!before)return;
  if(!S||JSON.stringify(S)===before.s)return;
  const stack=before.u.phase&&U.undo?U.undo:[];
  if(S.cur!==0||!U.phase||S.over||S.supply.length!==before.sup||S.players[0].deck.length<before.dk){const had=U.undo&&U.undo.length;U.undo=[];if(had&&S.cur===0&&U.phase)render()}
  else{stack.push(before);U.undo=stack;render()}
});
// Aktion einer Handkarte ausführen – vor dem Plättchen (Schritt 1) oder danach (Schritt 2); Reihenfolge ist frei
function runAct(a,el){const m=a==='act'?{k:'eff',hi:U.sel.i,r:+el.dataset.r,d:S.season}:{k:'eff',hi:U.sel.i};const d=describe(S,0,m);const disc=applyMove(S,0,m,R);
  if(a==='act'){say(`Du ${d} → ${m.res.links} Glieder, +${m.res.vp} Ruhm, +${m.res.coins} Mz.${m.res.conv?' (offene Reihe: Ruhm als Münzen)':''}`,true);if(m.trace&&m.trace.length)say('Kette: '+m.trace.join(' · '),true)}else say('Du '+d,true);
  if(U.phase==='land'){U.acted=true;U.disc=disc||0;U.sel=null;U.mode=null;render()}else afterTat(disc);
  if(a==='act')toastLong(`Kette: ${m.res.links} Glieder · +${m.res.vp} Ruhm · +${m.res.coins} Mz.`)}
function toTat(){if(U.acted)afterTat(U.disc);else{U.phase='tat';render()}}
function afterTat(disc){U.disc=disc||0;U.sel=null;U.mode=null;U.ups=0;U.bought=false;U.phase='ende';render()}
function upLeft(){const p=me();return U.ups<UPMAX&&p.hand.length>0&&p.coins>=TUCKCOST&&tilesOf(p).some(t=>t.edges.length<3)}
function maybeFinish(){if(!upLeft()&&U.bought)finishTurn();else render()}
function finishTurn(){const p=me();U.undo=[];draw(p,Math.max(0,5-p.hand.length),R);U.phase=null;U.sel=null;U.mode=null;nextTurn()}
// Nach „Neueste Version laden“ die gespeicherte Partie direkt fortsetzen
if(new URLSearchParams(location.search).has('resume')){try{if(load())document.dispatchEvent(new CustomEvent('saum:resume'))}catch(_){}history.replaceState(null,'',location.pathname)}
render();
</script>
