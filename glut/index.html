<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7EBDD">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Glut">
<title>Glut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap">
<style>
:root{
  --ground:#F2C8B6;--paper:#F7EBDD;--ink:#3B1220;--cobalt:#2A2BC8;--peri:#6F7BE8;--sun:#F2502E;--pink:#F6A8BE;--lilac:#9C90D6;--lime:#B4E35E;--pine:#124D39;--amber:#FFA844;
  --h0:#D6CEEA;--h1:#F6A8BE;--h2:#F58FA0;--h3:#F7794F;--h4:#F2502E;--h5:#E0371F;--h6:#B81E1A;
  --r-pill:999px;--r-card:24px;--r-die:15px;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--paper)}
body{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-variation-settings:'wdth' 100,'opsz' 14;font-weight:500;color:var(--ink);background:var(--paper);overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.disp{font-variation-settings:'wdth' 75,'opsz' 96;font-weight:600;line-height:.9;letter-spacing:-.01em}
.num{font-variation-settings:'wdth' 75,'opsz' 96;font-weight:800}
.lab{font-variation-settings:'wdth' 90,'opsz' 14;font-weight:600;font-size:13px}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:560px;margin:0 auto;background:var(--paper)}
/* ---- Pillen, Knöpfe ---- */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:var(--r-pill);padding:6px 13px;font-variation-settings:'wdth' 90,'opsz' 14;font-weight:600;font-size:14px;white-space:nowrap}
.p-ink{background:var(--ink);color:var(--paper)}.p-pink{background:var(--pink)}.p-lilac{background:var(--lilac)}.p-lime{background:var(--lime)}.p-cream{background:var(--paper)}.p-out{border:2.5px solid var(--ink);padding:3.5px 11px}.p-sun{background:var(--sun);color:#fff}.p-cobalt{background:var(--cobalt);color:#fff}
.btn{border-radius:var(--r-pill);padding:12px 20px;font-variation-settings:'wdth' 90,'opsz' 14;font-weight:700;font-size:16px;background:var(--sun);color:#fff;text-align:center;text-decoration:none;display:inline-block;white-space:nowrap}
.btn.alt{background:var(--paper);color:var(--ink);border:2.5px solid var(--ink);padding:9.5px 18px}
.btn.wide{display:block;width:100%}.btn[disabled]{opacity:.4}
.link{text-decoration:underline;font-size:14px;color:var(--ink);opacity:.8;padding:8px}
/* ---- Kopf ---- */
.thead{background:var(--paper);padding:calc(env(safe-area-inset-top) + 6px) 12px 8px;border-bottom:3px solid var(--ink);z-index:20}
.hrow{display:flex;align-items:center;gap:8px}
.hrow h1{font-size:34px;font-variation-settings:'wdth' 75,'opsz' 96;font-weight:700;line-height:.9}
.ann{flex:1;min-width:0;text-align:left;border-radius:var(--r-pill);padding:7px 13px;background:var(--pink);font-variation-settings:'wdth' 90,'opsz' 14;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ann.me{background:var(--lime)}
.mbtn{width:38px;height:38px;border-radius:50%;border:2.5px solid var(--ink);font-size:18px;line-height:1}
.opps{display:flex;gap:6px;margin-top:7px;overflow-x:auto;scrollbar-width:none;align-items:center}
.opps .pill{margin-left:auto;padding:4px 11px;font-size:13px}
.opp{display:flex;align-items:center;gap:6px;border:2.5px solid var(--ink);border-radius:var(--r-pill);padding:2px 10px 2px 3px;font-size:14px;font-weight:600;white-space:nowrap;background:var(--paper)}
.opp.cur{background:var(--lime)}.opp.done{opacity:.55}
.av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;flex:none}
.res{display:flex;gap:4px;margin-top:6px;align-items:center;justify-content:space-between}
.rc{background:var(--paper);border:2.5px solid var(--ink);border-radius:var(--r-pill);padding:1px 8px 1px 3px;display:flex;align-items:center;gap:3px;font-size:16px;line-height:1.1}
.rc svg{width:22px;height:22px;display:block;flex:none}
.dicerow{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
.die{width:50px;height:50px;border-radius:var(--r-die);border:3px solid var(--ink);display:grid;place-items:center;font-size:36px;line-height:1;box-shadow:3px 3px 0 var(--ink);position:relative;color:var(--ink);transition:transform .15s}
.die.h4,.die.h5,.die.h6{color:#fff}
.die.h0{background:var(--h0);color:#8d84b5;border-style:dashed;box-shadow:none;font-size:15px}
.die.h1{background:var(--h1)}.die.h2{background:var(--h2)}.die.h3{background:var(--h3)}.die.h4{background:var(--h4)}.die.h5{background:var(--h5)}.die.h6{background:var(--h6)}
.die.sel{transform:translateY(-5px);outline:4px solid var(--lime);outline-offset:2px}
.die.boost::after{content:"+";position:absolute;top:-8px;right:-8px;background:var(--lime);border:2.5px solid var(--ink);border-radius:50%;width:20px;height:20px;font-size:13px;display:grid;place-items:center;font-weight:800}
.die.dim{opacity:.55}
.bchips{display:flex;gap:5px}
.bchips .pill{padding:4px 11px;border:2.5px solid var(--ink)}
.bchips .pill.on{background:var(--lime)}
/* ---- Seiten ---- */
.pages{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:var(--ground)}
.pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;overflow-y:auto;padding:12px 12px 20px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
.ptitle{font-size:34px}
.plc{background:var(--paper);border:3px solid var(--ink);border-radius:var(--r-card);padding:9px 12px;display:flex;flex-direction:column;gap:4px}
.plc .t{display:flex;align-items:center;justify-content:space-between;gap:8px}
.plc .n{font-size:27px}
.plc .e{font-size:12.5px;line-height:1.3}
.plc.pick{background:var(--lime);box-shadow:4px 4px 0 var(--ink)}
.plc.off{opacity:.55}
.occ{display:flex;gap:5px;align-items:center}
.slot{width:26px;height:26px;border-radius:50%;border:2.5px dashed var(--ink);opacity:.45}
.box{background:var(--paper);border:3px solid var(--ink);border-radius:var(--r-card);padding:12px 13px}
.box h3{font-size:24px;margin-bottom:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.pc{border:2.5px solid var(--ink);border-radius:12px 12px 16px 16px;padding:4px 10px;font-weight:700;font-size:14px;background:var(--peri);color:#fff}
.pc.F{background:var(--paper);color:var(--ink)}.pc.Z{background:var(--cobalt)}
.ord{background:var(--paper);border:3px solid var(--ink);border-radius:var(--r-card);padding:10px 12px;display:flex;gap:10px;align-items:center}
.ord.can{background:var(--lime)}
.ord .need{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.stamp{width:50px;height:50px;border-radius:50%;background:var(--sun);color:#fff;display:grid;place-items:center;font-size:28px;transform:rotate(-8deg);box-shadow:3px 3px 0 var(--ink);border:3px solid var(--ink);flex:none}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:var(--r-card);padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.card.can{background:var(--lime)}.card .n{font-size:24px}
.card .e{font-size:13px;line-height:1.3}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl td,.tbl th{padding:4px 6px;text-align:left;border-bottom:1.5px solid rgba(59,18,32,.2)}
.log{font-size:13px;line-height:1.35}.log div{padding:3px 0;border-bottom:1.5px solid rgba(59,18,32,.15)}
/* ---- Fuß ---- */
.foot{display:flex;align-items:center;gap:8px;padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);background:var(--paper);border-top:3px solid var(--ink)}
.pdots{display:flex;gap:7px;flex:1;justify-content:center}
.pdots button{width:11px;height:11px;border-radius:50%;background:rgba(59,18,32,.25)}
.pdots button.on{background:var(--ink)}
.foot .btn{padding:10px 16px;font-size:15px}.foot .btn.alt{padding:7.5px 14px}
/* ---- Überlagerungen ---- */
.overlay{position:fixed;inset:0;background:rgba(59,18,32,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);border:3px solid var(--ink);border-radius:var(--r-card) var(--r-card) 0 0;width:100%;max-width:560px;max-height:82dvh;overflow-y:auto;padding:0 14px 16px}
.sheet .sh{position:sticky;top:0;background:var(--paper);padding:14px 0 8px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:2}
.sheet h2{font-size:30px}
.xbtn{width:36px;height:36px;border-radius:50%;border:2.5px solid var(--ink);font-size:16px;flex:none}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:3px solid var(--ink);border-radius:18px;padding:11px 14px;background:var(--paper);font-weight:600;font-size:15px;line-height:1.3}
.opt:active{background:var(--lime)}
.opt small{display:block;font-weight:500;opacity:.75;font-size:12.5px;margin-top:2px}
.menu{display:flex;flex-direction:column;gap:9px}
.rules p{font-size:14px;line-height:1.4;margin-bottom:8px}.rules h3{font-size:22px;margin:10px 0 4px}
.rules ul{padding-left:18px;font-size:14px;line-height:1.4;margin-bottom:8px}
.bubble{position:fixed;z-index:90;max-width:260px;background:var(--ink);color:var(--paper);padding:9px 12px;border-radius:14px;font-size:13.5px;line-height:1.35;white-space:pre-line;pointer-events:none}
.bubble .bt{display:block;font-weight:800;margin-bottom:2px;color:var(--lime)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:16px;z-index:80;font-weight:600;font-size:14px;max-width:88vw;text-align:center;white-space:pre-line}
.flash{animation:fl .6s}@keyframes fl{0%{box-shadow:0 0 0 0 var(--lime)}40%{box-shadow:0 0 0 8px var(--lime)}100%{box-shadow:0 0 0 0 transparent}}
/* ---- Start ---- */
.start{position:relative;display:flex;flex-direction:column;height:100vh;height:100dvh;background:#F2C8B6;overflow:hidden;max-width:560px;margin:0 auto}
.start .stage{flex:1;min-height:0;overflow:hidden;position:relative;padding-top:calc(env(safe-area-inset-top) + 46px)}
.start .cov{display:block;width:100%;height:auto}
.leave{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:12px;z-index:3;background:var(--paper);border:2.5px solid var(--ink);border-radius:var(--r-pill);padding:5px 13px;font-weight:700;font-size:14px;color:var(--ink);text-decoration:none}
.panel{flex:none;background:var(--paper);border-top:3px solid var(--ink);border-radius:var(--r-card) var(--r-card) 0 0;padding:13px 14px calc(env(safe-area-inset-bottom) + 12px);display:flex;flex-direction:column;gap:9px;z-index:2}
.prow{display:flex;gap:9px}.prow .btn{flex:1;padding:13px 10px;font-size:17px}.prow .btn.alt{padding:10.5px 10px}
.prow2{display:flex;align-items:center;justify-content:space-between;gap:8px}
.prow2 .link{padding:4px 2px;font-size:14px}
.input{width:100%;border:3px solid var(--ink);border-radius:var(--r-pill);padding:10px 16px;font:inherit;font-weight:600;font-size:16px;background:#fff8f0;color:var(--ink)}
.chip{border:2.5px solid var(--ink);border-radius:var(--r-pill);padding:5px 14px;font-weight:700;font-size:14px;background:var(--paper)}.chip.on{background:var(--lime)}
.note{font-size:12.5px;opacity:.75;line-height:1.35}
/* ---- Lernspiel ---- */
.coach{position:fixed;left:10px;right:10px;z-index:70;max-width:540px;margin:0 auto;display:flex;gap:11px;align-items:flex-start;background:var(--ink);color:var(--paper);border-radius:22px;padding:11px 13px;box-shadow:0 0 0 3px var(--lime),0 10px 30px rgba(0,0,0,.38)}
.coach .cface{width:54px;height:54px;flex:none;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px var(--sun)}
.coach .cface svg{width:100%;height:100%;display:block}
.coach .ctext{flex:1;min-width:0}
.coach .cstep{font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--lime)}
.coach p{margin:3px 0 7px;font-size:14px;line-height:1.38}
.coach .cwhy{font-size:12.5px;padding:7px 10px;border-radius:13px;background:rgba(251,243,232,.13)}
.coach .cwhy b{color:var(--lime)}
.coach .cbtns{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.coach .btn{padding:8px 16px;font-size:15px}
.coach .cquit{font-size:12px;opacity:.75;text-decoration:underline;margin-left:auto;color:var(--paper)}
.coach .cwait{font-weight:800;letter-spacing:3px;color:var(--lime)}
.tut-hl{outline:4px solid var(--cobalt)!important;outline-offset:3px;animation:tutp 1.2s ease-in-out infinite;position:relative;z-index:3}
@keyframes tutp{50%{outline-color:var(--sun)}}
/* Symbole in Texten */
.ri{display:inline-flex;align-items:center;gap:2px;font-weight:800;white-space:nowrap;vertical-align:middle}
.ri svg,.ri-i{width:1.3em;height:1.3em;flex:none;display:inline-block;vertical-align:middle}
.ti{display:inline-block;vertical-align:middle;margin-right:3px}.ti svg{width:1.35em;height:1.35em;display:block}
.pci{display:inline-grid;place-items:center;background:var(--paper);border-radius:50%;width:21px;height:21px;margin-right:5px;vertical-align:middle}.pci svg{width:16px;height:16px;display:block}
.pill svg{width:1.25em;height:1.25em;flex:none}
.opt small .ri,.opt small .ti{font-weight:700}
/* ---- Animationen ---- */
.btn,.chip,.opt,.mbtn,.xbtn,.pill[data-a],.plc,.die,.pdots button{transition:transform .12s ease,box-shadow .12s ease}
.btn:active,.chip:active,.opt:active,.mbtn:active,.xbtn:active,.pill[data-a]:active{transform:scale(.95)}
.plc:active{transform:scale(.985)}.die:active{transform:scale(.92)}
.fx-sel{animation:dsel .32s ease both}@keyframes dsel{0%{transform:translateY(0) rotate(0)}40%{transform:translateY(-10px) rotate(-7deg)}70%{transform:translateY(-3px) rotate(3deg)}100%{transform:translateY(-5px) rotate(0)}}
.fx-bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1) both}@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.28)}100%{transform:scale(1)}}
.fx-cool{animation:coolk .6s ease both}@keyframes coolk{0%{transform:scale(1.22);filter:brightness(1.7) saturate(1.5)}60%{transform:scale(.94)}100%{transform:scale(1);filter:none}}
.fx-cold{animation:coldk .9s ease both}@keyframes coldk{0%{transform:translateX(0);box-shadow:0 0 0 0 rgba(156,144,214,.95)}10%,30%,50%{transform:translateX(-3px)}20%,40%,60%{transform:translateX(3px)}75%{transform:translateX(0)}100%{transform:translateX(0);box-shadow:0 0 0 18px rgba(156,144,214,0)}}
.fx-roll{animation:rollk .7s cubic-bezier(.3,1.4,.5,1) both}@keyframes rollk{0%{transform:rotate(-320deg) scale(.4);opacity:.3}70%{transform:rotate(8deg) scale(1.14);opacity:1}100%{transform:rotate(0) scale(1)}}
.fx-drop{animation:dropk .6s cubic-bezier(.3,1.5,.5,1) both}@keyframes dropk{0%{transform:translateY(-30px) scale(1.7);opacity:0}60%{opacity:1}100%{transform:translateY(0) scale(1)}}
.fx-stamp{animation:stampk .5s ease-out both}@keyframes stampk{0%{transform:scale(1.04);box-shadow:0 0 0 0 var(--lime)}100%{transform:scale(1);box-shadow:0 0 0 14px rgba(180,227,94,0)}}
.fx-glow{animation:glowk 1.1s ease-out both}@keyframes glowk{0%{box-shadow:0 0 0 0 rgba(242,80,46,.95),0 0 0 0 rgba(255,190,70,0);background:#FFD27A}40%{box-shadow:0 0 0 10px rgba(242,80,46,.45),0 0 34px 8px rgba(255,170,60,.7)}100%{box-shadow:0 0 0 18px rgba(242,80,46,0),0 0 0 0 rgba(255,170,60,0)}}
.fx-pop{animation:popk .5s cubic-bezier(.3,1.6,.5,1) both}@keyframes popk{0%{transform:scale(0)}100%{transform:scale(1)}}
.fx-slide{animation:slidek .6s cubic-bezier(.2,.9,.3,1) both}@keyframes slidek{0%{transform:translateX(70px);opacity:0}100%{transform:none;opacity:1}}
.fx-swap{animation:swapk .35s ease both}@keyframes swapk{0%{transform:translateY(9px);opacity:0}100%{transform:none;opacity:1}}
.fx-up{animation:upk .3s cubic-bezier(.2,.9,.3,1) both}@keyframes upk{0%{transform:translateY(42px)}100%{transform:none}}
.fx-fade{animation:fadek .22s ease both}@keyframes fadek{0%{opacity:0}100%{opacity:1}}
.fx-toast{animation:toastk .3s cubic-bezier(.3,1.4,.5,1) both}@keyframes toastk{0%{transform:translate(-50%,18px);opacity:0}100%{transform:translate(-50%,0);opacity:1}}
.fx-coach{animation:coachk .35s cubic-bezier(.3,1.4,.5,1) both}@keyframes coachk{0%{transform:translateY(10px) scale(.96);opacity:0}100%{transform:none;opacity:1}}
.fl{position:fixed;z-index:95;transform:translateX(-50%);font-variation-settings:'wdth' 75,'opsz' 96;font-weight:800;font-size:19px;padding:1px 10px;border-radius:999px;pointer-events:none;animation:flk 1s ease-out forwards}
.fl.up{background:var(--lime);color:var(--ink);border:2.5px solid var(--ink)}.fl.dn{background:var(--ink);color:var(--paper)}
@keyframes flk{0%{transform:translate(-50%,-6px) scale(.6);opacity:0}15%{transform:translate(-50%,0) scale(1.12);opacity:1}100%{transform:translate(-50%,38px) scale(1);opacity:0}}
.pf{position:fixed;z-index:95;width:9px;height:9px;border-radius:50%;pointer-events:none;animation:pfk .75s ease-out forwards}
@keyframes pfk{0%{transform:translate(0,0) scale(.6);opacity:.9}100%{transform:translate(var(--dx,0),-26px) scale(1.6);opacity:0}}
.bigstamp{position:fixed;left:calc(50% - 56px);top:34%;z-index:96;width:112px;height:112px;border-radius:50%;background:var(--sun);color:#fff;border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);display:grid;place-items:center;align-content:center;pointer-events:none;animation:slamk 1.4s ease both}
.bigstamp .num{font-size:54px;line-height:.9}.bigstamp small{font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
@keyframes slamk{0%{transform:scale(2.8) rotate(-22deg);opacity:0}16%{transform:scale(1) rotate(-8deg);opacity:1}24%{transform:scale(1.1) rotate(-8deg)}32%{transform:scale(1) rotate(-8deg)}78%{opacity:1}100%{transform:scale(1) rotate(-8deg) translateY(-24px);opacity:0}}
.rbanner{position:fixed;left:0;right:0;top:38%;z-index:96;text-align:center;pointer-events:none;animation:bannerk 1.8s ease both}
.rbanner .bn{display:inline-flex;flex-direction:column;align-items:center;background:var(--ink);color:var(--lime);padding:10px 28px 12px;border-radius:22px;transform:rotate(-3deg);box-shadow:0 0 0 4px var(--lime)}
.rbanner .bn b{font-size:58px}.rbanner .bn span{font-weight:700;font-size:16px;color:var(--paper)}
@keyframes bannerk{0%{transform:translateX(-110%);opacity:0}14%{transform:translateX(0);opacity:1}78%{transform:translateX(0);opacity:1}100%{transform:translateX(110%);opacity:0}}
.cf{position:fixed;top:-16px;z-index:100;width:10px;height:15px;pointer-events:none;animation:cfk linear forwards}
@keyframes cfk{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--x,0),112vh) rotate(var(--r,360deg))}}
/* Cover lebt: Glut im Ofen und aufsteigende Funken */
.start .cwrap{position:relative;width:100%}.start .cwrap .cov{width:100%}
.kglow{position:absolute;left:50%;top:61.5%;width:21%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,214,120,.8),rgba(255,140,60,.38) 46%,transparent 70%);mix-blend-mode:screen;pointer-events:none;animation:flick 2.4s ease-in-out infinite alternate}
@keyframes flick{0%{opacity:.35;transform:translate(-50%,-50%) scale(.92)}50%{opacity:.85}100%{opacity:.6;transform:translate(-50%,-50%) scale(1.08)}}
.ember{position:absolute;left:61%;top:32.5%;width:5px;height:5px;border-radius:50%;background:#FFC857;box-shadow:0 0 6px 2px rgba(255,140,60,.8);pointer-events:none;opacity:0;animation:emberk 3.4s ease-in infinite}
.ember.e2{left:62%;animation-delay:.7s;--dx:16px}.ember.e3{left:60.5%;animation-delay:1.5s;--dx:-14px}.ember.e4{left:61.5%;animation-delay:2.1s;--dx:22px}.ember.e5{left:61%;animation-delay:2.8s;--dx:-8px}
@keyframes emberk{0%{transform:translate(0,0) scale(1);opacity:0}12%{opacity:1}100%{transform:translate(var(--dx,8px),-130px) scale(.3);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script>
'use strict';
/* =====================================================================
   GLUT – Fayence-Manufaktur. Regeln: REGELN.md; die Engine ist die getestete Simulation (sim.mjs).
   Interne Schlüssel: Waren ton/asche/holz/rohling/duk; Stücke F=Fliese K=Krug Z=Zierplatte; Gilden T=Töpfer H=Händler B=Brenner.
   ===================================================================== */
const PARAM={dice:4,cool:1,ofenMin:4,startDuk:3,noise:0.15,lookDepth:3,lookBeam:3,lookTop:6,priceMul:1.5,orderMul:1.3,dukPerRuhm:4,guildFirst:4,guildSecond:2,seat3p:1,batchTon:2};
const ROUNDS_BY={2:8,3:6,4:8},roundsFor=np=>ROUNDS_BY[np],capFor=np=>np>=3?2:1,scoreAt=np=>[roundsFor(np)/2,roundsFor(np)];
const TON=[0,1,2,3,3,4,5];
const PRICE0={F:2,K:5,Z:5},price=t=>Math.round(PRICE0[t]*PARAM.priceMul);
const PL=['ton','asche','wald','ofen','topf','kontor','gilde'];
const PNAME={ton:'Tongrube',asche:'Aschehütte',wald:'Wald',ofen:'Brennofen',topf:'Töpferscheibe',kontor:'Kontor',gilde:'Gildehaus'};
const TNAME={F:'Fliese',K:'Krug',Z:'Zierplatte'};
const GNAME={T:'Töpfer',H:'Händler',B:'Brenner'};
const RN={ton:'Ton',asche:'Asche',holz:'Holz',rohling:'Rohling',duk:'Dukaten'};
const RCOL={ton:'#E9C46A',asche:'#9C90D6',holz:'#8A5A2B',rohling:'#6F7BE8',duk:'#B4E35E',ruhm:'#F2502E'};
const CARDS=[
 {id:'waechter',n:'Glutwächter',tier:3,cost:7,g:'B',ruhm:2,fx:'nocool',tx:'Dein erster Einsatz je Runde kühlt nicht ab.'},
 {id:'lehrling',n:'Lehrling',tier:3,cost:6,g:'B',ruhm:1,fx:'dice',tx:'Du erhältst einen fünften Würfel (zunächst kalt).'},
 {id:'ofenmeister',n:'Ofenmeister',tier:2,cost:5,g:'B',ruhm:2,fx:'ofen3',tx:'Der Brennofen genügt dir schon ab Hitze 3.'},
 {id:'haendler',n:'Handelsbrief',tier:2,cost:5,g:'H',ruhm:2,fx:'kont1',tx:'+1 Dukat je verkauftem Stück.'},
 {id:'zunft',n:'Zunftbrief',tier:2,cost:5,g:'H',ruhm:3,fx:null,tx:'Nur Ruhm am Spielende.'},
 {id:'kontorist',n:'Kontorist',tier:3,cost:7,g:'H',ruhm:3,fx:'sell1',tx:'Am Kontor darfst du ein Stück mehr verkaufen.'},
 {id:'sandkarre',n:'Tonkarre',tier:1,cost:3,g:'T',ruhm:1,fx:'ton1',tx:'Tongrube: +1 Ton.'},
 {id:'holzrecht',n:'Holzrecht',tier:1,cost:3,g:'T',ruhm:1,fx:'holz1',tx:'Wald: +1 Holz.'},
 {id:'glasmeister',n:'Malermeister',tier:2,cost:5,g:'T',ruhm:2,fx:'qual1',tx:'Deine Stücke werden mit +1 Güte hergestellt.'},
 {id:'lehrbrief',n:'Lehrbrief',tier:1,cost:2,g:'T',ruhm:2,fx:null,tx:'Nur Ruhm am Spielende.'},
 {id:'sparglut',n:'Sparglut',tier:3,cost:6,g:'B',ruhm:2,fx:'bfree',tx:'Das erste Anfachen je Runde kostet kein Holz.'},
 {id:'aschebrenner',n:'Aschebrenner',tier:1,cost:3,g:'B',ruhm:1,fx:'asche1',tx:'Aschehütte: +1 Asche.'},
];
const CARD=Object.fromEntries(CARDS.map(c=>[c.id,c]));
const ORDER_T=[
 {need:[{t:'K',q:5}],ruhm:5,duk:0},{need:[{t:'K',q:7}],ruhm:7,duk:0},{need:[{t:'Z',q:5}],ruhm:6,duk:0},{need:[{t:'Z',q:7}],ruhm:8,duk:0},
 {need:[{t:'F',q:1},{t:'F',q:1}],ruhm:4,duk:2},{need:[{t:'F',q:2},{t:'F',q:2},{t:'F',q:0}],ruhm:7,duk:0},
 {need:[{t:'K',q:3},{t:'F',q:1}],ruhm:7,duk:0},{need:[{t:'Z',q:4},{t:'F',q:0}],ruhm:7,duk:0},
 {need:[{t:'K',q:5},{t:'Z',q:5}],ruhm:11,duk:0},{need:[{t:'K',q:3},{t:'K',q:3}],ruhm:9,duk:0},
 {need:[{t:'Z',q:3},{t:'Z',q:3}],ruhm:9,duk:0},{need:[{t:'F',q:3}],ruhm:3,duk:3},
];
const BASE_W={ton:.3,asche:.4,holz:.6,rohling:1.3,duk:.5,heat:.3,piece:{F:1.2,K:3,Z:3},orderBonus:1,sign:{T:.9,H:.9,B:.9},cardFx:1.2};
const mergeW=o=>({...BASE_W,...o,piece:{...BASE_W.piece,...(o.piece||{})},sign:{...BASE_W.sign,...(o.sign||{})}});
const PROFS=[mergeW({}),mergeW({sign:{T:1.5},piece:{F:1.4,K:3.6,Z:3.6}}),mergeW({sign:{H:1.5},duk:.7}),mergeW({sign:{B:1.5},cardFx:2.2})];

const rnd=g=>{let a=(g.rs=(g.rs+0x6D2B79F5)|0);let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const roll=g=>1+Math.floor(rnd(g)*6);
const shuffle=(a,g)=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd(g)*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const has=(p,fx)=>p.cards.some(id=>CARD[id].fx===fx);
const sum=a=>a.reduce((x,y)=>x+y,0);
const cp=p=>({...p,dice:p.dice.slice(),res:{...p.res},pieces:p.pieces.map(x=>({...x})),cards:p.cards.slice(),signs:{...p.signs},src:{...p.src},st:{...p.st}});
function assign(pieces,need){const used=new Set(),res=[];const ord=need.map((_,i)=>i).sort((a,b)=>need[b].q-need[a].q);
  for(const i of ord){let best=-1;pieces.forEach((pc,j)=>{if(used.has(j)||pc.t!==need[i].t||pc.q<need[i].q)return;if(best<0||pc.q<pieces[best].q)best=j});if(best<0)return null;used.add(best);res.push(best)}return res}

function newGame(list,seed){
  const g={v:1,seed,rs:seed|0,np:list.length,round:1,first:0,cur:0,firstPass:-1,over:false,log:[]};
  g.players=list.map((x,seat)=>({name:x.name,bot:!!x.bot,prof:x.bot?(seat-1)%PROFS.length:-1,seat,
    dice:Array.from({length:PARAM.dice},()=>roll(g)),res:{ton:2,asche:1,holz:1,rohling:0,duk:PARAM.startDuk+(g.np===3&&seat===2?PARAM.seat3p:0)},
    pieces:[],cards:[],signs:{T:0,H:0,B:0},ruhm:0,passed:false,noCoolUsed:false,bfreeUsed:false,src:{order:0,guild:0,card:0,left:0},st:{turns:0,orders:0}}));
  g.places=PL.map(()=>[]);
  g.orderDeck=shuffle(ORDER_T.map(o=>({...o,need:o.need.map(n=>({...n})),ruhm:Math.round(o.ruhm*PARAM.orderMul)})),g);
  g.orders=g.orderDeck.splice(0,3);
  g.cardDeck=shuffle(CARDS.map(c=>c.id),g);
  g.market=g.cardDeck.splice(0,4);
  return g}

/* ---- Aktionen (View = Spielerkopie für Vorschau/Bot, real = echter Zustand) ---- */
const view=(g,pi,real)=>real?{p:g.players[pi],places:g.places,orders:g.orders,market:g.market,pi,real,g}:{p:cp(g.players[pi]),places:g.places.map(a=>a.slice()),orders:g.orders.slice(),market:g.market.slice(),pi,real,g};
const cloneView=s=>({...s,real:false,p:cp(s.p),places:s.places.map(a=>a.slice()),orders:s.orders.slice(),market:s.market.slice()});
const bcost=(p,nb)=>Math.max(0,nb-((has(p,'bfree')&&!p.bfreeUsed&&nb>0)?1:0));
function singles(p,maxB=2){const out=[],seen=new Set();p.dice.forEach((h,i)=>{if(h<=0)return;for(let b=0;b<=maxB&&h+b<=6;b++){const k=h+':'+b;if(seen.has(k))continue;seen.add(k);out.push({i,b,eff:h+b,cost:bcost(p,b)})}});return out}
function pairs(p){const out=[],seen=new Set();for(let i=0;i<p.dice.length;i++)for(let j=i+1;j<p.dice.length;j++){const hi=p.dice[i],hj=p.dice[j];if(hi<=0||hj<=0)continue;
  for(let b1=0;b1<=1;b1++)for(let b2=0;b2<=1;b2++){if(hi+b1>6||hj+b2>6)continue;const k=[hi,hj,b1,b2].join(':');if(seen.has(k))continue;seen.add(k);out.push({i,j,b1,b2,e1:hi+b1,e2:hj+b2,cost:bcost(p,b1+b2)})}}return out}
const ofenMin=p=>has(p,'ofen3')?PARAM.ofenMin-1:PARAM.ofenMin;
function actions(s){
  const p=s.p,R=p.res,out=[{type:'pass'}];
  const free=k=>{const o=s.places[PL.indexOf(k)];return o.length<capFor(s.g.np)&&!o.includes(s.pi)};
  const S=singles(p),D=pairs(p);
  if(free('ton'))for(const d of S)if(d.cost<=R.holz)out.push({type:'work',place:'ton',d});
  if(free('asche'))for(const d of S)if(d.eff<=3&&d.cost<=R.holz)out.push({type:'work',place:'asche',d});
  if(free('wald'))for(const d of S)if(d.cost<=R.holz)out.push({type:'work',place:'wald',d});
  if(free('ofen')&&R.ton>=PARAM.batchTon&&R.asche>=1)for(const d of S)if(d.eff>=ofenMin(p)&&d.cost<=R.holz)out.push({type:'work',place:'ofen',d});
  if(free('topf')){
    if(R.rohling>=1)for(const d of S)if(d.cost<=R.holz)out.push({type:'work',place:'topf',mode:'F',d});
    if(R.rohling>=2)for(const d of D)if(d.cost+1<=R.holz){if(d.e1===d.e2)out.push({type:'work',place:'topf',mode:'K',d});else if(Math.abs(d.e1-d.e2)===1)out.push({type:'work',place:'topf',mode:'Z',d})}}
  if(free('kontor'))for(const d of S){
    if(d.eff<2||d.cost>R.holz)continue;
    if(p.pieces.length){const max=Math.ceil(d.eff/2)+(has(p,'sell1')?1:0),seenK=new Set();
      for(const dir of[1,-1]){const idx=p.pieces.map((_,i)=>i).sort((a,b)=>dir*(price(p.pieces[a].t)-price(p.pieces[b].t))||p.pieces[a].q-p.pieces[b].q);
        for(let n=1;n<=Math.min(max,idx.length);n++){const sel=idx.slice(0,n),k=sel.slice().sort().join(',');if(seenK.has(k))continue;seenK.add(k);out.push({type:'work',place:'kontor',mode:'sell',idx:sel,d})}}}
    s.orders.forEach((o,oi)=>{const a=assign(p.pieces,o.need);if(a)out.push({type:'work',place:'kontor',mode:'deliver',oi,idx:a,d})})}
  if(free('gilde'))for(const d of S){if(d.cost>R.holz)continue;s.market.forEach((id,mi)=>{const c=CARD[id];if(c.tier<=d.eff&&R.duk>=c.cost)out.push({type:'work',place:'gilde',mi,d})})}
  return out}
function cool(p,dl){for(const{i,eff}of dl){if(has(p,'nocool')&&!p.noCoolUsed){p.dice[i]=eff;p.noCoolUsed=true}else p.dice[i]=Math.max(0,eff-PARAM.cool)}}
const dieList=a=>a.d.j===undefined?[{i:a.d.i,eff:a.d.eff}]:[{i:a.d.i,eff:a.d.e1},{i:a.d.j,eff:a.d.e2}];
function ofenN(p,e){return Math.min(e-ofenMin(p)+1,Math.floor(p.res.ton/PARAM.batchTon),p.res.asche)}
function apply(s,a){
  const p=s.p,R=p.res;
  if(a.type==='pass'){p.passed=true;for(let i=0;i<p.dice.length;i++)if(p.dice[i]===0){p.dice[i]=s.real?roll(s.g):3.5;if(s.real)s.g.hidden=true}
    if(s.real&&s.g.firstPass<0)s.g.firstPass=s.pi;return}
  const d=a.d,dl=dieList(a),nb=d.j===undefined?d.b:d.b1+d.b2;
  R.holz-=bcost(p,nb);if(nb>0&&has(p,'bfree')&&!p.bfreeUsed)p.bfreeUsed=true;
  s.places[PL.indexOf(a.place)].push(s.pi);
  const e=d.eff;
  switch(a.place){
    case'ton':R.ton+=TON[e]+(has(p,'ton1')?1:0);break;
    case'asche':R.asche+=2+(has(p,'asche1')?1:0);break;
    case'wald':R.holz+=Math.ceil(e/3)+(has(p,'holz1')?1:0);break;
    case'ofen':{const n=ofenN(p,e);R.ton-=PARAM.batchTon*n;R.asche-=n;R.rohling+=n;p.signs.B+=1;break}
    case'topf':{const q=has(p,'qual1')?1:0;
      if(a.mode==='F'){R.rohling-=1;p.pieces.push({t:'F',q:e+q});p.signs.T+=1}
      else{R.rohling-=2;R.holz-=1;p.pieces.push({t:a.mode,q:d.e1+d.e2+q});p.signs.T+=2}break}
    case'kontor':
      if(a.mode==='sell'){for(const i of a.idx)R.duk+=price(p.pieces[i].t)+(has(p,'kont1')?1:0);p.pieces=p.pieces.filter((_,i)=>!a.idx.includes(i));p.signs.H+=1}
      else{const o=s.orders[a.oi];p.pieces=p.pieces.filter((_,i)=>!a.idx.includes(i));p.ruhm+=o.ruhm;p.src.order+=o.ruhm;R.duk+=o.duk;p.signs.H+=2;p.st.orders++;
        if(s.real){const nx=s.g.orderDeck.shift();if(nx)s.orders[a.oi]=nx;else s.orders.splice(a.oi,1);s.g.hidden=true}else s.orders.splice(a.oi,1)}
      break;
    case'gilde':{const id=s.market[a.mi],cd=CARD[id];R.duk-=cd.cost;p.cards.push(id);p.signs[cd.g]+=2;if(cd.fx==='dice')p.dice.push(0);
      if(s.real){const nx=s.g.cardDeck.shift();if(nx)s.market[a.mi]=nx;else s.market.splice(a.mi,1);s.g.hidden=true}else s.market.splice(a.mi,1);break}
  }
  cool(p,dl)}

/* ---- Bewertung und Planer-Bot (Beam-Suche über 3 eigene Züge) ---- */
function value(s,W,left){
  const p=s.p,R=p.res,m=left>=3?1:left===2?.7:.3;let v=p.ruhm;
  v+=m*(W.ton*R.ton+W.asche*R.asche+W.holz*R.holz+W.rohling*R.rohling+W.heat*sum(p.dice));
  v+=(left>=3?W.duk:.3*W.duk+.7*W.duk*(left-1)/2)*R.duk;
  for(const pc of p.pieces){const useful=s.orders.some(o=>o.need.some(n=>n.t===pc.t&&pc.q>=n.q));v+=Math.max(1,m*(W.piece[pc.t]+(useful?W.orderBonus:0)))}
  for(const gl of'THB')v+=W.sign[gl]*p.signs[gl];
  for(const id of p.cards)v+=CARD[id].ruhm+m*W.cardFx;
  return v}
function chooseBot(g,pi){
  const pl=g.players[pi],W=PROFS[pl.prof],s0=view(g,pi,true),acts=actions(s0),left=roundsFor(g.np)-g.round+1,v0=value(s0,W,left),first=[];
  for(const a of acts){if(a.type==='pass')continue;const sv=cloneView(s0);apply(sv,a);first.push({a,sv,v:value(sv,W,left)})}
  first.sort((x,y)=>y.v-x.v);
  let best=null,bv=0;
  { const sv=cloneView(s0);apply(sv,{type:'pass'});const dv=value(sv,W,left)-v0+(rnd(g)-.5)*2*PARAM.noise;if(dv>bv){bv=dv;best={type:'pass'}} }
  for(const f of first.slice(0,PARAM.lookTop)){
    let top=f.v,fr=[f.sv];
    for(let dd=2;dd<=PARAM.lookDepth;dd++){const kids=[];
      for(const st of fr)for(const a of actions(st)){if(a.type==='pass')continue;const c=cloneView(st);apply(c,a);kids.push({c,v:value(c,W,left)})}
      if(!kids.length)break;kids.sort((x,y)=>y.v-x.v);top=Math.max(top,kids[0].v);fr=kids.slice(0,PARAM.lookBeam).map(k=>k.c)}
    const dv=top-v0+(rnd(g)-.5)*2*PARAM.noise;if(dv>bv){bv=dv;best=f.a}}
  return best||{type:'pass'}}

/* ---- Beschreibungen ---- */
function outcome(a,p,s){ // {txt, sub}
  const d=a.d,e=d?d.eff:0,q=has(p,'qual1')?1:0;
  if(a.type==='pass')return{txt:'Rasten',sub:'Kalte Würfel werden neu gewürfelt.'};
  let txt='',sub='';
  switch(a.place){
    case'ton':txt=`+${TON[e]+(has(p,'ton1')?1:0)} Ton`;break;
    case'asche':txt=`+${2+(has(p,'asche1')?1:0)} Asche`;break;
    case'wald':txt=`+${Math.ceil(e/3)+(has(p,'holz1')?1:0)} Holz`;break;
    case'ofen':{const n=ofenN(p,e);txt=`+${n} Rohling${n>1?'e':''}`;sub=`−${PARAM.batchTon*n} Ton, −${n} Asche`;break}
    case'topf':if(a.mode==='F'){txt=`Fliese, Güte ${e+q}`;sub='−1 Rohling'}else{txt=`${TNAME[a.mode]}, Güte ${d.e1+d.e2+q}`;sub='−2 Rohlinge, −1 Holz'}break;
    case'kontor':if(a.mode==='sell'){const tot=sum(a.idx.map(i=>price(p.pieces[i].t)+(has(p,'kont1')?1:0)));txt=`Verkaufen: ${a.idx.map(i=>TNAME[p.pieces[i].t]+' '+p.pieces[i].q).join(', ')}`;sub=`+${tot} Dukaten`}
      else{const o=s.orders[a.oi];txt=`Auftrag liefern: ${o.need.map(n=>TNAME[n.t]).join(' + ')}`;sub=`+${o.ruhm} Ruhm`+(o.duk?`, +${o.duk} Dukaten`:'')}break;
    case'gilde':{const c=CARD[s.market[a.mi]];txt=`„${c.n}“ kaufen`;sub=`−${c.cost} Dukaten · ${c.tx}`;break}
  }
  const nb=d.j===undefined?d.b:d.b1+d.b2;if(nb>0){const c=bcost(p,nb);sub+=(sub?' · ':'')+`angefacht +${nb}`+(c?` (−${c} Holz)`:' (gratis)')}
  return{txt,sub}}

/* ---- Spielablauf ---- */
let S=null,U={page:0,sel:[],boost:0,sheet:null,menu:false,rules:false,setup:false,toast:null,undo:[],pending:false};
const lsGet=k=>{try{return localStorage.getItem(k)}catch(_){return null}},lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(_){}};
const fastPref=()=>lsGet('spielregal:botFast')==='1',botDelay=()=>fastPref()?160:600;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SAVE='glut:save',INBOX='spielregal:inbox:plays';
function save(){if(S&&S.tut)return;try{lsSet(SAVE,JSON.stringify({screen:S&&!S.over?'game':'start',S}))}catch(_){}}
function loadSave(){try{const x=JSON.parse(lsGet(SAVE)||'null');return x&&x.S&&!x.S.over?x:null}catch(_){return null}}
const myName=()=>{if(SETUP.name.trim())return SETUP.name.trim();try{const p=(JSON.parse(lsGet('spielregal:players')||'[]')||[]).filter(x=>x&&x.name);return p.length?p[0].name:'Du'}catch(_){return 'Du'}};
const cardRuhm=p=>sum(p.cards.map(id=>CARD[id].ruhm));
const total=p=>p.ruhm+cardRuhm(p)+p.pieces.length+Math.floor(p.res.duk/PARAM.dukPerRuhm);
function log(t,pi){S.log.push({r:S.round,p:pi,t})}
function nextCur(){for(let k=1;k<=S.np;k++){const i=(S.cur+k)%S.np;if(!S.players[i].passed)return i}return -1}
function exec(pi,a){
  const p=S.players[pi],s=view(S,pi,true),o=outcome(a,p,s);
  if(pi===0&&!p.bot){U.undo.push(JSON.stringify(S));buzz(14)}else U.undo=[];
  S.hidden=false;
  apply(s,a);p.st.turns++;
  log(a.type==='pass'?'rastet.':`${PNAME[a.place]}: ${o.txt}${o.sub?' ('+o.sub+')':''}`,pi);
  if(S.hidden)U.undo=[];
  U.sel=[];U.boost=0;U.sheet=null;
  afterAction()}
function afterAction(){
  if(S.players.every(p=>p.passed)){endRound();return}
  const n=nextCur();S.cur=n<0?S.cur:n;
  save();render();schedule()}
function endRound(){
  const g=S;let msg='';
  if(scoreAt(g.np).includes(g.round))msg=scoreGuilds(g);
  g.first=g.firstPass>=0?g.firstPass:(g.first+1)%g.np;
  if(g.round>=roundsFor(g.np)){finish();return}
  g.round++;startRound();
  if(msg)toast(msg,4200);
  save();render();schedule()}
function startRound(){const g=S;g.places=PL.map(()=>[]);g.players.forEach(p=>{p.passed=false;p.noCoolUsed=false;p.bfreeUsed=false});g.firstPass=-1;g.cur=g.first;U.undo=[];U.page=0;log(`Runde ${g.round} beginnt.`,-1)}
function scoreGuilds(g){
  const lines=[];
  for(const gl of'THB'){

  const st=tutStep(),al=st&&st.allow;if(!al||!(a in al))return false;return al[a]===true||!!al[a](d)}
function tutHtml(){
  const st=tutStep();if(!st)return '';const last=TUT.i===TUT_STEPS.length-1;
  const btn=last?'<button class="btn" data-a="tutend">Echtes Spiel starten</button>':!st.done?'<button class="btn" data-a="tutnext">Weiter</button>':st.wait?'<span class="cwait">· · ·</span>':'';
  return `<div class="coach" id="coach" role="dialog" aria-live="polite"><div class="cface">${KILN}</div><div class="ctext"><span class="cstep">Lernspiel · ${TUT.i+1}/${TUT_STEPS.length} · ${esc(st.ch)}</span><p>${st.text}</p>${st.why?`<p class="cwhy"><b>Warum?</b> ${st.why}</p>`:''}<div class="cbtns">${btn}<button class="cquit" data-a="tutquit">Lernspiel beenden</button></div></div></div>`}
function tutDecorate(){
  const st=tutStep(),coach=document.getElementById('coach');if(!st||!coach)return;
  const els=st.sel?[...document.querySelectorAll(st.sel)]:[];els.forEach(e=>e.classList.add('tut-hl'));
  const el=els[0],pgs=document.getElementById('pages');
  if(el&&pgs){const pg=el.closest('.page');
    if(pg){const n=+pg.id.slice(2);if(n!==U.page){U.page=n;pgs.scrollLeft=n*pgs.clientWidth;document.querySelectorAll('.pdots button').forEach((b,k)=>b.classList.toggle('on',k===n))}
      const key=TUT.i+'';if(TUT.scrolled!==key){TUT.scrolled=key;el.scrollIntoView({block:'center',behavior:'auto'})}}}
  // Coach auf die dem markierten Element gegenüberliegende Seite
  let top;
  if(st.pos)top=st.pos==='top';else if(el){const r=el.getBoundingClientRect();top=(r.top+r.bottom)/2>innerHeight*.5}else top=false;
  const head=document.querySelector('.thead'),foot=document.querySelector('.foot');
  if(top){coach.style.top=((head?head.offsetHeight:0)+8)+'px';coach.style.bottom=''}else{coach.style.bottom=((foot?foot.offsetHeight:0)+8)+'px';coach.style.top=''}}
function tutSetup(){
  S=newGame([{name:'Du',bot:false},{name:'Lotte',bot:true}],4711);S.tut=true;S.tutK=0;
  const m=S.players[0],b=S.players[1];
  m.dice=[6,4,2,1];m.res={ton:4,asche:2,holz:2,rohling:0,duk:3};
  b.dice=[4,3,3,2];b.res={ton:2,asche:1,holz:1,rohling:0,duk:3};
  S.orders=[{need:[{t:'K',q:5}],ruhm:7,duk:0},{need:[{t:'Z',q:5}],ruhm:8,duk:0},{need:[{t:'F',q:1},{t:'F',q:1}],ruhm:5,duk:2}];
  S.market=['sandkarre','holzrecht','haendler','ofenmeister'];S.cardDeck=S.cardDeck.filter(id=>!S.market.includes(id));
  S.log=[{r:1,p:-1,t:'Lernspiel: eine vorbereitete Runde.'}];
  TUT={i:0};U={page:0,sel:[],boost:0,sheet:null,menu:false,rules:false,toast:null,undo:[],pending:false};render();schedule()}
function tutBotAction(){
  const k=S.tutK=(S.tutK||0)+1,want=k===1?'wald':k===2?'ton':null,acts=actions(view(S,S.cur,true));
  if(want){const c=acts.filter(a=>a.type==='work'&&a.place===want).sort((x,y)=>x.d.eff-y.d.eff)[0];if(c)return c}
  return{type:'pass'}}
function tutEnd(){TUT=null;S=null;clearTimeout(botT);U={page:0,sel:[],boost:0,sheet:null,menu:false,rules:false,toast:null,undo:[],pending:false};render()}


/* ---- Animationen und Mikro-Interaktionen (Zustandsvergleich nach jedem Neuzeichnen, wie in Drei Schwestern) ---- */
const RM=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(_){return false}};
const buzz=ms=>{try{if(navigator.vibrate&&!RM())navigator.vibrate(ms)}catch(_){}};
let FX=[],FXP=null;const FXC={float:0,puff:0,stamp:0,banner:0,confetti:0,fx:0};
// Effekte auf Elementen, die bei jedem Neuzeichnen neu entstehen: Klasse wird erneut gesetzt, die Animation läuft mit negativem Delay nahtlos weiter
function fxAdd(sel,cls,dur){if(RM())return;FXC.fx++;FX.push({sel,cls,dur,t0:Date.now()})}
function fxApply(){const now=Date.now();FX=FX.filter(f=>now-f.t0<f.dur);for(const f of FX)document.querySelectorAll(f.sel).forEach(el=>{el.classList.add(f.cls);el.style.animationDelay=(-(now-f.t0))+'ms'})}
function fxSnap(){const p=S.players[0];
  return{id:S.seed+(S.tut?'t':''),round:S.round,dice:p.dice.slice(),res:{...p.res},tot:S.players.map(total),occ:S.places.map(a=>a.slice()),pieces:p.pieces.length,
    orders:S.orders.map(o=>o.need.map(n=>n.t+n.q).join()+':'+o.ruhm),ann:S.over?'over':annShort(),
    ov:(U.sheet?'s':'')+(U.menu?'m':'')+(U.rules?'r':'')+(S.over?'o':''),toast:U.toast||'',tut:TUT?TUT.i:-1,over:S.over}}
function fxRun(){
  if(!S){FXP=null;return}
  const cur=fxSnap(),prev=FXP;FXP=cur;
  if(prev&&prev.id===cur.id)fxDiff(prev,cur);
  fxApply()}
function fxDiff(a,b){
  b.dice.forEach((h,i)=>{const o=a.dice[i];if(o===undefined||h===o)return;const sel=`.dicerow .die[data-i="${i}"]`;
    if(h<o){fxAdd(sel,h===0?'fx-cold':'fx-cool',h===0?900:600);fxPuff(sel,h===0)}else fxAdd(sel,'fx-roll',700)});
  for(const k in b.res){const d=b.res[k]-a.res[k];if(d){const sel=`.rc[data-r="${k}"]`;fxAdd(sel,'fx-bump',500);fxFloat(sel,(d>0?'+':'−')+Math.abs(d),d>0)}}
  const dr=b.tot[0]-a.tot[0];
  if(dr){const sel='.rc[data-r="ruhm"]';fxAdd(sel,'fx-bump',500);fxFloat(sel,(dr>0?'+':'−')+Math.abs(dr),dr>0);if(dr>=5){fxStamp(dr);buzz([20,40,20])}}
  b.tot.forEach((t,i)=>{if(i>0&&t!==a.tot[i])fxAdd(`.opp[data-p="${i}"] b`,'fx-bump',500)});
  b.occ.forEach((o,k)=>{const po=a.occ[k]||[],added=o.filter(x=>!po.includes(x));if(!added.length)return;
    const sel=`.plc[data-k="${PL[k]}"]`,hot=PL[k]==='ofen';fxAdd(sel,hot?'fx-glow':'fx-stamp',hot?1100:500);added.forEach(x=>fxAdd(`${sel} .av[data-p="${x}"]`,'fx-drop',600))});
  if(b.pieces>a.pieces)fxAdd('#pg1 .chips .pc:last-child','fx-pop',500);
  b.orders.forEach((o,i)=>{if(!a.orders.includes(o))fxAdd(`#pg2 .ord[data-oi="${i}"]`,'fx-slide',600)});
  if(b.ann!==a.ann)fxAdd('.ann','fx-swap',350);
  if(b.ov&&b.ov!==a.ov){fxAdd('.sheet','fx-up',320);fxAdd('.overlay','fx-fade',220)}
  if(b.toast&&b.toast!==a.toast)fxAdd('.toast','fx-toast',320);
  if(b.tut!==a.tut&&b.tut>=0)fxAdd('#coach','fx-coach',350);
  if(b.round>a.round&&!S.over){const f=S.players[S.first];fxBanner('Runde '+b.round,(f.bot?f.name:'Du')+(f.bot?' beginnt':' beginnst'))}
  if(b.over&&!a.over&&S.players[0].ruhm===Math.max(...S.players.map(p=>p.ruhm)))fxConfetti()}
function fxBody(cls,html,ms,style){if(RM())return null;const d=document.createElement('div');d.className=cls;if(html)d.innerHTML=html;if(style)Object.assign(d.style,style);document.body.appendChild(d);setTimeout(()=>d.remove(),ms);return d}
function fxFloat(sel,txt,plus){if(RM())return;const el=document.querySelector(sel);if(!el)return;const r=el.getBoundingClientRect();FXC.float++;fxBody('fl '+(plus?'up':'dn'),txt,1000,{left:(r.left+r.width/2)+'px',top:(r.bottom-2)+'px'})}
function fxPuff(sel,cold){if(RM())return;const el=document.querySelector(sel);if(!el)return;const r=el.getBoundingClientRect();
  for(let i=0;i<(cold?4:3);i++){FXC.puff++;fxBody('pf',null,800,{left:(r.left+r.width*(.25+.25*i)-4)+'px',top:(r.top+4)+'px',background:cold?'#9C90D6':'rgba(59,18,32,.4)',animationDelay:(i*70)+'ms','--dx':((i-1.5)*9)+'px'})}}
function fxStamp(n){if(RM())return;FXC.stamp++;fxBody('bigstamp',`<span class="num">+${n}</span><small>Ruhm</small>`,1400)}
function fxBanner(t,sub){if(RM())return;FXC.banner++;fxBody('rbanner',`<div class="bn"><b class="disp">${esc(t)}</b><span>${esc(sub)}</span></div>`,1800)}
function fxConfetti(){if(RM())return;FXC.confetti++;const cols=['#F2502E','#2A2BC8','#B4E35E','#F6A8BE','#FFC857','#6F7BE8'];
  for(let i=0;i<42;i++)fxBody('cf',null,3600,{left:(Math.random()*100)+'vw',background:cols[i%cols.length],animationDuration:(2.2+Math.random()*1.4)+'s',animationDelay:(Math.random()*.6)+'s','--x':((Math.random()-.5)*160)+'px','--r':((Math.random()-.5)*900)+'deg'})}

/* ---- Eingaben ---- */
document.addEventListener('click',e=>{
  if(e.target.closest('[data-stop]')&&!e.target.closest('[data-a]:not(.overlay)'))return;
  const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;
  if(a==='setup'){U.setup=true;render();return}
  if(a==='setup-x'){U.setup=false;render();return}
  if(a==='bots'){SETUP.bots=+el.dataset.n;lsSet('glut:bots',SETUP.bots);render();return}
  if(a==='pickname'){SETUP.name=el.dataset.n;lsSet('glut:name',SETUP.name);render();return}
  if(a==='start'||a==='again'){S=null;lsSet(SAVE,'');startGame();return}
  if(a==='resume'){const sv=loadSave();if(sv){S=sv.S;U={page:0,sel:[],boost:0,sheet:null,menu:false,rules:false,toast:null,undo:[],pending:false};render();schedule()}return}
  if(a==='tutor'){tutSetup();return}
  if(a==='rules'){U.rules=true;U.menu=false;render();return}
  if(a==='rules-x'){U.rules=false;render();return}
  if(!S)return;
  if(TUT&&S.tut&&!tutAllowed(a,el.dataset)){toast('Folge dem markierten Hinweis im Lernspiel.');return}
  if(a==='tutnext'){if(TUT){TUT.i=Math.min(TUT.i+1,TUT_STEPS.length-1);TUT.scrolled=null}render();return}
  if(a==='tutend'){tutEnd();startGame();return}
  if(a==='tutquit'){tutEnd();return}
  if(a==='die'){pickDie(+el.dataset.i);return}
  if(a==='boost'){U.boost=+el.dataset.b;render();return}
  if(a==='place'){pickPlace(el.dataset.k);return}
  if(a==='opt'){const o=U.sheet&&U.sheet.opts[+el.dataset.i];if(o){const act=o.a;U.sheet=null;exec(0,act)}return}
  if(a==='sheet-x'){U.sheet=null;render();return}
  if(a==='pass'){if(myTurn())exec(0,{type:'pass'});return}
  if(a==='undo'){U.menu=false;doUndo();return}
  if(a==='page'){U.page=+el.dataset.n;const pg=document.getElementById('pages');if(pg)pg.scrollTo({left:U.page*pg.clientWidth,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});document.querySelectorAll('.pdots button').forEach((b,k)=>b.classList.toggle('on',k===U.page));return}
  if(a==='go'){if(myTurn()&&U.sel.length){U.page=0;render()}return}
  if(a==='menu'){U.menu=true;render();return}
  if(a==='menu-x'){U.menu=false;render();return}
  if(a==='fast'){lsSet('spielregal:botFast',fastPref()?'0':'1');render();return}
  if(a==='reload'){save();location.replace(location.pathname+'?v='+Date.now()+'&resume=1');return}
  if(a==='restart'){if(!confirm('Partie abbrechen und eine neue beginnen?'))return;S=null;lsSet(SAVE,'');U.menu=false;clearTimeout(botT);render();return}
});
/* ---- Start ---- */
(function init(){
  const sv=loadSave();
  if(sv&&/[?&]resume=1/.test(location.search)){S=sv.S;render();schedule();try{history.replaceState(null,'',location.pathname)}catch(_){}return}
  render()})();
</script>
